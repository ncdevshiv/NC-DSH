<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataWorm — live graph</title>
    <script>
      // Token injection hook: dataworm/server.py replaces the literal
      // "__DATAWORM_TOKEN__" placeholder with the real bearer token when it
      // serves this file at GET "/" (same mechanism as the legacy page).
      // The app reads window.__DW_TOKEN__ at runtime to authenticate its
      // fetch()/EventSource calls against the deny-by-default daemon.
      window.__DW_TOKEN__ = "__DATAWORM_TOKEN__";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
