<!doctype html>
<html>
<body
  data-callback-order=""
  data-first-records=""
  data-second-records=""
>
  <div id="target"></div>
  <script>
    const target = document.getElementById("target");
    const order = [];
    let firstRecords = 0;
    let secondRecords = 0;

    const first = new MutationObserver((records) => {
      order.push("first");
      firstRecords = records.length;
    });
    const second = new MutationObserver((records) => {
      order.push("second");
      secondRecords = records.length;
    });

    first.observe(target, { attributes: true });
    second.observe(target, { attributes: true });

    target.setAttribute("data-one", "1");
    target.setAttribute("data-two", "2");

    Promise.resolve().then(() => {
      document.body.setAttribute("data-callback-order", order.join(","));
      document.body.setAttribute("data-first-records", String(firstRecords));
      document.body.setAttribute("data-second-records", String(secondRecords));
      first.disconnect();
      second.disconnect();
    });
  </script>
</body>
</html>
