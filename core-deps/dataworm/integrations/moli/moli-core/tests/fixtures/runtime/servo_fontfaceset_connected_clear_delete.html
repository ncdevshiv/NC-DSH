<!doctype html>
<html>
  <body
    data-initial-size=""
    data-after-clear-size=""
    data-after-delete-size=""
    data-after-delete-has-connected=""
  >
    <style>
      @font-face {
        font-family: "WebFont";
        src: url("resources/Rochester.otf") format("opentype");
      }
    </style>
    <script>
      const body = document.body;
      const fonts = document.fonts;
      const connected = fonts.keys().next().value;
      body.setAttribute('data-initial-size', String(fonts.size));
      fonts.clear();
      body.setAttribute('data-after-clear-size', String(fonts.size));
      fonts.delete(connected);
      body.setAttribute('data-after-delete-size', String(fonts.size));
      body.setAttribute(
        'data-after-delete-has-connected',
        String(fonts.has(connected))
      );
    </script>
  </body>
</html>
