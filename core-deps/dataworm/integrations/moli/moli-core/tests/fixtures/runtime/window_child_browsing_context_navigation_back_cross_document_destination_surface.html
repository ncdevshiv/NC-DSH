<!doctype html>
<html>
  <body>
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const iframe = document.getElementById("child");
      const requestedMode = new URL(window.location.href).searchParams.get("mode");
      const mode =
        requestedMode === "traverse" || requestedMode === "history-back"
          ? requestedMode
          : "back";
      let loadCount = 0;
      let backCommitted = false;
      let backFinished = false;
      let backCommittedValue = "";
      let backFinishedValue = "";

      iframe.addEventListener("load", () => {
        loadCount += 1;
        const childWindow = iframe.contentWindow;

        if (loadCount === 1) {
          childWindow.navigation.navigate(
            "/compat/window-child-browsing-context-target-name-b",
            { history: "push" }
          );
          return;
        }

        if (loadCount === 2) {
          const beforeEntry = childWindow.navigation.currentEntry;
          document.body.setAttribute("data-mode", mode);
          if (mode === "history-back") {
            childWindow.history.back();
            document.body.setAttribute(
              "data-back-sync",
              [
                childWindow.location.href,
                String(childWindow.navigation.currentEntry === beforeEntry),
              ].join("|")
            );
            return;
          }
          const result =
            mode === "traverse"
              ? childWindow.navigation.traverseTo(
                  childWindow.navigation.entries()[0].key
                )
              : childWindow.navigation.back();
          document.body.setAttribute(
            "data-back-sync",
            [
              childWindow.location.href,
              String(childWindow.navigation.currentEntry === beforeEntry),
              Object.keys(result).join(","),
              String(!!result.committed),
              String(!!result.finished),
            ].join("|")
          );
          result.committed.then(
            (value) => {
              backCommitted = true;
              backCommittedValue = String(value?.url ?? "");
            },
            (error) => {
              backCommitted = true;
              backCommittedValue = `ERR:${error.name}:${error.message}`;
            }
          );
          result.finished.then(
            (value) => {
              backFinished = true;
              backFinishedValue = String(value?.url ?? "");
            },
            (error) => {
              backFinished = true;
              backFinishedValue = `ERR:${error.name}:${error.message}`;
            }
          );
          return;
        }

        if (loadCount === 3) {
          setTimeout(() => {
            const activation = childWindow.navigation.activation;
            const entries = childWindow.navigation.entries();
            document.body.setAttribute("data-child-load-count", String(loadCount));
            document.body.setAttribute(
              "data-child-location-href",
              childWindow.location.href
            );
            document.body.setAttribute(
              "data-child-current-entry-url",
              childWindow.navigation.currentEntry?.url ?? ""
            );
            document.body.setAttribute(
              "data-child-current-entry-index",
              String(childWindow.navigation.currentEntry?.index ?? -1)
            );
            document.body.setAttribute(
              "data-child-entries",
              entries.map((entry) => entry.url).join(",")
            );
            document.body.setAttribute(
              "data-child-activation",
              [
                activation?.entry?.url ?? "",
                activation?.from?.url ?? "",
                activation?.navigationType ?? "",
              ].join("|")
            );
            document.body.setAttribute(
              "data-back-settled",
              `${backCommitted}|${backFinished}`
            );
            document.body.setAttribute(
              "data-back-values",
              `${backCommittedValue}|${backFinishedValue}`
            );
          }, 0);
        }
      });
    </script>
  </body>
</html>
