<!DOCTYPE html>
<html>
  <head>
    <title>dump snapshot</title>
  </head>
  <body>
    <main id="before">before</main>
    <script>
      const node = document.getElementById("before");
      node.textContent = "after-script";
      document.body.setAttribute("data-snapshot", "yes");

      const section = document.createElement("section");
      section.id = "after";
      section.textContent = "runtime";
      document.body.appendChild(section);
    </script>
  </body>
</html>
