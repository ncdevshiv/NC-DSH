<!doctype html>
<html>
  <head></head>
  <body>
    <script>
      window.dynamicNomoduleRuns = 0;

      const skipped = document.createElement("script");
      skipped.setAttribute("nomodule", "");
      skipped.text = "window.dynamicNomoduleRuns += 1;";
      document.head.appendChild(skipped);

      skipped.removeAttribute("nomodule");
      skipped.text = "window.dynamicNomoduleRuns += 100;";

      window.dynamicNomoduleAfterMutation = window.dynamicNomoduleRuns;
    </script>
  </body>
</html>
