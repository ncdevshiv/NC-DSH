<!doctype html>
<html>
  <body data-has-cssfloat="" data-initial="" data-after="">
    <div id="target"></div>
    <script>
      const body = document.body;
      const target = document.getElementById('target');
      body.setAttribute(
        'data-has-cssfloat',
        String('cssFloat' in getComputedStyle(target))
      );
      body.setAttribute('data-initial', target.style.cssFloat);
      target.style.cssFloat = 'right';
      body.setAttribute('data-after', target.style.cssFloat);
    </script>
  </body>
</html>
