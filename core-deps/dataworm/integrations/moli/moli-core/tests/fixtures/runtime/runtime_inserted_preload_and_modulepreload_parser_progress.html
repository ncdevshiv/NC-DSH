<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimePreloadProgressStart = Date.now();
      window.runtimePreloadProgressOrder = [];
      window.runtimePreloadProgressParserNotBlocked = false;
      window.runtimePreloadProgressParserSawLate = false;
      window.runtimePreloadProgressParserSawPreloadLoad = false;
      window.runtimePreloadProgressParserSawModulepreloadLoad = false;
      window.runtimePreloadProgressPreloadLoadEarly = null;
      window.runtimePreloadProgressModulepreloadLoadEarly = null;

      const preload = document.createElement("link");
      preload.rel = "preload";
      preload.as = "style";
      preload.href = "/assets/runtime_connected_preload_very_slow.css";
      preload.addEventListener("load", () => {
        window.runtimePreloadProgressPreloadLoadEarly =
          Date.now() - window.runtimePreloadProgressStart < 50;
        window.runtimePreloadProgressOrder.push("preload-load");
      });
      document.head.appendChild(preload);

      const modulepreload = document.createElement("link");
      modulepreload.rel = "modulepreload";
      modulepreload.href = "/assets/runtime_connected_modulepreload_very_slow.mjs";
      modulepreload.addEventListener("load", () => {
        window.runtimePreloadProgressModulepreloadLoadEarly =
          Date.now() - window.runtimePreloadProgressStart < 50;
        window.runtimePreloadProgressOrder.push("modulepreload-load");
      });
      document.head.appendChild(modulepreload);
    </script>
    <script>
      window.runtimePreloadProgressParserNotBlocked =
        Date.now() - window.runtimePreloadProgressStart < 50;
      window.runtimePreloadProgressParserSawLate = !!document.getElementById("late");
      window.runtimePreloadProgressParserSawPreloadLoad =
        window.runtimePreloadProgressOrder.includes("preload-load");
      window.runtimePreloadProgressParserSawModulepreloadLoad =
        window.runtimePreloadProgressOrder.includes("modulepreload-load");
      window.runtimePreloadProgressOrder.push("parser");
      window.runtimePreloadProgressFinalOrder =
        window.runtimePreloadProgressOrder.join(",");
    </script>
  </head>
  <body>
    <div id="late">late</div>
  </body>
</html>
