<!doctype html>
<html>
<head>
<script>window.__headInnerTextProbe = 'head script text should stay out of documentElement.innerText';</script>
</head>
<body
  data-inner-text=""
  data-inner-html=""
  data-inner-text-setter=""
  data-script-inner-text=""
  data-document-inner-text=""
  data-outer-html=""
>
<div id="target">
  Alpha <span>Beta</span><br>
  <style>.ignored { color: red; }</style>
  <template>ignored</template>
  <script id="json-payload" type="application/json">{"ignored":true}</script>
  Gamma
</div>
<script>
const target = document.getElementById('target');
document.body.setAttribute('data-inner-text', target.innerText);
document.body.setAttribute('data-script-inner-text', document.getElementById('json-payload').innerText);
document.body.setAttribute(
  'data-document-inner-text',
  `${document.documentElement.innerText.includes('head script text')}:${document.documentElement.innerText.includes('{"ignored":true}')}:${document.documentElement.innerText.includes('Alpha Beta')}`
);

const box = document.createElement('div');
box.innerHTML = '<p id="p1">Hello <em>World</em></p>';
document.body.setAttribute('data-inner-html', `${box.innerHTML}:${box.querySelector('em').innerText}`);
box.innerText = 'hello <b>literal</b>';
document.body.setAttribute('data-inner-text-setter', `${box.innerText}:${box.innerHTML}`);

const oldNode = document.createElement('div');
oldNode.id = 'old-node';
oldNode.textContent = 'old';
document.body.appendChild(oldNode);
oldNode.outerHTML = '<section id="new-node"><strong>New</strong></section>';
const newNode = document.getElementById('new-node');
document.body.setAttribute(
  'data-outer-html',
  `${oldNode.outerHTML}:${document.getElementById('old-node') === null}:${newNode.outerHTML}`
);
</script>
</body>
</html>
