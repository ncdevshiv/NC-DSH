<!doctype html>
<html>
  <body>
    <script>
      window.documentWriteLateStyleOrder = [];
      window.documentWriteLateStyleLoaded = false;
      document.write(
        '<script type="module">' +
          'window.documentWriteLateStyleOrder.push(window.documentWriteLateStyleLoaded ? "module-after-style" : "module-before-style");' +
          'window.documentWriteLateStyleResult = window.documentWriteLateStyleOrder.join(",") + "|" + !!document.querySelector("link[data-document-write-late-style]");' +
        '<\/script>' +
        '<link rel="stylesheet" href="/assets/blocking_stylesheet_slow.css" data-document-write-late-style>' +
        '<script>' +
          'document.currentScript.previousElementSibling.addEventListener("load", () => { window.documentWriteLateStyleLoaded = true; });' +
          'window.documentWriteLateStyleOrder.push("classic-after-write");' +
          'window.documentWriteLateStyleResult = window.documentWriteLateStyleOrder.join(",") + "|" + !!document.querySelector("link[data-document-write-late-style]");' +
        '<\/script>'
      );
    </script>
  </body>
</html>
