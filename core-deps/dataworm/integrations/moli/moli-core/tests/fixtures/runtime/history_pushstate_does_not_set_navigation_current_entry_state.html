<!doctype html>
<html>
<body>
<script>
document.addEventListener("DOMContentLoaded", () => {
  document.body.setAttribute(
    "data-initial-nav-state-undefined",
    String(navigation.currentEntry.getState() === undefined),
  );

  history.pushState({ step: 1 }, "", "#one");
  document.body.setAttribute("data-after-push-history-state", JSON.stringify(history.state));
  document.body.setAttribute(
    "data-after-push-nav-state-undefined",
    String(navigation.currentEntry.getState() === undefined),
  );
  document.body.setAttribute("data-after-push-url", navigation.currentEntry.url);
  document.body.setAttribute("data-after-push-index", String(navigation.currentEntry.index));

  history.replaceState({ step: 2 }, "", "#two");
  document.body.setAttribute("data-after-replace-history-state", JSON.stringify(history.state));
  document.body.setAttribute(
    "data-after-replace-nav-state-undefined",
    String(navigation.currentEntry.getState() === undefined),
  );
  document.body.setAttribute("data-after-replace-url", navigation.currentEntry.url);
  document.body.setAttribute("data-after-replace-index", String(navigation.currentEntry.index));
});
</script>
</body>
</html>
