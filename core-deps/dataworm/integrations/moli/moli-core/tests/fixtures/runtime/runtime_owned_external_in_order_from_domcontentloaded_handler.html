<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimeOwnedInOrderFromDclOrder = [];
      window.runtimeOwnedInOrderLoadOrder = window.runtimeOwnedInOrderFromDclOrder;

      document.addEventListener("DOMContentLoaded", () => {
        window.runtimeOwnedInOrderFromDclOrder.push("dcl");

        const script = document.createElement("script");
        script.async = false;
        script.src = "/assets/runtime_owned_in_order_load.js";
        script.onload = () => {
          window.runtimeOwnedInOrderFromDclOrder.push("load");
          queueMicrotask(() => {
            window.runtimeOwnedInOrderFromDclOrder.push("load-microtask");
            window.runtimeOwnedInOrderFromDclLoadOrder =
              window.runtimeOwnedInOrderFromDclOrder.join(",");
          });
        };
        document.head.appendChild(script);
        window.runtimeOwnedInOrderFromDclOrder.push("after-append");
        window.runtimeOwnedInOrderFromDclAfterDclOrder =
          window.runtimeOwnedInOrderFromDclOrder.join(",");
      });

      window.addEventListener("load", () => {
        window.runtimeOwnedInOrderFromDclOrder.push("window-load");
        window.runtimeOwnedInOrderFromDclFinalOrder =
          window.runtimeOwnedInOrderFromDclOrder.join(",");
      });
    </script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
