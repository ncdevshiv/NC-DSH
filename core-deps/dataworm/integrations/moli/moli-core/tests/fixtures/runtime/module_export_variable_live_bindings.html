<!doctype html>
<html>
  <head>
    <script>
      window.moduleExportVariableOrder = [];
      document.addEventListener("DOMContentLoaded", () => {
        window.moduleExportVariableOrder.push("dcl");
        window.moduleExportVariableDclOrder =
          window.moduleExportVariableOrder.join(",");
      });
    </script>
    <script type="module">
      import { counter, label } from "/assets/module-export-variable-live-bindings.mjs";

      window.moduleExportVariableInitial = `${counter}:${label}`;
      window.moduleExportVariableOrder.push(`module:${counter}:${label}`);

      Promise.resolve().then(() => {
        window.moduleExportVariableAfterMicrotask = `${counter}:${label}`;
        window.moduleExportVariableOrder.push(
          `microtask:${window.moduleExportVariableAfterMicrotask}`
        );
      });

      setTimeout(() => {
        window.moduleExportVariableAfterTimeout = `${counter}:${label}`;
        window.moduleExportVariableOrder.push(
          `timeout:${window.moduleExportVariableAfterTimeout}`
        );
        window.moduleExportVariableFinalOrder =
          window.moduleExportVariableOrder.join(",");
      }, 10);
    </script>
  </head>
  <body></body>
</html>
