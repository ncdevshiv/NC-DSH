<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.phaseTwoUpgradeStyleOrder = [];
      window.phaseTwoUpgradeStyleLoaded = false;
      document.addEventListener("DOMContentLoaded", () => {
        window.phaseTwoUpgradeStyleOrder.push("dcl");
        window.phaseTwoUpgradeDeferDclOrder =
          window.phaseTwoUpgradeStyleOrder.join(",");
      });
    </script>
    <script>
      customElements.define(
        "x-phase-two-upgrade-defer",
        class extends HTMLElement {
          connectedCallback() {
            if (this.hasAttribute("data-upgraded")) {
              return;
            }
            this.setAttribute("data-upgraded", "1");
            window.phaseTwoUpgradeStyleOrder.push("connected");

            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = "/assets/blocking_stylesheet_slow.css?phase2-upgrade=defer";
            link.addEventListener(
              "load",
              () => {
                window.phaseTwoUpgradeStyleLoaded = true;
                window.phaseTwoUpgradeStyleOrder.push("style-load");
                window.phaseTwoUpgradeStyleFinalOrder =
                  window.phaseTwoUpgradeStyleOrder.join(",");
              },
              { once: true }
            );
            document.head.appendChild(link);
          }
        }
      );
    </script>
    <x-phase-two-upgrade-defer></x-phase-two-upgrade-defer>
    <script defer src="/assets/phase_two_upgrade_runtime_style_defer.js"></script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
