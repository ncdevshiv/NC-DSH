<!doctype html>
<html>
  <body>
    <script>
      window.documentWriteLoadMicrotaskOrder = [];

      document.write(
        '<script src="/assets/document_write_load_microtask.js" onload="window.documentWriteLoadMicrotaskOrder.push(\'load\'); queueMicrotask(() => window.documentWriteLoadMicrotaskOrder.push(\'load-microtask\')); window.documentWriteLoadMicrotaskDuringLoad = window.documentWriteLoadMicrotaskOrder.join(\',\');"><\/script>' +
          '<script>window.documentWriteLoadMicrotaskOrder.push(\'after-inline\'); window.documentWriteLoadMicrotaskAfterInline = window.documentWriteLoadMicrotaskOrder.join(\',\');<\/script>'
      );

      window.addEventListener("load", () => {
        window.documentWriteLoadMicrotaskFinal =
          window.documentWriteLoadMicrotaskOrder.join(",");
      });
    </script>
  </body>
</html>
