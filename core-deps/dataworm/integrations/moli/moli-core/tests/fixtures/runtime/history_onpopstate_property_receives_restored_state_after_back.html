<!doctype html>
<html>
  <body
    data-onpopstate-fired=""
    data-onpopstate-state=""
    data-history-state=""
    data-sync-history-state=""
    data-timeout-history-state=""
  >
    <script>
      const state = { new: "field", testComplete: true, testInProgress: true };

      history.replaceState(state, "", "");
      history.pushState(null, "", "#after");

      window.onpopstate = (event) => {
        document.body.setAttribute("data-onpopstate-fired", "true");
        document.body.setAttribute(
          "data-onpopstate-state",
          JSON.stringify(event.state)
        );
        document.body.setAttribute(
          "data-history-state",
          JSON.stringify(history.state)
        );
      };

      history.back();

      document.body.setAttribute(
        "data-sync-history-state",
        String(history.state === null ? "null" : JSON.stringify(history.state))
      );

      setTimeout(() => {
        document.body.setAttribute(
          "data-timeout-history-state",
          String(history.state === null ? "null" : JSON.stringify(history.state))
        );
      }, 0);
    </script>
  </body>
</html>
