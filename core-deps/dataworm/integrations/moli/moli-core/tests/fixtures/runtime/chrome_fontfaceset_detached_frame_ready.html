<!doctype html>
<html>
  <body data-ok="" data-ready-exists="">
    <script>
      const body = document.body;
      let ok = true;
      let readyExists = false;
      try {
        const frame = document.createElement('iframe');
        document.body.appendChild(frame);
        const doc = frame.contentDocument;
        document.body.removeChild(frame);
        readyExists = !!doc?.fonts?.ready;
      } catch (error) {
        ok = false;
      }
      body.setAttribute('data-ok', String(ok));
      body.setAttribute('data-ready-exists', String(readyExists));
    </script>
  </body>
</html>
