<!doctype html>
<body></body>
<script>
  const order = [];
  let committed = false;
  let finished = false;
  let committedValue = null;
  let finishedValue = null;

  window.addEventListener("popstate", () => {
    order.push("popstate:" + location.hash);
  });

  window.addEventListener("hashchange", () => {
    order.push("hashchange:" + location.hash);
  });

  navigation.addEventListener("currententrychange", (event) => {
    order.push("cec:" + String(event.navigationType) + ":" + location.hash);
  });

  history.replaceState({ base: 1 }, "", "#base");

  const result = navigation.navigate(location.pathname + "#dest", {
    history: "push",
    state: { step: 1 },
  });

  result.committed.then((entry) => {
    committed = true;
    committedValue = entry;
    order.push("committed:" + location.hash);
  });

  result.finished.then((entry) => {
    finished = true;
    finishedValue = entry;
    order.push("finished:" + location.hash);
  });

  document.body.setAttribute(
    "data-sync",
    "hash=" +
      location.hash +
      "|committed=" +
      committed +
      "|finished=" +
      finished +
      "|order=" +
      order.join(",")
  );
  document.body.setAttribute("data-sync-result-keys", Object.keys(result).join(","));
  document.body.setAttribute("data-sync-result-props", Object.getOwnPropertyNames(result).join(","));

  setTimeout(() => {
    document.body.setAttribute(
      "data-timeout",
      "hash=" +
        location.hash +
        "|committed=" +
        committed +
        "|finished=" +
        finished +
        "|order=" +
        order.join(",")
    );
    document.body.setAttribute("data-committed-type", Object.prototype.toString.call(committedValue));
    document.body.setAttribute("data-finished-type", Object.prototype.toString.call(finishedValue));
    document.body.setAttribute("data-committed-url", committedValue?.url ?? "");
    document.body.setAttribute("data-finished-url", finishedValue?.url ?? "");
    document.body.setAttribute("data-current-same-committed", String(committedValue === navigation.currentEntry));
    document.body.setAttribute("data-current-same-finished", String(finishedValue === navigation.currentEntry));
  }, 0);
</script>
