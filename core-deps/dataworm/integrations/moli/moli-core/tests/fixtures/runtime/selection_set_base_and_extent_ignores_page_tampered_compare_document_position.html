<!doctype html>
<html>
  <body data-tampered-compare-document-position-called="no">
    <p>
      <span id="first">alpha</span>
      <span id="second">beta</span>
    </p>
    <script>
      Node.prototype.compareDocumentPosition = function () {
        document.body.setAttribute(
          "data-tampered-compare-document-position-called",
          "yes",
        );
        throw new Error("page tampered Node.prototype.compareDocumentPosition");
      };

      const sel = window.getSelection();
      const first = document.getElementById("first").firstChild;
      const second = document.getElementById("second").firstChild;

      sel.setBaseAndExtent(first, 1, second, 2);

      const range = sel.getRangeAt(0);
      document.body.setAttribute("data-selection-direction", sel.direction);
      document.body.setAttribute(
        "data-anchor-parent-id",
        sel.anchorNode.parentNode.id,
      );
      document.body.setAttribute(
        "data-focus-parent-id",
        sel.focusNode.parentNode.id,
      );
      document.body.setAttribute(
        "data-range-start-parent-id",
        range.startContainer.parentNode.id,
      );
      document.body.setAttribute(
        "data-range-start-offset",
        String(range.startOffset),
      );
      document.body.setAttribute(
        "data-range-end-parent-id",
        range.endContainer.parentNode.id,
      );
      document.body.setAttribute(
        "data-range-end-offset",
        String(range.endOffset),
      );
    </script>
  </body>
</html>
