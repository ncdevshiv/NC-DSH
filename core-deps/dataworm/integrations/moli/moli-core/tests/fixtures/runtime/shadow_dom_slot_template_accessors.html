<!doctype html>
<html>
<body
  data-shadow-root=""
  data-slot-reflection=""
  data-slot-assignment=""
  data-template-content=""
>
<script>
const host = document.createElement('div');
document.body.appendChild(host);
const root = host.attachShadow({mode: 'open'});
const slot = document.createElement('slot');
slot.setAttribute('name', 'named');
root.appendChild(slot);

const assigned = document.createElement('span');
assigned.id = 'assigned';
assigned.slot = 'named';
host.appendChild(assigned);

document.body.setAttribute('data-shadow-root', `${host.shadowRoot === root}:${root.host === host}:${root.mode}`);
document.body.setAttribute('data-slot-reflection', `${assigned.slot}:${assigned.getAttribute('slot')}:${assigned.assignedSlot === slot}`);
document.body.setAttribute('data-slot-assignment', `${slot.assignedNodes().map(node => node.id).join(',')}:${slot.assignedElements({flatten: true}).map(node => node.id).join(',')}`);

const template = document.createElement('template');
template.innerHTML = '<span id="inside-template"></span>';
document.body.appendChild(template);
document.body.setAttribute('data-template-content', `${template.content.nodeType}:${template.content.childNodes.length}:${document.getElementById('inside-template') === null}`);
</script>
</body>
</html>
