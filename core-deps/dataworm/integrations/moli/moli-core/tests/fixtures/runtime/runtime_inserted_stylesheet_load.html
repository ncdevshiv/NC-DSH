<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimeInsertedStylesheetLoadStart = Date.now();
      window.runtimeInsertedStylesheetLoadOrder = [];
      document.addEventListener('DOMContentLoaded', () => {
        window.runtimeInsertedStylesheetLoadOrder.push('dcl');
        window.runtimeInsertedStylesheetLoadFinalOrder =
          window.runtimeInsertedStylesheetLoadOrder.join(',');
      });

      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/assets/blocking_stylesheet_slow.css';
      link.addEventListener('load', () => {
        window.runtimeInsertedStylesheetLoadElapsed =
          Date.now() - window.runtimeInsertedStylesheetLoadStart;
        window.runtimeInsertedStylesheetLoadBlockedEnough =
          window.runtimeInsertedStylesheetLoadElapsed >= 50;
        window.runtimeInsertedStylesheetLoadOrder.push('style-load');
        window.runtimeInsertedStylesheetLoadFinalOrder =
          window.runtimeInsertedStylesheetLoadOrder.join(',');
      });
      document.head.appendChild(link);
    </script>
  </head>
  <body></body>
</html>
