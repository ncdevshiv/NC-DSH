<!doctype html>
<html>
  <body>
    <div id="root"><span id="alpha">alpha</span><span id="beta">beta</span></div>
    <script>
      try {
        const bridge = globalThis.__moliNativeBridge;
        const root = document.getElementById("root");
        const beta = document.getElementById("beta");

        root.__moliConnected = false;
        root.__moliChildNodes = [];
        beta.__moliParentNode = null;
        beta.__moliParentElement = null;
        beta.__moliConnected = false;

        const script = document.createElement("script");
        script.text = "window.rustDomMutationSyncExecuted = (window.rustDomMutationSyncExecuted ?? 0) + 1;";
        root.appendChild(script);

        const gamma = document.createElement("span");
        gamma.id = "gamma";
        gamma.textContent = "gamma";
        root.insertBefore(gamma, beta);

        root.__moliChildNodes = [];
        const removed = root.removeChild(beta);

        window.rustDomMutationSyncError = null;
        window.rustDomMutationSyncExecuted = window.rustDomMutationSyncExecuted ?? 0;
        window.rustDomMutationSyncScriptConnected =
          bridge.describeNode(script)?.connected === true;
        window.rustDomMutationSyncScriptParent = script.parentNode === root;
        window.rustDomMutationSyncGammaParent = gamma.parentNode === root;
        window.rustDomMutationSyncRemovedIdentity = removed === beta;
        window.rustDomMutationSyncRemovedParent = beta.parentNode === null;
        window.rustDomMutationSyncRemovedConnected =
          bridge.describeNode(beta)?.connected === false;
        window.rustDomMutationSyncChildOrder = Array.from(root.childNodes, (node) =>
          node.id || node.nodeName,
        ).join("|");
      } catch (error) {
        window.rustDomMutationSyncError = String(error);
      }
    </script>
  </body>
</html>
