<!doctype html>
<html>
  <body
    data-currententrychange-count=""
    data-property-currententrychange-count=""
    data-history-state=""
    data-navigation-state=""
    data-activation-entry-url=""
    data-activation-from-url=""
    data-activation-navigation-type=""
  >
    <script>
      let listenerCount = 0;
      let propertyCount = 0;

      navigation.addEventListener("currententrychange", () => {
        listenerCount += 1;
      });

      navigation.oncurrententrychange = () => {
        propertyCount += 1;
      };

      document.body.setAttribute(
        "data-navlog",
        sessionStorage.getItem("navlog") ?? "null"
      );
      document.body.setAttribute(
        "data-entry-url",
        navigation.currentEntry?.url ?? "null"
      );
      document.body.setAttribute(
        "data-currententrychange-count",
        String(listenerCount)
      );
      document.body.setAttribute(
        "data-property-currententrychange-count",
        String(propertyCount)
      );
      document.body.setAttribute(
        "data-history-state",
        JSON.stringify(history.state)
      );
      document.body.setAttribute(
        "data-navigation-state",
        JSON.stringify(navigation.currentEntry?.getState?.() ?? null)
      );
      document.body.setAttribute(
        "data-activation-entry-url",
        String(navigation.activation?.entry?.url ?? "")
      );
      document.body.setAttribute(
        "data-activation-from-url",
        String(navigation.activation?.from?.url ?? "")
      );
      document.body.setAttribute(
        "data-activation-navigation-type",
        String(navigation.activation?.navigationType ?? "")
      );
    </script>
  </body>
</html>
