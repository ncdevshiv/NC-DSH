<html>

    <script>
      window.moduleExportClassOrder = [];
      document.addEventListener("DOMContentLoaded", () => {
        window.moduleExportClassOrder.push("dcl");
        window.moduleExportClassDclOrder =
          window.moduleExportClassOrder.join(",");
      });

    <script type="module">
      import { DerivedAnswer } from "/assets/module-export-class-named.mjs";

      const instance = new DerivedAnswer();

      window.moduleExportClassName = DerivedAnswer.name;
      window.moduleExportClassOrder.push("module");
    </script>
  </head>
