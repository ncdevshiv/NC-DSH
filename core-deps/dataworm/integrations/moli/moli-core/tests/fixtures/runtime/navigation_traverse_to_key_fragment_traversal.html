<!doctype html>
<html>
<body
  data-order=""
  data-from-url=""
  data-navigation-type=""
  data-current-key-sync=""
  data-current-key-committed=""
  data-current-key-finished=""
  data-completed-hash=""
  data-completed-state=""
  data-cangoback-after=""
  data-cangoforward-after=""
  data-missing-key-sync=""
  data-missing-key-committed=""
  data-missing-key-finished=""
  data-missing-argument-name=""
  data-missing-argument-required=""
  data-symbol-name=""
  data-undefined-key-sync=""
  data-undefined-key-committed=""
  data-undefined-key-finished=""
>
<script>
document.addEventListener("DOMContentLoaded", () => {
  history.pushState({ n: 1 }, "", "#one");
  history.pushState({ n: 2 }, "", "#two");

  const entries = navigation.entries();
  const target = entries.find((entry) => new URL(entry.url).hash === "#one");
  const order = [];

  navigation.addEventListener("currententrychange", (event) => {
    order.push(
      "currententrychange:" +
        String(event.navigationType) +
        ":" +
        (event.from ? new URL(event.from.url).hash || "(none)" : "(null)")
    );
    queueMicrotask(() => {
      order.push(
        "currententrychange-microtask:" +
          location.hash +
          ":" +
          String(history.state?.n ?? "null")
      );
    });
    document.body.setAttribute(
      "data-from-url",
      event.from ? event.from.url : "null"
    );
    document.body.setAttribute(
      "data-navigation-type",
      String(event.navigationType)
    );
  });
  window.addEventListener("popstate", (event) => {
    order.push("popstate:" + String(event.state?.n ?? "null"));
    queueMicrotask(() => {
      order.push("popstate-microtask:" + String(history.state?.n ?? "null"));
    });
  });
  window.addEventListener("hashchange", () => {
    order.push("hashchange:" + location.hash);
    queueMicrotask(() => {
      order.push("hashchange-microtask:" + location.hash);
      document.body.setAttribute("data-completed-hash", location.hash);
      document.body.setAttribute(
        "data-completed-state",
        JSON.stringify(history.state)
      );
      document.body.setAttribute(
        "data-cangoback-after",
        String(navigation.canGoBack)
      );
      document.body.setAttribute(
        "data-cangoforward-after",
        String(navigation.canGoForward)
      );
      document.body.setAttribute("data-order", order.join(","));
    });
  });

  document.body.setAttribute("data-traverseto-type", typeof navigation.traverseTo);
  document.body.setAttribute("data-target-key-present", String(!!target && typeof target.key === "string"));
  document.body.setAttribute("data-cangoback-before", String(navigation.canGoBack));
  document.body.setAttribute("data-cangoforward-before", String(navigation.canGoForward));

  const currentEntry = navigation.currentEntry;
  const currentRet = navigation.traverseTo(currentEntry.key);
  document.body.setAttribute(
    "data-current-key-sync",
    [
      String(typeof currentRet?.committed?.then === "function"),
      String(typeof currentRet?.finished?.then === "function"),
      String(navigation.currentEntry === currentEntry),
    ].join("|")
  );
  const describeEntry = (entry) =>
    [
      Object.prototype.toString.call(entry),
      new URL(entry?.url ?? location.href).hash || "(none)",
      String(entry === currentEntry),
    ].join("|");
  currentRet.committed.then((entry) => {
    document.body.setAttribute("data-current-key-committed", describeEntry(entry));
  });
  currentRet.finished.then((entry) => {
    document.body.setAttribute("data-current-key-finished", describeEntry(entry));
  });

  const missingRet = navigation.traverseTo("missing-key");
  document.body.setAttribute(
    "data-missing-key-sync",
    [
      String(typeof missingRet?.committed?.then === "function"),
      String(typeof missingRet?.finished?.then === "function"),
      String(navigation.currentEntry === currentEntry),
    ].join("|")
  );
  const describeRejection = (error) =>
    [String(error?.name ?? ""), String(error?.message ?? "")].join("|");
  missingRet.committed.then(
    () => document.body.setAttribute("data-missing-key-committed", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-missing-key-committed",
        describeRejection(error)
      )
  );
  missingRet.finished.then(
    () => document.body.setAttribute("data-missing-key-finished", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-missing-key-finished",
        describeRejection(error)
      )
  );

  try {
    navigation.traverseTo();
  } catch (error) {
    document.body.setAttribute("data-missing-argument-name", String(error?.name ?? ""));
    document.body.setAttribute(
      "data-missing-argument-required",
      String(String(error?.message ?? "").includes("1 argument required"))
    );
  }

  try {
    navigation.traverseTo(Symbol("key"));
  } catch (error) {
    document.body.setAttribute("data-symbol-name", String(error?.name ?? ""));
  }

  const undefinedRet = navigation.traverseTo(undefined);
  document.body.setAttribute(
    "data-undefined-key-sync",
    [
      String(typeof undefinedRet?.committed?.then === "function"),
      String(typeof undefinedRet?.finished?.then === "function"),
      String(navigation.currentEntry === currentEntry),
    ].join("|")
  );
  undefinedRet.committed.then(
    () => document.body.setAttribute("data-undefined-key-committed", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-undefined-key-committed",
        describeRejection(error)
      )
  );
  undefinedRet.finished.then(
    () => document.body.setAttribute("data-undefined-key-finished", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-undefined-key-finished",
        describeRejection(error)
      )
  );

  const ret = navigation.traverseTo(target.key);
  document.body.setAttribute(
    "data-return-shape",
    String(!!ret && typeof ret.committed?.then === "function" && typeof ret.finished?.then === "function"),
  );
  document.body.setAttribute("data-sync-hash", location.hash);
  document.body.setAttribute("data-sync-state", JSON.stringify(history.state));

});
</script>
</body>
</html>
