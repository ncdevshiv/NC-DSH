        window.moduleDefaultDeclOrder.push("dcl");
        window.moduleDefaultDeclDclOrder =
          window.moduleDefaultDeclOrder.join(",");

      import makeValue from "/assets/module-default-function-export.mjs";
      import ValueBox from "/assets/module-default-class-export.mjs";

      window.moduleDefaultDeclFunctionName = makeValue.name;
      window.moduleDefaultDeclClassName = ValueBox.name;
      window.moduleDefaultDeclOrder.push("module");
    </script>
  </head>
