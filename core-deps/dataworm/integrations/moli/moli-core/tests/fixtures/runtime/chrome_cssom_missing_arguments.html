<!doctype html>
<html>
  <body
    data-style-type=""
    data-item-throws=""
    data-get-property-value-throws=""
    data-get-property-priority-throws=""
    data-set-property-no-args-throws=""
    data-set-property-name-only-throws=""
    data-remove-property-throws=""
  >
    <script>
      const style = document.body.style;
      const body = document.body;

      function throws(fn) {
        try {
          fn();
          return false;
        } catch (_) {
          return true;
        }
      }

      body.setAttribute('data-style-type', style.constructor.name);
      body.setAttribute('data-item-throws', String(throws(() => style.item())));
      body.setAttribute(
        'data-get-property-value-throws',
        String(throws(() => style.getPropertyValue()))
      );
      body.setAttribute(
        'data-get-property-priority-throws',
        String(throws(() => style.getPropertyPriority()))
      );
      body.setAttribute(
        'data-set-property-no-args-throws',
        String(throws(() => style.setProperty()))
      );
      body.setAttribute(
        'data-set-property-name-only-throws',
        String(throws(() => style.setProperty('color')))
      );
      body.setAttribute(
        'data-remove-property-throws',
        String(throws(() => style.removeProperty()))
      );
    </script>
  </body>
</html>
