<!doctype html>
<html>
  <body>
    <iframe
      id="child"
      src="/compat/window-child-browsing-context-target-name-a?base=1"
    ></iframe>
    <script>
      const iframe = document.getElementById('child');
      const topHrefBefore = window.location.href;
      const topHistoryBefore = window.history.length;

      iframe.addEventListener(
        'load',
        () => {
          const childWindow = iframe.contentWindow;
          let childReloadCount = 0;
          iframe.addEventListener('load', () => {
            childReloadCount += 1;
          });

          childWindow.history.pushState(
            { step: 'push' },
            '',
            'relative-child?step=push'
          );
          childWindow.history.replaceState(
            { step: 'replace' },
            '',
            '#frag'
          );

          document.body.setAttribute(
            'data-top-location-unchanged',
            String(window.location.href === topHrefBefore)
          );
          document.body.setAttribute(
            'data-top-history-unchanged',
            String(window.history.length === topHistoryBefore)
          );
          document.body.setAttribute(
            'data-child-location-href',
            childWindow.location.href
          );
          document.body.setAttribute(
            'data-child-document-location-href',
            childWindow.document.location.href
          );
          document.body.setAttribute(
            'data-child-current-entry-url',
            childWindow.navigation.currentEntry?.url ?? 'null'
          );
          document.body.setAttribute(
            'data-child-history-state',
            JSON.stringify(childWindow.history.state)
          );
          document.body.setAttribute(
            'data-child-history-length',
            String(childWindow.history.length)
          );
          childWindow.history.back();
          setTimeout(() => {
            document.body.setAttribute(
              'data-top-history-unchanged-after-back',
              String(window.history.length === topHistoryBefore)
            );
            document.body.setAttribute(
              'data-child-path-back-reload-count',
              String(childReloadCount)
            );
            document.body.setAttribute(
              'data-child-path-back-location-href',
              childWindow.location.href
            );
            document.body.setAttribute(
              'data-child-path-back-document-location-href',
              childWindow.document.location.href
            );
            document.body.setAttribute(
              'data-child-path-back-current-entry-url',
              childWindow.navigation.currentEntry?.url ?? 'null'
            );
            document.body.setAttribute(
              'data-child-path-back-history-state',
              JSON.stringify(childWindow.history.state)
            );
            document.body.setAttribute(
              'data-child-path-back-history-length',
              String(childWindow.history.length)
            );
            document.body.setAttribute(
              'data-child-path-back-can-forward',
              String(childWindow.navigation.canGoForward)
            );
            document.body.setAttribute(
              'data-child-path-back-current-same-document',
              String(childWindow.navigation.currentEntry?.sameDocument ?? 'null')
            );
          }, 50);
        },
        { once: true }
      );
    </script>
  </body>
</html>
