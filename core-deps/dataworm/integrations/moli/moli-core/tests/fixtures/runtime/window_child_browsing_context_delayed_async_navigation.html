<!doctype html>
<html>
  <body data-parent-continued="false">
    <iframe id="child" src="/compat/window-child-browsing-context-delayed-child"></iframe>
    <script>
      const iframe = document.getElementById('child');
      document.body.setAttribute('data-parent-continued', 'true');
      document.body.setAttribute(
        'data-child-before-load',
        iframe.contentDocument?.body?.getAttribute('data-child') ?? 'not-ready'
      );
      iframe.addEventListener('load', () => {
        document.body.setAttribute('data-child-load-fired', 'true');
        document.body.setAttribute(
          'data-child-after-load',
          iframe.contentDocument?.body?.getAttribute('data-child') ?? 'null'
        );
        document.body.setAttribute(
          'data-child-script-ran',
          iframe.contentDocument?.body?.getAttribute('data-script-ran') ?? 'null'
        );
      });
    </script>
  </body>
</html>
