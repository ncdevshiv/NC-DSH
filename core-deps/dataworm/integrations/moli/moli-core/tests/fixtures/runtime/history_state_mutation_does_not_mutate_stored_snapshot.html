<!doctype html>
<html>
  <body
    data-sync-state=""
    data-popstate-state=""
    data-history-state=""
    data-timeout-state=""
  >
    <script>
      history.pushState({ x: 1 }, "", "#one");
      history.state.x = 99;
      history.pushState({ y: 2 }, "", "#two");

      window.addEventListener("popstate", (event) => {
        document.body.setAttribute(
          "data-popstate-state",
          JSON.stringify(event.state)
        );
        document.body.setAttribute(
          "data-history-state",
          JSON.stringify(history.state)
        );
      });

      history.back();
      document.body.setAttribute(
        "data-sync-state",
        JSON.stringify(history.state)
      );

      setTimeout(() => {
        document.body.setAttribute(
          "data-timeout-state",
          JSON.stringify(history.state)
        );
      }, 0);
    </script>
  </body>
</html>
