<!doctype html>
<html>
  <head>
    <style>
      @font-face { font-family: sans-serif; src: local(Arial); }
      @font-face { font-family: serif; src: local(Arial); }
      @font-face { font-family: fantasy; src: local(Arial); }
      @font-face { font-family: cursive; src: local(Arial); }
      @font-face { font-family: monospace; src: local(Arial); }
      @font-face { font-family: inherit; src: local(Arial); }
      @font-face { font-family: initial; src: local(Arial); }
      @font-face { font-family: unset; src: local(Arial); }
      @font-face { font-family: default; src: local(Arial); }
    </style>
  </head>
  <body data-size="">
    <script>
      document.body.setAttribute('data-size', String(document.fonts.size));
    </script>
  </body>
</html>
