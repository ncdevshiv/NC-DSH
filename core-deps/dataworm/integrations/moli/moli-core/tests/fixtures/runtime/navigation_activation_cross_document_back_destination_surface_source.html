<!doctype html>
<meta charset="utf-8">
<body
  data-transition-is-null=""
  data-history-length=""
  data-entry-url=""
  data-from-url=""
  data-navigation-type=""
  data-currententrychange-count=""
  data-property-currententrychange-count=""
  data-history-state=""
  data-navigation-state=""
  data-b-entry-url=""
  data-b-from-url=""
  data-b-navigation-type=""
  data-b-current-url=""
  data-b-history-length=""
  data-b-can-back=""
  data-b-can-forward=""
  data-source-sync=""
  data-source-log=""
  data-source-committed-url=""
  data-source-finished-url=""
></body>
<script>
  const storageKey = "activation-cross-document-back";
  const loads = Number(sessionStorage.getItem(`${storageKey}:loads`) ?? "0") + 1;
  sessionStorage.setItem(`${storageKey}:loads`, String(loads));

  let listenerCount = 0;
  let propertyCount = 0;
  navigation.addEventListener("currententrychange", () => {
    listenerCount += 1;
  });
  navigation.oncurrententrychange = () => {
    propertyCount += 1;
  };

  if (loads === 1) {
    navigation.navigate(
      "/compat/navigation-activation-cross-document-back-destination-surface-dest",
      { history: "push" }
    );
  } else {
    const before = JSON.parse(
      sessionStorage.getItem(`${storageKey}:dest-before`) ?? "null"
    );
    document.body.setAttribute(
      "data-transition-is-null",
      String(navigation.transition === null)
    );
    document.body.setAttribute("data-history-length", String(history.length));
    document.body.setAttribute(
      "data-entry-url",
      String(navigation.activation?.entry?.url ?? "")
    );
    document.body.setAttribute(
      "data-from-url",
      String(navigation.activation?.from?.url ?? "")
    );
    document.body.setAttribute(
      "data-navigation-type",
      String(navigation.activation?.navigationType ?? "")
    );
    document.body.setAttribute(
      "data-currententrychange-count",
      String(listenerCount)
    );
    document.body.setAttribute(
      "data-property-currententrychange-count",
      String(propertyCount)
    );
    document.body.setAttribute("data-history-state", JSON.stringify(history.state));
    document.body.setAttribute(
      "data-navigation-state",
      JSON.stringify(navigation.currentEntry?.getState?.() ?? null)
    );
    document.body.setAttribute(
      "data-b-entry-url",
      String(before?.activationEntry ?? "")
    );
    document.body.setAttribute(
      "data-b-from-url",
      String(before?.activationFrom ?? "")
    );
    document.body.setAttribute(
      "data-b-navigation-type",
      String(before?.activationType ?? "")
    );
    document.body.setAttribute(
      "data-b-current-url",
      String(before?.current ?? "")
    );
    document.body.setAttribute(
      "data-b-history-length",
      String(before?.length ?? "")
    );
    document.body.setAttribute(
      "data-b-can-back",
      String(before?.canBack ?? "")
    );
    document.body.setAttribute(
      "data-b-can-forward",
      String(before?.canForward ?? "")
    );
    document.body.setAttribute(
      "data-source-sync",
      sessionStorage.getItem(`${storageKey}:source-sync`) ?? ""
    );
    document.body.setAttribute(
      "data-source-log",
      sessionStorage.getItem(`${storageKey}:source-log`) ?? ""
    );
    document.body.setAttribute(
      "data-source-committed-url",
      sessionStorage.getItem(`${storageKey}:source-committed-url`) ?? ""
    );
    document.body.setAttribute(
      "data-source-finished-url",
      sessionStorage.getItem(`${storageKey}:source-finished-url`) ?? ""
    );
  }
</script>
