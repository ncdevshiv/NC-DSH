<!doctype html>
<html><body
  data-back-type=""
  data-forward-type=""
  data-cangoback-before=""
  data-cangoforward-before=""
  data-noop-back-sync=""
  data-noop-forward-sync=""
  data-noop-back-committed=""
  data-noop-back-finished=""
  data-noop-forward-committed=""
  data-noop-forward-finished=""
  data-entries-length=""
  data-sync-hash=""
  data-sync-state=""
  data-return-shape=""
  data-timeout-hash=""
  data-timeout-state=""
  data-cangoback-after=""
  data-cangoforward-after=""
></body><script>
window.addEventListener("load", () => {
  const initialEntry = navigation.currentEntry;
  const describeRejection = (error) =>
    [String(error?.name ?? ""), String(error?.message ?? "")].join("|");
  const noopBack = navigation.back();
  const noopForward = navigation.forward();
  document.body.setAttribute(
    "data-noop-back-sync",
    [
      String(typeof noopBack?.committed?.then === "function"),
      String(typeof noopBack?.finished?.then === "function"),
      String(navigation.currentEntry === initialEntry),
    ].join("|")
  );
  document.body.setAttribute(
    "data-noop-forward-sync",
    [
      String(typeof noopForward?.committed?.then === "function"),
      String(typeof noopForward?.finished?.then === "function"),
      String(navigation.currentEntry === initialEntry),
    ].join("|")
  );
  noopBack.committed.then(
    () => document.body.setAttribute("data-noop-back-committed", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-noop-back-committed",
        describeRejection(error)
      )
  );
  noopBack.finished.then(
    () => document.body.setAttribute("data-noop-back-finished", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-noop-back-finished",
        describeRejection(error)
      )
  );
  noopForward.committed.then(
    () => document.body.setAttribute("data-noop-forward-committed", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-noop-forward-committed",
        describeRejection(error)
      )
  );
  noopForward.finished.then(
    () => document.body.setAttribute("data-noop-forward-finished", "fulfilled"),
    (error) =>
      document.body.setAttribute(
        "data-noop-forward-finished",
        describeRejection(error)
      )
  );

  history.pushState({ n: 1 }, "", "#one");
  history.pushState({ n: 2 }, "", "#two");

  document.body.setAttribute("data-back-type", typeof navigation.back);
  document.body.setAttribute("data-forward-type", typeof navigation.forward);
  document.body.setAttribute("data-cangoback-before", String(navigation.canGoBack));
  document.body.setAttribute("data-cangoforward-before", String(navigation.canGoForward));
  document.body.setAttribute("data-entries-length", String(navigation.entries().length));

  const ret = navigation.back();
  document.body.setAttribute("data-sync-hash", location.hash);
  document.body.setAttribute("data-sync-state", JSON.stringify(history.state));
  document.body.setAttribute(
    "data-return-shape",
    String(typeof ret?.committed?.then === "function" && typeof ret?.finished?.then === "function"),
  );

  setTimeout(() => {
    document.body.setAttribute("data-timeout-hash", location.hash);
    document.body.setAttribute("data-timeout-state", JSON.stringify(history.state));
    document.body.setAttribute("data-cangoback-after", String(navigation.canGoBack));
    document.body.setAttribute("data-cangoforward-after", String(navigation.canGoForward));
  }, 0);
});
</script></html>
