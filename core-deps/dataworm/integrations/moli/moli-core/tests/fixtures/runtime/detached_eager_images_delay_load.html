<!doctype html>
<html>
<body data-image-terminal-count="" data-window-load-terminal-count="">
  <script>
    window.detachedEagerImages = [];
    window.detachedEagerImageTerminals = [];

    document.addEventListener("DOMContentLoaded", () => {
      for (let i = 0; i < 5; i += 1) {
        const image = new Image();
        const recordTerminal = (kind) => {
          window.detachedEagerImageTerminals.push(kind + "-" + i);
          window.detachedEagerImageTerminalText =
            window.detachedEagerImageTerminals.join(",");
          document.body.setAttribute(
            "data-image-terminal-count",
            String(window.detachedEagerImageTerminals.length)
          );
        };
        image.onload = () => recordTerminal("load");
        image.onerror = () => recordTerminal("error");
        image.src = "/assets/detached-eager-image-slow/" + i;
        window.detachedEagerImages.push(image);
      }
    });

    window.addEventListener("load", () => {
      document.body.setAttribute(
        "data-window-load-terminal-count",
        String(window.detachedEagerImageTerminals.length)
      );
    });
  </script>
</body>
</html>
