<!doctype html>
<html>
  <head>
    <script>
      window.dynamicInOrderScriptOrder = [];
      window.dynamicSrcMutationLoads = 0;
      window.dynamicSrcMutationSettled = false;

      const script = document.createElement("script");
      script.async = false;
      script.src = "/assets/dynamic_taxonomy_in_order_fast.js";
      script.onload = () => {
        window.dynamicSrcMutationLoads += 1;
        if (window.dynamicSrcMutationLoads === 1) {
          script.src = "/assets/dynamic_taxonomy_in_order_slow.js";
          setTimeout(() => {
            window.dynamicSrcMutationSettled = true;
          }, 25);
        }
      };

      document.head.appendChild(script);
    </script>
  </head>
  <body>
    <script>
      testing.eventually(() => {
        testing.expectTrue(window.dynamicSrcMutationSettled);
        testing.expectEqual(1, window.dynamicSrcMutationLoads);
        testing.expectEqual(
          "in-order-fast",
          window.dynamicInOrderScriptOrderResult,
        );
      });
    </script>
  </body>
</html>
