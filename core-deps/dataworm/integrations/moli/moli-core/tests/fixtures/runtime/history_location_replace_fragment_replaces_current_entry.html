<!doctype html>
<html>
  <body>
    <script>
      const order = [];

      window.addEventListener('popstate', () => {
        order.push('popstate');
        queueMicrotask(() => order.push('popstate-microtask'));
      });

      window.addEventListener('hashchange', (event) => {
        order.push('hashchange');
        document.body.setAttribute('data-old', event.oldURL);
        document.body.setAttribute('data-new', event.newURL);
        queueMicrotask(() => {
          order.push('hashchange-microtask');
        });
      });

      const beforeLen = history.length;
      const beforeHref = location.href;

      location.replace('#frag');

      document.body.setAttribute('data-sync-len', String(history.length));
      document.body.setAttribute('data-sync-href', location.href);

      setTimeout(() => {
        document.body.setAttribute('data-before-len', String(beforeLen));
        document.body.setAttribute('data-before-href', beforeHref);
        document.body.setAttribute('data-order', order.join(','));
        document.body.setAttribute('data-final-len', String(history.length));
        document.body.setAttribute('data-final-href', location.href);
      }, 0);
    </script>
  </body>
</html>
