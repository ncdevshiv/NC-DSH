<!doctype html>
<html>
<head>
  <script>
    window.runtimeInsertedStyleImportOrder = [];
    document.addEventListener('DOMContentLoaded', () => {
      window.runtimeInsertedStyleImportOrder.push('dcl');
      const style = document.createElement('style');
      style.textContent = '@import url("/assets/missing-runtime-style-import.css"); body { color: rgb(1, 2, 3); }';
      style.onload = () => {
        window.runtimeInsertedStyleImportOrder.push('style-load');
      };
      style.onerror = () => {
        window.runtimeInsertedStyleImportOrder.push('style-error');
      };
      document.head.appendChild(style);
      window.runtimeInsertedStyleImportOrder.push('after-append');
    });
    window.addEventListener('load', () => {
      window.runtimeInsertedStyleImportOrder.push('window-load');
      window.runtimeInsertedStyleImportFinalOrder =
        window.runtimeInsertedStyleImportOrder.join(',');
    });
  </script>
</head>
<body><main>runtime inserted style import</main></body>
</html>
