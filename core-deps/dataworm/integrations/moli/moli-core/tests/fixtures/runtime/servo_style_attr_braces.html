<!doctype html>
<html>
  <body
    data-case1-color=""
    data-case1-background=""
    data-case2-color=""
    data-case2-background=""
    data-case3-color=""
    data-case3-background=""
  >
    <p id="case1" style="color: green; color: red }; background: lime;"></p>
    <p id="case2" style="{color: red; background: red; }"></p>
    <p
      id="case3"
      style="background: lime; {background: red; background: red; } background: red; color: green;"
    ></p>
    <script>
      const body = document.body;
      for (const id of ['case1', 'case2', 'case3']) {
        const style = document.getElementById(id).style;
        body.setAttribute(`data-${id}-color`, style.getPropertyValue('color'));
        body.setAttribute(
          `data-${id}-background`,
          style.getPropertyValue('background'),
        );
      }
    </script>
  </body>
</html>
