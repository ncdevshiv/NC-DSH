<!doctype html>
<html>
  <head>
    <title>modulepreload duplicate shared static dependency</title>
    <script>
      window.modulepreloadDuplicateOrder = ["classic-before"];
      window.modulepreloadDuplicateError = "";
      window.addEventListener("error", (event) => {
        window.modulepreloadDuplicateError =
          event.message || String(event.error || "error");
        window.modulepreloadDuplicateOrder.push("error");
        window.modulepreloadDuplicateFinalOrder =
          window.modulepreloadDuplicateOrder.join(",");
      });
      const link = document.createElement("link");
      link.rel = "modulepreload";
      link.href = "/assets/modulepreload_duplicate_leaf_slow.mjs";
      document.head.appendChild(link);
    </script>
    <script type="module" src="/assets/modulepreload_duplicate_root.mjs"></script>
    <script>
      window.modulepreloadDuplicateOrder.push("classic-after");
      window.modulepreloadDuplicateClassicAfter = true;
    </script>
  </head>
  <body>
    <main id="after">after</main>
  </body>
</html>
