<!doctype html>
<html>
<body
  data-usp-instance=""
  data-usp-tag=""
  data-usp-first=""
  data-usp-all=""
  data-usp-keys=""
  data-usp-values=""
  data-usp-entries=""
  data-usp-sorted=""
  data-usp-usv-surrogate=""
  data-url-search-sync=""
  data-url-usv-surrogate=""
  data-formdata-tag=""
  data-formdata-get=""
  data-formdata-all-count=""
  data-formdata-second=""
  data-formdata-keys=""
  data-formdata-entry-count=""
  data-formdata-submitter=""
  data-formdata-usv-surrogate=""
>
  <form id="f">
    <input name="alpha" value="1">
    <input type="submit" id="submitter" name="action" value="save">
  </form>
  <script>
    const body = document.body;

    const usp = new URLSearchParams("b=2&a=1&a=3");
    body.setAttribute("data-usp-instance", String(usp instanceof URLSearchParams));
    body.setAttribute("data-usp-tag", Object.prototype.toString.call(usp));
    body.setAttribute("data-usp-first", String(usp.get("a")));
    body.setAttribute("data-usp-all", JSON.stringify(usp.getAll("a")));
    body.setAttribute("data-usp-keys", Array.from(usp.keys()).join(","));
    body.setAttribute("data-usp-values", Array.from(usp.values()).join(","));
    body.setAttribute("data-usp-entries", JSON.stringify(Array.from(usp.entries())));
    usp.sort();
    body.setAttribute("data-usp-sorted", usp.toString());

    const url = new URL("https://example.com/?x=1");
    url.searchParams.append("y", "2");
    body.setAttribute("data-url-search-sync", url.search);

    const loneSurrogate = "\uD800";
    const replacement = "\uFFFD";
    const uspSurrogate = new URLSearchParams();
    uspSurrogate.append(loneSurrogate, loneSurrogate);
    body.setAttribute(
      "data-usp-usv-surrogate",
      String(
        uspSurrogate.get(replacement) === replacement &&
        uspSurrogate.toString() === "%EF%BF%BD=%EF%BF%BD"
      )
    );
    body.setAttribute(
      "data-url-usv-surrogate",
      new URL(loneSurrogate, "https://example.com/base").pathname
    );

    const fd = new FormData();
    fd.append("a", "1");
    fd.append("a", "2");
    fd.append("b", "3");
    body.setAttribute("data-formdata-tag", Object.prototype.toString.call(fd));
    body.setAttribute("data-formdata-get", String(fd.get("a")));
    body.setAttribute("data-formdata-all-count", String(fd.getAll("a").length));
    body.setAttribute("data-formdata-second", String(fd.getAll("a")[1]));
    body.setAttribute("data-formdata-keys", Array.from(fd.keys()).join(","));
    body.setAttribute("data-formdata-entry-count", String(Array.from(fd.entries()).length));

    const form = document.getElementById("f");
    const submitter = document.getElementById("submitter");
    const serialized = new FormData(form, submitter);
    body.setAttribute("data-formdata-submitter", JSON.stringify(Array.from(serialized.entries())));

    const fdSurrogate = new FormData();
    fdSurrogate.append(loneSurrogate, loneSurrogate);
    body.setAttribute(
      "data-formdata-usv-surrogate",
      String(fdSurrogate.get(replacement) === replacement)
    );
  </script>
</body>
</html>
