<!doctype html>
<html>
  <body
    data-arial=""
    data-nonexistent=""
    data-sans-serif=""
    data-fallback-list=""
    data-plain-list=""
  >
    <script>
      const body = document.body;
      body.setAttribute('data-arial', String(document.fonts.check('10px Arial')));
      body.setAttribute(
        'data-nonexistent',
        String(document.fonts.check('10px Nonexistent'))
      );
      body.setAttribute(
        'data-sans-serif',
        String(document.fonts.check('10px sans-serif'))
      );
      body.setAttribute(
        'data-fallback-list',
        String(document.fonts.check('10px Nonexistent, monospace'))
      );
      body.setAttribute(
        'data-plain-list',
        String(document.fonts.check('10px Nonexistent1, Nonexistent2'))
      );
    </script>
  </body>
</html>
