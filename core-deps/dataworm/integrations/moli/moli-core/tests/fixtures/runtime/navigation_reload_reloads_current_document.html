<!doctype html>
<html><body
  data-count=""
  data-typeof-reload=""
  data-reload-length=""
  data-return-shape=""
  data-sync-snapshot=""
  data-history-state=""
  data-nav-state=""
  data-activation-type=""
  data-activation-entry=""
  data-activation-from=""
  data-committed-shape=""
  data-finished-shape=""
  data-currententrychange-count=""
  data-property-currententrychange-count=""
>
<script>
window.addEventListener("load", () => {
  const count = Number(sessionStorage.getItem("navReloadCount") || "0");
  sessionStorage.setItem("navReloadCount", String(count + 1));
  document.body.setAttribute("data-count", String(count + 1));
  document.body.setAttribute("data-typeof-reload", typeof navigation.reload);
  document.body.setAttribute("data-reload-length", String(navigation.reload?.length));

  let currentEntryChanges = 0;
  let propertyCurrentEntryChanges = 0;
  navigation.addEventListener("currententrychange", () => {
    currentEntryChanges += 1;
  });
  navigation.oncurrententrychange = () => {
    propertyCurrentEntryChanges += 1;
  };

  if (count === 0) {
    const beforeEntry = navigation.currentEntry;
    const result = navigation.reload({ state: { ignored: true } });
    sessionStorage.setItem(
      "navReloadReturnShape",
      String(!!result && typeof result === "object" && "committed" in result && "finished" in result),
    );
    sessionStorage.setItem(
      "navReloadSyncSnapshot",
      [
        String(beforeEntry === navigation.currentEntry),
        String(currentEntryChanges),
        String(propertyCurrentEntryChanges),
      ].join("|"),
    );
    result.committed.then((entry) => {
      sessionStorage.setItem(
        "navReloadCommittedShape",
        [
          Object.prototype.toString.call(entry),
          String(entry?.url ?? ""),
          String(entry === navigation.currentEntry),
          String(entry === beforeEntry),
          String(currentEntryChanges),
          String(propertyCurrentEntryChanges),
        ].join("|"),
      );
    });
    result.finished.then((entry) => {
      sessionStorage.setItem(
        "navReloadFinishedShape",
        [
          Object.prototype.toString.call(entry),
          String(entry?.url ?? ""),
          String(entry === navigation.currentEntry),
          String(entry === beforeEntry),
          String(currentEntryChanges),
          String(propertyCurrentEntryChanges),
        ].join("|"),
      );
    });
    return;
  }

  document.body.setAttribute(
    "data-return-shape",
    sessionStorage.getItem("navReloadReturnShape") || "",
  );
  document.body.setAttribute(
    "data-sync-snapshot",
    sessionStorage.getItem("navReloadSyncSnapshot") || "",
  );
  document.body.setAttribute("data-history-state", JSON.stringify(history.state));
  document.body.setAttribute(
    "data-nav-state",
    JSON.stringify(navigation.currentEntry?.getState?.() ?? null),
  );
  document.body.setAttribute(
    "data-activation-type",
    String(navigation.activation?.navigationType ?? "")
  );
  document.body.setAttribute(
    "data-activation-entry",
    String(navigation.activation?.entry?.url ?? "")
  );
  document.body.setAttribute(
    "data-activation-from",
    String(navigation.activation?.from?.url ?? "")
  );
  document.body.setAttribute(
    "data-committed-shape",
    sessionStorage.getItem("navReloadCommittedShape") || ""
  );
  document.body.setAttribute(
    "data-finished-shape",
    sessionStorage.getItem("navReloadFinishedShape") || ""
  );
  document.body.setAttribute(
    "data-currententrychange-count",
    String(currentEntryChanges)
  );
  document.body.setAttribute(
    "data-property-currententrychange-count",
    String(propertyCurrentEntryChanges)
  );
});
</script>
</body></html>
