<!doctype html>
<html>
  <body
    data-prefixed-get-box=""
    data-prefixed-get-webkit=""
    data-prefixed-prop-box=""
    data-prefixed-prop-webkit-upper=""
    data-prefixed-prop-webkit-lower=""
    data-unprefixed-get-box=""
    data-unprefixed-get-webkit=""
    data-unprefixed-prop-box=""
    data-unprefixed-prop-webkit-upper=""
    data-unprefixed-prop-webkit-lower=""
  >
    <div id="prefixed" style="-webkit-box-sizing: border-box;"></div>
    <div id="unprefixed" style="box-sizing: border-box;"></div>
    <script>
      const body = document.body;
      const prefixedStyle = document.getElementById('prefixed').style;
      const unprefixedStyle = document.getElementById('unprefixed').style;

      body.setAttribute(
        'data-prefixed-get-box',
        String(prefixedStyle.getPropertyValue('box-sizing') === 'border-box')
      );
      body.setAttribute(
        'data-prefixed-get-webkit',
        String(prefixedStyle.getPropertyValue('-webkit-box-sizing') === 'border-box')
      );
      body.setAttribute(
        'data-prefixed-prop-box',
        String(prefixedStyle.boxSizing === 'border-box')
      );
      body.setAttribute(
        'data-prefixed-prop-webkit-upper',
        String(prefixedStyle.WebkitBoxSizing === 'border-box')
      );
      body.setAttribute(
        'data-prefixed-prop-webkit-lower',
        String(prefixedStyle.webkitBoxSizing === 'border-box')
      );

      body.setAttribute(
        'data-unprefixed-get-box',
        String(unprefixedStyle.getPropertyValue('box-sizing') === 'border-box')
      );
      body.setAttribute(
        'data-unprefixed-get-webkit',
        String(unprefixedStyle.getPropertyValue('-webkit-box-sizing') === 'border-box')
      );
      body.setAttribute(
        'data-unprefixed-prop-box',
        String(unprefixedStyle.boxSizing === 'border-box')
      );
      body.setAttribute(
        'data-unprefixed-prop-webkit-upper',
        String(unprefixedStyle.WebkitBoxSizing === 'border-box')
      );
      body.setAttribute(
        'data-unprefixed-prop-webkit-lower',
        String(unprefixedStyle.webkitBoxSizing === 'border-box')
      );
    </script>
  </body>
</html>
