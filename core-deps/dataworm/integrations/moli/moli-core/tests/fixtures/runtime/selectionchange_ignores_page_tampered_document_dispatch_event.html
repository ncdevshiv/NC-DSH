<!doctype html>
<html>
  <body
    data-tampered-dispatch-event-called="no"
    data-selectionchange-fired="no"
    data-selectionchange-count="0"
  >
    <p id="target">hello world</p>
    <script>
      document.addEventListener("selectionchange", () => {
        const next = Number(
          document.body.getAttribute("data-selectionchange-count") || "0"
        ) + 1;
        document.body.setAttribute("data-selectionchange-fired", "yes");
        document.body.setAttribute("data-selectionchange-count", String(next));
      });

      document.dispatchEvent = () => {
        document.body.setAttribute("data-tampered-dispatch-event-called", "yes");
        throw new Error("host must not call document.dispatchEvent");
      };

      const target = document.getElementById("target").firstChild;
      const selection = window.getSelection();
      selection.collapse(target, 1);
      document.body.setAttribute("data-selection-anchor-offset", String(selection.anchorOffset));
      document.body.setAttribute("data-selection-focus-offset", String(selection.focusOffset));
    </script>
  </body>
</html>
