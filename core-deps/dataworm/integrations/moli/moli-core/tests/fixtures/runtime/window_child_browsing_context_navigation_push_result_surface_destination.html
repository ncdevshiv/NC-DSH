<!doctype html>
<html>
  <body>
    <script>
      let listenerCount = 0;
      let propertyCount = 0;

      navigation.addEventListener("currententrychange", () => {
        listenerCount += 1;
        parent.document.body.setAttribute(
          "data-dest-events",
          `${listenerCount}|${propertyCount}`
        );
      });

      navigation.oncurrententrychange = () => {
        propertyCount += 1;
        parent.document.body.setAttribute(
          "data-dest-events",
          `${listenerCount}|${propertyCount}`
        );
      };

      parent.document.body.setAttribute(
        "data-dest-activation",
        [
          String(navigation.activation?.entry?.url ?? ""),
          String(navigation.activation?.from?.url ?? ""),
          String(navigation.activation?.navigationType ?? ""),
        ].join("|")
      );

      parent.document.body.setAttribute(
        "data-dest-current",
        `${location.href}|${history.length}|${navigation.currentEntry?.index ?? -1}`
      );
      parent.document.body.setAttribute(
        "data-dest-state",
        `${String(history.state)}|${typeof navigation.currentEntry?.getState?.()}`
      );

      setTimeout(() => {
        parent.document.body.setAttribute(
          "data-dest-events",
          `${listenerCount}|${propertyCount}`
        );
        parent.document.body.setAttribute(
          "data-dest-state",
          `${String(history.state)}|${typeof navigation.currentEntry?.getState?.()}`
        );
      }, 0);
    </script>
  </body>
</html>
