<!doctype html>
<html>
  <body>
    <script>
      let committedSettled = false;
      let finishedSettled = false;
      let listenerCount = 0;
      let propertyCount = 0;
      navigation.addEventListener("currententrychange", () => {
        listenerCount += 1;
      });
      navigation.oncurrententrychange = () => {
        propertyCount += 1;
      };
      const sourceActivation = () =>
        [
          String(navigation.activation?.entry?.url ?? ""),
          String(navigation.activation?.from?.url ?? ""),
          String(navigation.activation?.navigationType ?? ""),
          String(navigation.transition === null),
        ].join("|");
      const sourceObservation = () =>
        [
          String(committedSettled),
          String(finishedSettled),
          String(location.href),
          String(history.length),
          String(navigation.currentEntry?.index ?? -1),
          sourceActivation(),
          `${listenerCount}|${propertyCount}`,
        ].join("|");
      parent.document.body.setAttribute("data-source-before", sourceActivation());
      const result = navigation.navigate(
        "/compat/window-child-browsing-context-navigation-result-surface-destination"
      );
      parent.document.body.setAttribute(
        "data-sync-shape",
        [
          Object.keys(result).join(","),
          Object.getOwnPropertyNames(result).join(","),
          String(typeof result?.committed?.then === "function"),
          String(typeof result?.finished?.then === "function"),
        ].join("|")
      );
      parent.document.body.setAttribute(
        "data-sync-settled",
        String(committedSettled) + "," + String(finishedSettled)
      );
      parent.document.body.setAttribute("data-source-sync", sourceObservation());
      setTimeout(() => {
        parent.document.body.setAttribute("data-source-timeout", sourceObservation());
      }, 0);
      result.committed.then((entry) => {
        committedSettled = true;
        parent.document.body.setAttribute(
          "data-committed-shape",
          [
            Object.prototype.toString.call(entry),
            String(entry?.url ?? ""),
            String(entry === navigation.currentEntry),
          ].join("|")
        );
      });
      result.finished.then((entry) => {
        finishedSettled = true;
        parent.document.body.setAttribute(
          "data-finished-shape",
          [
            Object.prototype.toString.call(entry),
            String(entry?.url ?? ""),
            String(entry === navigation.currentEntry),
          ].join("|")
        );
      });
    </script>
  </body>
</html>
