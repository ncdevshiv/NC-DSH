<!doctype html>
<html>
  <body>
    <script>
      window.dynamicModuleMissingExportWindowOrder = [];
      window.addEventListener("error", (event) => {
        window.dynamicModuleMissingExportWindowOrder.push("window-error");
        window.dynamicModuleMissingExportWindowErrorCount =
          (window.dynamicModuleMissingExportWindowErrorCount || 0) + 1;
        window.dynamicModuleMissingExportWindowMessageMatches =
          event.message.includes("does not export") &&
          event.message.includes("default");
      });

      const broken = document.createElement("script");
      broken.type = "module";
      broken.onerror = () => {
        window.dynamicModuleMissingExportWindowOrder.push("script-error");
      };
      broken.text =
        'import missingDefault from "/assets/module-link-exports-only-named.mjs";\nwindow.dynamicModuleMissingExportWindowValue = missingDefault;';
      document.body.appendChild(broken);

      const later = document.createElement("script");
      later.type = "module";
      later.text =
        'window.dynamicModuleMissingExportWindowOrder.push("later-module"); window.dynamicModuleMissingExportWindowContinuation = true; window.dynamicModuleMissingExportWindowOrderResult = window.dynamicModuleMissingExportWindowOrder.join(",");';
      document.body.appendChild(later);
    </script>
  </body>
</html>
