<!doctype html>
<html>
  <body>
    <script>
      window.documentWriteMultiLevelOrder = [];
      window.documentWriteMultiLevelResult = "initial";
      window.documentWriteMultiLevelDispatch = function (kind) {
        if (kind === "inner") {
          window.documentWriteMultiLevelOrder.push("inner");
          return;
        }
        if (kind === "middle") {
          window.documentWriteMultiLevelOrder.push("middle-start");
          document.write('<script>window.documentWriteMultiLevelDispatch("inner")<\/script>');
          document.write('<span id="after-inner">inner-after</span>');
          window.documentWriteMultiLevelOrder.push(
            document.getElementById("after-inner")
              ? "inner-after-visible"
              : "inner-after-missing",
          );
          return;
        }
        window.documentWriteMultiLevelOrder.push("outer-start");
        document.write('<script>window.documentWriteMultiLevelDispatch("middle")<\/script>');
        document.write('<span id="after-middle">middle-after</span>');
        window.documentWriteMultiLevelOrder.push(
          document.getElementById("after-middle")
            ? "middle-after-visible"
            : "middle-after-missing",
        );
      };

      document.write('<script>window.documentWriteMultiLevelDispatch("outer")<\/script>');
    </script>
    <script>
      const afterInner = document.getElementById("after-inner");
      const afterMiddle = document.getElementById("after-middle");
      window.documentWriteMultiLevelResult = [
        afterInner ? afterInner.textContent : "missing",
        afterMiddle ? afterMiddle.textContent : "missing",
        window.documentWriteMultiLevelOrder.join(","),
      ].join("|");
    </script>
  </body>
</html>
