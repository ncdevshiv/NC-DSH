<!doctype html>
<html>
  <head>
    <script>
      window.parseTimeTrace = ["inline-1"];
      document.documentElement.setAttribute(
        "data-inline-before-late",
        document.getElementById("late") ? "seen" : "missing"
      );
    </script>
  </head>
  <body>
    <div id="late">late</div>
    <script>
      document.documentElement.setAttribute(
        "data-inline-after-late",
        document.getElementById("late") ? "seen" : "missing"
      );
      document.documentElement.setAttribute(
        "data-inline-trace",
        window.parseTimeTrace.join(",")
      );
      window.parseTimeTrace.push("inline-2");
    </script>
  </body>
</html>
