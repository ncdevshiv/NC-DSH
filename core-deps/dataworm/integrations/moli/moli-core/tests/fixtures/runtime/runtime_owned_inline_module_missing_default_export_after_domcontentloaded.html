<!doctype html>
<html>
  <head>
    <script>
      window.runtimeOwnedInlineModuleLinkFailureOrder = [];
      window.runtimeOwnedInlineModuleLinkFailureOrder.push(
        "ready:" + document.readyState,
      );
      document.addEventListener("DOMContentLoaded", () => {
        window.runtimeOwnedInlineModuleLinkFailureOrder.push(
          "dcl:" + document.readyState,
        );
      });
      window.addEventListener("error", (event) => {
        window.runtimeOwnedInlineModuleLinkFailureOrder.push("window-error");
        window.runtimeOwnedInlineModuleLinkFailureMessageMatches =
          typeof event.message === "string" &&
          event.message.includes("does not export") &&
          event.message.includes("default");
        queueMicrotask(() => {
          window.runtimeOwnedInlineModuleLinkFailureOrder.push(
            "window-error-microtask",
          );
        });
      });

      const broken = document.createElement("script");
      broken.type = "module";
      broken.onerror = () => {
        window.runtimeOwnedInlineModuleLinkFailureOrder.push("script-error");
      };
      broken.text =
        'import missingDefault from "/assets/module-link-exports-only-named.mjs"; window.runtimeOwnedInlineModuleLinkFailureValue = missingDefault;';
      document.head.appendChild(broken);
      window.runtimeOwnedInlineModuleLinkFailureOrder.push(
        "after-append:" + document.readyState + ":async=" + String(broken.async),
      );

      const later = document.createElement("script");
      later.type = "module";
      later.text =
        'window.runtimeOwnedInlineModuleLinkFailureOrder.push("later-module");';
      document.head.appendChild(later);

      window.addEventListener("load", () => {
        window.runtimeOwnedInlineModuleLinkFailureOrder.push(
          "window-load:" + document.readyState,
        );
        window.runtimeOwnedInlineModuleLinkFailureFinalOrder =
          window.runtimeOwnedInlineModuleLinkFailureOrder.join(",");
      });
    </script>
  </head>
  <body>
    <main id="after">after</main>
  </body>
</html>
