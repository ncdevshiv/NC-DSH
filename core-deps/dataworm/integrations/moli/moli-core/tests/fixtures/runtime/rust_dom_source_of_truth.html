<!doctype html>
<html>
  <body>
    <div id="rust-root" data-state="seed"><span id="alpha" class="item">alpha</span></div>
    <script>
      try {
        const root = document.getElementById("rust-root");
        const childNodes = root.childNodes;
        const children = root.children;
        const beta = document.createElement("span");
        beta.id = "beta";
        beta.className = "item beta";
        beta.setAttribute("name", "user");
        beta.textContent = "beta";
        root.appendChild(beta);
        const field = document.createElement("input");
        field.id = "field";
        field.className = "field";
        field.name = "user";
        root.appendChild(field);
        root.setAttribute("data-state", "rust");

        const textNode = beta.firstChild;
        textNode.textContent = "BETA";
        const spans = document.getElementsByTagName("span");
        const rootSpans = root.getElementsByTagName("span");
        const items = document.getElementsByClassName("item");
        const rootItems = root.getElementsByClassName("item");
        const named = document.getElementsByName("user");

        root.__moliChildNodes = [];
        root.__moliShadowAttributes = new Map([["data-state", "shadow"]]);
        const alpha = document.getElementById("alpha");
        alpha.__moliShadowAttributes = new Map([["class", "shadow"]]);
        beta.__moliShadowAttributes = new Map([
          ["id", "shadow-beta"],
          ["class", "shadow"],
          ["name", "shadow"],
        ]);
        field.__moliShadowAttributes = new Map([["name", "shadow"]]);
        beta.__moliParentNode = null;
        beta.__moliParentElement = null;
        textNode.__moliShadowData = "shadow-text";

        window.rustDomSourceError = null;
        window.rustDomSourceChildNodesSameInstance = childNodes === root.childNodes;
        window.rustDomSourceChildrenSameInstance = children === root.children;
        window.rustDomSourceChildNodesLength = childNodes.length;
        window.rustDomSourceChildrenLength = children.length;
        window.rustDomSourceChildOrder = Array.from(childNodes, (node) =>
          node.id ?? node.nodeName,
        ).join("|");
        window.rustDomSourceChildrenIds = Array.from(children, (node) => node.id).join("|");
        window.rustDomSourceAttribute = root.getAttribute("data-state");
        window.rustDomSourceHasAttribute = root.hasAttribute("data-state");
        window.rustDomSourceBetaById = document.getElementById("beta") === beta;
        window.rustDomSourceFieldById = document.getElementById("field") === field;
        window.rustDomSourceParentNode = beta.parentNode === root;
        window.rustDomSourceOwnerDocument = beta.ownerDocument === document;
        window.rustDomSourceTextNodeTextContent = textNode.textContent;
        window.rustDomSourceRootTextContent = root.textContent;
        window.rustDomSourceDocumentSpans = Array.from(spans, (node) => node.id).join("|");
        window.rustDomSourceRootSpans = Array.from(rootSpans, (node) => node.id).join("|");
        window.rustDomSourceDocumentItems = Array.from(items, (node) => node.id).join("|");
        window.rustDomSourceRootItems = Array.from(rootItems, (node) => node.id).join("|");
        window.rustDomSourceNamedLength = named.length;
        window.rustDomSourceNamedTags = Array.from(named, (node) => node.tagName).join("|");
      } catch (error) {
        window.rustDomSourceError = String(error);
      }
    </script>
  </body>
</html>
