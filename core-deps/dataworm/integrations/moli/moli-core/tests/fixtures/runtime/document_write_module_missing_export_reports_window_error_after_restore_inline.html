<!doctype html>
<html>
  <body>
    <script>
      window.documentWriteMissingExportRestoreOrder = [];
      window.documentWriteMissingExportRestoreErrors = 0;
      window.addEventListener("error", () => {
        window.documentWriteMissingExportRestoreErrors += 1;
        window.documentWriteMissingExportRestoreOrder.push("window-error");
        queueMicrotask(() => {
          window.documentWriteMissingExportRestoreOrder.push(
            "window-error-microtask",
          );
          window.documentWriteMissingExportRestoreMicrotaskOrder =
            window.documentWriteMissingExportRestoreOrder.join(",");
          window.documentWriteMissingExportRestoreFinalOrder =
            window.documentWriteMissingExportRestoreOrder.join(",");
        });
        window.documentWriteMissingExportRestoreFinalOrder =
          window.documentWriteMissingExportRestoreOrder.join(",");
      });
      document.write(
        '<script type="module">import { missingValue } from "/assets/module-link-exports-only-named.mjs"; window.documentWriteMissingExportRestoreValue = missingValue;<\/script>' +
          '<script>window.documentWriteMissingExportRestoreOrder.push("restore-inline"); window.documentWriteMissingExportRestoreRestoreOrder = window.documentWriteMissingExportRestoreOrder.join(","); window.documentWriteMissingExportRestoreFinalOrder = window.documentWriteMissingExportRestoreOrder.join(",");<\/script>',
      );
    </script>
  </body>
</html>
