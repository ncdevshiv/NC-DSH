<!doctype html>
<html>
  <body
    data-tampered-queue-microtask-called="no"
    data-post-message-delivered="no"
  >
    <script>
      window.queueMicrotask = () => {
        document.body.setAttribute("data-tampered-queue-microtask-called", "yes");
        throw new Error("host must not call page queueMicrotask");
      };

      window.addEventListener("message", (event) => {
        if (event.data !== "ping") {
          return;
        }
        document.body.setAttribute("data-post-message-delivered", "yes");
      });

      window.postMessage("ping", "*");
    </script>
  </body>
</html>
