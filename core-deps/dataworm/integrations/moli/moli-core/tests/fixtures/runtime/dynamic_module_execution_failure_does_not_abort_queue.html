<!doctype html>
<html>
  <body>
    <script>
      window.dynamicModuleExecFailureOrder = [];
      window.addEventListener("error", (event) => {
        window.dynamicModuleExecFailureOrder.push("error");
        window.dynamicModuleExecFailureErrorCount =
          (window.dynamicModuleExecFailureErrorCount || 0) + 1;
        window.dynamicModuleExecFailureMessageMentionsFixture =
          event.message.includes("fixture");
      });

      const broken = document.createElement("script");
      broken.type = "module";
      broken.text =
        'import { greeting } from "fixture"; window.dynamicModuleExecFailure = greeting;';
      document.body.appendChild(broken);

      const later = document.createElement("script");
      later.type = "module";
      later.text =
        'window.dynamicModuleExecFailureOrder.push("later-module"); window.dynamicModuleExecFailureContinuation = true; window.dynamicModuleExecFailureOrderResult = window.dynamicModuleExecFailureOrder.join(",");';
      document.body.appendChild(later);
    </script>
  </body>
</html>
