<!doctype html>
<html>
  <body
    data-not-false=""
    data-double-not-true=""
    data-triple-not-false=""
    data-and-chain-true=""
    data-and-chain-false=""
    data-or-chain-true=""
    data-or-chain-false=""
    data-mixed-operators-false=""
    data-not-mixed-operators-false=""
    data-not-no-space-false=""
  >
    <script>
      document.body.setAttribute(
        'data-not-false',
        String(CSS.supports('not (display: none)')),
      );
      document.body.setAttribute(
        'data-double-not-true',
        String(CSS.supports('not (not (display: none))')),
      );
      document.body.setAttribute(
        'data-triple-not-false',
        String(CSS.supports('not (not (not (display: none)))')),
      );
      document.body.setAttribute(
        'data-and-chain-true',
        String(
          CSS.supports(
            '(display: none) and (display: block) and (display: inline)',
          ),
        ),
      );
      document.body.setAttribute(
        'data-and-chain-false',
        String(
          CSS.supports(
            '(display: none) and (display: block) and (display: deadbeef) and (display: inline)',
          ),
        ),
      );
      document.body.setAttribute(
        'data-or-chain-true',
        String(
          CSS.supports(
            '(display: none) or (display: deadbeef) or (display: inline)',
          ),
        ),
      );
      document.body.setAttribute(
        'data-or-chain-false',
        String(
          CSS.supports(
            '(display: ohhai) or (display: deadbeef) or (display: rainbows)',
          ),
        ),
      );
      document.body.setAttribute(
        'data-mixed-operators-false',
        String(
          CSS.supports(
            '(display: none) and (display: block) or (display: inline)',
          ),
        ),
      );
      document.body.setAttribute(
        'data-not-mixed-operators-false',
        String(CSS.supports('not (display: deadbeef) and (display: block)')),
      );
      document.body.setAttribute(
        'data-not-no-space-false',
        String(CSS.supports('not( display: deadbeef)')),
      );
    </script>
  </body>
</html>
