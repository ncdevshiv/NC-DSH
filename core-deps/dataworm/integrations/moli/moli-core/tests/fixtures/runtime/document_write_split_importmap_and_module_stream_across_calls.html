<!doctype html>
<html>
  <body>
    <script>
      window.documentWriteSplitImportMapModuleResult = "initial";

      document.write('<script type="importmap">{"imports":{"docwrite:split":"');
      document.write(
        '/assets/module-export-const-multiple-bindings.mjs"}}<\/script>'
      );
      document.write('<script type="module">import { first');
      document.write(
        ', second } from "docwrite:split";\nwindow.documentWriteSplitImportMapModuleResult = first + ":" + second;<\/script>'
      );
      document.write('<span id="after-split-module">after</span>');

      window.addEventListener("load", () => {
        window.documentWriteSplitImportMapModuleResult +=
          "|" +
          (document.getElementById("after-split-module") ? "after-present" : "after-missing");
      });
    </script>
  </body>
</html>
