<!doctype html>
<html>
<body
  data-connected-order=""
  data-connected-continued="false"
  data-connected-error=""
  data-attribute-order=""
  data-attribute-continued="false"
  data-attribute-error=""
>
<script>
  const body = document.body;
  const connectedOrder = [];

  class ThrowConnected extends HTMLElement {
    connectedCallback() {
      connectedOrder.push("throw-connected");
      throw new Error("connected boom");
    }
  }

  class GoodConnected extends HTMLElement {
    connectedCallback() {
      connectedOrder.push("good-connected");
    }
  }

  customElements.define("throw-connected", ThrowConnected);
  customElements.define("good-connected", GoodConnected);

  try {
    body.appendChild(document.createElement("throw-connected"));
    body.appendChild(document.createElement("good-connected"));
    body.setAttribute("data-connected-continued", "true");
  } catch (error) {
    body.setAttribute("data-connected-error", String(error && error.message || error));
  }
  body.setAttribute("data-connected-order", connectedOrder.join("|"));

  const attributeOrder = [];
  class ThrowAttribute extends HTMLElement {
    static get observedAttributes() {
      return ["data-step"];
    }

    attributeChangedCallback(_name, _oldValue, newValue) {
      attributeOrder.push(newValue);
      if (newValue === "one") {
        throw new Error("attribute boom");
      }
    }
  }

  customElements.define("throw-attribute", ThrowAttribute);
  const attrElement = document.createElement("throw-attribute");
  body.appendChild(attrElement);

  try {
    attrElement.setAttribute("data-step", "one");
    attrElement.setAttribute("data-step", "two");
    body.setAttribute("data-attribute-continued", "true");
  } catch (error) {
    body.setAttribute("data-attribute-error", String(error && error.message || error));
  }
  body.setAttribute("data-attribute-order", attributeOrder.join("|"));
</script>
</body>
</html>
