<!doctype html>
<html>
<body data-global-id="" data-window-id="" data-shadowed="" data-location-function="" data-location-shadowed="" data-location-stringifier="" data-document-location-stringifier="">
  <div id="i"></div>
  <div id="testDiv"></div>
  <div id="location"></div>
  <script>
    document.body.setAttribute("data-global-id", i && i.id);
    document.body.setAttribute("data-window-id", window.testDiv && window.testDiv.id);
    document.body.setAttribute("data-location-function", String(typeof window.location.replace === "function"));
    document.body.setAttribute("data-location-shadowed", String(window.location.id === undefined));
    document.body.setAttribute("data-location-stringifier", String(
      typeof window.location.toString === "function" &&
      window.location.toString() === window.location.href &&
      String(window.location) === window.location.href &&
      `${window.location}` === window.location.href
    ));
    document.body.setAttribute("data-document-location-stringifier", String(
      document.location.toString() === window.location.href &&
      String(document.location) === window.location.href
    ));
  </script>
  <script>
    (() => {
      const i = 100;
      document.body.setAttribute("data-shadowed", String(i));
    })();
  </script>
</body>
</html>
