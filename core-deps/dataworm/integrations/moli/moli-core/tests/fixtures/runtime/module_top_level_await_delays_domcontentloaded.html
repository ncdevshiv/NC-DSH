<!doctype html>
<html>
  <body>
    <script>
      window.moduleTlaOrder = [];
      document.addEventListener("DOMContentLoaded", () => {
        window.moduleTlaOrder.push("dcl");
        window.moduleTlaOrderResult = window.moduleTlaOrder.join(",");
        window.moduleTlaDclSawAwait = window.moduleTlaAfterAwait === true;
      });
    </script>
    <script type="module">
      window.moduleTlaOrder.push("module-start");
      await new Promise((resolve) =>
        setTimeout(() => {
          window.moduleTlaOrder.push("await-resolved");
          resolve();
        }, 0)
      );
      window.moduleTlaAfterAwait = true;
      window.moduleTlaOrder.push("module-end");
    </script>
  </body>
</html>
