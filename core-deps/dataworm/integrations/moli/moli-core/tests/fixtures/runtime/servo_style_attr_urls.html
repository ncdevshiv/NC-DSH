<!doctype html>
<html>
  <head>
    <base href="support/" />
  </head>
  <body data-no-base="" data-with-base="" data-with-xml-base="">
    <p id="no-base"></p>
    <p id="with-base"></p>
    <p id="with-xml-base" xml:base="support/"></p>
    <script>
      const noBase = document.getElementById('no-base');
      noBase.style.cssText = 'background-image: url(support/swatch-lime.png)';

      const withBase = document.getElementById('with-base');
      withBase.style.cssText = 'background-image: url(swatch-lime.png)';

      const withXmlBase = document.getElementById('with-xml-base');
      withXmlBase.style.cssText = 'background-image: url(swatch-red.png)';

      document.body.setAttribute(
        'data-no-base',
        noBase.style.getPropertyValue('background-image'),
      );
      document.body.setAttribute(
        'data-with-base',
        withBase.style.getPropertyValue('background-image'),
      );
      document.body.setAttribute(
        'data-with-xml-base',
        withXmlBase.style.getPropertyValue('background-image'),
      );
    </script>
  </body>
</html>
