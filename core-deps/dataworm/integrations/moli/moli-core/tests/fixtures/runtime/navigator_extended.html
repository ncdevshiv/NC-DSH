<!doctype html>
<html>
<body
  data-connection-type=""
  data-connection-effective-type=""
  data-connection-downlink=""
  data-connection-rtt=""
  data-connection-save-data=""
  data-send-beacon-type=""
  data-device-memory=""
  data-do-not-track=""
  data-get-battery-type=""
  data-permissions-type=""
  data-permissions-query-type=""
  data-storage-type=""
  data-storage-estimate-type=""
  data-media-devices-type=""
  data-service-worker-type=""
  data-clipboard-type=""
  data-clipboard-read-text-type=""
  data-clipboard-write-text-type=""
  data-clipboard-roundtrip=""
>
<script>
  (async () => {
  const body = document.body;

  const conn = navigator.connection;
  body.setAttribute('data-connection-type', typeof conn);
  body.setAttribute('data-connection-effective-type', conn ? conn.effectiveType : '');
  body.setAttribute('data-connection-downlink', conn ? String(conn.downlink) : '');
  body.setAttribute('data-connection-rtt', conn ? String(conn.rtt) : '');
  body.setAttribute('data-connection-save-data', conn ? String(conn.saveData) : '');

  body.setAttribute('data-send-beacon-type', typeof navigator.sendBeacon);
  body.setAttribute('data-device-memory', String(navigator.deviceMemory));
  body.setAttribute('data-do-not-track', String(navigator.doNotTrack));

  body.setAttribute('data-get-battery-type', typeof navigator.getBattery);
  body.setAttribute('data-permissions-type', typeof navigator.permissions);
  body.setAttribute('data-permissions-query-type', typeof navigator.permissions.query);
  body.setAttribute('data-storage-type', typeof navigator.storage);
  body.setAttribute('data-storage-estimate-type', typeof navigator.storage.estimate);
  body.setAttribute('data-media-devices-type', typeof navigator.mediaDevices);
  body.setAttribute('data-service-worker-type', typeof navigator.serviceWorker);
  body.setAttribute('data-clipboard-type', typeof navigator.clipboard);
  body.setAttribute('data-clipboard-read-text-type', typeof navigator.clipboard.readText);
  body.setAttribute('data-clipboard-write-text-type', typeof navigator.clipboard.writeText);
  await navigator.clipboard.writeText('moli clipboard');
  body.setAttribute('data-clipboard-roundtrip', await navigator.clipboard.readText());
  })();
</script>
</body>
</html>
