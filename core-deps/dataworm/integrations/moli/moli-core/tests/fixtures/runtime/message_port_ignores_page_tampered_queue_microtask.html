<!doctype html>
<html>
  <body
    data-tampered-queue-microtask-called="no"
    data-message-port-delivered="no"
  >
    <script>
      window.queueMicrotask = () => {
        document.body.setAttribute("data-tampered-queue-microtask-called", "yes");
        throw new Error("host must not call page queueMicrotask");
      };

      const channel = new MessageChannel();
      channel.port1.onmessage = (event) => {
        if (event.data !== "ping") {
          return;
        }
        document.body.setAttribute("data-message-port-delivered", "yes");
      };

      channel.port2.postMessage("ping");
    </script>
  </body>
</html>
