<!doctype html>
<html>
  <body
    data-count=""
    data-href=""
    data-sync-snapshot=""
    data-history-state=""
    data-nav-state=""
    data-activation-type=""
    data-activation-entry=""
    data-activation-from=""
    data-currententrychange-count=""
    data-property-currententrychange-count=""
  >
    <script>
      const count = Number(sessionStorage.getItem("history_go_nan_reloads_current_document_count") || "0") + 1;
      sessionStorage.setItem("history_go_nan_reloads_current_document_count", String(count));

      let currentEntryChanges = 0;
      let propertyCurrentEntryChanges = 0;
      navigation.addEventListener("currententrychange", () => {
        currentEntryChanges += 1;
      });
      navigation.oncurrententrychange = () => {
        propertyCurrentEntryChanges += 1;
      };

      if (count === 1) {
        const beforeEntry = navigation.currentEntry;
        sessionStorage.setItem(
          "history_go_nan_reloads_current_document_sync_snapshot",
          [
            String(beforeEntry === navigation.currentEntry),
            String(currentEntryChanges),
            String(propertyCurrentEntryChanges),
          ].join("|"),
        );
        history.go(NaN);
      } else {
        document.body.setAttribute("data-count", String(count));
        document.body.setAttribute("data-href", location.href);
        document.body.setAttribute(
          "data-sync-snapshot",
          sessionStorage.getItem("history_go_nan_reloads_current_document_sync_snapshot") || "",
        );
        document.body.setAttribute("data-history-state", JSON.stringify(history.state));
        document.body.setAttribute(
          "data-nav-state",
          JSON.stringify(navigation.currentEntry?.getState?.() ?? null),
        );
        document.body.setAttribute(
          "data-activation-type",
          String(navigation.activation?.navigationType ?? ""),
        );
        document.body.setAttribute(
          "data-activation-entry",
          String(navigation.activation?.entry?.url ?? ""),
        );
        document.body.setAttribute(
          "data-activation-from",
          String(navigation.activation?.from?.url ?? ""),
        );
        document.body.setAttribute(
          "data-currententrychange-count",
          String(currentEntryChanges),
        );
        document.body.setAttribute(
          "data-property-currententrychange-count",
          String(propertyCurrentEntryChanges),
        );
      }
    </script>
  </body>
</html>
