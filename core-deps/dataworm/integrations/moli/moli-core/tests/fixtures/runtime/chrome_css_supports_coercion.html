<!doctype html>
<html>
  <body
    data-display-semicolon-garbage=""
    data-display-semicolon-leading-garbage=""
    data-two-arg-undefined-false=""
    data-true-empty-false=""
    data-array-none-false=""
    data-display-empty-false=""
    data-display-colon-false=""
    data-content-array-false=""
    data-content-important-false=""
    data-margin-internal-unit-false=""
    data-background-spaced-property-false=""
    data-font-family-newline-false=""
    data-four-nots-false=""
  >
    <script>
      document.body.setAttribute(
        'data-display-semicolon-garbage',
        String(CSS.supports('display: none; garbage')),
      );
      document.body.setAttribute(
        'data-display-semicolon-leading-garbage',
        String(CSS.supports('  display: none ; garbage ')),
      );
      document.body.setAttribute(
        'data-two-arg-undefined-false',
        String(CSS.supports('(display: none)', undefined)),
      );
      document.body.setAttribute(
        'data-true-empty-false',
        String(CSS.supports(true, '')),
      );
      document.body.setAttribute(
        'data-array-none-false',
        String(CSS.supports([], 'none')),
      );
      document.body.setAttribute(
        'data-display-empty-false',
        String(CSS.supports('display', '')),
      );
      document.body.setAttribute(
        'data-display-colon-false',
        String(CSS.supports('display:', 'none')),
      );
      document.body.setAttribute(
        'data-content-array-false',
        String(CSS.supports('content', [])),
      );
      document.body.setAttribute(
        'data-content-important-false',
        String(CSS.supports('content', '!important')),
      );
      document.body.setAttribute(
        'data-margin-internal-unit-false',
        String(CSS.supports('margin', '1__qem')),
      );
      document.body.setAttribute(
        'data-background-spaced-property-false',
        String(CSS.supports(' background   ', 'url(rainbow.png)')),
      );
      document.body.setAttribute(
        'data-font-family-newline-false',
        String(CSS.supports('font-family', "'\n'")),
      );
      document.body.setAttribute(
        'data-four-nots-false',
        String(CSS.supports('not not not not (display: none)')),
      );
    </script>
  </body>
</html>
