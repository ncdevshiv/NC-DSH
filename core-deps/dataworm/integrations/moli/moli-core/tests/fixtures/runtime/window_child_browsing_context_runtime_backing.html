<!doctype html>
<html>
  <body>
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const iframe = document.getElementById('child');
      const childWindow = iframe.contentWindow;
      document.body.setAttribute(
        'data-location-distinct',
        String(childWindow.location !== window.location)
      );
      document.body.setAttribute(
        'data-history-distinct',
        String(childWindow.history !== window.history)
      );
      document.body.setAttribute(
        'data-navigation-distinct',
        String(childWindow.navigation !== window.navigation)
      );
      document.body.setAttribute('data-location-href', childWindow.location.href);
      document.body.setAttribute(
        'data-location-stringifier',
        String(
          typeof childWindow.location.toString === 'function' &&
          childWindow.location.toString() === childWindow.location.href &&
          String(childWindow.location) === childWindow.location.href &&
          `${childWindow.location}` === childWindow.location.href
        )
      );
      document.body.setAttribute(
        'data-document-location-identity',
        String(childWindow.document.location === childWindow.location)
      );
      document.body.setAttribute(
        'data-document-location-stringifier',
        String(
          childWindow.document.location.toString() === childWindow.location.href &&
          String(childWindow.document.location) === childWindow.location.href
        )
      );
      document.body.setAttribute(
        'data-document-url-aligned',
        String(
          childWindow.document.URL === childWindow.location.href &&
          childWindow.document.documentURI === childWindow.location.href
        )
      );
      document.body.setAttribute(
        'data-document-base-inherited',
        String(childWindow.document.baseURI === document.baseURI)
      );
    </script>
  </body>
</html>
