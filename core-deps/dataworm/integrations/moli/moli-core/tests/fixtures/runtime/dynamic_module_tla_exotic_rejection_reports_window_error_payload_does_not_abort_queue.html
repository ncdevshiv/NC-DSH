<!doctype html>
<html>
  <body>
    <script>
      window.dynamicModuleTlaPayloadOrder = [];
      window.addEventListener("error", (event) => {
        window.dynamicModuleTlaPayloadOrder.push("window-error");
        window.dynamicModuleTlaPayloadErrorMessageMatches = Boolean(
          event.error &&
            typeof event.error.message === "string" &&
            event.error.message.length > 0,
        );
        window.dynamicModuleTlaPayloadFilenameMatches =
          typeof event.filename === "string" &&
          event.filename.includes(
            "/compat/dynamic-module-tla-exotic-rejection-reports-window-error-payload-does-not-abort-queue",
          );
      });

      const broken = document.createElement("script");
      broken.type = "module";
      broken.onerror = () => {
        window.dynamicModuleTlaPayloadOrder.push("script-error");
      };
      broken.text =
        'const reason = Object.create(null); await Promise.reject(reason);';
      document.body.appendChild(broken);

      const later = document.createElement("script");
      later.type = "module";
      later.text =
        'window.dynamicModuleTlaPayloadOrder.push("later-module"); window.dynamicModuleTlaPayloadContinuation = true; window.dynamicModuleTlaPayloadOrderResult = window.dynamicModuleTlaPayloadOrder.join(",");';
      document.body.appendChild(later);
    </script>
  </body>
</html>
