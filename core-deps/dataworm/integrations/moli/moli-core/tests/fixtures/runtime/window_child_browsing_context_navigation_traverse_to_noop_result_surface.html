<!doctype html>
<html>
  <body
    data-child-current-sync=""
    data-child-current-committed=""
    data-child-current-finished=""
    data-child-missing-sync=""
    data-child-missing-committed=""
    data-child-missing-finished=""
  >
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const describeRejection = (error) =>
        [String(error?.name ?? ""), String(error?.message ?? "")].join("|");
      const iframe = document.getElementById("child");
      iframe.addEventListener("load", () => {
        const childWindow = iframe.contentWindow;
        const currentEntry = childWindow.navigation.currentEntry;
        const currentResult = childWindow.navigation.traverseTo(currentEntry.key);

        document.body.setAttribute(
          "data-child-current-sync",
          [
            String(typeof currentResult?.committed?.then === "function"),
            String(typeof currentResult?.finished?.then === "function"),
            String(childWindow.navigation.currentEntry === currentEntry),
          ].join("|")
        );
        const describeEntry = (entry) =>
          [
            Object.prototype.toString.call(entry),
            entry?.url ?? "",
            String(entry === currentEntry),
            String(entry === childWindow.navigation.currentEntry),
          ].join("|");
        currentResult.committed.then(
          (entry) =>
            document.body.setAttribute(
              "data-child-current-committed",
              describeEntry(entry)
            ),
          (error) =>
            document.body.setAttribute(
              "data-child-current-committed",
              "ERR:" + describeRejection(error)
            )
        );
        currentResult.finished.then(
          (entry) =>
            document.body.setAttribute(
              "data-child-current-finished",
              describeEntry(entry)
            ),
          (error) =>
            document.body.setAttribute(
              "data-child-current-finished",
              "ERR:" + describeRejection(error)
            )
        );

        const missingResult = childWindow.navigation.traverseTo("missing-key");
        document.body.setAttribute(
          "data-child-missing-sync",
          [
            String(typeof missingResult?.committed?.then === "function"),
            String(typeof missingResult?.finished?.then === "function"),
            String(childWindow.navigation.currentEntry === currentEntry),
          ].join("|")
        );
        missingResult.committed.then(
          () =>
            document.body.setAttribute(
              "data-child-missing-committed",
              "fulfilled"
            ),
          (error) =>
            document.body.setAttribute(
              "data-child-missing-committed",
              describeRejection(error)
            )
        );
        missingResult.finished.then(
          () =>
            document.body.setAttribute(
              "data-child-missing-finished",
              "fulfilled"
            ),
          (error) =>
            document.body.setAttribute(
              "data-child-missing-finished",
              describeRejection(error)
            )
        );
      });
    </script>
  </body>
</html>
