<!doctype html>
<html>
  <head>
    <title>modulepreload shared static dependency</title>
    <script>
      window.modulepreloadSharedOrder = ["classic-before"];
      window.modulepreloadSharedError = "";
      window.addEventListener("error", (event) => {
        window.modulepreloadSharedError =
          event.message || String(event.error || "error");
        window.modulepreloadSharedOrder.push("error");
        window.modulepreloadSharedFinalOrder =
          window.modulepreloadSharedOrder.join(",");
      });
      const link = document.createElement("link");
      link.rel = "modulepreload";
      link.href = "/assets/modulepreload_shared_leaf_slow.mjs";
      document.head.appendChild(link);
    </script>
    <script type="module" src="/assets/modulepreload_shared_root.mjs"></script>
    <script>
      window.modulepreloadSharedOrder.push("classic-after");
      window.modulepreloadSharedClassicAfter = true;
    </script>
  </head>
  <body>
    <main id="after">after</main>
  </body>
</html>
