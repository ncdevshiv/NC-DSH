<!doctype html>
<html>
  <body data-child-current-same-document="">
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const iframe = document.getElementById("child");
      iframe.addEventListener(
        "load",
        () => {
          document.body.setAttribute(
            "data-child-current-same-document",
            String(iframe.contentWindow.navigation.currentEntry?.sameDocument)
          );
        },
        { once: true }
      );
    </script>
  </body>
</html>
