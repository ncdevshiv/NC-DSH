<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimeOwnedAsyncWithDeferOrder = [];
      window.runtimeOwnedAsyncClassicOrder = window.runtimeOwnedAsyncWithDeferOrder;
      const script = document.createElement("script");
      script.src = "/assets/runtime_owned_async_slow.js";
      script.onload = () => {
        window.runtimeOwnedAsyncWithDeferOrder.push("load");
        window.runtimeOwnedAsyncWithDeferLoadOrder =
          window.runtimeOwnedAsyncWithDeferOrder.join(",");
      };
      document.head.appendChild(script);
      window.runtimeOwnedAsyncWithDeferOrder.push(
        "after-append:async=" + script.async
      );

      document.addEventListener("DOMContentLoaded", () => {
        window.runtimeOwnedAsyncWithDeferOrder.push("dcl:" + document.readyState);
        window.runtimeOwnedAsyncWithDeferDclOrder =
          window.runtimeOwnedAsyncWithDeferOrder.join(",");
      });

      window.addEventListener("load", () => {
        window.runtimeOwnedAsyncWithDeferOrder.push(
          "window-load:" + document.readyState
        );
        window.runtimeOwnedAsyncWithDeferFinalOrder =
          window.runtimeOwnedAsyncWithDeferOrder.join(",");
      });
    </script>
    <script defer>
      window.runtimeOwnedAsyncWithDeferOrder.push("defer");
      window.runtimeOwnedAsyncWithDeferAfterDeferOrder =
        window.runtimeOwnedAsyncWithDeferOrder.join(",");
    </script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
