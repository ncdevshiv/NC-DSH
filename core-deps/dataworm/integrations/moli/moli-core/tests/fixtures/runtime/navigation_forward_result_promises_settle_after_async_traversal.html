<!doctype html>
<html>
  <body
    data-sync-committed=""
    data-sync-finished=""
    data-sync-result-keys=""
    data-sync-result-props=""
    data-timeout-hash=""
    data-timeout-committed=""
    data-timeout-finished=""
    data-timeout-committed-type=""
    data-timeout-finished-type=""
    data-timeout-committed-url=""
    data-timeout-finished-url=""
    data-timeout-current-same-committed=""
    data-timeout-current-same-finished=""
    data-sync-current-same-before=""
    data-timeout-before-same-committed=""
    data-timeout-before-same-finished=""
    data-order=""
  >
    <script>
      history.pushState({ n: 1 }, "", "#one");
      history.pushState({ n: 2 }, "", "#two");

      let committedSettled = false;
      let finishedSettled = false;
      let committedValue = null;
      let finishedValue = null;
      const order = [];

      window.addEventListener("hashchange", () => {
        if (location.hash !== "#one") {
          return;
        }
        const beforeEntry = navigation.currentEntry;
        const result = navigation.forward();
        result.committed.then((entry) => {
          committedSettled = true;
          committedValue = entry;
          order.push("committed:" + location.hash);
        });
        result.finished.then((entry) => {
          finishedSettled = true;
          finishedValue = entry;
          order.push("finished:" + location.hash);
        });
        document.body.setAttribute("data-sync-committed", String(committedSettled));
        document.body.setAttribute("data-sync-finished", String(finishedSettled));
        document.body.setAttribute("data-sync-result-keys", Object.keys(result).join(","));
        document.body.setAttribute("data-sync-result-props", Object.getOwnPropertyNames(result).join(","));
        document.body.setAttribute("data-sync-current-same-before", String(navigation.currentEntry === beforeEntry));
        setTimeout(() => {
          document.body.setAttribute("data-timeout-hash", location.hash);
          document.body.setAttribute("data-timeout-committed", String(committedSettled));
          document.body.setAttribute("data-timeout-finished", String(finishedSettled));
          document.body.setAttribute("data-timeout-committed-type", Object.prototype.toString.call(committedValue));
          document.body.setAttribute("data-timeout-finished-type", Object.prototype.toString.call(finishedValue));
          document.body.setAttribute("data-timeout-committed-url", committedValue?.url ?? "");
          document.body.setAttribute("data-timeout-finished-url", finishedValue?.url ?? "");
          document.body.setAttribute("data-timeout-current-same-committed", String(committedValue === navigation.currentEntry));
          document.body.setAttribute("data-timeout-current-same-finished", String(finishedValue === navigation.currentEntry));
          document.body.setAttribute("data-timeout-before-same-committed", String(committedValue === beforeEntry));
          document.body.setAttribute("data-timeout-before-same-finished", String(finishedValue === beforeEntry));
          document.body.setAttribute("data-order", order.join(","));
        }, 0);
      });

      history.back();
    </script>
  </body>
</html>
