<!doctype html>
<html>

    <script>
      window.moduleCycleDefaultMissingOrder = [];
      window.addEventListener("error", () => {
        window.moduleCycleDefaultMissingOrder.push("error");
        window.moduleCycleDefaultMissingError = "missing-default";
      });
    </script>
    <script
      type="module"
      src="/assets/module-cycle-default-missing-a.mjs"
    ></script>
    <script type="module">
      window.moduleCycleDefaultMissingOrder.push("later-module");
      window.moduleCycleDefaultMissingContinuation = true;
      window.moduleCycleDefaultMissingOrderResult =
        window.moduleCycleDefaultMissingOrder.join(",");
    </script>
  </body>
