<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Main document lifecycle performance event-end probe</title>
    <script>
      (() => {
        const root = document.documentElement;
        const navigation = () => performance.getEntriesByType("navigation")[0];
        const recordPositive = (name, value) => {
          root.dataset[name] = Number.isFinite(value) && value > 0 ? "yes" : "no";
        };

        document.addEventListener("DOMContentLoaded", () => {
          recordPositive(
            "dclListenerEventEnd",
            navigation().domContentLoadedEventEnd,
          );
          Promise.resolve().then(() => {
            recordPositive(
              "dclMicrotaskEventEnd",
              navigation().domContentLoadedEventEnd,
            );
          });
        });

        window.addEventListener("load", () => {
          recordPositive("loadListenerEventEnd", navigation().loadEventEnd);
          Promise.resolve().then(() => {
            recordPositive("loadMicrotaskEventEnd", navigation().loadEventEnd);
          });
        });

        window.addEventListener("pageshow", () => {
          recordPositive("pageshowListenerLoadEnd", navigation().loadEventEnd);
          Promise.resolve().then(() => {
            recordPositive("pageshowMicrotaskLoadEnd", navigation().loadEventEnd);
            root.dataset.probeComplete = "yes";
          });
        });
      })();
    </script>
  </head>
  <body></body>
</html>
