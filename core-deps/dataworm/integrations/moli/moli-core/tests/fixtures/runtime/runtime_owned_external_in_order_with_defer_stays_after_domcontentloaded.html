<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimeOwnedInOrderWithDeferOrder = [];
      window.runtimeOwnedInOrderLoadOrder = window.runtimeOwnedInOrderWithDeferOrder;

      const script = document.createElement("script");
      script.async = false;
      script.src = "/assets/runtime_owned_in_order_load_slow.js";
      script.onload = () => {
        window.runtimeOwnedInOrderWithDeferOrder.push("load");
        window.runtimeOwnedInOrderWithDeferLoadOrder =
          window.runtimeOwnedInOrderWithDeferOrder.join(",");
      };
      document.head.appendChild(script);
      window.runtimeOwnedInOrderWithDeferOrder.push("after-append");

      document.addEventListener("DOMContentLoaded", () => {
        window.runtimeOwnedInOrderWithDeferOrder.push("dcl");
        window.runtimeOwnedInOrderWithDeferDclOrder =
          window.runtimeOwnedInOrderWithDeferOrder.join(",");
      });

      window.addEventListener("load", () => {
        window.runtimeOwnedInOrderWithDeferOrder.push("window-load");
        window.runtimeOwnedInOrderWithDeferFinalOrder =
          window.runtimeOwnedInOrderWithDeferOrder.join(",");
      });
    </script>
    <script defer>
      window.runtimeOwnedInOrderWithDeferOrder.push("defer");
      window.runtimeOwnedInOrderWithDeferAfterDeferOrder =
        window.runtimeOwnedInOrderWithDeferOrder.join(",");
    </script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
