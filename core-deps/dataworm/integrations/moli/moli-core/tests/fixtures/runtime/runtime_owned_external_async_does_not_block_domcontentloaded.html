<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimeOwnedAsyncClassicOrder = [];
      const script = document.createElement("script");
      script.src = "/assets/runtime_owned_async_slow.js";
      script.onload = () => {
        window.runtimeOwnedAsyncClassicOrder.push("load");
        window.runtimeOwnedAsyncClassicDuringLoad =
          window.runtimeOwnedAsyncClassicOrder.join(",");
      };
      document.head.appendChild(script);
      window.runtimeOwnedAsyncClassicOrder.push("after-append:async=" + script.async);
      document.addEventListener("DOMContentLoaded", () => {
        window.runtimeOwnedAsyncClassicOrder.push("dcl:" + document.readyState);
        window.runtimeOwnedAsyncClassicDclOrder =
          window.runtimeOwnedAsyncClassicOrder.join(",");
      });
      window.addEventListener("load", () => {
        window.runtimeOwnedAsyncClassicOrder.push("window-load:" + document.readyState);
        window.runtimeOwnedAsyncClassicFinalOrder =
          window.runtimeOwnedAsyncClassicOrder.join(",");
      });
    </script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
