<!doctype html>
<html>
  <body data-form-submit="" data-formtarget="">
    <script>
      {
        const frame = document.createElement('iframe');
        frame.name = 'frame2';
        document.documentElement.appendChild(frame);

        const form = document.createElement('form');
        form.target = 'frame2';
        form.action = '/compat/window-child-browsing-context-target-name-a';
        form.submit();

        const text = frame.contentDocument?.body?.textContent?.trim() ?? 'null';
        document.body.setAttribute('data-form-submit', text);
      }
    </script>

    <iframe name="frame3" id="f3"></iframe>
    <form target="_top" action="/compat/window-child-browsing-context-target-name-a">
      <input type="submit" id="submit1" formtarget="frame3" />
    </form>

    <script>
      {
        document.getElementById('submit1').click();
        const frame = document.getElementById('f3');
        const text = frame.contentDocument?.body?.textContent?.trim() ?? 'null';
        document.body.setAttribute('data-formtarget', text);
      }
    </script>
  </body>
</html>
