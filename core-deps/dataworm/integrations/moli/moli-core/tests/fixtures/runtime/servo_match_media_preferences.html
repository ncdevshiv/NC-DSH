<!doctype html>
<html>
  <body
    data-color-scheme-bool=""
    data-color-scheme-light=""
    data-color-scheme-dark=""
    data-reduced-motion-bool=""
    data-reduced-motion-no-preference=""
    data-reduced-motion-reduce=""
    data-reduced-data-bool=""
    data-reduced-data-no-preference=""
    data-reduced-data-reduce=""
    data-reduced-transparency-bool=""
    data-reduced-transparency-no-preference=""
    data-reduced-transparency-reduce=""
    data-prefers-contrast-bool=""
    data-prefers-contrast-no-preference=""
    data-prefers-contrast-more=""
  >
    <script>
      const body = document.body;
      const cases = [
        ['data-color-scheme-bool', '(prefers-color-scheme)'],
        ['data-color-scheme-light', '(prefers-color-scheme: light)'],
        ['data-color-scheme-dark', '(prefers-color-scheme: dark)'],
        ['data-reduced-motion-bool', '(prefers-reduced-motion)'],
        [
          'data-reduced-motion-no-preference',
          '(prefers-reduced-motion: no-preference)',
        ],
        ['data-reduced-motion-reduce', '(prefers-reduced-motion: reduce)'],
        ['data-reduced-data-bool', '(prefers-reduced-data)'],
        [
          'data-reduced-data-no-preference',
          '(prefers-reduced-data: no-preference)',
        ],
        ['data-reduced-data-reduce', '(prefers-reduced-data: reduce)'],
        ['data-reduced-transparency-bool', '(prefers-reduced-transparency)'],
        [
          'data-reduced-transparency-no-preference',
          '(prefers-reduced-transparency: no-preference)',
        ],
        [
          'data-reduced-transparency-reduce',
          '(prefers-reduced-transparency: reduce)',
        ],
        ['data-prefers-contrast-bool', '(prefers-contrast)'],
        [
          'data-prefers-contrast-no-preference',
          '(prefers-contrast: no-preference)',
        ],
        ['data-prefers-contrast-more', '(prefers-contrast: more)'],
      ];
      for (const [attr, query] of cases) {
        body.setAttribute(attr, String(window.matchMedia(query).matches));
      }
    </script>
  </body>
</html>
