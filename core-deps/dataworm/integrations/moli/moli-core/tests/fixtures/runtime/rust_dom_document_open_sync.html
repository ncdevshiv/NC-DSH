<!doctype html>
<html>
  <body>
    <div id="old">old</div>
    <script>
      try {
        const bridge = globalThis.__moliNativeBridge;
        const oldNode = document.getElementById("old");
        const oldBody = document.body;
        oldBody.__moliChildNodes = [];

        setTimeout(() => {
          try {
            document.open();
            window.rustDomDocumentOpenSyncOldParentPreserved =
              oldNode.parentNode === oldBody;
            window.rustDomDocumentOpenSyncOldConnected =
              bridge.describeNode(oldNode)?.connected === false;
            window.rustDomDocumentOpenSyncShellReady =
              document.documentElement === null &&
              document.head === null &&
              document.body === null;

            document.write('<main id="new">new</main>');
            document.close();

            window.rustDomDocumentOpenSyncError = null;
            window.rustDomDocumentOpenSyncNewId =
              document.getElementById("new")?.id ?? null;
            window.rustDomDocumentOpenSyncOldGone =
              document.getElementById("old") === null;
          } catch (error) {
            window.rustDomDocumentOpenSyncError = String(error);
          }
        }, 0);
      } catch (error) {
        window.rustDomDocumentOpenSyncError = String(error);
      }
    </script>
  </body>
</html>
