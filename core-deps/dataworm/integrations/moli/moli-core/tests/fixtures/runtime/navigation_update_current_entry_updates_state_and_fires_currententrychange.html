<!doctype html>
<html><body
  data-order=""
  data-history-state=""
  data-nav-state=""
  data-count=""
  data-same-entry=""
  data-event-constructor=""
  data-event-from-same-entry=""
  data-event-navigation-type=""
  data-missing-name=""
  data-missing-required=""
  data-empty-name=""
  data-empty-state-required=""
  data-undefined-name=""
  data-undefined-state-required=""
  data-null-state=""
  data-function-name=""
  data-function-state-unchanged=""
>
<script>
window.addEventListener("load", () => {
  const entryBefore = navigation.currentEntry;
  const order = [];
  let count = 0;

  navigation.addEventListener("currententrychange", (event) => {
    count += 1;
    order.push("currententrychange");
    document.body.setAttribute("data-history-state", JSON.stringify(history.state));
    document.body.setAttribute(
      "data-nav-state",
      JSON.stringify(navigation.currentEntry?.getState?.() ?? null),
    );
    document.body.setAttribute(
      "data-same-entry",
      String(entryBefore === navigation.currentEntry),
    );
    document.body.setAttribute(
      "data-event-constructor",
      event?.constructor?.name ?? "null",
    );
    document.body.setAttribute(
      "data-event-from-same-entry",
      String(event?.from === entryBefore),
    );
    document.body.setAttribute(
      "data-event-navigation-type",
      String(event?.navigationType ?? "null"),
    );
  });

  const recordError = (prefix, callback) => {
    try {
      callback();
    } catch (error) {
      const message = String(error?.message ?? "");
      document.body.setAttribute(`data-${prefix}-name`, String(error?.name ?? ""));
      document.body.setAttribute(
        `data-${prefix}-required`,
        String(message.includes("1 argument required"))
      );
      document.body.setAttribute(
        `data-${prefix}-state-required`,
        String(message.includes("Required member is undefined"))
      );
    }
  };

  recordError("missing", () => navigation.updateCurrentEntry());
  recordError("empty", () => navigation.updateCurrentEntry({}));
  recordError("undefined", () =>
    navigation.updateCurrentEntry({ state: undefined })
  );

  navigation.updateCurrentEntry({ state: null });
  document.body.setAttribute(
    "data-null-state",
    JSON.stringify(navigation.currentEntry?.getState?.() ?? null)
  );
  navigation.updateCurrentEntry({ state: { x: 1 } });
  try {
    navigation.updateCurrentEntry({ state: function nope() {} });
  } catch (error) {
    document.body.setAttribute("data-function-name", String(error?.name ?? ""));
    document.body.setAttribute(
      "data-function-state-unchanged",
      JSON.stringify(navigation.currentEntry?.getState?.() ?? null)
    );
  }
  order.push("after-call");

  document.body.setAttribute("data-order", order.join(","));
  document.body.setAttribute("data-count", String(count));
  if (!document.body.getAttribute("data-history-state")) {
    document.body.setAttribute("data-history-state", JSON.stringify(history.state));
    document.body.setAttribute(
      "data-nav-state",
      JSON.stringify(navigation.currentEntry?.getState?.() ?? null),
    );
    document.body.setAttribute(
      "data-same-entry",
      String(entryBefore === navigation.currentEntry),
    );
  }
});
</script>
</body></html>
