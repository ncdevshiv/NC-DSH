<!doctype html>
<html>
  <head id="head">
    <style id="style">
      @font-face {
        font-family: "WebFont";
        src: url("resources/Rochester.otf") format("opentype");
      }
    </style>
  </head>
  <body data-size-before="" data-size-after="">
    <script>
      const body = document.body;
      const fonts = document.fonts;
      body.setAttribute('data-size-before', String(fonts.size));
      document.getElementById('head').removeChild(document.getElementById('style'));
      body.setAttribute('data-size-after', String(fonts.size));
    </script>
  </body>
</html>
