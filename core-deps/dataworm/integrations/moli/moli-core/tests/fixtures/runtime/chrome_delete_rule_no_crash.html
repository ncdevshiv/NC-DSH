<!doctype html>
<html>
  <head>
    <style>
      .rule1 {}
      .rule2 {}
    </style>
  </head>
  <body data-ok="" data-length="">
    <script>
      const body = document.body;
      let ok = true;
      try {
        document.styleSheets[0].cssRules[0];
        document.styleSheets[0].deleteRule(1);
      } catch (error) {
        ok = false;
      }
      body.setAttribute('data-ok', String(ok));
      body.setAttribute(
        'data-length',
        String(document.styleSheets[0]?.cssRules?.length ?? -1)
      );
    </script>
  </body>
</html>
