<!doctype html>
<html>
<body
  data-li-value=""
  data-ol-start=""
  data-ol-reversed=""
  data-ol-type=""
  data-optgroup=""
  data-quote-cite=""
  data-table-cell=""
  data-time-datetime=""
  data-meta-content=""
  data-track-kind=""
  data-global-attributes=""
  data-hidden-tabindex=""
>
<script>
const li = document.createElement('li');
const liDefault = li.value;
li.value = 7;
document.body.setAttribute('data-li-value', `${liDefault}:${li.value}:${li.getAttribute('value')}`);

const ol = document.createElement('ol');
const olDefaultStart = ol.start;
const olDefaultType = ol.type;
ol.start = 3;
ol.reversed = true;
ol.type = 'A';
document.body.setAttribute('data-ol-start', `${olDefaultStart}:${ol.start}:${ol.getAttribute('start')}`);
document.body.setAttribute('data-ol-reversed', `${ol.reversed}:${ol.hasAttribute('reversed')}`);
document.body.setAttribute('data-ol-type', `${olDefaultType}:${ol.type}:${ol.getAttribute('type')}`);

const optgroup = document.createElement('optgroup');
optgroup.disabled = true;
optgroup.label = 'Group A';
document.body.setAttribute('data-optgroup', `${optgroup.disabled}:${optgroup.hasAttribute('disabled')}:${optgroup.label}`);

const quote = document.createElement('q');
quote.cite = 'https://example.test/source';
document.body.setAttribute('data-quote-cite', `${quote.cite}:${quote.getAttribute('cite')}`);

const td = document.createElement('td');
const colDefault = td.colSpan;
const rowDefault = td.rowSpan;
td.colSpan = 2000;
const colClamped = `${td.colSpan}:${td.getAttribute('colspan')}`;
td.rowSpan = 0;
const rowZero = `${td.rowSpan}:${td.getAttribute('rowspan')}`;
td.rowSpan = 70000;
document.body.setAttribute('data-table-cell', `${colDefault}:${rowDefault}:${colClamped}:${rowZero}:${td.rowSpan}:${td.getAttribute('rowspan')}`);

const time = document.createElement('time');
time.dateTime = '2026-04-18T00:00:00Z';
document.body.setAttribute('data-time-datetime', `${time.dateTime}:${time.getAttribute('datetime')}`);

const meta = document.createElement('meta');
const divContentType = typeof document.createElement('div').content;
const metaDefault = `${meta.content}:${meta.httpEquiv}`;
meta.name = 'keywords';
meta.content = 'alpha beta';
meta.httpEquiv = 'refresh';
document.body.setAttribute('data-meta-content', `${metaDefault}:${meta.name}:${meta.content}:${meta.getAttribute('content')}:${meta.httpEquiv}:${meta.getAttribute('http-equiv')}:${divContentType}`);

const track = document.createElement('track');
const missingKind = track.kind;
track.kind = 'captions';
const captionsKind = `${track.kind}:${track.getAttribute('kind')}`;
track.kind = 'bad-kind';
document.body.setAttribute('data-track-kind', `${missingKind}:${captionsKind}:${track.kind}:${track.getAttribute('kind')}`);

const div = document.createElement('div');
const span = document.createElement('span');
const button = document.createElement('button');
div.id = 'alpha';
div.className = 'one two';
div.setAttribute('name', 'before');
div.name = 'after';
div.dir = 'rtl';
document.body.setAttribute('data-global-attributes', `${div.id}:${div.getAttribute('id')}:${div.className}:${div.getAttribute('class')}:${div.name}:${div.getAttribute('name')}:${div.dir}:${div.getAttribute('dir')}`);

const defaultDivTabIndex = div.tabIndex;
div.hidden = true;
div.tabIndex = 5;
document.body.setAttribute('data-hidden-tabindex', `${div.hidden}:${div.hasAttribute('hidden')}:${defaultDivTabIndex}:${div.tabIndex}:${div.getAttribute('tabindex')}:${button.tabIndex}:${span.tabIndex}`);
</script>
</body>
</html>
