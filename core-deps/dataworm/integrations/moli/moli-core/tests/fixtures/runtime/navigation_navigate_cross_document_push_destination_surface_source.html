<!doctype html>
<meta charset="utf-8">
<script>
  sessionStorage.removeItem("navigatePushSourceLog");
  sessionStorage.removeItem("navigatePushResultOrder");
  const log = [];
  navigation.addEventListener("currententrychange", (event) => {
    log.push(
      "listener:" +
        String(event.navigationType) +
        ":" +
        (event.from?.url ?? "null")
    );
    sessionStorage.setItem("navigatePushSourceLog", log.join("|"));
  });
  navigation.oncurrententrychange = (event) => {
    log.push(
      "prop:" + String(event.navigationType) + ":" + (event.from?.url ?? "null")
    );
    sessionStorage.setItem("navigatePushSourceLog", log.join("|"));
  };
  let committedSettled = false;
  let finishedSettled = false;
  sessionStorage.setItem("navigatePushSourceLog", "before");
  const result = navigation.navigate(
    "/compat/navigation-navigate-cross-document-push-destination-surface-dest",
    { history: "push" }
  );
  sessionStorage.setItem(
    "navigatePushResultOrder",
    [
      "surface:" +
        String(
          !!result &&
            typeof result.committed?.then === "function" &&
            typeof result.finished?.then === "function"
        ),
      "sync:" + String(committedSettled) + "," + String(finishedSettled),
    ].join("|")
  );
  result.committed.then(() => {
    committedSettled = true;
    sessionStorage.setItem(
      "navigatePushResultOrder",
      sessionStorage.getItem("navigatePushResultOrder") + "|committed"
    );
  });
  result.finished.then(() => {
    finishedSettled = true;
    sessionStorage.setItem(
      "navigatePushResultOrder",
      sessionStorage.getItem("navigatePushResultOrder") + "|finished"
    );
  });
  sessionStorage.setItem(
    "navigatePushSourceLog",
    (sessionStorage.getItem("navigatePushSourceLog") || "") + "|after-call"
  );
</script>
