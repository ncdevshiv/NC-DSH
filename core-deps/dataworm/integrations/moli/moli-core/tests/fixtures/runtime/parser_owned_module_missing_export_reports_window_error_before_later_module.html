<!doctype html>
<html>
  <body>
    <script>
      window.parserOwnedMissingExportWindowOrder = [];
      window.addEventListener("error", (event) => {
        window.parserOwnedMissingExportWindowOrder.push("window-error");
        window.parserOwnedMissingExportWindowErrorCount =
          (window.parserOwnedMissingExportWindowErrorCount || 0) + 1;
        window.parserOwnedMissingExportWindowMessageMatches =
          event.message.includes("does not export") &&
          event.message.includes("missingValue");
      });
    </script>
    <script
      type="module"
      onerror="window.parserOwnedMissingExportWindowOrder.push('script-error');"
    >
      import { missingValue } from "/assets/module-link-exports-only-named.mjs";
      window.parserOwnedMissingExportWindowValue = missingValue;
    </script>
    <script type="module">
      window.parserOwnedMissingExportWindowOrder.push("later-module");
      window.parserOwnedMissingExportWindowContinuation = true;
      window.parserOwnedMissingExportWindowOrderResult =
        window.parserOwnedMissingExportWindowOrder.join(",");
    </script>
  </body>
</html>
