<!doctype html>
<html>
  <head>
    <link id="s1" rel="stylesheet" href="/assets/chrome_stylesheetlist_1.css">
    <link
      id="s2"
      rel="alternate stylesheet"
      title="set"
      href="/assets/chrome_stylesheetlist_2.css"
    >
    <link id="s3" rel="stylesheet" type="text/css" href="/assets/chrome_stylesheetlist_3.css">
    <style id="s4">#e4 { color: red; }</style>
    <style id="s5" title="set">#e5 { color: red; }</style>
  </head>
  <body
    style="color: green"
    data-initial-length=""
    data-initial-owner-ids=""
    data-after-disable-length=""
    data-after-disable-owner-ids=""
    data-initial-spread-owner-ids=""
    data-after-disable-spread-owner-ids=""
    data-iter-error=""
  >
    <span id="e1">This</span>
    <span id="e2">text</span>
    <span id="e3">should</span>
    <span id="e4">be</span>
    <span id="e5">green</span>
    <script>
      function ownerIds() {
        return Array.from(document.styleSheets)
          .map((sheet) => sheet.ownerNode && sheet.ownerNode.id)
          .join(',');
      }

      function spreadOwnerIds() {
        try {
          return [...document.styleSheets]
            .map((sheet) => sheet.ownerNode && sheet.ownerNode.id)
            .join(',');
        } catch (error) {
          document.body.setAttribute('data-iter-error', `${error.name}: ${error.message}`);
          return 'spread-failed';
        }
      }

      window.addEventListener('load', () => {
        document.body.setAttribute('data-initial-length', String(document.styleSheets.length));
        document.body.setAttribute('data-initial-owner-ids', ownerIds());
        document.body.setAttribute('data-initial-spread-owner-ids', spreadOwnerIds());

        for (let index = 1; index <= 5; index += 1) {
          document.getElementById(`s${index}`).disabled = true;
        }

        document.body.setAttribute(
          'data-after-disable-length',
          String(document.styleSheets.length)
        );
        document.body.setAttribute('data-after-disable-owner-ids', ownerIds());
        document.body.setAttribute('data-after-disable-spread-owner-ids', spreadOwnerIds());
      });
    </script>
  </body>
</html>
