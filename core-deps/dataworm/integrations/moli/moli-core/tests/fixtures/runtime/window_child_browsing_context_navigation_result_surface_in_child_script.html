<!doctype html>
<html>
  <body
    data-sync-shape=""
    data-sync-settled=""
    data-source-sync=""
    data-source-timeout=""
    data-committed-shape=""
    data-finished-shape=""
    data-child-location-href=""
    data-child-activation=""
    data-child-currententrychange=""
    data-child-property-currententrychange=""
    data-history-state=""
    data-current-entry-state-type=""
  >
    <iframe
      id="child"
      src="/compat/window-child-browsing-context-navigation-result-surface-source"
    ></iframe>
    <script>
      const iframe = document.getElementById("child");
      iframe.addEventListener(
        "load",
        () => {
          document.body.setAttribute(
            "data-child-location-href",
            iframe.contentWindow.location.href
          );
          document.body.setAttribute(
            "data-child-activation",
            iframe.contentDocument?.body?.getAttribute("data-activation") ?? ""
          );
          document.body.setAttribute(
            "data-child-currententrychange",
            iframe.contentDocument?.body?.getAttribute("data-currententrychange") ?? ""
          );
          document.body.setAttribute(
            "data-child-property-currententrychange",
            iframe.contentDocument?.body?.getAttribute("data-property-currententrychange") ?? ""
          );
          document.body.setAttribute(
            "data-history-state",
            iframe.contentDocument?.body?.getAttribute("data-history-state") ?? ""
          );
          document.body.setAttribute(
            "data-current-entry-state-type",
            iframe.contentDocument?.body?.getAttribute("data-current-entry-state-type") ?? ""
          );
        },
        { once: false }
      );
    </script>
  </body>
</html>
