<!doctype html>
<html>
<body data-simple="" data-compound="" data-complex="" data-nested="" data-nested-is="" data-nested-not="">
  <div id="a1" class="a">
    <div class="b" id="b1"></div>
    <div class="c" id="c1"></div>
    <div class="c" id="d"></div>
    <div class="e" id="e1"></div>
    <div class="f" id="f1"></div>
    <div class="g">
      <div class="b" id="b2">
        <div class="b" id="b3"></div>
      </div>
    </div>
    <div class="h" id="h1"></div>
  </div>
  <div class="c" id="c2">
    <div id="a2" class="a"></div>
    <div class="e" id="e2"></div>
  </div>
  <script>
    function ids(selector) {
      return Array.from(document.querySelectorAll(selector)).map((node) => node.id).join(",");
    }

    document.body.dataset.simple = ids(".a :where(.b, .c)");
    document.body.dataset.compound = ids(".a :where(.c#d, .e)");
    document.body.dataset.complex = ids(".a :where(.e+.f, .g>.b, .h)");
    document.body.dataset.nested = ids(".a+:where(.b+.f, :where(.c>.e, .g))");
    document.body.dataset.nestedIs = ids(".a :where(:is(:is(.b ~ .c)))");
    document.body.dataset.nestedNot = ids(".b + :where(.c + .c + .c, .b + .c:not(span), .b + .c + .e) ~ .h");
  </script>
</body>
</html>
