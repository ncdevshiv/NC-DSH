<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>lazy geometry offset chain</title>
  <style>
    body { margin: 8px; }
    .item { display: block; width: 120px; height: 20px; margin-top: 1px; }
  </style>
</head>
<body data-lazy-geometry-done="false">
  <div id="root"></div>
  <script>
    const root = document.getElementById("root");
    const lazy = [];

    function offsetChain(node) {
      let top = 0;
      let left = 0;
      for (let current = node; current; current = current.offsetParent) {
        top += current.offsetTop;
        left += current.offsetLeft;
      }
      return top + left;
    }

    function scanVisible() {
      let total = 0;
      for (const node of lazy) {
        total += offsetChain(node);
        total += node.offsetWidth + node.offsetHeight;
        if (node.offsetParent) {
          node.setAttribute("data-visited", "1");
        }
      }
      return total;
    }

    for (let i = 0; i < 24; i++) {
      const img = document.createElement("img");
      img.className = "item";
      img.setAttribute("data-original", "/assets/lazy-" + i + ".png");
      root.appendChild(img);
    }

    const started = performance.now();
    for (const img of root.children) {
      lazy.push(img);
      document.body.setAttribute("data-lazy-geometry-total", String(scanVisible()));
      img.setAttribute("data-original", img.getAttribute("data-original") + "?mutated=1");
    }
    window.lazyGeometryCount = lazy.length;
    window.lazyGeometryElapsed = Math.round(performance.now() - started);
    document.body.setAttribute("data-lazy-geometry-count", String(window.lazyGeometryCount));
    document.body.setAttribute("data-lazy-geometry-elapsed", String(window.lazyGeometryElapsed));
    document.body.setAttribute("data-lazy-geometry-done", "true");
  </script>
</body>
</html>
