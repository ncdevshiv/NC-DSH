<!doctype html>
<meta charset="utf-8">
<body
  data-activation-type=""
  data-activation-is-null=""
  data-transition-type=""
  data-transition-is-null=""
  data-activation-assign-ignored=""
  data-transition-assign-ignored=""
  data-current-entry-assign-ignored=""
  data-current-entry-descriptor=""
  data-activation-descriptor=""
  data-transition-descriptor=""
  data-entry-url=""
  data-from-url=""
  data-navigation-type=""
></body>
<script>
  const activation = navigation.activation;
  const transition = navigation.transition;
  const currentEntry = navigation.currentEntry;
  const navigationPrototype = Object.getPrototypeOf(navigation);
  const currentEntryDescriptor = Object.getOwnPropertyDescriptor(navigationPrototype, "currentEntry");
  const activationDescriptor = Object.getOwnPropertyDescriptor(navigationPrototype, "activation");
  const transitionDescriptor = Object.getOwnPropertyDescriptor(navigationPrototype, "transition");
  navigation.activation = { hacked: true };
  navigation.transition = { hacked: true };
  navigation.currentEntry = { hacked: true };
  document.body.setAttribute("data-activation-type", typeof activation);
  document.body.setAttribute("data-activation-is-null", String(activation === null));
  document.body.setAttribute("data-transition-type", typeof transition);
  document.body.setAttribute("data-transition-is-null", String(transition === null));
  document.body.setAttribute(
    "data-activation-assign-ignored",
    String(navigation.activation === activation)
  );
  document.body.setAttribute(
    "data-transition-assign-ignored",
    String(navigation.transition === transition)
  );
  document.body.setAttribute(
    "data-current-entry-assign-ignored",
    String(navigation.currentEntry === currentEntry)
  );
  document.body.setAttribute(
    "data-current-entry-descriptor",
    `${typeof currentEntryDescriptor?.get}|${typeof currentEntryDescriptor?.set}|${String(currentEntryDescriptor?.enumerable)}|${String(currentEntryDescriptor?.configurable)}`
  );
  document.body.setAttribute(
    "data-activation-descriptor",
    `${typeof activationDescriptor?.get}|${typeof activationDescriptor?.set}|${String(activationDescriptor?.enumerable)}|${String(activationDescriptor?.configurable)}`
  );
  document.body.setAttribute(
    "data-transition-descriptor",
    `${typeof transitionDescriptor?.get}|${typeof transitionDescriptor?.set}|${String(transitionDescriptor?.enumerable)}|${String(transitionDescriptor?.configurable)}`
  );
  document.body.setAttribute("data-entry-url", String(activation?.entry?.url ?? ""));
  document.body.setAttribute("data-from-url", String(activation?.from?.url ?? ""));
  document.body.setAttribute(
    "data-navigation-type",
    String(activation?.navigationType ?? "")
  );
</script>
