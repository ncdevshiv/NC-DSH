<!doctype html>
<html>
  <body
    data-tampered-queue-microtask-called="no"
    data-history-back-fired="no"
    data-history-back-sync-url=""
    data-history-back-async-url=""
  >
    <script>
      history.pushState({ step: 1 }, "", "#one");

      window.queueMicrotask = () => {
        document.body.setAttribute("data-tampered-queue-microtask-called", "yes");
        throw new Error("host must not call page queueMicrotask");
      };

      window.addEventListener("popstate", () => {
        document.body.setAttribute("data-history-back-fired", "yes");
        document.body.setAttribute("data-history-back-async-url", location.href);
      });

      history.back();
      document.body.setAttribute("data-history-back-sync-url", location.href);
    </script>
  </body>
</html>
