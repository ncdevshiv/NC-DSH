<!doctype html>
<html>
  <head>
    <script>
      window.dynamicScriptErrorOrder = [];
      window.dynamicScriptErrorCount = 0;
      window.dynamicScriptErrorDocumentCapture = false;
      window.dynamicInOrderScriptOrder = [];

      const broken = document.createElement("script");
      broken.async = false;
      broken.src = "/assets/dynamic_taxonomy_missing.js";
      broken.onerror = () => {
        window.dynamicScriptErrorCount += 1;
        window.dynamicScriptErrorOrder.push("error");
        window.dynamicScriptErrorOrderResult =
          window.dynamicScriptErrorOrder.join(",");
      };

      document.documentElement.addEventListener(
        "error",
        (event) => {
          if (event.target === broken) {
            window.dynamicScriptErrorDocumentCapture = true;
          }
        },
        true,
      );

      const good = document.createElement("script");
      good.async = false;
      good.src = "/assets/dynamic_taxonomy_in_order_fast.js";
      good.onload = () => {
        window.dynamicScriptErrorOrder.push("load");
        window.dynamicScriptErrorOrderResult =
          window.dynamicScriptErrorOrder.join(",");
      };

      document.head.appendChild(broken);
      document.head.appendChild(good);
    </script>
  </head>
  <body>
    <script>
      testing.eventually(() => {
        testing.expectEqual(1, window.dynamicScriptErrorCount);
        testing.expectTrue(window.dynamicScriptErrorDocumentCapture);
        testing.expectEqual("error,load", window.dynamicScriptErrorOrderResult);
        testing.expectEqual(
          "in-order-fast",
          window.dynamicInOrderScriptOrderResult,
        );
      });
    </script>
  </body>
</html>
