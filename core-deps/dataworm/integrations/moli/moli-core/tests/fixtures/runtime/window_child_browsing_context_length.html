<!doctype html>
<html>
<body
  data-window-length-initial=""
  data-window-length-after-append=""
  data-window-length-after-remove=""
>
<iframe id="initial-frame" src="about:blank"></iframe>
<script>
  const body = document.body;
  body.setAttribute('data-window-length-initial', String(window.length));

  const dynamic = document.createElement('iframe');
  dynamic.src = 'about:blank';
  document.documentElement.appendChild(dynamic);
  body.setAttribute('data-window-length-after-append', String(window.length));

  dynamic.remove();
  body.setAttribute('data-window-length-after-remove', String(window.length));
</script>
</body>
</html>
