<!doctype html>
<html>
  <body data-fired="" data-count="" data-current-url="">
    <script>
      let count = 0;

      navigation.addEventListener("currententrychange", () => {
        count += 1;
        document.body.setAttribute("data-fired", "true");
        document.body.setAttribute("data-count", String(count));
        document.body.setAttribute(
          "data-current-url",
          navigation.currentEntry?.url ?? "null"
        );
      });

      location.href = location.href + "#1";
    </script>
  </body>
</html>
