<!doctype html>
<html>
  <body data-tampered-node-contains-called="no">
    <p id="outside">outside</p>
    <div id="nested">
      <span id="s1">alpha</span>
      <span id="s2">beta</span>
    </div>
    <script>
      Node.prototype.contains = function () {
        document.body.setAttribute("data-tampered-node-contains-called", "yes");
        throw new Error("page tampered Node.prototype.contains");
      };

      const sel = window.getSelection();
      const nested = document.getElementById("nested");
      const s1 = document.getElementById("s1");
      const s2 = document.getElementById("s2");
      const outside = document.getElementById("outside");
      const range = document.createRange();

      range.selectNodeContents(nested);
      sel.removeAllRanges();
      sel.addRange(range);

      document.body.setAttribute(
        "data-contains-partial-s1",
        String(sel.containsNode(s1, true)),
      );
      document.body.setAttribute(
        "data-contains-partial-s2",
        String(sel.containsNode(s2, true)),
      );
      document.body.setAttribute(
        "data-contains-partial-nested",
        String(sel.containsNode(nested, true)),
      );
      document.body.setAttribute(
        "data-contains-full-nested",
        String(sel.containsNode(nested, false)),
      );
      document.body.setAttribute(
        "data-contains-partial-outside",
        String(sel.containsNode(outside, true)),
      );
    </script>
  </body>
</html>
