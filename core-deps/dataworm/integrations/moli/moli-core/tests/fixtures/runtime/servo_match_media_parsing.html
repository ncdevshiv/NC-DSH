<!doctype html>
<html>
  <body
    data-empty=""
    data-all=""
    data-list=""
    data-feature=""
    data-open-feature=""
    data-invalid-close=""
    data-empty-items=""
    data-trailing=""
    data-case-all=""
    data-case-feature=""
    data-case-min-width=""
    data-invalid-list=""
    data-double-empty=""
  >
    <script>
      const body = document.body;
      const cases = [
        ['data-empty', ''],
        ['data-all', '   all   '],
        ['data-list', ' all , all '],
        ['data-feature', ' ( color  ) '],
        ['data-open-feature', ' ( color   '],
        ['data-invalid-close', 'color)'],
        ['data-empty-items', ' , '],
        ['data-trailing', ' foo,'],
        ['data-case-all', ' ALL '],
        ['data-case-feature', '(Height)'],
        ['data-case-min-width', '(mIN-Width:0cM)'],
        ['data-invalid-list', '  color ), ( color'],
        ['data-double-empty', ',,'],
      ];
      for (const [attr, query] of cases) {
        body.setAttribute(attr, window.matchMedia(query).media);
      }
    </script>
  </body>
</html>
