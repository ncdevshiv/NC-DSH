<!doctype html>
<html>
  <head>
    <link id="s1" rel="stylesheet" href="/assets/chrome_stylesheetlist_1.css">
    <style id="s2">#sheet-item-two { color: red; }</style>
    <style id="s3">#sheet-item-three { color: blue; }</style>
  </head>
  <body
    data-length=""
    data-item0-owner=""
    data-item1-owner=""
    data-item2-owner=""
    data-item0-eq-index=""
    data-oob-null=""
    data-oob-index-undefined=""
    data-iterator-type=""
    data-spread-owner-ids=""
    data-iter-error=""
  >
    <div id="sheet-item-two"></div>
    <div id="sheet-item-three"></div>
    <script>
      const body = document.body;
      const sheets = document.styleSheets;
      body.setAttribute('data-length', String(sheets.length));
      body.setAttribute('data-item0-owner', sheets.item(0)?.ownerNode?.id ?? '');
      body.setAttribute('data-item1-owner', sheets.item(1)?.ownerNode?.id ?? '');
      body.setAttribute('data-item2-owner', sheets.item(2)?.ownerNode?.id ?? '');
      body.setAttribute('data-item0-eq-index', String(sheets.item(0) === sheets[0]));
      body.setAttribute('data-oob-null', String(sheets.item(99) === null));
      body.setAttribute('data-oob-index-undefined', String(sheets[99] === undefined));
      body.setAttribute('data-iterator-type', typeof sheets[Symbol.iterator]);
      try {
        body.setAttribute('data-spread-owner-ids', [...sheets].map(sheet => sheet.ownerNode?.id ?? '').join(','));
      } catch (error) {
        body.setAttribute('data-iter-error', `${error.name}: ${error.message}`);
      }
    </script>
  </body>
</html>
