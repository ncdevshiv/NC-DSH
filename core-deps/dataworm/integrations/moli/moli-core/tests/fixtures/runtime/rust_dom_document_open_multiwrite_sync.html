<!doctype html>
<html>
  <body>
    <div id="old">old</div>
    <script>
      try {
        setTimeout(() => {
          try {
            document.open();
            window.rustDomDocumentOpenMultiwriteOldGone =
              document.getElementById("old") === null;
            document.write("<html><body>");
            document.write('<main id="new">new</main>');
            document.write("</body></html>");
            document.close();
            window.rustDomDocumentOpenMultiwriteError = null;
            window.rustDomDocumentOpenMultiwriteNewId =
              document.getElementById("new")?.id ?? null;
          } catch (error) {
            window.rustDomDocumentOpenMultiwriteError = String(error);
          }
        }, 0);
      } catch (error) {
        window.rustDomDocumentOpenMultiwriteError = String(error);
      }
    </script>
  </body>
</html>
