<!doctype html>
<html>
  <body
    data-test0-overflow=""
    data-test0-overflow-x=""
    data-test0-overflow-y=""
    data-test1-overflow=""
    data-test1-overflow-x=""
    data-test1-overflow-y=""
    data-test2-overflow=""
    data-test2-overflow-x=""
    data-test2-overflow-y=""
    data-test3-overflow=""
    data-test3-overflow-x=""
    data-test3-overflow-y=""
    data-test4-overflow=""
    data-test4-overflow-x=""
    data-test4-overflow-y=""
    data-test5-overflow=""
    data-test5-overflow-x=""
    data-test5-overflow-y=""
    data-test6-overflow=""
    data-test6-overflow-x=""
    data-test6-overflow-y=""
    data-test7-overflow=""
    data-test7-overflow-x=""
    data-test7-overflow-y=""
  >
    <div id="test0" style="overflow: auto"></div>
    <div id="test1" style="overflow: auto auto"></div>
    <div id="test2" style="overflow-x: scroll; overflow-y: scroll"></div>
    <div id="test3" style="overflow-x: overlay; overflow-y: hidden"></div>
    <div id="test4" style="overflow-x: auto"></div>
    <div id="test5" style="overflow-y: auto"></div>
    <div id="test6" style="overflow: invalid"></div>
    <div id="test7"></div>
    <script>
      for (let index = 0; index <= 7; index += 1) {
        const style = document.getElementById(`test${index}`).style;
        document.body.setAttribute(`data-test${index}-overflow`, style.overflow);
        document.body.setAttribute(`data-test${index}-overflow-x`, style.overflowX);
        document.body.setAttribute(`data-test${index}-overflow-y`, style.overflowY);
      }
    </script>
  </body>
</html>
