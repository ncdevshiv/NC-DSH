<!doctype html>
<html>
  <body
    data-push=""
    data-replace=""
    data-href=""
    data-pathname=""
    data-history-length=""
    data-history-state=""
  >
    <script>
      try {
        history.pushState({ step: 1 }, "", "https://example.com/push");
        document.body.setAttribute("data-push", "ok");
      } catch (error) {
        document.body.setAttribute("data-push", String(error?.name ?? error ?? ""));
      }

      try {
        history.replaceState({ step: 2 }, "", "https://example.com/replace");
        document.body.setAttribute("data-replace", "ok");
      } catch (error) {
        document.body.setAttribute("data-replace", String(error?.name ?? error ?? ""));
      }

      document.body.setAttribute("data-href", location.href);
      document.body.setAttribute("data-pathname", location.pathname);
      document.body.setAttribute("data-history-length", String(history.length));
      document.body.setAttribute(
        "data-history-state",
        String(history.state === null ? "null" : JSON.stringify(history.state))
      );
    </script>
  </body>
</html>
