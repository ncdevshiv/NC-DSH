<!doctype html>
<html>
  <head>
    <script>
      window.dynamicScriptTaxonomyOrder = [];
      window.dynamicScriptTaxonomyLoads = 0;

      function recordDynamicScriptTaxonomyLoad() {
        window.dynamicScriptTaxonomyLoads += 1;
        if (window.dynamicScriptTaxonomyLoads === 2) {
          window.dynamicScriptTaxonomyOrderResult =
            window.dynamicScriptTaxonomyOrder.join(",");
        }
      }

      const slowInOrder = document.createElement("script");
      slowInOrder.async = false;
      slowInOrder.src = "/assets/dynamic_taxonomy_in_order_slow.js";
      slowInOrder.addEventListener("load", recordDynamicScriptTaxonomyLoad);
      document.head.appendChild(slowInOrder);

      const fastAsync = document.createElement("script");
      fastAsync.src = "/assets/dynamic_taxonomy_async_fast.js";
      fastAsync.addEventListener("load", recordDynamicScriptTaxonomyLoad);
      document.head.appendChild(fastAsync);
    </script>
  </head>
  <body></body>
</html>
