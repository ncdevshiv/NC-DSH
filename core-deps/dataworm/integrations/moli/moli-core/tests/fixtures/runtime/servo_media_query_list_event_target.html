<!doctype html>
<html>
  <body
    data-add-listener-optional=""
    data-add-listener-dedup=""
    data-add-listener-order=""
    data-remove-listener=""
    data-onchange=""
    data-handle-event=""
    data-handle-event-remove=""
    data-once=""
    data-dispatch-default-prevented=""
  >
    <script>
      function makeChangeEvent(mql) {
        const event = new Event('change', { cancelable: true });
        Object.defineProperty(event, 'media', { value: mql.media });
        Object.defineProperty(event, 'matches', { value: mql.matches });
        return event;
      }

      const mql = matchMedia('(min-width: 100px)');

      let addListenerOptional = true;
      try {
        mql.addListener(null);
        mql.addListener(undefined);
        mql.removeListener(null);
        mql.removeListener(undefined);
      } catch (_) {
        addListenerOptional = false;
      }
      document.body.setAttribute(
        'data-add-listener-optional',
        String(addListenerOptional),
      );

      let dedupCount = 0;
      const dedupListener = () => {
        dedupCount++;
      };
      mql.addListener(dedupListener);
      mql.addListener(dedupListener);
      mql.dispatchEvent(makeChangeEvent(mql));
      document.body.setAttribute(
        'data-add-listener-dedup',
        String(dedupCount === 1),
      );
      mql.removeListener(dedupListener);

      const order = [];
      const first = () => order.push('first');
      const second = () => order.push('second');
      mql.addListener(first);
      mql.addListener(second);
      mql.dispatchEvent(makeChangeEvent(mql));
      document.body.setAttribute(
        'data-add-listener-order',
        String(order.join(',') === 'first,second'),
      );
      mql.removeListener(first);
      mql.removeListener(second);

      let removedCalled = false;
      const removed = () => {
        removedCalled = true;
      };
      mql.addListener(removed);
      mql.removeListener(removed);
      mql.dispatchEvent(makeChangeEvent(mql));
      document.body.setAttribute(
        'data-remove-listener',
        String(removedCalled === false),
      );

      let onchangeOk = false;
      mql.onchange = event => {
        onchangeOk = event.media === mql.media && event.matches === mql.matches;
      };
      mql.dispatchEvent(makeChangeEvent(mql));
      mql.onchange = null;
      mql.dispatchEvent(makeChangeEvent(mql));
      document.body.setAttribute('data-onchange', String(onchangeOk));

      let handleEventCalls = 0;
      const handleEventListener = {
        marker: 'listener',
        handleEvent(event) {
          if (
            this === handleEventListener &&
            event.media === mql.media &&
            event.matches === mql.matches
          ) {
            handleEventCalls++;
          }
        },
      };
      mql.addEventListener('change', handleEventListener);
      mql.dispatchEvent(makeChangeEvent(mql));
      document.body.setAttribute(
        'data-handle-event',
        String(handleEventCalls === 1),
      );
      mql.removeEventListener('change', handleEventListener);
      mql.dispatchEvent(makeChangeEvent(mql));
      document.body.setAttribute(
        'data-handle-event-remove',
        String(handleEventCalls === 1),
      );

      let onceCalls = 0;
      mql.addEventListener(
        'change',
        () => {
          onceCalls++;
        },
        { once: true },
      );
      mql.dispatchEvent(makeChangeEvent(mql));
      mql.dispatchEvent(makeChangeEvent(mql));
      document.body.setAttribute('data-once', String(onceCalls === 1));

      let customDispatched = false;
      mql.addEventListener('custom', event => {
        customDispatched = event.type === 'custom';
        event.preventDefault();
      });
      const customEvent = new CustomEvent('custom', { cancelable: true });
      const defaultAction = mql.dispatchEvent(customEvent);
      document.body.setAttribute(
        'data-dispatch-default-prevented',
        String(customDispatched && defaultAction === false),
      );
    </script>
  </body>
</html>
