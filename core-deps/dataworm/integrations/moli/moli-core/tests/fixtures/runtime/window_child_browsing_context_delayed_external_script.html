<!doctype html>
<html>
  <body data-parent-continued="false">
    <iframe id="child" src="/compat/window-child-browsing-context-delayed-external-script-child"></iframe>
    <script>
      const iframe = document.getElementById('child');
      document.body.setAttribute(
        'data-child-before-load',
        iframe.contentDocument?.body?.getAttribute('data-external-script') ?? 'not-ready'
      );
      document.body.setAttribute('data-parent-continued', 'true');
      iframe.addEventListener('load', () => {
        document.body.setAttribute('data-child-load-fired', 'true');
        document.body.setAttribute(
          'data-child-order',
          iframe.contentDocument?.body?.getAttribute('data-script-order') ?? 'null'
        );
        document.body.setAttribute(
          'data-child-inline-after-external',
          iframe.contentDocument?.body?.getAttribute('data-inline-after-external') ?? 'null'
        );
      });
    </script>
  </body>
</html>
