<!doctype html>
<html>
  <head id="head">
    <style id="style">
      @font-face {
        font-family: "WebFont";
        src: url("resources/Rochester.otf") format("opentype");
      }
    </style>
  </head>
  <body data-result-length="">
    <script>
      (async () => {
        const fonts = document.fonts;
        document.getElementById('head').removeChild(document.getElementById('style'));
        const result = await fonts.load("12px 'WebFont'");
        document.body.setAttribute('data-result-length', String(result.length));
      })();
    </script>
  </body>
</html>
