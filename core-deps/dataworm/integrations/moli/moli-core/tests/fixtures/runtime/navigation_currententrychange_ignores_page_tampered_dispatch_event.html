<!doctype html>
<html>
  <body
    data-tampered-dispatch-event-called="no"
    data-currententrychange-fired="no"
    data-property-currententrychange-fired="no"
    data-currententrychange-navigation-type=""
  >
    <script>
      navigation.addEventListener("currententrychange", (event) => {
        document.body.setAttribute("data-currententrychange-fired", "yes");
        document.body.setAttribute(
          "data-currententrychange-navigation-type",
          event.navigationType ?? ""
        );
      });
      navigation.oncurrententrychange = () => {
        document.body.setAttribute("data-property-currententrychange-fired", "yes");
      };
      navigation.dispatchEvent = () => {
        document.body.setAttribute("data-tampered-dispatch-event-called", "yes");
        throw new Error("host must not call navigation.dispatchEvent");
      };

      history.pushState({ step: 1 }, "", "#one");
      document.body.setAttribute("data-location-hash", location.hash);
    </script>
  </body>
</html>
