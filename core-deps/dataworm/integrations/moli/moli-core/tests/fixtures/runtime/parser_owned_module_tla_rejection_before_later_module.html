<!doctype html>
<html>
  <body>
    <script>
      window.parserOwnedModuleTlaOrder = [];
      window.addEventListener("error", () => {
        window.parserOwnedModuleTlaOrder.push("error");
        window.parserOwnedModuleTlaErrors =
          (window.parserOwnedModuleTlaErrors || 0) + 1;
        window.parserOwnedModuleTlaOrderResult =
          window.parserOwnedModuleTlaOrder.join(",");
      });
    </script>
    <script type="module">
      await Promise.reject(new Error("tla-broken"));
    </script>
    <script type="module">
      window.parserOwnedModuleTlaOrder.push("later-module");
      window.parserOwnedModuleTlaContinuation = true;
      window.parserOwnedModuleTlaOrderResult = window.parserOwnedModuleTlaOrder.join(",");
    </script>
  </body>
</html>
