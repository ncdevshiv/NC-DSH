<!doctype html>
<html>
  <body>
    <script>
      window.dynamicPendingStarFinalMissingOrder = [];
      window.addEventListener("error", event => {
        const message =
          (event.error && event.error.message) || event.message || "";
        if (message.includes("does not export `missingValue`")) {
          window.dynamicPendingStarFinalMissingOrder.push("error");
          window.dynamicPendingStarFinalMissingWindowError = message;
        }
      });

      const broken = document.createElement("script");
      broken.type = "module";
      broken.text = 'import "/assets/module-pending-star-cycle-entry.mjs";';
      document.body.appendChild(broken);

      const later = document.createElement("script");
      later.type = "module";
      later.text =
        'window.dynamicPendingStarFinalMissingOrder.push("later-module"); window.dynamicPendingStarFinalMissingOrderResult = window.dynamicPendingStarFinalMissingOrder.join(",");';
      document.body.appendChild(later);
    </script>
  </body>
</html>
