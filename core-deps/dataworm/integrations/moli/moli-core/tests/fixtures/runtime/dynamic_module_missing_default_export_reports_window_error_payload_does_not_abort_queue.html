<!doctype html>
<html>
  <body>
    <script>
      window.dynamicModuleMissingExportPayloadOrder = [];
      window.addEventListener("error", (event) => {
        window.dynamicModuleMissingExportPayloadOrder.push("window-error");
        window.dynamicModuleMissingExportPayloadErrorMessageMatches = Boolean(
          event.error &&
            typeof event.error.message === "string" &&
            event.error.message.includes("default"),
        );
        window.dynamicModuleMissingExportPayloadFilenameMatches =
          typeof event.filename === "string" &&
          event.filename.includes(
            "/compat/dynamic-module-missing-default-export-reports-window-error-payload-does-not-abort-queue",
          );
      });

      const broken = document.createElement("script");
      broken.type = "module";
      broken.onerror = () => {
        window.dynamicModuleMissingExportPayloadOrder.push("script-error");
      };
      broken.text =
        'import missingDefault from "/assets/module-link-exports-only-named.mjs";\nwindow.dynamicModuleMissingExportPayloadValue = missingDefault;';
      document.body.appendChild(broken);

      const later = document.createElement("script");
      later.type = "module";
      later.text =
        'window.dynamicModuleMissingExportPayloadOrder.push("later-module"); window.dynamicModuleMissingExportPayloadContinuation = true; window.dynamicModuleMissingExportPayloadOrderResult = window.dynamicModuleMissingExportPayloadOrder.join(",");';
      document.body.appendChild(later);
    </script>
  </body>
</html>
