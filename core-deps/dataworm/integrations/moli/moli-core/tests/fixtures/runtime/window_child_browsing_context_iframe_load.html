<!doctype html>
<html>
<body
  data-parser-load="pending"
  data-dynamic-load="pending"
  data-invalid-load="pending"
>
  <iframe
    id="parser"
    onload="document.body.setAttribute('data-parser-load', 'true')"
    src="about:blank"
  ></iframe>
  <script>
    const dynamic = document.createElement('iframe');
    dynamic.id = 'dynamic';
    dynamic.addEventListener('load', () => {
      document.body.setAttribute('data-dynamic-load', 'true');
    });
    dynamic.src = '/compat/window-child-browsing-context-target-name-a';
    document.body.appendChild(dynamic);

    const invalid = document.createElement('iframe');
    invalid.id = 'invalid';
    invalid.addEventListener('load', () => {
      document.body.setAttribute('data-invalid-load', 'true');
    });
    invalid.src = 'invalid';
    document.body.appendChild(invalid);
  </script>
</body>
</html>
