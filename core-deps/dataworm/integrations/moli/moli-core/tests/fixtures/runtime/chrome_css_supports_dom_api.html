<!doctype html>
<html>
  <body
    data-simple-true=""
    data-simple-false=""
    data-and-or=""
    data-not=""
    data-semicolon=""
    data-property-display-true=""
    data-property-display-false=""
    data-property-top-percent=""
    data-property-top-number=""
    data-property-background-url=""
    data-property-background-invalid=""
    data-property-color-rgba=""
    data-property-z-index-number=""
    data-property-important=""
    data-property-empty=""
    data-unsupported-text-decoration-style=""
  >
    <script>
      document.body.setAttribute(
        'data-simple-true',
        String(CSS.supports('display: none')),
      );
      document.body.setAttribute(
        'data-simple-false',
        String(CSS.supports('(display: deadbeef)')),
      );
      document.body.setAttribute(
        'data-and-or',
        String(
          CSS.supports(
            '(display: none) and ((display: block) or (display: inline))',
          ),
        ),
      );
      document.body.setAttribute(
        'data-not',
        String(CSS.supports('not (display: deadbeef)')),
      );
      document.body.setAttribute(
        'data-semicolon',
        String(CSS.supports('display: none;')),
      );
      document.body.setAttribute(
        'data-property-display-true',
        String(CSS.supports('display', 'block')),
      );
      document.body.setAttribute(
        'data-property-display-false',
        String(CSS.supports('display', 'rainbow')),
      );
      document.body.setAttribute(
        'data-property-top-percent',
        String(CSS.supports('top', '20%')),
      );
      document.body.setAttribute(
        'data-property-top-number',
        String(CSS.supports('top', '20')),
      );
      document.body.setAttribute(
        'data-property-background-url',
        String(CSS.supports('background', "url('/blah')")),
      );
      document.body.setAttribute(
        'data-property-background-invalid',
        String(CSS.supports('background', "invalid('/blah')")),
      );
      document.body.setAttribute(
        'data-property-color-rgba',
        String(CSS.supports('background-color', 'rgba(0,0,0,0)')),
      );
      document.body.setAttribute(
        'data-property-z-index-number',
        String(CSS.supports('z-index', 1)),
      );
      document.body.setAttribute(
        'data-property-important',
        String(CSS.supports('display', 'none !important')),
      );
      document.body.setAttribute(
        'data-property-empty',
        String(CSS.supports('', '')),
      );
      document.body.setAttribute(
        'data-unsupported-text-decoration-style',
        String(CSS.supports('text-decoration-style', 'blink')),
      );
    </script>
  </body>
</html>
