<!doctype html>
<html>
  <body data-constructor-throws="">
    <script>
      const body = document.body;
      const FontFaceSetCtor =
        'FontFaceSet' in self ? self.FontFaceSet : document.fonts.constructor;
      try {
        new FontFaceSetCtor([]);
        body.setAttribute('data-constructor-throws', 'false');
      } catch (error) {
        body.setAttribute(
          'data-constructor-throws',
          String(error instanceof TypeError)
        );
      }
    </script>
  </body>
</html>
