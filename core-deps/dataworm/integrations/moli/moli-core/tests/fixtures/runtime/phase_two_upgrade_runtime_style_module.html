<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.phaseTwoUpgradeModuleOrder = [];
      window.phaseTwoUpgradeModuleLoaded = false;
      document.addEventListener("DOMContentLoaded", () => {
        window.phaseTwoUpgradeModuleOrder.push("dcl");
        window.phaseTwoUpgradeModuleDclOrder =
          window.phaseTwoUpgradeModuleOrder.join(",");
      });
    </script>
    <script>
      customElements.define(
        "x-phase-two-upgrade-module",
        class extends HTMLElement {
          connectedCallback() {
            if (this.hasAttribute("data-upgraded")) {
              return;
            }
            this.setAttribute("data-upgraded", "1");
            window.phaseTwoUpgradeModuleOrder.push("connected");

            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = "/assets/blocking_stylesheet_slow.css?phase2-upgrade=module";
            link.addEventListener(
              "load",
              () => {
                window.phaseTwoUpgradeModuleLoaded = true;
                window.phaseTwoUpgradeModuleOrder.push("style-load");
                window.phaseTwoUpgradeModuleFinalOrder =
                  window.phaseTwoUpgradeModuleOrder.join(",");
              },
              { once: true }
            );
            document.head.appendChild(link);
          }
        }
      );
    </script>
    <x-phase-two-upgrade-module></x-phase-two-upgrade-module>
    <script type="module">
      window.phaseTwoUpgradeModuleSawLoaded =
        window.phaseTwoUpgradeModuleLoaded === true;
      window.phaseTwoUpgradeModuleSawLate = !!document.getElementById("late");
      window.phaseTwoUpgradeModuleOrder.push("module");
      Promise.resolve().then(() => {
        window.phaseTwoUpgradeModuleOrder.push("module-microtask");
        window.phaseTwoUpgradeModuleFinalOrder =
          window.phaseTwoUpgradeModuleOrder.join(",");
      });
      window.phaseTwoUpgradeModuleFinalOrder =
        window.phaseTwoUpgradeModuleOrder.join(",");
    </script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
