<!doctype html>
<meta charset="utf-8">
<body
  data-length=""
  data-activation-type=""
  data-entry-url=""
  data-from-url=""
  data-history-state=""
  data-navigation-state=""
  data-currententrychange-count=""
  data-property-currententrychange-count=""
  data-source-log=""
  data-result-order=""
  data-current-same-document=""
  data-entry-same-document-values=""
></body>
<script>
  let listenerCount = 0;
  let propertyCount = 0;

  navigation.addEventListener("currententrychange", () => {
    listenerCount += 1;
  });

  navigation.oncurrententrychange = () => {
    propertyCount += 1;
  };

  document.body.setAttribute("data-length", String(history.length));
  document.body.setAttribute(
    "data-activation-type",
    String(navigation.activation?.navigationType ?? "")
  );
  document.body.setAttribute(
    "data-entry-url",
    String(navigation.activation?.entry?.url ?? "")
  );
  document.body.setAttribute(
    "data-from-url",
    String(navigation.activation?.from?.url ?? "")
  );
  document.body.setAttribute("data-history-state", JSON.stringify(history.state));
  document.body.setAttribute(
    "data-navigation-state",
    JSON.stringify(navigation.currentEntry?.getState?.() ?? null)
  );
  document.body.setAttribute(
    "data-currententrychange-count",
    String(listenerCount)
  );
  document.body.setAttribute(
    "data-property-currententrychange-count",
    String(propertyCount)
  );
  document.body.setAttribute(
    "data-source-log",
    sessionStorage.getItem("navigatePushSourceLog") ?? "null"
  );
  document.body.setAttribute(
    "data-result-order",
    sessionStorage.getItem("navigatePushResultOrder") ?? "null"
  );
  document.body.setAttribute(
    "data-current-same-document",
    String(navigation.currentEntry?.sameDocument)
  );
  document.body.setAttribute(
    "data-entry-same-document-values",
    navigation.entries().map((entry) => String(entry.sameDocument)).join("|")
  );
</script>
