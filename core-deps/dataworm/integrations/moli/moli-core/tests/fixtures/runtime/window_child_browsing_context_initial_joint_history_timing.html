<!doctype html>
<html>
<body
  data-top-sync-history-length=""
  data-top-load-history-length=""
  data-child-load-history-length=""
  data-child-entries-length=""
>
<iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
<script>
  const iframe = document.getElementById('child');
  document.body.setAttribute('data-top-sync-history-length', String(history.length));
  iframe.addEventListener('load', () => {
    document.body.setAttribute('data-top-load-history-length', String(history.length));
    document.body.setAttribute(
      'data-child-load-history-length',
      String(iframe.contentWindow.history.length)
    );
    document.body.setAttribute(
      'data-child-entries-length',
      String(iframe.contentWindow.navigation.entries().length)
    );
  });
</script>
</body>
</html>
