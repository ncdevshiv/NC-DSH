<!doctype html>
<html>
  <body
    data-activation=""
    data-currententrychange="0"
    data-property-currententrychange="0"
    data-history-state=""
    data-current-entry-state-type=""
  >
    destination
    <script>
      let listenerCount = 0;
      let propertyCount = 0;

      navigation.addEventListener("currententrychange", () => {
        listenerCount += 1;
        document.body.setAttribute(
          "data-currententrychange",
          String(listenerCount)
        );
      });

      navigation.oncurrententrychange = () => {
        propertyCount += 1;
        document.body.setAttribute(
          "data-property-currententrychange",
          String(propertyCount)
        );
      };

      document.body.setAttribute(
        "data-activation",
        [
          String(navigation.activation?.entry?.url ?? ""),
          String(navigation.activation?.from?.url ?? ""),
          String(navigation.activation?.navigationType ?? ""),
        ].join("|")
      );
      document.body.setAttribute("data-history-state", String(history.state));
      document.body.setAttribute(
        "data-current-entry-state-type",
        typeof navigation.currentEntry?.getState?.()
      );

      setTimeout(() => {
        document.body.setAttribute(
          "data-currententrychange",
          String(listenerCount)
        );
        document.body.setAttribute(
          "data-property-currententrychange",
          String(propertyCount)
        );
        document.body.setAttribute("data-history-state", String(history.state));
        document.body.setAttribute(
          "data-current-entry-state-type",
          typeof navigation.currentEntry?.getState?.()
        );
      }, 0);
    </script>
  </body>
</html>
