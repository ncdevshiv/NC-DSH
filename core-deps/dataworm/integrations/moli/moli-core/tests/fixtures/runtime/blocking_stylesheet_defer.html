<!doctype html>
<html>
  <head>
    <script>
      window.blockingStylesheetStart = Date.now();
      window.blockingStylesheetDeferOrder = [];
      document.addEventListener("DOMContentLoaded", () => {
        window.blockingStylesheetDeferDclElapsed =
          Date.now() - window.blockingStylesheetStart;
        window.blockingStylesheetDeferDclBlockedEnough =
          window.blockingStylesheetDeferDclElapsed >= 50;
        window.blockingStylesheetDeferOrder.push("dcl");
        window.blockingStylesheetDeferDclOrder =
          window.blockingStylesheetDeferOrder.join(",");
      });
    </script>
    <link rel="stylesheet" href="/assets/blocking_stylesheet_slow.css">
    <script defer src="/assets/blocking_stylesheet_defer.js"></script>
  </head>
  <body>
    <div id="late">late</div>
  </body>
</html>
