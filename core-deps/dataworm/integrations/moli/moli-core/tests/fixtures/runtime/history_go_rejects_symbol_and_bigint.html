<!doctype html>
<html>
  <body data-symbol-count="" data-symbol-result="" data-bigint-count="" data-bigint-result="">
    <script>
      const symbolCount =
        Number(sessionStorage.getItem("history-go-symbol-count") || "0") + 1;
      sessionStorage.setItem("history-go-symbol-count", String(symbolCount));
      document.body.setAttribute("data-symbol-count", String(symbolCount));
      try {
        if (symbolCount === 1) {
          history.go(Symbol("x"));
        }
        document.body.setAttribute("data-symbol-result", "ok");
      } catch (error) {
        document.body.setAttribute(
          "data-symbol-result",
          error && error.name ? error.name : String(error)
        );
      }

      const bigintCount =
        Number(sessionStorage.getItem("history-go-bigint-count") || "0") + 1;
      sessionStorage.setItem("history-go-bigint-count", String(bigintCount));
      document.body.setAttribute("data-bigint-count", String(bigintCount));
      try {
        if (bigintCount === 1) {
          history.go(1n);
        }
        document.body.setAttribute("data-bigint-result", "ok");
      } catch (error) {
        document.body.setAttribute(
          "data-bigint-result",
          error && error.name ? error.name : String(error)
        );
      }
    </script>
  </body>
</html>
