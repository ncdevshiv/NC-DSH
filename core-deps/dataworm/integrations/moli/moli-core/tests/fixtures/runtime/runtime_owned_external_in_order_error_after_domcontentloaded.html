<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      window.runtimeOwnedInOrderErrorOrder = [];
      document.addEventListener("DOMContentLoaded", () => {
        window.runtimeOwnedInOrderErrorOrder.push("dcl");

        // Starting the request from this listener gives the fixture a causal
        // ordering boundary. A parser-time request with an immediate 404 races
        // DCL by design and cannot test the DCL snapshot deterministically.
        const script = document.createElement("script");
        script.async = false;
        script.src = "/assets/missing_runtime_owned_in_order_error.js";
        script.onerror = () => {
          window.runtimeOwnedInOrderErrorOrder.push("error");
          queueMicrotask(() => {
            window.runtimeOwnedInOrderErrorOrder.push("error-microtask");
          });
          window.runtimeOwnedInOrderErrorDuringError =
            window.runtimeOwnedInOrderErrorOrder.join(",");
        };
        document.head.appendChild(script);
        window.runtimeOwnedInOrderErrorOrder.push("after-append");
        window.runtimeOwnedInOrderErrorAfterDcl =
          window.runtimeOwnedInOrderErrorOrder.join(",");
        if (!location.search.includes("manual-release")) {
          void fetch(
            "/compat/runtime-owned-external-in-order-error-after-domcontentloaded-release",
          );
        }
      });
      window.addEventListener("load", () => {
        window.runtimeOwnedInOrderErrorOrder.push("window-load");
        window.runtimeOwnedInOrderErrorFinalOrder =
          window.runtimeOwnedInOrderErrorOrder.join(",");
      });
    </script>
  </head>
  <body>
    <main id="late">late</main>
  </body>
</html>
