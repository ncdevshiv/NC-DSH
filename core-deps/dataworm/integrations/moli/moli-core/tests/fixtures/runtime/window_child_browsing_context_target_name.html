<!doctype html>
<html>
  <body
    data-after-name=""
    data-after-id=""
    data-after-old-name=""
    data-after-new-name=""
    data-src-attr-after-name=""
    data-src-attr-after-id=""
    data-src-attr-after-new-name=""
  >
    <iframe
      id="frame-id"
      name="frame-a"
      srcdoc="<p id='child'>initial</p>"
    ></iframe>
    <a
      id="to-name"
      target="frame-a"
      href="/compat/window-child-browsing-context-target-name-a"
    ></a>
    <a
      id="to-id"
      target="frame-id"
      href="/compat/window-child-browsing-context-target-name-id"
    ></a>
    <a
      id="to-old-name"
      target="frame-a"
      href="/compat/window-child-browsing-context-target-name-old"
    ></a>
    <a
      id="to-new-name"
      target="frame-b"
      href="/compat/window-child-browsing-context-target-name-b"
    ></a>
    <script>
      const frame = document.querySelector('iframe');
      const text = () => frame.contentDocument?.body?.textContent?.trim() ?? 'null';

      document.getElementById('to-name').click();
      document.body.setAttribute('data-after-name', text());
      document.body.setAttribute(
        'data-src-attr-after-name',
        String(frame.getAttribute('src'))
      );

      document.getElementById('to-id').click();
      document.body.setAttribute('data-after-id', text());
      document.body.setAttribute(
        'data-src-attr-after-id',
        String(frame.getAttribute('src'))
      );

      frame.name = 'frame-b';

      document.getElementById('to-old-name').click();
      document.body.setAttribute('data-after-old-name', text());

      document.getElementById('to-new-name').click();
      document.body.setAttribute('data-after-new-name', text());
      document.body.setAttribute(
        'data-src-attr-after-new-name',
        String(frame.getAttribute('src'))
      );
    </script>
  </body>
</html>
