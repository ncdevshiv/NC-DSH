<!doctype html>
<html>
  <body>
    <script>
      window.moduleExportDestructuringOrder = [];
      document.addEventListener("DOMContentLoaded", () => {
        window.moduleExportDestructuringOrder.push("dcl");
      });
    </script>
    <script type="module">
      import {
        answer,
        title,
        first,
        second,
        count,
        left,
        tail
      } from "/assets/module-export-destructuring-bindings.mjs";

      window.moduleExportDestructuringOrder.push("module");
      window.moduleExportDestructuringImmediate =
        `${answer}:${title}:${first}:${second}:${count}:${left}:${tail.join("-")}`;

      setTimeout(() => {
        window.moduleExportDestructuringOrder.push("timeout");
        window.moduleExportDestructuringLater =
          `${count}:${left}:${tail.join("-")}`;
        window.moduleExportDestructuringFinalOrder =
          window.moduleExportDestructuringOrder.join(",");
      }, 0);
    </script>
  </body>
</html>
