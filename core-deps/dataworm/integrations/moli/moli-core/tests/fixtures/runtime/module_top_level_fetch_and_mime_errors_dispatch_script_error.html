<!doctype html>
<html>
  <head>
    <title>module top-level fetch and mime errors</title>
    <script>
      window.moduleTopLevelFailureEvents = [];
      window.addEventListener("error", () => {
        window.moduleTopLevelFailureEvents.push("window-error");
      });
    </script>
    <script
      type="module"
      src="/assets/missing_top_level_module_error.mjs"
      onerror="window.moduleTopLevelFailureEvents.push('missing-error');"
      onload="window.moduleTopLevelFailureEvents.push('missing-load');"
    ></script>
    <script
      type="module"
      src="/assets/module_wrong_mime.css"
      onerror="window.moduleTopLevelFailureEvents.push('mime-error');"
      onload="window.moduleTopLevelFailureEvents.push('mime-load');"
    ></script>
    <script type="module">
      window.moduleTopLevelFailureEvents.push("later-module");
      window.moduleTopLevelFailureFinalEvents =
        window.moduleTopLevelFailureEvents.join(",");
    </script>
  </head>
  <body>
    <main>module top-level fetch and mime errors</main>
  </body>
</html>
