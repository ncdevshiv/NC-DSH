<!doctype html>
<html>
  <body>
    <script>
      const worker = new Worker('./window-child-browsing-context-worker-relay-worker.js');
      worker.onmessage = (event) => parent.postMessage(event.data, '*');
      worker.onerror = (event) => {
        parent.postMessage({
          message: 'worker-error',
          pathname: event.filename || '',
        }, '*');
      };
    </script>
  </body>
</html>
