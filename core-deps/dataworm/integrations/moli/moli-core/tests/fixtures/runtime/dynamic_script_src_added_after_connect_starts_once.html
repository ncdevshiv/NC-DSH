<!doctype html>
<html>
  <head>
    <script>
      window.dynamicInOrderScriptOrder = [];
      window.dynamicSrcAddedLoads = 0;

      const script = document.createElement("script");
      script.async = false;
      script.onload = () => {
        window.dynamicSrcAddedLoads += 1;
      };

      document.head.appendChild(script);
      script.src = "/assets/dynamic_taxonomy_in_order_fast.js";
    </script>
  </head>
  <body>
    <script>
      testing.eventually(() => {
        testing.expectEqual(1, window.dynamicSrcAddedLoads);
        testing.expectEqual(
          "in-order-fast",
          window.dynamicInOrderScriptOrderResult,
        );
      });
    </script>
  </body>
</html>
