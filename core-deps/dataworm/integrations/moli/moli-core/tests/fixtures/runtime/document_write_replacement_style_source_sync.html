<!doctype html>
<html>
<head>
  <script>
    document.open();
    document.write(`<!doctype html><html><head><style>#target { display: block; }</style></head><body><span id="target">target</span><script>
      window.documentWriteReplacementStyleDisplay = getComputedStyle(document.getElementById("target")).display;
      document.body.setAttribute("data-style-display", window.documentWriteReplacementStyleDisplay);
    <\/script></body></html>`);
    document.close();
  </script>
</head>
<body>
  <span id="stale">stale</span>
</body>
</html>
