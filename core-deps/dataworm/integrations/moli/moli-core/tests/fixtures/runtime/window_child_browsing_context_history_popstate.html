<!doctype html>
<html>
  <body>
    <iframe id="child" src="/compat/window-child-browsing-context-target-name-a"></iframe>
    <script>
      const iframe = document.getElementById('child');
      const topHrefBefore = window.location.href;
      const topHistoryBefore = window.history.length;

      iframe.addEventListener(
        'load',
        () => {
          const childWindow = iframe.contentWindow;

          childWindow.addEventListener('popstate', (event) => {
            document.body.setAttribute(
              'data-child-popstate',
              String(event.state?.step ?? 'null')
            );
            document.body.setAttribute(
              'data-child-popstate-href',
              childWindow.location.href
            );
          });

          childWindow.history.pushState({ step: 1 }, '', '#one');
          childWindow.history.pushState({ step: 2 }, '', '#two');
          childWindow.history.back();

          document.body.setAttribute(
            'data-top-location-unchanged',
            String(window.location.href === topHrefBefore)
          );
          document.body.setAttribute(
            'data-top-history-unchanged',
            String(window.history.length === topHistoryBefore)
          );
          document.body.setAttribute(
            'data-child-history-state-sync',
            String(childWindow.history.state?.step ?? 'null')
          );
          document.body.setAttribute(
            'data-child-location-href-sync',
            childWindow.location.href
          );

          setTimeout(() => {
            document.body.setAttribute(
              'data-child-history-state-timeout',
              String(childWindow.history.state?.step ?? 'null')
            );
            document.body.setAttribute(
              'data-child-location-href-timeout',
              childWindow.location.href
            );
            document.body.setAttribute(
              'data-child-document-location-href-timeout',
              childWindow.document.location.href
            );
          }, 50);
        },
        { once: true }
      );
    </script>
  </body>
</html>
