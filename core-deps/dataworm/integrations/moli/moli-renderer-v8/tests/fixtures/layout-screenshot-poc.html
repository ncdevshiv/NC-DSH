<!doctype html><html><head><style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: rgb(255, 255, 255); }
body { width: 800px; }
#cards { display: flex; flex-direction: row; width: 300px; height: 120px; }
.card { flex: 0 0 auto; width: 100px; height: 40px; }
#red { background: rgb(240, 40, 40); }
#green { background: rgb(40, 200, 80); }
#blue { background: rgb(40, 100, 240); }
#mixed { width: 300px; }
#inline-start, #inline-end { display: inline-block; width: 60px; height: 20px; }
#inline-start { background: rgb(250, 200, 30); }
#middle { display: block; width: 80px; height: 20px; background: rgb(30, 190, 210); }
#inline-end { background: rgb(210, 40, 180); }
#pseudo { width: 100px; height: 40px; }
#pseudo::before { content: ""; display: block; width: 40px; height: 20px; background: rgb(240, 130, 20); }
#pseudo::after { content: "tail"; display: block; width: 40px; height: 20px; background: rgb(100, 50, 180); }
#paint { position: relative; width: 240px; height: 100px; border: 8px solid rgb(15, 25, 35); overflow: hidden; background: rgb(230, 230, 230); }
#paint-low, #paint-high, #clip-child, #paint-label { position: absolute; }
#paint-low { left: 20px; top: 20px; width: 70px; height: 45px; z-index: -1; background: rgb(210, 60, 50); }
#paint-high { left: 40px; top: 30px; width: 70px; height: 45px; z-index: 2; background: rgb(30, 170, 90); }
#clip-child { left: 210px; top: 60px; width: 80px; height: 20px; background: rgb(245, 140, 25); }
#paint-label { left: 110px; top: 10px; width: 90px; height: 30px; color: rgb(10, 10, 10); font-size: 20px; line-height: 24px; }
</style></head><body><section id="cards"><div class="card" id="red"></div><div class="card" id="green"></div><div class="card" id="blue"></div></section><section id="mixed"><span id="inline-start">start</span><div id="middle"></div><span id="inline-end">end</span></section><div id="pseudo"></div><section id="paint"><div id="paint-high"></div><div id="paint-low"></div><div id="clip-child"></div><div id="paint-label">Text</div></section></body></html>
