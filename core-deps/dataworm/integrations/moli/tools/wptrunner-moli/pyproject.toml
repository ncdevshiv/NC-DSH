[project]
name = "wptrunner-moli"
version = "0.1.0"
description = "Moli product plugin for upstream WPT wptrunner"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"

[project.entry-points."wptrunner.products"]
moli = "moli_wptrunner.product:get_product"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moli_wptrunner"]
