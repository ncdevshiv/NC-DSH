<!doctype html>
<meta charset="utf-8">
<body></body>
<script>
const STORAGE_PREFIX = "__lm_wpt_form_self_target_basic__";

function key(suffix) {
  return STORAGE_PREFIX + suffix;
}

for (const suffix of ["submitCount", "submittedTarget"]) {
  sessionStorage.removeItem(key(suffix));
}

const sameNamedFrame = document.createElement("iframe");
sameNamedFrame.name = "_self";
document.body.appendChild(sameNamedFrame);

const form = document.createElement("form");
form.target = "_self";
form.action = "resources/form-self-target-report.html";
form.addEventListener("submit", function () {
  const count = Number(sessionStorage.getItem(key("submitCount")) ?? "0") + 1;
  sessionStorage.setItem(key("submitCount"), String(count));
});

const hiddenTarget = document.createElement("input");
hiddenTarget.type = "hidden";
hiddenTarget.name = "target";
hiddenTarget.value = "_self";
form.appendChild(hiddenTarget);

const submitter = document.createElement("button");
submitter.type = "submit";
submitter.name = "submitter";
submitter.value = "button";
form.appendChild(submitter);

document.body.appendChild(form);
submitter.click();
</script>
