<!doctype html>
<meta charset="utf-8">
<body>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function textInput(value, pattern) {
  const input = document.createElement("input");
  input.type = "text";
  input.value = value;
  input.pattern = pattern;
  document.body.appendChild(input);
  return input;
}

function assertPatternMatch(value, pattern, description) {
  const input = textInput(value, pattern);
  assert_false(input.validity.patternMismatch, description);
  assert_true(input.validity.valid, description + " keeps the control valid");
}

function assertPatternMismatch(value, pattern, description) {
  const input = textInput(value, pattern);
  assert_true(input.validity.patternMismatch, description);
  assert_false(input.validity.valid, description + " makes the control invalid");
}

test(function () {
  assertPatternMatch("a[b", "a\\[b", "escaped opening bracket should match literally");
  assertPatternMatch("a]b", "a\\]b", "escaped closing bracket should match literally");
  assertPatternMismatch("ab", "a\\[b", "escaped bracket pattern should still require the literal bracket");
}, "patternMismatch supports escaped literal bracket punctuators");

test(function () {
  assertPatternMatch("a/b", "a\\/b", "escaped slash should match literally");
  assertPatternMismatch("ab", "a\\/b", "escaped slash pattern should still require the literal slash");
}, "patternMismatch supports escaped literal slash punctuators");

test(function () {
  assertPatternMatch("a|b", "a\\|b", "escaped vertical bar should match literally");
  assertPatternMismatch("a", "a\\|b", "escaped vertical bar should not act as alternation");
  assertPatternMismatch("b", "a\\|b", "escaped vertical bar should require the surrounding literals");
}, "patternMismatch supports escaped literal vertical bar punctuators");

test(function () {
  const punctuators = [
    "(", ")", "[", "]", "{", "}", "/", "|",
  ];
  for (const punctuator of punctuators) {
    const pattern = "a\\" + punctuator + "b";
    assertPatternMatch(
      "a" + punctuator + "b",
      pattern,
      "escaped " + punctuator + " should match as a literal punctuator",
    );
    assertPatternMismatch(
      "ab",
      pattern,
      "escaped " + punctuator + " should still require the literal punctuator",
    );
  }
}, "patternMismatch supports the full escaped v-flag reserved punctuator set");

test(function () {
  const invalidEscapedPunctuators = [
    "!", "#", "%", "&", ",", ":", ";", "<", "=", ">", "@", "`", "~",
  ];
  for (const punctuator of invalidEscapedPunctuators) {
    const input = textInput("ab", "a\\" + punctuator + "b");
    assert_false(
      input.validity.patternMismatch,
      "invalid escaped " + punctuator + " pattern syntax should be ignored",
    );
    assert_true(
      input.validity.valid,
      "ignored invalid escaped " + punctuator + " pattern should not make the control invalid",
    );
  }
}, "invalid escaped v-flag double-punctuator pattern syntax remains ignored");
</script>
