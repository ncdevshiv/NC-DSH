<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function websocket_url(path) {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  return scheme + "//" + location.host + path;
}

function byte_array(buffer) {
  return Array.from(new Uint8Array(buffer));
}

function next_message_or_error(socket) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      socket.removeEventListener("message", onmessage);
      socket.removeEventListener("error", onerror);
    }
    function onmessage(event) {
      cleanup();
      resolve(event);
    }
    function onerror(event) {
      cleanup();
      reject(new Error("WebSocket error before message: " + event.type));
    }
    socket.addEventListener("message", onmessage);
    socket.addEventListener("error", onerror);
  });
}

function wait_for_close(socket) {
  return new Promise(function (resolve) {
    socket.addEventListener("close", resolve, { once: true });
  });
}

async function open_echo_socket(binaryType) {
  const socket = new WebSocket(websocket_url("/wpt/runtime/websocket/echo"));
  socket.binaryType = binaryType;
  await new Promise(function (resolve, reject) {
    socket.addEventListener("open", resolve, { once: true });
    socket.addEventListener("error", reject, { once: true });
  });
  return socket;
}

async function echo_binary_payload(binaryType, payload) {
  const socket = await open_echo_socket(binaryType);
  const message = next_message_or_error(socket);
  socket.send(payload);
  const event = await message;
  const closed = wait_for_close(socket);
  socket.close(1000, "binary");
  await closed;
  return event.data;
}

promise_test(async function () {
  const payload = new Uint8Array([0, 255, 128, 65]).buffer;
  const data = await echo_binary_payload("arraybuffer", payload);
  assert_true(data instanceof ArrayBuffer, "binaryType=arraybuffer should expose ArrayBuffer data");
  assert_array_equals(byte_array(data), [0, 255, 128, 65], "ArrayBuffer payload bytes should round-trip");
}, "WebSocket binaryType=arraybuffer receives echoed ArrayBuffer bytes");

promise_test(async function () {
  const backing = new Uint8Array([9, 1, 2, 3, 8]);
  const data = await echo_binary_payload("arraybuffer", backing.subarray(1, 4));
  assert_true(data instanceof ArrayBuffer, "typed-array echo should still expose ArrayBuffer data");
  assert_array_equals(byte_array(data), [1, 2, 3], "TypedArray view byte range should be sent without surrounding bytes");
}, "WebSocket.send() preserves ArrayBufferView byte offsets for binary frames");

promise_test(async function () {
  const payload = new Blob([new Uint8Array([5, 0, 250])], { type: "application/octet-stream" });
  const data = await echo_binary_payload("blob", payload);
  assert_true(data instanceof Blob, "binaryType=blob should expose Blob data");
  assert_array_equals(byte_array(await data.arrayBuffer()), [5, 0, 250], "Blob payload bytes should round-trip");
}, "WebSocket binaryType=blob receives echoed Blob bytes");
</script>
