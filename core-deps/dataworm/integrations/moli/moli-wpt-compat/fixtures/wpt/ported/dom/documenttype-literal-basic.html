<!DOCTYPE html PUBLIC "STAFF" "staffNS.dtd">
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function() {
  const doctype = document.firstChild;
  assert_true(doctype instanceof DocumentType);
  assert_equals(doctype, document.doctype);
  assert_equals(doctype.name, "html");
  assert_equals(doctype.publicId, "STAFF");
  assert_equals(doctype.systemId, "staffNS.dtd");
}, "parser-created DocumentType preserves public and system identifiers");
</script>
