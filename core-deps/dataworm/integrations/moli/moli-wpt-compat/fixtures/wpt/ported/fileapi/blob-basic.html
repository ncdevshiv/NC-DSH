<script>
function assert_throws_name(expectedName, callback, description) {
  let error = null;
  try {
    callback();
  } catch (caught) {
    error = caught;
  }
  assert_true(error !== null, (description || "assert_throws_name") + ": expected an exception");
  assert_equals(error.name, expectedName, (description || "assert_throws_name") + ": unexpected exception name");
}

promise_test(async function () {
  const blob = new Blob(["hello ", new Uint8Array([0xe2, 0x99, 0xa5])], {
    type: "TEXT/PLAIN;charset=UTF-8",
  });

  assert_true(blob instanceof Blob);
  assert_equals(blob.size, 9);
  assert_equals(blob.type, "text/plain;charset=utf-8");
  assert_equals(await blob.text(), "hello \u2665");
}, "Blob constructor preserves bytes, size, type, and text output");

test(function () {
  const blob = new Blob(["hello"], { type: "text/plain" });

  for (const name of ["size", "type"]) {
    assert_equals(
      Object.getOwnPropertyDescriptor(blob, name),
      undefined,
      "Blob." + name + " should not be installed as an own data property",
    );
    const descriptor = Object.getOwnPropertyDescriptor(Blob.prototype, name);
    assert_equals(typeof descriptor.get, "function", "Blob." + name + " prototype getter");
    assert_equals(descriptor.set, undefined, "Blob." + name + " should be readonly");
    assert_true(descriptor.enumerable, "Blob." + name + " prototype descriptor should be enumerable");
    assert_true(descriptor.configurable, "Blob." + name + " prototype descriptor should be configurable");
  }
}, "Blob size and type are prototype accessors");

promise_test(async function () {
  const blob = new Blob([new Uint8Array([65, 66, 67])]);
  const bytes = new Uint8Array(await blob.arrayBuffer());

  assert_array_equals(Array.from(bytes), [65, 66, 67]);
}, "Blob.arrayBuffer returns the underlying byte sequence");

promise_test(async function () {
  const blob = new Blob(["abcdef"], { type: "text/plain" });
  const slice = blob.slice(1, 4, "Text/HTML");

  assert_true(slice instanceof Blob);
  assert_equals(slice.size, 3);
  assert_equals(slice.type, "text/html");
  assert_equals(await slice.text(), "bcd");
}, "Blob.slice creates a typed byte-range Blob");

test(function () {
  assert_equals(new Blob(["x"], undefined).type, "");
  assert_equals(new Blob(["x"], null).type, "");
  assert_equals(new Blob(["x"], {}).type, "");
  assert_equals(new Blob(["x"], { type: undefined }).type, "");
  assert_equals(new Blob(["x"], { type: null }).type, "null");
  assert_equals(new Blob(["x"], { type: "TEXT/PLAIN;Charset=UTF-8" }).type, "text/plain;charset=utf-8");
  assert_equals(new Blob(["x"], { type: "text/plain\u0001bad" }).type, "");
  assert_equals(new Blob(["x"], { type: "text/pla\u0100in" }).type, "");
  assert_throws_name("TypeError", function () {
    new Blob(["x"], { type: Symbol() });
  }, "Symbol type member must fail DOMString conversion");
  assert_throws_name("TypeError", function () {
    new Blob(["x"], Symbol());
  }, "Symbol options must fail dictionary conversion");
}, "BlobPropertyBag.type follows WebIDL DOMString conversion before MIME normalization");

promise_test(async function () {
  const blob = new Blob(["stream"]);
  const reader = blob.stream().getReader();
  const first = await reader.read();

  assert_false(first.done);
  assert_array_equals(Array.from(first.value), [115, 116, 114, 101, 97, 109]);
}, "Blob.stream reader yields the Blob bytes");
</script>
