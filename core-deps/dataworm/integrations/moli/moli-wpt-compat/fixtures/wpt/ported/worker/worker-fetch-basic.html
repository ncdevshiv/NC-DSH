<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function next_message(worker) {
  return new Promise(function (resolve) {
    worker.addEventListener("message", resolve, { once: true });
  });
}

promise_test(async function () {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-fetch.js",
    location.href,
  ).href;
  const targetUrl = new URL(
    "/wpt/ported/worker/resources/fetch-target.js",
    location.href,
  ).href;
  const worker = new Worker(workerUrl);

  try {
    const message = await next_message(worker);
    assert_equals(message.data.error, undefined, "worker fetch should not reject");
    assert_true(message.data.ok, "worker fetch should resolve an OK response");
    assert_equals(message.data.status, 200, "worker fetch status");
    assert_equals(
      message.data.url,
      targetUrl,
      "worker fetch should resolve relative URLs against the worker script URL",
    );
    assert_equals(message.data.text, "hello from worker fetch", "worker fetch response text");
    assert_true(message.data.objectOk, "worker fetch object input should resolve OK");
    assert_equals(
      message.data.objectUrl,
      targetUrl,
      "worker fetch object input should use WebIDL stringification",
    );
    assert_equals(
      message.data.objectText,
      "hello from worker fetch",
      "worker fetch object input response text",
    );
    assert_equals(message.data.missingInputName, "TypeError", "missing fetch input rejects");
    assert_true(
      message.data.missingInputMessage.includes("Argument 1") &&
        message.data.missingInputMessage.includes("required"),
      "missing fetch input should use WebIDL required-argument error",
    );
    assert_equals(message.data.badPortName, "TypeError", "bad-port fetch rejects");
    assert_true(
      message.data.badPortMessage.includes("blocked bad port"),
      "bad-port fetch should reject before network I/O",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated workers resolve fetch() and reject WebAPI input/network errors");
</script>
