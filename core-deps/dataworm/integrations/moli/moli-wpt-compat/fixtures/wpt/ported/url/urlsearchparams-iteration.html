<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const params = new URLSearchParams("b=2&a=1&a=3");
  assert_array_equals(Array.from(params.keys()), ["b", "a", "a"]);
  assert_array_equals(Array.from(params.values()), ["2", "1", "3"]);
  assert_array_equals(Array.from(params.entries()).map(pair => pair.join("=")), ["b=2", "a=1", "a=3"]);

  const visited = [];
  params.forEach(function (value, key, object) {
    assert_true(object === params);
    visited.push(key + "=" + value);
  });
  assert_array_equals(visited, ["b=2", "a=1", "a=3"]);

  params.sort();
  assert_equals(params.toString(), "a=1&a=3&b=2");
}, "URLSearchParams exposes keys, values, entries, forEach, and stable sort");

test(function () {
  const url = new URL("https://example.test/path?b=2&a=1");
  url.searchParams.append("a", "3");
  assert_equals(url.href, "https://example.test/path?b=2&a=1&a=3");
  url.searchParams.sort();
  assert_equals(url.href, "https://example.test/path?a=1&a=3&b=2");
}, "URL.searchParams mutations update the owning URL query");

test(function () {
  const url = new URL("https://example.test/path?utf8=caf%C3%A9");
  assert_equals(url.searchParams.get("utf8"), "café");

  url.searchParams.append("emoji", "😀");
  assert_equals(
    url.href,
    "https://example.test/path?utf8=caf%C3%A9&emoji=%F0%9F%98%80",
  );

  url.searchParams.set("\uD800", "\uDC00");
  assert_equals(url.searchParams.get("\uFFFD"), "\uFFFD");
  assert_equals(
    url.href,
    "https://example.test/path?utf8=caf%C3%A9&emoji=%F0%9F%98%80&%EF%BF%BD=%EF%BF%BD",
  );
}, "URL.searchParams preserves UTF-8 and USVString replacement when updating owning URLs");

test(function () {
  const url = new URL(
    "https://example.test/path?utf8=caf%C3%A9&emoji=%F0%9F%98%80&emoji=text&%EF%BF%BD=%EF%BF%BD&flag=undefined&flag=keep",
  );
  assert_true(url.searchParams.has("utf8", "café"));
  assert_false(url.searchParams.has("utf8", "cafe"));
  assert_true(url.searchParams.has("emoji", "😀"));
  assert_true(url.searchParams.has("emoji", "text"));
  assert_false(url.searchParams.has("emoji", "missing"));
  assert_true(url.searchParams.has("\uD800", "\uDC00"));
  assert_false(url.searchParams.has("\uD800", "literal"));
  assert_true(url.searchParams.has("flag", undefined));

  url.searchParams.delete("flag", undefined);
  assert_equals(
    url.href,
    "https://example.test/path?utf8=caf%C3%A9&emoji=%F0%9F%98%80&emoji=text&%EF%BF%BD=%EF%BF%BD",
  );

  url.searchParams.delete("emoji", "😀");
  assert_equals(
    url.href,
    "https://example.test/path?utf8=caf%C3%A9&emoji=text&%EF%BF%BD=%EF%BF%BD",
  );

  url.searchParams.delete("\uD800");
  assert_equals(
    url.href,
    "https://example.test/path?utf8=caf%C3%A9&emoji=text",
  );

  url.searchParams.delete("utf8");
  assert_equals(url.href, "https://example.test/path?emoji=text");
}, "URL.searchParams has and delete keep owning URL optional value query updates synchronized");
</script>
