<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
async function assert_rejects_name(expectedName, promise, description) {
  try {
    await promise;
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected rejection");
}

function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected exception");
}

promise_test(async function () {
  const response = new Response("hello", {
    status: 201,
    statusText: "Created",
    headers: [["Content-Type", "text/plain"]],
  });
  assert_equals(response.status, 201);
  assert_equals(response.statusText, "Created");
  assert_true(response.ok);
  assert_equals(response.headers.get("content-type"), "text/plain");
  assert_false(response.bodyUsed);
  assert_equals(await response.text(), "hello");
  assert_true(response.bodyUsed);
  await assert_rejects_name("TypeError", response.text(), "Response body should only be consumed once");
  assert_throws_name("TypeError", function () {
    response.clone();
  }, "Response.clone() should reject a consumed body");
}, "Response constructor stores status, headers, ok, and text body");

test(function () {
  assert_throws_name("RangeError", function () {
    new Response(null, { status: 199 });
  }, "Response constructor should reject status values below 200");
  assert_throws_name("RangeError", function () {
    new Response(null, { status: 600 });
  }, "Response constructor should reject status values above 599");

  for (const status of [204, 205, 304]) {
    assert_throws_name("TypeError", function () {
      new Response("body", { status });
    }, "Response constructor should reject body with null-body status " + status);
  }

  const noContent = new Response(null, { status: 204 });
  assert_equals(noContent.status, 204);
  assert_true(noContent.ok);
  assert_equals(noContent.body, null);
}, "Response constructor validates status and null-body status combinations");

test(function () {
  assert_throws_name("TypeError", function () {
    new Response(null, { statusText: "line\nbreak" });
  }, "Response constructor should reject LF in statusText");
  assert_throws_name("TypeError", function () {
    new Response(null, { statusText: "line\rbreak" });
  }, "Response constructor should reject CR in statusText");
  assert_throws_name("TypeError", function () {
    new Response(null, { statusText: "\u0100" });
  }, "Response constructor should reject non-ByteString statusText");
  assert_throws_name("TypeError", function () {
    Response.json({}, { statusText: "line\nbreak" });
  }, "Response.json() should reject invalid statusText through ResponseInit");

  const response = new Response(null, { statusText: "OK\tfine" });
  assert_equals(response.statusText, "OK\tfine");
}, "Response constructor validates statusText as a ByteString reason phrase");

test(function () {
  assert_throws_name("TypeError", function () {
    new Response(null, 1);
  }, "Response constructor should reject non-object ResponseInit");
  assert_throws_name("TypeError", function () {
    Response.json({}, 1);
  }, "Response.json should reject non-object ResponseInit");

  const statusObject = {
    valueOf() {
      return 202;
    },
  };
  const response = new Response(null, {
    status: statusObject,
    statusText: { toString() { return "Accepted"; } },
    headers: { "X-Init": { toString() { return "yes"; } } },
  });
  assert_equals(response.status, 202);
  assert_equals(response.statusText, "Accepted");
  assert_equals(response.headers.get("x-init"), "yes");

  assert_throws_name("RangeError", function () {
    new Response(null, { status: null });
  }, "ResponseInit.status null uses unsigned short conversion before range validation");
}, "ResponseInit uses WebIDL dictionary conversion for status, statusText, and headers");

promise_test(async function () {
  const response = Response.json({ ok: true }, { status: 202 });
  assert_true(response instanceof Response);
  assert_equals(response.status, 202);
  assert_equals(response.headers.get("content-type"), "application/json");
  const data = await response.json();
  assert_true(data.ok);

  const error = Response.error();
  assert_equals(error.type, "error");
  assert_equals(error.status, 0);
  assert_false(error.ok);

  const redirect = Response.redirect("https://example.test/next", 301);
  assert_equals(redirect.status, 301);
  assert_equals(redirect.headers.get("location"), "https://example.test/next");
  assert_equals(Response.redirect("https://example.test/default").status, 302);
  assert_equals(Response.redirect("https://example.test/string-status", "303").status, 303);

  assert_throws_name("RangeError", function () {
    Response.redirect("https://example.test/bad", 200);
  }, "Response.redirect() should reject non-redirect statuses");
  assert_throws_name("TypeError", function () {
    Response.redirect();
  }, "Response.redirect() should require a URL argument");
  assert_throws_name("TypeError", function () {
    Response.redirect(Symbol("url"));
  }, "Response.redirect() should parse URL through WebIDL USVString conversion");
  assert_throws_name("TypeError", function () {
    Response.redirect("https://example.test/bad-status", Symbol("status"));
  }, "Response.redirect() should parse status through WebIDL unsigned short conversion");
}, "Response static constructors create minimal Response instances");
</script>
