<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function next_message(worker) {
  return new Promise(function (resolve, reject) {
    worker.addEventListener("message", resolve, { once: true });
    worker.addEventListener("error", function (event) {
      reject(new Error("Worker error: " + event.message));
    }, { once: true });
  });
}

promise_test(async function () {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-dynamic-import-main.js",
    location.href
  ).href;
  const awaitedUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-dynamic-import-awaited.js",
    location.href
  ).href;
  const promisedUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-dynamic-import-promised.js",
    location.href
  ).href;
  const queryOneUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-query-dep.js?case=dynamic-one",
    location.href
  ).href;
  const queryTwoUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-query-dep.js?case=dynamic-two",
    location.href
  ).href;
  const fragmentOneUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-fragment-dep.js#dynamic-one",
    location.href
  ).href;
  const fragmentTwoUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-fragment-dep.js#dynamic-two",
    location.href
  ).href;
  const worker = new Worker(workerUrl, { type: "module" });

  try {
    const message = await next_message(worker);
    assert_equals(message.data.error, undefined, "HTTP dynamic import module worker should not fail");
    assert_equals(message.data.awaitedAnswer, 42, "await import() should expose HTTP named exports");
    assert_equals(message.data.awaitedDefault, "http-dynamic-default", "await import() should expose HTTP default exports");
    assert_equals(message.data.promisedAnswer, 7, "bare import() should resolve to an HTTP namespace promise");
    assert_equals(message.data.promisedDefault, "http-promise-default", "bare import() should resolve HTTP default exports");
    assert_equals(message.data.templateAnswer, 42, "template-literal import() should expose HTTP named exports");
    assert_equals(message.data.concatenatedDefault, "http-dynamic-default", "static-concat import() should expose HTTP default exports");
    assert_equals(message.data.dotSegmentAnswer, 42, "dot-segment import() should expose HTTP named exports");
    assert_equals(message.data.dotSegmentUrl, awaitedUrl, "dot-segment import() should normalize to the dependency URL");
    assert_equals(message.data.optionsAnswer, 7, "import() with an options bag should resolve HTTP named exports");
    assert_equals(message.data.resolved, awaitedUrl, "import.meta.resolve() should resolve relative HTTP specifiers");
    assert_equals(message.data.resolvedTemplate, awaitedUrl, "template-literal import.meta.resolve() should resolve relative HTTP specifiers");
    assert_equals(message.data.resolvedConcatenated, awaitedUrl, "static-concat import.meta.resolve() should resolve relative HTTP specifiers");
    assert_equals(message.data.resolvedDotSegment, awaitedUrl, "import.meta.resolve() should normalize dot segments in dynamic dependency specifiers");
    assert_equals(message.data.resolvedQueryOne, queryOneUrl, "import.meta.resolve() should preserve query strings for dynamic import dependencies");
    assert_equals(message.data.resolvedQueryTwo, queryTwoUrl, "import.meta.resolve() should distinguish dynamic import dependency query strings");
    assert_equals(message.data.resolvedFragmentOne, fragmentOneUrl, "import.meta.resolve() should preserve fragments for dynamic import dependencies");
    assert_equals(message.data.resolvedFragmentTwo, fragmentTwoUrl, "import.meta.resolve() should distinguish dynamic import dependency fragments");
    assert_equals(message.data.promisedUrl, promisedUrl, "dynamic import dependency import.meta.url should expose its HTTP URL");
    assert_equals(message.data.queryOneUrl, queryOneUrl, "first query dynamic import should preserve its URL");
    assert_equals(message.data.sameQueryOneUrl, queryOneUrl, "duplicate query dynamic import should share the same module URL");
    assert_equals(message.data.queryTwoUrl, queryTwoUrl, "different query dynamic import should preserve its URL");
    assert_equals(message.data.queryOneFirst, 1, "first query dynamic import should start at its own counter");
    assert_equals(message.data.queryOneSecond, 2, "same query dynamic import should reuse the first module record");
    assert_equals(message.data.sameQueryOneCounter, 2, "duplicate query dynamic import namespace should observe the shared live binding");
    assert_equals(message.data.queryTwoFirst, 1, "different query dynamic import should get an independent module record");
    assert_equals(message.data.queryTwoCounter, 1, "different query dynamic import state should stay independent");
    assert_equals(message.data.fragmentOneUrl, fragmentOneUrl, "first fragment dynamic import should preserve its URL");
    assert_equals(message.data.sameFragmentOneUrl, fragmentOneUrl, "duplicate fragment dynamic import should share the same module URL");
    assert_equals(message.data.fragmentTwoUrl, fragmentTwoUrl, "different fragment dynamic import should preserve its URL");
    assert_equals(message.data.fragmentOneFirst, 1, "first fragment dynamic import should start at its own counter");
    assert_equals(message.data.fragmentOneSecond, 2, "same fragment dynamic import should reuse the first module record");
    assert_equals(message.data.sameFragmentOneCounter, 2, "duplicate fragment dynamic import namespace should observe the shared live binding");
    assert_equals(message.data.fragmentTwoFirst, 1, "different fragment dynamic import should get an independent module record");
    assert_equals(message.data.fragmentTwoCounter, 1, "different fragment dynamic import state should stay independent");
    assert_equals(message.data.metaUrl, workerUrl, "main module import.meta.url should expose the HTTP worker script URL");
    assert_equals(message.data.importScriptsType, "function", "module workers should expose WorkerGlobalScope.importScripts");
  } finally {
    worker.terminate();
  }
}, "Dedicated module workers support relative HTTP dynamic import and import.meta.resolve");
</script>
