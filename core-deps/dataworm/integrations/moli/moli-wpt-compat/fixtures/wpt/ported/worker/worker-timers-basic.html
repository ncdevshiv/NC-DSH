<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_message(worker) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
    }

    function onmessage(event) {
      cleanup();
      resolve(event);
    }

    function onerror(event) {
      cleanup();
      reject(new Error("unexpected worker error: " + event.message));
    }

    worker.addEventListener("message", onmessage);
    worker.addEventListener("error", onerror);
  });
}

promise_test(async function () {
  const worker = new Worker(
    worker_url([
      "setTimeout(function () {",
      "  postMessage('delayed');",
      "  close();",
      "}, 20);",
    ].join("\n")),
  );

  try {
    const event = await next_message(worker);
    assert_equals(event.data, "delayed", "setTimeout should run the callback asynchronously");
  } finally {
    worker.terminate();
  }
}, "Dedicated worker setTimeout schedules asynchronous callbacks");

promise_test(async function () {
  const worker = new Worker(
    worker_url([
      "setTimeout(function (a, b) {",
      "  postMessage(a + b);",
      "  close();",
      "}, 20, 3, 4);",
    ].join("\n")),
  );

  try {
    const event = await next_message(worker);
    assert_equals(event.data, 7, "setTimeout should pass trailing arguments to the callback");
  } finally {
    worker.terminate();
  }
}, "Dedicated worker setTimeout forwards callback arguments");

promise_test(async function () {
  const worker = new Worker(
    worker_url([
      "const id = setTimeout(function () {",
      "  postMessage('should not fire');",
      "}, 40);",
      "clearTimeout(id);",
      "setTimeout(function () {",
      "  postMessage('ok');",
      "  close();",
      "}, 80);",
    ].join("\n")),
  );

  try {
    const event = await next_message(worker);
    assert_equals(event.data, "ok", "clearTimeout should prevent the canceled timer from firing");
  } finally {
    worker.terminate();
  }
}, "Dedicated worker clearTimeout cancels pending timers");

promise_test(async function () {
  const worker = new Worker(
    worker_url([
      "const id = setTimeout(function () {",
      "  postMessage('should not fire');",
      "}, 80);",
      "setTimeout(function () {",
      "  clearTimeout(id);",
      "  setTimeout(function () {",
      "    postMessage('ok');",
      "    close();",
      "  }, 20);",
      "}, 10);",
    ].join("\n")),
  );

  try {
    const event = await next_message(worker);
    assert_equals(
      event.data,
      "ok",
      "clearTimeout should still cancel a timer after the event loop has already advanced",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated worker clearTimeout can cancel an already-scheduled active timer");

promise_test(async function () {
  const worker = new Worker(
    worker_url([
      "let count = 0;",
      "const id = setInterval(function () {",
      "  count += 1;",
      "  postMessage(count);",
      "  if (count >= 3) {",
      "    clearInterval(id);",
      "    close();",
      "  }",
      "}, 20);",
    ].join("\n")),
  );

  try {
    const first = await next_message(worker);
    const second = await next_message(worker);
    const third = await next_message(worker);
    assert_array_equals(
      [first.data, second.data, third.data],
      [1, 2, 3],
      "setInterval should keep firing until cleared inside the worker",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated worker setInterval keeps dispatching until clearInterval");
</script>
