<!doctype html>
<meta charset="utf-8">
<body>
  <div id="scope-root"><h1 id="test"></h1><p id="para"><span>hello</span></p></div>
</body>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const div = document.getElementById("scope-root");
const p = document.getElementById("para");

test(function () {
  assert_equals(div.querySelector(":scope > p"), p);
  assert_equals(div.querySelector(":scope > span"), null);
}, "querySelector() supports :scope direct-child matching");

test(function () {
  assert_equals(div.querySelector("#test + p"), p);
  assert_equals(p.querySelector("#test + p"), null);
}, "querySelector() keeps sibling selectors scoped to the query root");

test(function () {
  assert_array_equals(Array.from(div.querySelectorAll(":scope > p")), [p]);
  assert_array_equals(Array.from(div.querySelectorAll(":scope > span")), []);
}, "querySelectorAll() supports :scope direct-child matching");

test(function () {
  assert_array_equals(Array.from(div.querySelectorAll("#test + p")), [p]);
  assert_array_equals(Array.from(p.querySelectorAll("#test + p")), []);
}, "querySelectorAll() keeps sibling selectors scoped to the query root");
</script>
