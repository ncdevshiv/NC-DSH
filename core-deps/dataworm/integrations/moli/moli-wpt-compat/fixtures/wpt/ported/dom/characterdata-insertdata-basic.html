<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback) {
  let thrown = null;
  try {
    callback();
  } catch (error) {
    thrown = error;
  }
  assert_true(!!thrown, "expected exception");
  assert_equals(thrown.name, expectedName);
}

function test_insert_data(create, type) {
  test(function() {
    const node = create();
    assert_throws_name("IndexSizeError", function() { node.insertData(5, "x"); });
    assert_throws_name("IndexSizeError", function() { node.insertData(-1, "x"); });
    assert_throws_name("IndexSizeError", function() { node.insertData(-0x100000000 + 5, "x"); });
    assert_equals(node.data, "test");
  }, type + ".insertData() rejects out-of-bounds offset");

  test(function() {
    const node = create();
    node.insertData(-0x100000000 + 2, "X");
    assert_equals(node.data, "teXst");
  }, type + ".insertData() uses unsigned long offset conversion");

  test(function() {
    const node = create();
    node.insertData(0, "");
    assert_equals(node.data, "test");
    node.insertData(0, "X");
    assert_equals(node.data, "Xtest");
  }, type + ".insertData() at the start");

  test(function() {
    const node = create();
    node.insertData(2, "X");
    assert_equals(node.data, "teXst");
  }, type + ".insertData() in the middle");

  test(function() {
    const node = create();
    node.insertData(4, "ing");
    assert_equals(node.data, "testing");
  }, type + ".insertData() at the end");

  test(function() {
    const node = create();
    node.data = "This is the character data, append more \u8cc7\u6599\uff0c\u6e2c\u8a66\u8cc7\u6599";
    node.insertData(26, " test");
    assert_equals(node.data, "This is the character data test, append more \u8cc7\u6599\uff0c\u6e2c\u8a66\u8cc7\u6599");
    node.insertData(48, "\u66f4\u591a");
    assert_equals(node.data, "This is the character data test, append more \u8cc7\u6599\uff0c\u66f4\u591a\u6e2c\u8a66\u8cc7\u6599");
  }, type + ".insertData() handles non-ASCII data");

  test(function() {
    const node = create();
    node.data = "\ud83c\udf20 test \ud83c\udf20 TEST";
    node.insertData(5, "--");
    assert_equals(node.data, "\ud83c\udf20 te--st \ud83c\udf20 TEST");
  }, type + ".insertData() counts UTF-16 code units");
}

test_insert_data(function() { return document.createTextNode("test"); }, "Text");
test_insert_data(function() { return document.createComment("test"); }, "Comment");
</script>
