<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_bytes_equal(actual, expected, description) {
  assert_equals(actual.length, expected.length, description + " length");
  for (let i = 0; i < expected.length; i++) {
    assert_equals(actual[i], expected[i], description + " byte " + i);
  }
}

async function assert_rejects_name(expectedName, promise, description) {
  try {
    await promise;
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected rejection");
}

promise_test(async function () {
  const bytes = [0x00, 0xff, 0x41, 0x80, 0x0a, 0x0d];
  const response = new Response(new Uint8Array(bytes));

  assert_false(response.bodyUsed, "Response body starts unused");
  assert_bytes_equal(
    new Uint8Array(await response.arrayBuffer()),
    bytes,
    "Response.arrayBuffer() should preserve BodyInit bytes",
  );
  assert_true(response.bodyUsed, "Response body is marked used after arrayBuffer()");
  await assert_rejects_name(
    "TypeError",
    response.arrayBuffer(),
    "Response body should only be consumed once",
  );
}, "Response.arrayBuffer() preserves non-UTF-8 BodyInit bytes");

promise_test(async function () {
  const buffer = new Uint8Array([0xee, 0x00, 0xff, 0x80, 0xdd]).buffer;
  const response = new Response(new DataView(buffer, 1, 3), {
    headers: [["Content-Type", "application/octet-stream"]],
  });
  const blob = await response.blob();

  assert_equals(blob.type, "application/octet-stream", "Response.blob() uses response content type");
  assert_bytes_equal(
    new Uint8Array(await blob.arrayBuffer()),
    [0x00, 0xff, 0x80],
    "Response.blob() should preserve the selected ArrayBufferView range",
  );
}, "Response.blob() preserves ArrayBufferView byte ranges");

promise_test(async function () {
  const bytes = [0x00, 0xff, 0x41, 0x80];
  const request = new Request("https://example.test/upload", {
    method: "POST",
    body: new Uint8Array(bytes),
  });

  assert_false(request.bodyUsed, "Request body starts unused");
  assert_bytes_equal(
    new Uint8Array(await request.arrayBuffer()),
    bytes,
    "Request.arrayBuffer() should preserve BodyInit bytes",
  );
  assert_true(request.bodyUsed, "Request body is marked used after arrayBuffer()");
  await assert_rejects_name(
    "TypeError",
    request.text(),
    "Request body should only be consumed once",
  );
}, "Request.arrayBuffer() preserves non-UTF-8 BodyInit bytes");

promise_test(async function () {
  const buffer = new Uint8Array([0xaa, 0x00, 0xff, 0x80, 0xbb]).buffer;
  const request = new Request("https://example.test/upload", {
    method: "POST",
    body: new DataView(buffer, 1, 3),
  });
  const clone = request.clone();

  assert_bytes_equal(
    new Uint8Array(await clone.arrayBuffer()),
    [0x00, 0xff, 0x80],
    "Request.clone() should preserve binary body bytes",
  );
  assert_false(request.bodyUsed, "Consuming the clone should not consume the original request");
  assert_bytes_equal(
    new Uint8Array(await request.arrayBuffer()),
    [0x00, 0xff, 0x80],
    "Original Request body should remain readable after clone consumption",
  );
}, "Request.clone() preserves binary BodyInit bytes");

promise_test(async function () {
  const bytes = [0x00, 0xff, 0x41, 0x80];
  const response = new Response(new Uint8Array(bytes));
  const clone = response.clone();

  assert_bytes_equal(
    new Uint8Array(await clone.arrayBuffer()),
    bytes,
    "Response.clone() should preserve binary body bytes",
  );
  assert_false(response.bodyUsed, "Consuming the clone should not consume the original response");
  assert_bytes_equal(
    new Uint8Array(await response.arrayBuffer()),
    bytes,
    "Original Response body should remain readable after clone consumption",
  );
}, "Response.clone() preserves binary BodyInit bytes");
</script>
