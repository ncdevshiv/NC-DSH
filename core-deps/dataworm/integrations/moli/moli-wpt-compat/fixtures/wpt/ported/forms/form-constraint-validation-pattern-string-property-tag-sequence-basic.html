<!doctype html>
<meta charset="utf-8">
<body>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function textInput(value, pattern) {
  const input = document.createElement("input");
  input.type = "text";
  input.value = value;
  input.pattern = pattern;
  document.body.appendChild(input);
  return input;
}

function assertPatternMatch(value, pattern, description) {
  const input = textInput(value, pattern);
  assert_false(input.validity.patternMismatch, description);
  assert_true(input.validity.valid, description + " should keep the control valid");
}

function assertPatternMismatch(value, pattern, description) {
  const input = textInput(value, pattern);
  assert_true(input.validity.patternMismatch, description);
  assert_false(input.validity.valid, description + " should make the control invalid");
}

test(function () {
  const englandFlag = "\u{1F3F4}\u{E0067}\u{E0062}\u{E0065}\u{E006E}\u{E0067}\u{E007F}";
  const blackFlag = "\u{1F3F4}";
  const pattern = "\\p{RGI_Emoji_Tag_Sequence}";

  assertPatternMatch(
    englandFlag,
    pattern,
    "emoji tag sequences should match as one string-property atom",
  );
  assertPatternMismatch(
    blackFlag,
    pattern,
    "the base flag alone should not satisfy the tag-sequence property",
  );
  assertPatternMismatch(
    englandFlag + englandFlag,
    pattern,
    "whole-value matching should reject two tag sequences for one atom",
  );
}, "patternMismatch supports RGI_Emoji_Tag_Sequence string properties");

test(function () {
  const englandFlag = "\u{1F3F4}\u{E0067}\u{E0062}\u{E0065}\u{E006E}\u{E0067}\u{E007F}";
  const blackFlag = "\u{1F3F4}";
  const pattern = "(?:\\p{RGI_Emoji_Tag_Sequence}){2}";

  assertPatternMatch(
    englandFlag + englandFlag,
    pattern,
    "quantified tag-sequence atoms should match repeated tag sequences",
  );
  assertPatternMismatch(
    englandFlag,
    pattern,
    "quantified tag-sequence atoms should still enforce the count",
  );
  assertPatternMismatch(
    englandFlag + blackFlag,
    pattern,
    "quantified tag-sequence atoms should reject a trailing base flag",
  );
}, "patternMismatch supports quantifiers around RGI_Emoji_Tag_Sequence atoms");
</script>
