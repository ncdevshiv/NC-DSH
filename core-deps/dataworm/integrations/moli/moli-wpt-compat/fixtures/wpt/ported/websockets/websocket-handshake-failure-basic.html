<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function websocket_url(path) {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  return scheme + "//" + location.host + path;
}

promise_test(async function () {
  const socket = new WebSocket(websocket_url("/wpt/runtime/websocket/plain-200"));
  const events = [];

  const closed = new Promise(function (resolve, reject) {
    socket.addEventListener("open", function () {
      reject(new Error("open should not fire for an invalid opening handshake"));
    }, { once: true });
    socket.addEventListener("message", function () {
      reject(new Error("message should not fire for an invalid opening handshake"));
    }, { once: true });
    socket.addEventListener("error", function (event) {
      events.push("error:" + event.type + ":" + (event instanceof Event) + ":" + socket.readyState);
    }, { once: true });
    socket.addEventListener("close", function (event) {
      events.push("close:" + socket.readyState + ":" + event.code + ":" + event.wasClean);
      resolve(event);
    }, { once: true });
  });

  const closeEvent = await closed;
  assert_equals(closeEvent.code, 1006, "invalid opening handshake should report abnormal closure");
  assert_false(closeEvent.wasClean, "invalid opening handshake should not be clean");
  assert_equals(socket.readyState, WebSocket.CLOSED, "socket should end CLOSED");
  assert_array_equals(events, [
    "error:error:true:3",
    "close:3:1006:false",
  ], "invalid opening handshake should dispatch error before abnormal close");
}, "WebSocket invalid opening handshake dispatches error then abnormal close");
</script>
