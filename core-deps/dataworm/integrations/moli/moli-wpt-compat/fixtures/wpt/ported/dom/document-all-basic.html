<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected exception");
}

test(function () {
  const namedDecimal = document.createElement("div");
  namedDecimal.id = "1.9";
  const namedNull = document.createElement("div");
  namedNull.id = "null";
  const namedUndefined = document.createElement("div");
  namedUndefined.id = "undefined";
  const namedLeadingZero = document.createElement("div");
  namedLeadingZero.id = "01";
  const namedMaxArrayIndex = document.createElement("div");
  namedMaxArrayIndex.id = "4294967294";
  const namedTooLarge = document.createElement("div");
  namedTooLarge.id = "4294967295";
  document.body.append(
    namedDecimal,
    namedNull,
    namedUndefined,
    namedLeadingZero,
    namedMaxArrayIndex,
    namedTooLarge,
  );

  assert_equals(typeof document.all, "undefined", "HTMLAllCollection keeps the legacy typeof surface");
  assert_equals(Object.prototype.toString.call(document.all), "[object HTMLAllCollection]");
  assert_equals(document.all.item(), null, "missing item() argument should return null");
  assert_equals(document.all.item(undefined), null, "explicit undefined should behave like a missing optional argument");
  assert_equals(document.all(), null, "missing callable argument should return null");
  assert_equals(document.all(undefined), null, "explicit undefined callable argument should return null");

  assert_equals(document.all.item(0), document.documentElement);
  assert_equals(document.all.item("0"), document.documentElement, "array-index strings should use indexed lookup");
  assert_equals(document.all(1), document.head);
  assert_equals(document.all("1"), document.head, "callable array-index strings should use indexed lookup");

  assert_equals(document.all.item(1.9), namedDecimal, "non-array-index numeric DOMString should use named lookup");
  assert_equals(document.all.item("1.9"), namedDecimal);
  assert_equals(document.all(1.9), namedDecimal, "callable non-array-index numeric DOMString should use named lookup");
  assert_equals(document.all.item(null), namedNull, "null should convert to the DOMString \"null\"");
  assert_equals(document.all(null), namedNull);
  assert_equals(document.all.item("01"), namedLeadingZero, "leading-zero strings are not array-index property names");
  assert_equals(document.all("01"), namedLeadingZero);
  assert_equals(document.all.item("4294967294"), null, "array-index property names do not fall back to named lookup");
  assert_equals(document.all("4294967294"), null);
  assert_equals(document.all.item("4294967295"), namedTooLarge, "2^32 - 1 is not an array-index property name");
  assert_equals(document.all("4294967295"), namedTooLarge);
  assert_equals(document.all.item(-1), null);
  assert_equals(document.all("-1"), null);
  assert_throws_name("TypeError", () => document.all.item(Symbol("index")), "Symbol should fail DOMString conversion");
  assert_throws_name("TypeError", () => document.all(Symbol("index")), "callable Symbol should fail DOMString conversion");
}, "document.all item() and callable lookup use HTMLAllCollection name-or-index semantics");

test(function () {
  const doc = document.implementation.createHTMLDocument("detached all");
  const namedDecimal = doc.createElement("div");
  namedDecimal.id = "1.9";
  const namedNull = doc.createElement("div");
  namedNull.id = "null";
  const namedUndefined = doc.createElement("div");
  namedUndefined.id = "undefined";
  const namedLeadingZero = doc.createElement("div");
  namedLeadingZero.id = "01";
  const namedMaxArrayIndex = doc.createElement("div");
  namedMaxArrayIndex.id = "4294967294";
  const namedTooLarge = doc.createElement("div");
  namedTooLarge.id = "4294967295";
  doc.body.append(
    namedDecimal,
    namedNull,
    namedUndefined,
    namedLeadingZero,
    namedMaxArrayIndex,
    namedTooLarge,
  );

  assert_equals(typeof doc.all, "undefined", "detached HTMLAllCollection keeps the legacy typeof surface");
  assert_equals(Object.prototype.toString.call(doc.all), "[object HTMLAllCollection]");
  assert_equals(doc.all.item(), null);
  assert_equals(doc.all.item(undefined), null);
  assert_equals(doc.all(), null);
  assert_equals(doc.all(undefined), null);

  assert_equals(doc.all.item(0), doc.documentElement);
  assert_equals(doc.all.item("0"), doc.documentElement);
  assert_equals(doc.all(1), doc.head);
  assert_equals(doc.all("1"), doc.head);
  assert_equals(doc.all.item(1.9), namedDecimal);
  assert_equals(doc.all("1.9"), namedDecimal);
  assert_equals(doc.all.item(null), namedNull);
  assert_equals(doc.all(null), namedNull);
  assert_equals(doc.all.item("01"), namedLeadingZero);
  assert_equals(doc.all("01"), namedLeadingZero);
  assert_equals(doc.all.item("4294967294"), null);
  assert_equals(doc.all("4294967294"), null);
  assert_equals(doc.all.item("4294967295"), namedTooLarge);
  assert_equals(doc.all("4294967295"), namedTooLarge);
  assert_equals(doc.all.item(-1), null);
  assert_equals(doc.all("-1"), null);
  assert_throws_name("TypeError", () => doc.all.item(Symbol("index")), "detached Symbol item() should fail DOMString conversion");
  assert_throws_name("TypeError", () => doc.all(Symbol("index")), "detached callable Symbol should fail DOMString conversion");
}, "detached document.all item() and callable lookup use HTMLAllCollection name-or-index semantics");
</script>
