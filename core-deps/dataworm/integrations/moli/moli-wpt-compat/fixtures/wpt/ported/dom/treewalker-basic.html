<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function createSampleDOM() {
  const root = document.createElement("div");
  root.id = "a";
  root.appendChild(document.createTextNode("b"));

  const c = document.createElement("div");
  c.id = "c";
  root.appendChild(c);

  const d = document.createElement("div");
  d.id = "d";
  c.appendChild(d);

  d.appendChild(document.createTextNode("e"));

  const f = document.createElement("span");
  f.id = "f";
  d.appendChild(f);

  f.appendChild(document.createTextNode("g"));
  f.appendChild(document.createComment("h"));
  d.appendChild(document.createTextNode("i"));
  c.appendChild(document.createComment("j"));

  return root;
}

function assert_node(node, expected) {
  assert_true(node instanceof expected.type, "node type");
  if ("id" in expected) {
    assert_equals(node.id, expected.id, "node id");
  }
  if ("value" in expected) {
    assert_equals(node.nodeValue, expected.value, "node value");
  }
}

function assert_readonly(object, property, replacement) {
  const original = object[property];
  try {
    object[property] = replacement;
  } catch (_) {}
  assert_equals(object[property], original, property + " should be readonly");
}

function assert_throws_type_error(callback, message) {
  try {
    callback();
  } catch (error) {
    assert_true(error instanceof TypeError, message);
    return;
  }
  throw new Error(message);
}

function ids(nodes) {
  return nodes.map((node) => node.id || node.nodeValue);
}

test(function () {
  assert_throws_type_error(function () {
    document.createTreeWalker();
  }, "createTreeWalker() without root should throw TypeError");
}, "createTreeWalker() requires a root Node");

test(function () {
  const root = createSampleDOM();
  const walker = document.createTreeWalker(root);

  assert_equals(walker.toString(), "[object TreeWalker]");
  assert_equals(walker.constructor.name, "TreeWalker");
  assert_equals(walker.root, root);
  assert_equals(walker.whatToShow, 0xffffffff);
  assert_equals(walker.filter, null);
  assert_equals(walker.currentNode, root);
  assert_readonly(walker, "root", document);
  assert_readonly(walker, "whatToShow", NodeFilter.SHOW_ELEMENT);
  assert_readonly(walker, "filter", function () {
    return NodeFilter.FILTER_ACCEPT;
  });
}, "Construct a TreeWalker by document.createTreeWalker(root)");

test(function () {
  const root = createSampleDOM();

  assert_equals(document.createTreeWalker(root, null, null).whatToShow, 0);
  assert_equals(document.createTreeWalker(root, undefined, undefined).whatToShow, 0xffffffff);
  assert_equals(
    document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_COMMENT).whatToShow,
    NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_COMMENT,
  );
}, "createTreeWalker() optional arguments preserve WPT whatToShow semantics");

test(function () {
  const root = createSampleDOM();
  const walker = document.createTreeWalker(root);
  const f = root.lastChild.firstChild.childNodes[1];

  assert_node(walker.currentNode, { type: Element, id: "a" });
  assert_equals(walker.parentNode(), null);
  assert_node(walker.firstChild(), { type: Text, value: "b" });
  assert_node(walker.nextSibling(), { type: Element, id: "c" });
  assert_node(walker.lastChild(), { type: Comment, value: "j" });
  assert_node(walker.previousSibling(), { type: Element, id: "d" });
  assert_node(walker.nextNode(), { type: Text, value: "e" });
  assert_node(walker.parentNode(), { type: Element, id: "d" });
  assert_node(walker.previousNode(), { type: Element, id: "c" });
  assert_equals(walker.nextSibling(), null);
  assert_node(walker.currentNode, { type: Element, id: "c" });

  walker.currentNode = f;
  assert_equals(walker.currentNode, f);
}, "TreeWalker navigation updates currentNode in document order");

test(function () {
  const root = createSampleDOM();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  const visited = [];
  let node;

  while ((node = walker.nextNode())) {
    visited.push(node);
  }

  assert_array_equals(ids(visited), ["c", "d", "f"]);
  assert_equals(walker.nextNode(), null);
  assert_equals(walker.currentNode.id, "f");
}, "TreeWalker respects whatToShow when walking elements");

test(function () {
  const root = createSampleDOM();
  const walker = document.createTreeWalker(
    root,
    NodeFilter.SHOW_ELEMENT,
    function (node) {
      if (node.id === "c") {
        return NodeFilter.FILTER_SKIP;
      }
      if (node.id === "d") {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  );
  const visited = [];
  let node;

  while ((node = walker.nextNode())) {
    visited.push(node);
  }

  assert_array_equals(ids(visited), []);
}, "TreeWalker function filter distinguishes FILTER_SKIP and FILTER_REJECT");

test(function () {
  const root = createSampleDOM();
  const filter = {
    acceptNode(node) {
      if (node.nodeType === Node.TEXT_NODE && node.nodeValue !== "b") {
        return NodeFilter.FILTER_ACCEPT;
      }
      return NodeFilter.FILTER_SKIP;
    },
  };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, filter);
  const visited = [];
  let node;

  while ((node = walker.nextNode())) {
    visited.push(node);
  }

  assert_equals(walker.filter, filter);
  assert_array_equals(ids(visited), ["e", "g", "i"]);
}, "TreeWalker accepts object filters with acceptNode()");
</script>
