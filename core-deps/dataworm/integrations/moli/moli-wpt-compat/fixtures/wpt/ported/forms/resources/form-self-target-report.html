<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body data-submit-count="" data-query-target="" data-query-submitter=""></body>
<script>
const STORAGE_PREFIX = "__lm_wpt_form_self_target_basic__";

function key(suffix) {
  return STORAGE_PREFIX + suffix;
}

const params = new URLSearchParams(location.search);
document.body.setAttribute("data-submit-count", sessionStorage.getItem(key("submitCount")) ?? "");
document.body.setAttribute("data-query-target", params.get("target") ?? "");
document.body.setAttribute("data-query-submitter", params.get("submitter") ?? "");

test(function () {
  assert_equals(
    document.body.getAttribute("data-submit-count"),
    "1",
    "_self submission should dispatch submit exactly once",
  );
  assert_equals(
    document.body.getAttribute("data-query-target"),
    "_self",
    "_self submission should preserve successful hidden controls in the destination query",
  );
  assert_equals(
    document.body.getAttribute("data-query-submitter"),
    "button",
    "_self submission should include the active submit button",
  );
  assert_equals(
    location.pathname.endsWith("/forms/resources/form-self-target-report.html"),
    true,
    "_self should navigate the current top-level browsing context, not a same-named child frame",
  );
}, "_self form target navigates the current browsing context even when a same-named child frame exists");
</script>
