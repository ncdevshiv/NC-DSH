<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_message(worker) {
  return new Promise(function (resolve) {
    worker.addEventListener("message", resolve, { once: true });
  });
}

promise_test(async function () {
  const source = [
    "export const answer = 42;",
    "const topLevelThisUndefined = this === undefined;",
    "function functionThis() { return this; }",
    "let implicitGlobalError = 'none';",
    "try {",
    "  accidentalWorkerGlobal = 7;",
    "} catch (error) {",
    "  implicitGlobalError = error && error.name;",
    "}",
    "postMessage({",
    "  answer,",
    "  topLevelThisUndefined,",
    "  functionThisUndefined: functionThis() === undefined,",
    "  implicitGlobalError,",
    "  leakedGlobal: Object.prototype.hasOwnProperty.call(self, 'accidentalWorkerGlobal')",
    "});",
  ].join("\n");
  const worker = new Worker(worker_url(source), { type: "module" });

  try {
    const message = await next_message(worker);
    assert_equals(message.data.answer, 42, "module export should remain locally visible");
    assert_true(message.data.topLevelThisUndefined, "module top-level this should be undefined");
    assert_true(message.data.functionThisUndefined, "module functions should run in strict mode");
    assert_equals(message.data.implicitGlobalError, "ReferenceError", "implicit global assignment should throw");
    assert_false(message.data.leakedGlobal, "implicit global assignment should not leak onto self");
  } finally {
    worker.terminate();
  }
}, "Dedicated no-import module workers run with strict-mode semantics");
</script>
