<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const a = document.createTextNode("data");
  const b = document.createTextNode("data");
  const c = document.createTextNode("other");

  assert_true(a.isEqualNode(a));
  assert_true(a.isEqualNode(b));
  assert_false(a.isEqualNode(c));
  assert_false(a.isEqualNode(null));
}, "Text nodes compare by data and null is not equal");

test(function () {
  const a = document.createComment("data");
  const b = document.createComment("data");
  const c = document.createComment("other");

  assert_true(a.isEqualNode(b));
  assert_false(a.isEqualNode(c));
}, "Comment nodes compare by data");

test(function () {
  const a = document.createProcessingInstruction("target", "data");
  const b = document.createProcessingInstruction("target", "data");
  const c = document.createProcessingInstruction("other", "data");
  const d = document.createProcessingInstruction("target", "other");

  assert_true(a.isEqualNode(b));
  assert_false(a.isEqualNode(c));
  assert_false(a.isEqualNode(d));
}, "ProcessingInstruction nodes compare by target and data");

test(function () {
  const svgNamespace = "http://www.w3.org/2000/svg";
  const mathNamespace = "http://www.w3.org/1998/Math/MathML";
  const a = document.createElementNS(svgNamespace, "p:local");
  const b = document.createElementNS(svgNamespace, "p:local");
  const differentNamespace = document.createElementNS(mathNamespace, "p:local");
  const differentPrefix = document.createElementNS(svgNamespace, "q:local");
  const differentLocal = document.createElementNS(svgNamespace, "p:other");

  assert_true(a.isEqualNode(b), "same properties");
  assert_false(a.isEqualNode(differentNamespace), "different namespace");
  assert_false(a.isEqualNode(differentPrefix), "different prefix");
  assert_false(a.isEqualNode(differentLocal), "different local name");
}, "Elements compare by namespace, prefix, and local name");

test(function () {
  const a = document.createElement("element");
  a.setAttributeNS("urn:test", "p:name", "value");

  const b = document.createElement("element");
  b.setAttributeNS("urn:test", "p:name", "value");

  const differentAttributeNamespace = document.createElement("element");
  differentAttributeNamespace.setAttributeNS("urn:other", "p:name", "value");

  const differentAttributePrefix = document.createElement("element");
  differentAttributePrefix.setAttributeNS("urn:test", "q:name", "value");

  const differentAttributeLocal = document.createElement("element");
  differentAttributeLocal.setAttributeNS("urn:test", "p:other", "value");

  const differentAttributeValue = document.createElement("element");
  differentAttributeValue.setAttributeNS("urn:test", "p:name", "other");

  assert_true(a.isEqualNode(b), "same attribute properties");
  assert_false(a.isEqualNode(differentAttributeNamespace), "different attribute namespace");
  assert_true(a.isEqualNode(differentAttributePrefix), "different attribute prefix is ignored");
  assert_false(a.isEqualNode(differentAttributeLocal), "different attribute local name");
  assert_false(a.isEqualNode(differentAttributeValue), "different attribute value");
}, "Element attributes compare by namespace, local name, and value but not prefix");

test(function () {
  const a = document.createElement("parent");
  const b = document.createElement("parent");

  a.appendChild(document.createComment("data"));
  assert_false(a.isEqualNode(b));

  b.appendChild(document.createComment("data"));
  assert_true(a.isEqualNode(b));

  a.appendChild(document.createElement("child")).textContent = "text";
  b.appendChild(document.createElement("child")).textContent = "text";
  assert_true(a.isEqualNode(b));

  b.lastChild.textContent = "other";
  assert_false(a.isEqualNode(b));
}, "isEqualNode() compares descendants recursively");

test(function () {
  const a = document.createDocumentFragment();
  const b = document.createDocumentFragment();

  assert_true(a.isEqualNode(b));
  a.appendChild(document.createElement("child"));
  assert_false(a.isEqualNode(b));
  b.appendChild(document.createElement("child"));
  assert_true(a.isEqualNode(b));
}, "DocumentFragment equality is based on descendants");
</script>
