<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
promise_test(async function () {
  const response = await fetch("/wpt/runtime/fetch/request-headers", {
    headers: { "X-Test": "fetch" },
  });
  assert_equals(response.status, 200, "fetch header echo status");

  const payload = await response.json();
  assert_equals(payload.x_test, "fetch", "custom request header");
  assert_equals(payload.accept, "*/*", "default Accept header");
  assert_true(
    typeof payload.referer === "string" &&
      payload.referer.indexOf("/wpt/ported/fetch/fetch-request-headers-basic.html") !== -1,
    "fetch should send the current document as Referer",
  );
  assert_equals(payload.sec_fetch_site, "same-origin", "Sec-Fetch-Site");
  assert_equals(payload.sec_fetch_mode, "cors", "Sec-Fetch-Mode");
  assert_equals(payload.sec_fetch_dest, "empty", "Sec-Fetch-Dest");
  assert_true(payload.sec_ch_ua_present, "Sec-CH-UA should be present");
  assert_equals(payload.sec_ch_ua_mobile, "?0", "Sec-CH-UA-Mobile");
  assert_equals(
    String(payload.sec_ch_ua_platform).toLowerCase(),
    "\"windows\"",
    "Sec-CH-UA-Platform",
  );
}, "fetch() sends browser-style same-origin subresource request headers");

promise_test(async function () {
  const response = await fetch({
    href: "/wpt/runtime/fetch/request-headers?href-should-not-win",
    toString() {
      return "/wpt/runtime/fetch/request-headers";
    },
  }, {
    headers: { "X-Test": "request-info-object" },
  });
  assert_equals(response.status, 200, "fetch object input status");

  const payload = await response.json();
  assert_equals(payload.x_test, "request-info-object", "custom request header");
}, "fetch() parses non-Request object input through WebIDL USVString");
</script>
