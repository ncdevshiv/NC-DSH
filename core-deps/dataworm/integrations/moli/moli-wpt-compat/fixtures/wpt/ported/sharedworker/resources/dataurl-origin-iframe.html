<!doctype html>
<meta charset="utf-8">
<script>
const token = new URL(location.href).searchParams.get("token") || "";
const workerScript = [
  "let connections = 0;",
  "onconnect = function (event) {",
  "  connections++;",
  "  event.ports[0].postMessage(connections);",
  "};",
  "/* " + token + " */",
].join("\n");
const worker = new SharedWorker(
  "data:text/javascript," + encodeURIComponent(workerScript),
  "sharedworker-dataurl-origin-" + token,
);
worker.port.onmessage = function (event) {
  parent.postMessage({ token: token, count: event.data }, "*");
};
worker.port.start();
</script>
