<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
promise_test(async function () {
  const worker = new SharedWorker(
    "/wpt/ported/sharedworker/resources/script-response-csp/websocket-self-worker.js",
    "response-csp-websocket-" + Date.now(),
  );
  const outcome = await new Promise(function (resolve) {
    worker.onerror = function (event) {
      resolve("worker-error:" + event.message);
    };
    worker.port.onmessage = function (event) {
      resolve(event.data);
    };
    worker.port.start();
  });

  assert_equals(
    outcome,
    "shared-worker-csp-websocket",
    "SharedWorker response CSP connect-src 'self' must allow same-host ws://",
  );
}, "SharedWorker script response CSP allows same-host WebSocket for connect-src self");
</script>
