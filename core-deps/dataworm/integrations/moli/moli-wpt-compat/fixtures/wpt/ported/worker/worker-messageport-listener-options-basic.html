<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_worker_message(worker, predicate) {
  return new Promise(function (resolve, reject) {
    worker.addEventListener("message", function handler(event) {
      if (predicate && !predicate(event.data)) {
        return;
      }
      worker.removeEventListener("message", handler);
      resolve(event);
    });
    worker.addEventListener("error", function (event) {
      reject(new Error(event.message || "worker error"));
    }, { once: true });
  });
}

promise_test(async function () {
  const worker = new Worker(
    worker_url(
      [
        "onmessage = function (event) {",
        "  if (!event.data || event.data !== 'connect') {",
        "    return;",
        "  }",
        "  const port = event.ports[0];",
        "  let duplicateCount = 0;",
        "  let onceCount = 0;",
        "  function duplicateListener() {",
        "    duplicateCount += 1;",
        "  }",
        "  function onceListener() {",
        "    onceCount += 1;",
        "  }",
        "  port.addEventListener('message', duplicateListener);",
        "  port.addEventListener('message', duplicateListener);",
        "  port.addEventListener('message', onceListener, { once: true });",
        "  port.addEventListener('message', function (messageEvent) {",
        "    if (messageEvent.data === 'second') {",
        "      setTimeout(function () {",
        "        postMessage({ kind: 'result', duplicateCount, onceCount });",
        "      }, 0);",
        "    }",
        "  });",
        "  port.start();",
        "  postMessage({ kind: 'ready' });",
        "};",
      ].join("\n"),
    ),
  );
  const channel = new MessageChannel();

  try {
    const ready = next_worker_message(worker, function (data) {
      return data && data.kind === "ready";
    });
    worker.postMessage("connect", [channel.port2]);
    await ready;

    const result = next_worker_message(worker, function (data) {
      return data && data.kind === "result";
    });
    channel.port1.postMessage("first");
    channel.port1.postMessage("second");

    const data = (await result).data;
    assert_equals(data.duplicateCount, 2, "duplicate listener should run once per message");
    assert_equals(data.onceCount, 1, "once listener should run only for the first message");
  } finally {
    channel.port1.close();
    worker.terminate();
  }
}, "Worker-owned MessagePort honors duplicate suppression and once listeners");
</script>
