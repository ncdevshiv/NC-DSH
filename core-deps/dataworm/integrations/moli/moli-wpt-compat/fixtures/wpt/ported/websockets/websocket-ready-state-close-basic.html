<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function websocket_url(path) {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  return scheme + "//" + location.host + path;
}

promise_test(async function () {
  const socket = new WebSocket(websocket_url("/wpt/runtime/websocket/echo"));
  const events = [
    "constructed:" + (socket.readyState === WebSocket.CONNECTING) + ":" + socket.readyState,
  ];

  await new Promise(function (resolve, reject) {
    socket.addEventListener("open", function () {
      events.push("open:" + (socket.readyState === WebSocket.OPEN) + ":" + socket.readyState);
      socket.close();
      events.push("after-close:" + (socket.readyState === WebSocket.CLOSING) + ":" + socket.readyState);
    }, { once: true });
    socket.addEventListener("close", function (event) {
      events.push("close:" + (socket.readyState === WebSocket.CLOSED) + ":" + socket.readyState + ":" + event.wasClean);
      resolve();
    }, { once: true });
    socket.addEventListener("error", reject, { once: true });
  });

  assert_array_equals(events, [
    "constructed:true:0",
    "open:true:1",
    "after-close:true:2",
    "close:true:3:true",
  ], "readyState should expose the WebSocket lifecycle around close()");
}, "WebSocket readyState moves through CONNECTING, OPEN, CLOSING, and CLOSED");
</script>
