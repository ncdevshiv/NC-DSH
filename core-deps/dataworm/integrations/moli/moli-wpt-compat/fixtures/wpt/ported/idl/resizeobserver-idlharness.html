<!doctype html>
<meta charset="utf-8">
<div id="target"></div>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/resources/WebIDLParser.js"></script>
<script src="/wpt/resources/idlharness.js"></script>
<script>
idl_test([`
interface ResizeObserver {
  constructor(ResizeObserverCallback callback);
  undefined observe(Element target, optional object options = {});
  undefined unobserve(Element target);
  undefined disconnect();
};
`], [], function (idlArray) {
  idlArray.enable_function_length_assertions();
  idlArray.enable_interface_descriptor_assertions();
  idlArray.enable_operation_descriptor_assertions();
  idlArray.enable_object_brand_assertions();
  idlArray.add_objects({
    ResizeObserver: ["new ResizeObserver(function () {})"]
  });
});

test(function () {
  const target = document.getElementById("target");
  const observer = new ResizeObserver(function () {});
  observer.observe(target);
  observer.unobserve(target);
  observer.disconnect();
}, "ResizeObserver idlharness sample operations accept an Element target");
</script>
