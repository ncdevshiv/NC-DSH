<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const XML_NS = "http://www.w3.org/XML/1998/namespace";
const XMLNS_NS = "http://www.w3.org/2000/xmlns/";

function assert_throws_name(expectedName, callback) {
  try {
    callback();
  } catch (error) {
    assert_equals(error && error.name, expectedName);
    return;
  }
  assert_true(false, "Expected " + expectedName);
}

function assert_attr(attr, expected) {
  assert_equals(attr.value, expected.value, "value");
  assert_equals(attr.localName, expected.localName, "localName");
  assert_equals(attr.namespaceURI, expected.namespaceURI, "namespaceURI");
  assert_equals(attr.prefix, expected.prefix, "prefix");
  assert_equals(attr.name, expected.name, "name");
}

test(function () {
  const el = document.createElement("foo");

  el.setAttributeNS(null, "aa", "one");
  el.setAttributeNS("", "xx", "two");

  assert_equals(el.attributes.length, 2);
  assert_attr(el.attributes[0], {
    value: "one",
    localName: "aa",
    namespaceURI: null,
    prefix: null,
    name: "aa",
  });
  assert_attr(el.attributes[1], {
    value: "two",
    localName: "xx",
    namespaceURI: null,
    prefix: null,
    name: "xx",
  });
}, "setAttributeNS treats null and empty namespace as null namespace");

test(function () {
  const el = document.createElement("foo");

  assert_throws_name("NamespaceError", function () {
    el.setAttributeNS(null, "aa:bb", "fail");
  });
  assert_throws_name("NamespaceError", function () {
    el.setAttributeNS("", "aa:bb", "fail");
  });
}, "setAttributeNS requires a namespace when qualifiedName has a prefix");

test(function () {
  const el = document.createElement("foo");

  assert_throws_name("NamespaceError", function () {
    el.setAttributeNS("urn:not-xml", "xml:lang", "fail");
  });

  el.setAttributeNS(XML_NS, "a:lang", "pass");
  assert_attr(el.attributes[0], {
    value: "pass",
    localName: "lang",
    namespaceURI: XML_NS,
    prefix: "a",
    name: "a:lang",
  });
}, "setAttributeNS restricts the xml prefix to the XML namespace");

test(function () {
  const el = document.createElement("foo");

  assert_throws_name("NamespaceError", function () {
    el.setAttributeNS("urn:not-xmlns", "xmlns:foo", "fail");
  });
  assert_throws_name("NamespaceError", function () {
    el.setAttributeNS("urn:not-xmlns", "xmlns", "fail");
  });
  assert_throws_name("NamespaceError", function () {
    el.setAttributeNS(XMLNS_NS, "a:xmlns", "fail");
  });
  assert_throws_name("NamespaceError", function () {
    el.setAttributeNS(XMLNS_NS, "b:foo", "fail");
  });

  el.setAttributeNS(XMLNS_NS, "xmlns:a", "pass");
  el.setAttributeNS(XMLNS_NS, "xmlns", "root");
  assert_attr(el.attributes[0], {
    value: "pass",
    localName: "a",
    namespaceURI: XMLNS_NS,
    prefix: "xmlns",
    name: "xmlns:a",
  });
  assert_attr(el.attributes[1], {
    value: "root",
    localName: "xmlns",
    namespaceURI: XMLNS_NS,
    prefix: null,
    name: "xmlns",
  });
}, "setAttributeNS validates XMLNS namespace and prefix combinations");

test(function () {
  const el = document.createElement("foo");

  el.setAttributeNS("urn:test", "foo:bar", "x");
  assert_attr(el.attributes[0], {
    value: "x",
    localName: "bar",
    namespaceURI: "urn:test",
    prefix: "foo",
    name: "foo:bar",
  });

  el.setAttributeNS("urn:test", "quux:bar", "y");
  assert_equals(el.attributes.length, 1);
  assert_attr(el.attributes[0], {
    value: "y",
    localName: "bar",
    namespaceURI: "urn:test",
    prefix: "foo",
    name: "foo:bar",
  });
}, "setAttributeNS preserves an existing attribute prefix when replacing by namespace and localName");
</script>
