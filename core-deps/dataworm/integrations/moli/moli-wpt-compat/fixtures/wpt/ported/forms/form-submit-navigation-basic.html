<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body></body>
<script>
function read_frame_text(frame) {
  return frame.contentDocument?.body?.textContent?.trim() ?? "";
}

function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for_value(read, expected, description) {
  return Promise.race([
    new Promise(function (resolve, reject) {
      const deadline = Date.now() + 1000;
      function poll() {
        const value = read();
        if (value === expected) {
          resolve(value);
          return;
        }
        if (Date.now() >= deadline) {
          reject(new Error("timed out waiting for " + description + ": got " + value));
          return;
        }
        setTimeout(poll, 10);
      }
      poll();
    }),
    wait(1100).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

const submitFrame = document.createElement("iframe");
submitFrame.name = "submit-target";
document.body.appendChild(submitFrame);

const submitForm = document.createElement("form");
submitForm.target = "submit-target";
submitForm.action = "../navigation/resources/a-page.html";
let submitEventCount = 0;
submitForm.addEventListener("submit", function () {
  submitEventCount += 1;
});
document.body.appendChild(submitForm);
submitForm.submit();

const preventedFrame = document.createElement("iframe");
preventedFrame.name = "prevented-target";
document.body.appendChild(preventedFrame);

const preventedForm = document.createElement("form");
preventedForm.target = "prevented-target";
preventedForm.action = "../navigation/resources/a-page.html";
let preventedSubmitCount = 0;
preventedForm.addEventListener("submit", function (event) {
  preventedSubmitCount += 1;
  event.preventDefault();
});
document.body.appendChild(preventedForm);
preventedForm.requestSubmit();

const targetedFrame = document.createElement("iframe");
targetedFrame.name = "submitter-target";
document.body.appendChild(targetedFrame);

const targetedForm = document.createElement("form");
targetedForm.target = "_top";
targetedForm.action = "../navigation/resources/a-page.html";
const targetedSubmitter = document.createElement("input");
targetedSubmitter.type = "submit";
targetedSubmitter.setAttribute("formtarget", "submitter-target");
targetedForm.appendChild(targetedSubmitter);
let targetedSubmitCount = 0;
targetedForm.addEventListener("submit", function () {
  targetedSubmitCount += 1;
});
document.body.appendChild(targetedForm);
targetedForm.requestSubmit(targetedSubmitter);

const buttonTargetedFrame = document.createElement("iframe");
buttonTargetedFrame.name = "button-submitter-target";
document.body.appendChild(buttonTargetedFrame);

const inactiveSubmitterFrame = document.createElement("iframe");
inactiveSubmitterFrame.name = "inactive-submitter-target";
document.body.appendChild(inactiveSubmitterFrame);

const buttonTargetedForm = document.createElement("form");
buttonTargetedForm.target = "inactive-submitter-target";
buttonTargetedForm.action = "../navigation/resources/a-page.html";
const inactiveSubmitter = document.createElement("button");
inactiveSubmitter.type = "submit";
inactiveSubmitter.setAttribute("formtarget", "inactive-submitter-target");
buttonTargetedForm.appendChild(inactiveSubmitter);
const buttonTargetedSubmitter = document.createElement("button");
buttonTargetedSubmitter.type = "submit";
buttonTargetedSubmitter.setAttribute("formtarget", "button-submitter-target");
buttonTargetedForm.appendChild(buttonTargetedSubmitter);
let buttonTargetedSubmitCount = 0;
buttonTargetedForm.addEventListener("submit", function () {
  buttonTargetedSubmitCount += 1;
});
document.body.appendChild(buttonTargetedForm);
buttonTargetedForm.requestSubmit(buttonTargetedSubmitter);

const submitIgnoresSubmitterFrame = document.createElement("iframe");
submitIgnoresSubmitterFrame.name = "submit-ignores-submitter-target";
document.body.appendChild(submitIgnoresSubmitterFrame);

const submitIgnoresFormTargetFrame = document.createElement("iframe");
submitIgnoresFormTargetFrame.name = "submit-uses-form-target";
document.body.appendChild(submitIgnoresFormTargetFrame);

const submitIgnoresForm = document.createElement("form");
submitIgnoresForm.target = "submit-uses-form-target";
submitIgnoresForm.action = "../navigation/resources/a-page.html";
const ignoredSubmitter = document.createElement("button");
ignoredSubmitter.type = "submit";
ignoredSubmitter.setAttribute("formtarget", "submit-ignores-submitter-target");
submitIgnoresForm.appendChild(ignoredSubmitter);
let submitIgnoresEventCount = 0;
submitIgnoresForm.addEventListener("submit", function () {
  submitIgnoresEventCount += 1;
});
document.body.appendChild(submitIgnoresForm);
submitIgnoresForm.submit();

const externalSubmitterFrame = document.createElement("iframe");
externalSubmitterFrame.name = "external-submitter-target";
document.body.appendChild(externalSubmitterFrame);

const externalFormTargetFrame = document.createElement("iframe");
externalFormTargetFrame.name = "external-form-target";
document.body.appendChild(externalFormTargetFrame);

const externalForm = document.createElement("form");
externalForm.id = "external-submit-form";
externalForm.target = "external-form-target";
externalForm.action = "../navigation/resources/a-page.html";
const externalSubmitter = document.createElement("button");
externalSubmitter.type = "submit";
externalSubmitter.setAttribute("form", externalForm.id);
externalSubmitter.setAttribute("formtarget", "external-submitter-target");
let externalSubmitCount = 0;
let externalSubmitEvent = null;
externalForm.addEventListener("submit", function (event) {
  externalSubmitCount += 1;
  externalSubmitEvent = event;
});
document.body.appendChild(externalForm);
document.body.appendChild(externalSubmitter);
externalForm.requestSubmit(externalSubmitter);

test(function () {
  assert_equals(read_frame_text(submitFrame), "", "form.submit target should start empty");
  assert_equals(read_frame_text(preventedFrame), "", "prevented requestSubmit target should start empty");
  assert_equals(
    read_frame_text(targetedFrame),
    "",
    "requestSubmit(submitter) target should start empty",
  );
  assert_equals(
    read_frame_text(buttonTargetedFrame),
    "",
    "requestSubmit(button submitter) target should start empty",
  );
  assert_equals(
    read_frame_text(inactiveSubmitterFrame),
    "",
    "inactive submitter target should start empty",
  );
  assert_equals(
    read_frame_text(submitIgnoresSubmitterFrame),
    "",
    "form.submit should not use inactive submitter formtarget",
  );
  assert_equals(
    read_frame_text(submitIgnoresFormTargetFrame),
    "",
    "form.submit target should start empty",
  );
  assert_equals(
    read_frame_text(externalSubmitterFrame),
    "",
    "external form-associated submitter target should start empty",
  );
  assert_equals(
    read_frame_text(externalFormTargetFrame),
    "",
    "external form-associated submitter form target should start empty",
  );
  assert_equals(submitEventCount, 0, "form.submit should bypass submit event dispatch");
  assert_equals(submitIgnoresEventCount, 0, "form.submit should not dispatch submit while ignoring submitters");
  assert_equals(preventedSubmitCount, 1, "requestSubmit should synchronously dispatch submit");
  assert_equals(
    targetedSubmitCount,
    1,
    "requestSubmit(submitter) should synchronously dispatch submit",
  );
  assert_equals(
    buttonTargetedSubmitCount,
    1,
    "requestSubmit(button submitter) should synchronously dispatch submit",
  );
  assert_equals(
    externalSubmitCount,
    1,
    "requestSubmit(external submitter) should synchronously dispatch submit",
  );
  assert_equals(
    externalSubmitEvent.submitter,
    externalSubmitter,
    "requestSubmit(external submitter) should preserve the external submitter",
  );
}, "Form submission starts named-target navigation asynchronously while preserving submit-event semantics");

promise_test(async function () {
  await wait_for_value(function () {
    return read_frame_text(submitFrame);
  }, "a-page", "form.submit target load");
  await wait_for_value(function () {
    return read_frame_text(targetedFrame);
  }, "a-page", "requestSubmit(submitter) target load");
  await wait_for_value(function () {
    return read_frame_text(buttonTargetedFrame);
  }, "a-page", "requestSubmit(button submitter) target load");
  await wait_for_value(function () {
    return read_frame_text(submitIgnoresFormTargetFrame);
  }, "a-page", "form.submit form target load");
  await wait_for_value(function () {
    return read_frame_text(externalSubmitterFrame);
  }, "a-page", "external form-associated submitter target load");

  assert_equals(read_frame_text(submitFrame), "a-page", "form.submit should navigate the named target");
  assert_equals(
    read_frame_text(preventedFrame),
    "",
    "prevented requestSubmit should keep the named target unchanged",
  );
  assert_equals(
    read_frame_text(targetedFrame),
    "a-page",
    "requestSubmit(submitter) should honor submitter formtarget",
  );
  assert_equals(
    read_frame_text(buttonTargetedFrame),
    "a-page",
    "requestSubmit(button submitter) should honor button formtarget",
  );
  assert_equals(
    read_frame_text(inactiveSubmitterFrame),
    "",
    "requestSubmit(button submitter) should ignore other submitters' formtarget values",
  );
  assert_equals(
    read_frame_text(submitIgnoresFormTargetFrame),
    "a-page",
    "form.submit should use the form target",
  );
  assert_equals(
    read_frame_text(submitIgnoresSubmitterFrame),
    "",
    "form.submit should ignore submitter formtarget values",
  );
  assert_equals(
    read_frame_text(externalSubmitterFrame),
    "a-page",
    "requestSubmit(external submitter) should honor the external submitter formtarget",
  );
  assert_equals(
    read_frame_text(externalFormTargetFrame),
    "",
    "requestSubmit(external submitter) should not fall back to the form target",
  );
  assert_equals(submitEventCount, 0, "form.submit should still not dispatch submit");
  assert_equals(submitIgnoresEventCount, 0, "form.submit should still bypass submit");
  assert_equals(preventedSubmitCount, 1, "prevented requestSubmit should dispatch submit exactly once");
  assert_equals(
    targetedSubmitCount,
    1,
    "requestSubmit(submitter) should dispatch submit exactly once",
  );
  assert_equals(
    buttonTargetedSubmitCount,
    1,
    "requestSubmit(button submitter) should dispatch submit exactly once",
  );
  assert_equals(
    externalSubmitCount,
    1,
    "requestSubmit(external submitter) should dispatch submit exactly once",
  );
}, "submit(), prevented requestSubmit(), and submitter-targeted requestSubmit couple event flow to navigation correctly");
</script>
