<!doctype html>

<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
promise_test(async function () {
  const order = [];
  Promise.resolve().then(function () {
    order.push("promise");
  });
  queueMicrotask(function () {
    order.push("queueMicrotask");
  });
  await Promise.resolve();
  assert_array_equals(order, ["promise", "queueMicrotask"]);
}, "Promise jobs and queueMicrotask run before promise_test completion");
</script>
