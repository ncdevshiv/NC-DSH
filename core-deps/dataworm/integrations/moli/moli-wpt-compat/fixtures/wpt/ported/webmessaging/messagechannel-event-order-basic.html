<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function ordered_delivery(register) {
  const channel = new MessageChannel();
  const order = [];
  const complete = new Promise(function (resolve) {
    register(channel.port2, function (label) {
      order.push(label);
      if (order.length === 2) {
        resolve();
      }
    });
  });

  channel.port2.start();
  channel.port1.postMessage("go");
  return complete.then(function () {
    channel.port1.close();
    channel.port2.close();
    return order;
  });
}

promise_test(async function () {
  const order = await ordered_delivery(function (port, record) {
    port.addEventListener("message", function () {
      record("listener");
    });
    port.onmessage = function () {
      record("onmessage");
    };
  });

  assert_array_equals(order, ["listener", "onmessage"]);
}, "MessagePort dispatches addEventListener listener before later onmessage handler");

promise_test(async function () {
  const order = await ordered_delivery(function (port, record) {
    port.onmessage = function () {
      record("onmessage");
    };
    port.addEventListener("message", function () {
      record("listener");
    });
  });

  assert_array_equals(order, ["onmessage", "listener"]);
}, "MessagePort dispatches onmessage handler before later addEventListener listener");

promise_test(async function () {
  const order = await ordered_delivery(function (port, record) {
    port.onmessage = function () {
      record("stale");
    };
    port.addEventListener("message", function () {
      record("listener");
    });
    port.onmessage = function () {
      record("replacement");
    };
  });

  assert_array_equals(order, ["replacement", "listener"]);
}, "Replacing MessagePort.onmessage keeps the original event handler listener order");

promise_test(async function () {
  const order = await ordered_delivery(function (port, record) {
    port.onmessage = function () {
      record("removed");
    };
    port.onmessage = null;
    port.addEventListener("message", function () {
      record("listener");
    });
    port.onmessage = function () {
      record("onmessage");
    };
  });

  assert_array_equals(order, ["listener", "onmessage"]);
}, "Clearing MessagePort.onmessage removes its event handler listener order");
</script>
