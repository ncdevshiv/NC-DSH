<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_worker_message(worker, predicate) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
    }

    function onmessage(event) {
      if (predicate && !predicate(event.data)) {
        return;
      }
      cleanup();
      resolve(event);
    }

    function onerror(event) {
      cleanup();
      reject(event.error || new Error(event.message || "unexpected worker error"));
    }

    worker.addEventListener("message", onmessage);
    worker.addEventListener("error", onerror);
  });
}

function next_port_message(port, predicate) {
  port.start();
  return new Promise(function (resolve) {
    function onmessage(event) {
      if (predicate && !predicate(event.data)) {
        return;
      }
      port.removeEventListener("message", onmessage);
      resolve(event);
    }

    port.addEventListener("message", onmessage);
  });
}

function transfer_iterable(value) {
  return {
    [Symbol.iterator]: function* () {
      yield value;
    },
  };
}

promise_test(async function () {
  const worker = new Worker(worker_url([
    "onmessage = function (event) {",
    "  const buffer = event.data.buffer;",
    "  postMessage({",
    "    kind: 'buffer',",
    "    isArrayBuffer: buffer instanceof ArrayBuffer,",
    "    byteLength: buffer.byteLength,",
    "    bytes: Array.from(new Uint8Array(buffer)).join(','),",
    "    portsLength: event.ports.length,",
    "  });",
    "};",
  ].join("\n")));

  try {
    const transferred = new Uint8Array([1, 2, 3]).buffer;
    const reply = next_worker_message(worker, function (data) {
      return data && data.kind === "buffer";
    });

    worker.postMessage({ buffer: transferred }, transfer_iterable(transferred));

    assert_equals(transferred.byteLength, 0, "raw iterable should detach the sender ArrayBuffer");

    const data = (await reply).data;
    assert_true(data.isArrayBuffer, "worker should receive an ArrayBuffer");
    assert_equals(data.byteLength, 3, "worker should receive the original byte length");
    assert_equals(data.bytes, "1,2,3", "worker should receive the transferred bytes");
    assert_equals(data.portsLength, 0, "ArrayBuffer-only transfer should not populate event.ports");
  } finally {
    worker.terminate();
  }
}, "Worker.postMessage accepts a raw iterable transfer list for ArrayBuffer transfer");

promise_test(async function () {
  const worker = new Worker(worker_url([
    "onmessage = function (event) {",
    "  const port = event.data.port;",
    "  postMessage({",
    "    kind: 'ready',",
    "    portsLength: event.ports.length,",
    "    sameWrapper: port === event.ports[0],",
    "    isMessagePort: port instanceof MessagePort,",
    "  });",
    "  port.onmessage = function (messageEvent) {",
    "    port.postMessage('raw:' + messageEvent.data);",
    "  };",
    "};",
  ].join("\n")));
  const channel = new MessageChannel();

  try {
    const ready = next_worker_message(worker, function (data) {
      return data && data.kind === "ready";
    });

    worker.postMessage({ port: channel.port2 }, transfer_iterable(channel.port2));

    const readyData = (await ready).data;
    assert_equals(readyData.portsLength, 1, "raw iterable should populate event.ports");
    assert_true(readyData.sameWrapper, "payload port and event.ports should share a wrapper");
    assert_true(readyData.isMessagePort, "worker should receive a MessagePort");

    const reply = next_port_message(channel.port1);
    channel.port1.postMessage("ping");
    assert_equals((await reply).data, "raw:ping", "raw iterable transferred port should round-trip");
  } finally {
    channel.port1.close();
    channel.port2.close();
    worker.terminate();
  }
}, "Worker.postMessage accepts a raw iterable transfer list for MessagePort transfer");

promise_test(async function () {
  const channel = new MessageChannel();
  const transferred = new Uint8Array([4, 5]).buffer;
  const reply = next_port_message(channel.port2, function (data) {
    return data && data.kind === "buffer";
  });

  channel.port1.postMessage({ kind: "buffer", buffer: transferred }, transfer_iterable(transferred));

  assert_equals(
    transferred.byteLength,
    0,
    "raw iterable MessagePort transfer should detach the sender ArrayBuffer",
  );

  const event = await reply;
  const data = event.data;
  channel.port1.close();
  channel.port2.close();
  assert_true(data.buffer instanceof ArrayBuffer, "peer should receive an ArrayBuffer through the port");
  assert_equals(data.buffer.byteLength, 2, "peer should receive the original byte length");
  assert_equals(Array.from(new Uint8Array(data.buffer)).join(","), "4,5", "peer should receive the transferred bytes");
  assert_equals(event.ports.length, 0, "ArrayBuffer-only MessagePort transfer should not populate event.ports");
}, "MessagePort.postMessage accepts a raw iterable transfer list for ArrayBuffer transfer");

promise_test(async function () {
  const control = new MessageChannel();
  const inner = new MessageChannel();
  const ready = next_port_message(control.port2, function (data) {
    return data && data.kind === "ready";
  });

  control.port1.postMessage({ kind: "ready", port: inner.port2 }, transfer_iterable(inner.port2));

  const event = await ready;
  assert_equals(event.ports.length, 1, "raw iterable port transfer should populate event.ports");
  assert_true(event.data.port === event.ports[0], "payload port and event.ports should share a wrapper");
  assert_true(event.data.port instanceof MessagePort, "peer should receive a MessagePort");

  event.data.port.onmessage = function (messageEvent) {
    event.data.port.postMessage("raw:" + messageEvent.data);
  };
  const reply = next_port_message(inner.port1);
  inner.port1.postMessage("ping");
  assert_equals((await reply).data, "raw:ping", "raw iterable MessagePort transfer should round-trip");

  control.port1.close();
  control.port2.close();
  inner.port1.close();
  inner.port2.close();
}, "MessagePort.postMessage accepts a raw iterable transfer list for MessagePort transfer");
</script>
