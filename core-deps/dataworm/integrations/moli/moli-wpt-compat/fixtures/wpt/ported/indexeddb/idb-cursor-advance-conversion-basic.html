<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(
      error && error.name,
      expectedName,
      description || "unexpected exception name"
    );
    return;
  }
  assert_unreached(
    (description || "assert_throws_name") + ": expected an exception"
  );
}

function wait_request(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function run_cursor_advance_sequence(db, storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName);
    const request = tx.objectStore(storeName).openCursor();
    let phase = 0;
    const throwingCount = {
      valueOf() {
        throw new RangeError("advance count conversion");
      },
    };
    request.onerror = () => reject(request.error);
    request.onsuccess = () => {
      try {
        const cursor = request.result;
        if (phase === 0) {
          assert_equals(cursor.key, 1, "cursor starts at first key");
          assert_throws_name(
            "TypeError",
            () => cursor.advance(),
            "advance count is required"
          );
          assert_throws_name(
            "TypeError",
            () => cursor.advance(0),
            "advance rejects zero after conversion"
          );
          assert_throws_name(
            "TypeError",
            () => cursor.advance(null),
            "advance rejects null because it converts to zero"
          );
          assert_throws_name(
            "TypeError",
            () => cursor.advance(NaN),
            "advance rejects NaN under EnforceRange"
          );
          assert_throws_name(
            "TypeError",
            () => cursor.advance(Infinity),
            "advance rejects Infinity under EnforceRange"
          );
          assert_throws_name(
            "TypeError",
            () => cursor.advance(-1),
            "advance rejects negative counts under EnforceRange"
          );
          assert_throws_name(
            "TypeError",
            () => cursor.advance(4294967296),
            "advance rejects counts outside unsigned long range"
          );
          assert_throws_name(
            "TypeError",
            () => cursor.advance(Symbol("count")),
            "advance rejects Symbol count"
          );
          assert_throws_name(
            "RangeError",
            () => cursor.advance(throwingCount),
            "advance propagates count conversion errors"
          );
          cursor.advance({
            valueOf() {
              return 2.9;
            },
          });
          phase = 1;
          return;
        }
        if (phase === 1) {
          assert_equals(cursor.key, 3, "object count truncates under EnforceRange");
          cursor.advance("1.9");
          phase = 2;
          return;
        }
        if (phase === 2) {
          assert_equals(cursor.key, 4, "numeric string count converts and truncates");
          cursor.advance(1);
          phase = 3;
          return;
        }
        assert_equals(cursor, null, "advance past the final entry exhausts the cursor");
        resolve();
      } catch (error) {
        reject(error);
      }
    };
  });
}

promise_test(async () => {
  const dbname = "idb-cursor-advance-conversion-" + Math.random();
  const storeName = "store";
  const request = indexedDB.open(dbname, 1);
  request.onupgradeneeded = () => {
    const store = request.result.createObjectStore(storeName);
    store.add("one", 1);
    store.add("two", 2);
    store.add("three", 3);
    store.add("four", 4);
  };

  const db = await wait_request(request);
  await run_cursor_advance_sequence(db, storeName);
  db.close();
  await wait_request(indexedDB.deleteDatabase(dbname));
}, "IDBCursor.advance() count follows WebIDL EnforceRange unsigned long conversion");
</script>
