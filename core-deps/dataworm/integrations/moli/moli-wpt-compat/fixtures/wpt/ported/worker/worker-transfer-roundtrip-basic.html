<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_message(worker) {
  return new Promise(function (resolve) {
    worker.addEventListener("message", resolve, { once: true });
  });
}

function assert_throws_data_clone(callback, description) {
  let thrown = null;
  try {
    callback();
  } catch (error) {
    thrown = error;
  }

  assert_true(!!thrown, description + " should throw");
  assert_equals(thrown.name, "DataCloneError", description + " exception name");
  assert_true(thrown instanceof DOMException, description + " exception type");
}

test(function () {
  const worker = new Worker(worker_url("postMessage('ready');"));
  try {
    assert_throws_data_clone(
      function () {
        worker.postMessage(function nope() {});
      },
      "uncloneable Worker.postMessage payloads",
    );

    const view = new Uint8Array([1]);
    assert_throws_data_clone(
      function () {
        worker.postMessage("payload", [view]);
      },
      "non-transferable transfer-list entries",
    );

    const buffer = new ArrayBuffer(1);
    assert_throws_data_clone(
      function () {
        worker.postMessage(buffer, [buffer, buffer]);
      },
      "duplicate transfer-list entries",
    );
  } finally {
    worker.terminate();
  }
}, "Worker.postMessage rejects uncloneable payloads and invalid transfer lists");

promise_test(async function () {
  const worker = new Worker(
    worker_url(
      "postMessage(new Uint8Array([7, 8, 9]).buffer);",
    ),
  );

  try {
    const message = await next_message(worker);
    assert_true(
      message.data instanceof ArrayBuffer,
      "worker-created buffer should arrive as ArrayBuffer",
    );
    assert_equals(message.data.byteLength, 3, "worker-created buffer byteLength");
    assert_array_equals(
      Array.from(new Uint8Array(message.data)),
      [7, 8, 9],
      "worker-created buffer bytes",
    );
  } finally {
    worker.terminate();
  }
}, "Worker postMessage can clone ArrayBuffers back to the window");

promise_test(async function () {
  const worker = new Worker(
    worker_url(
      [
        "const buffer = new Uint8Array([3, 4, 5]).buffer;",
        "postMessage(buffer, [buffer]);",
        "postMessage(buffer.byteLength);",
      ].join("\n"),
    ),
  );

  try {
    const bufferMessage = await next_message(worker);
    assert_true(
      bufferMessage.data instanceof ArrayBuffer,
      "transferred value should arrive as ArrayBuffer",
    );
    assert_array_equals(
      Array.from(new Uint8Array(bufferMessage.data)),
      [3, 4, 5],
      "transferred worker buffer bytes",
    );

    const lengthMessage = await next_message(worker);
    assert_equals(lengthMessage.data, 0, "worker sender buffer should be detached after transfer");
  } finally {
    worker.terminate();
  }
}, "Worker postMessage can transfer ArrayBuffers back to the window and detach the sender");

promise_test(async function () {
  const worker = new Worker(
    worker_url(
      [
        "onmessage = function (event) {",
        "  const view = new DataView(event.data);",
        "  postMessage(new Uint8Array([view.getUint8(0) + 1, view.getUint8(1) + 1]));",
        "};",
      ].join("\n"),
    ),
  );

  try {
    worker.postMessage(new Uint8Array([40, 41]).buffer);
    const message = await next_message(worker);
    assert_true(message.data instanceof Uint8Array, "worker reply should preserve typed array type");
    assert_true(
      message.data.buffer instanceof ArrayBuffer,
      "typed array reply should have an ArrayBuffer backing store",
    );
    assert_array_equals(
      Array.from(message.data),
      [41, 42],
      "worker should read the incoming buffer with DataView",
    );
  } finally {
    worker.terminate();
  }
}, "Worker ArrayBuffer round-trips support DataView reads and typed array replies");
</script>
