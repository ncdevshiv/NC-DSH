<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function createDetachedTree() {
  const doc = document.implementation.createDocument("https://example.test/tree", "root", null);
  const root = doc.documentElement;
  root.setAttribute("id", "source");
  root.appendChild(doc.createElement("child"));
  return { doc, root };
}

test(function () {
  const { doc, root } = createDetachedTree();

  const imported = document.importNode(root);

  assert_equals(root.ownerDocument, doc, "source ownerDocument");
  assert_equals(root.firstChild.ownerDocument, doc, "source child ownerDocument");
  assert_equals(imported.ownerDocument, document, "imported ownerDocument");
  assert_equals(imported.localName, "root", "localName");
  assert_equals(imported.id, "source", "attribute copied");
  assert_equals(imported.firstChild, null, "default deep is false");
}, "importNode() defaults deep to false for a detached element");

test(function () {
  const { doc, root } = createDetachedTree();

  const imported = document.importNode(root, undefined);

  assert_equals(root.ownerDocument, doc, "source ownerDocument");
  assert_equals(imported.ownerDocument, document, "imported ownerDocument");
  assert_equals(imported.firstChild, null, "undefined deep is false");
}, "importNode() treats undefined deep as false");

test(function () {
  const { doc, root } = createDetachedTree();

  const imported = document.importNode(root, true);

  assert_equals(root.ownerDocument, doc, "source ownerDocument");
  assert_equals(root.firstChild.ownerDocument, doc, "source child ownerDocument");
  assert_equals(imported.ownerDocument, document, "imported ownerDocument");
  assert_true(imported.firstChild instanceof Element, "child imported");
  assert_equals(imported.firstChild.localName, "child", "child localName");
  assert_equals(imported.firstChild.ownerDocument, document, "child ownerDocument");
}, "importNode() deep-imports a detached element subtree");

test(function () {
  const { root } = createDetachedTree();

  const imported = document.importNode(root, false);

  assert_equals(imported.ownerDocument, document, "imported ownerDocument");
  assert_equals(imported.firstChild, null, "false deep is shallow");
}, "importNode() respects false deep");

test(function () {
  const doc = document.implementation.createDocument(null, "root", null);
  const attr = doc.createAttributeNS("https://example.test/ns", "p:name");
  attr.value = "value";

  const imported = document.importNode(attr, true);

  assert_true(imported instanceof Attr, "Attr identity");
  assert_equals(imported.ownerElement, null, "ownerElement");
  assert_equals(imported.prefix, "p", "prefix");
  assert_equals(imported.namespaceURI, "https://example.test/ns", "namespaceURI");
  assert_equals(imported.localName, "name", "localName");
  assert_equals(imported.name, "p:name", "name");
  assert_equals(imported.value, "value", "value");
}, "importNode() preserves namespace metadata when importing an Attr");
</script>
