<!doctype html>
<meta charset="utf-8">
<script>
const params = new URLSearchParams(location.search);
const mode = params.get("mode");
const storagePrefix = params.get("storagePrefix") ?? "";
const sourceUrl = params.get("sourceUrl") ?? "";

function key(suffix) {
  return storagePrefix + suffix;
}

sessionStorage.setItem(
  key("destBefore"),
  JSON.stringify({
    activationEntry: navigation.activation?.entry?.url ?? "",
    activationFrom: navigation.activation?.from?.url ?? "",
    activationType: navigation.activation?.navigationType ?? "",
    current: navigation.currentEntry?.url ?? "",
    canBack: navigation.canGoBack,
    canForward: navigation.canGoForward,
  }),
);
sessionStorage.setItem(key("stage"), "dest-ready");

setTimeout(function () {
  const order = ["before"];
  let committedSettled = false;
  let finishedSettled = false;
  let result = null;

  if (mode === "back") {
    result = navigation.back();
  } else if (mode === "traverse-to") {
    const target = navigation.entries().find(function (entry) {
      return entry.url === sourceUrl;
    });
    if (target) {
      result = navigation.traverseTo(target.key);
    }
  }

  const hasPromiseSurface =
    !!result &&
    typeof result.committed?.then === "function" &&
    typeof result.finished?.then === "function";

  if (hasPromiseSurface) {
    result.committed.then(function (entry) {
      committedSettled = true;
      order.push("committed:" + String(entry?.url ?? ""));
      sessionStorage.setItem(key("sourceLog"), order.join("|"));
      sessionStorage.setItem(key("sourceCommittedUrl"), String(entry?.url ?? ""));
    });

    result.finished.then(function (entry) {
      finishedSettled = true;
      order.push("finished:" + String(entry?.url ?? ""));
      sessionStorage.setItem(key("sourceLog"), order.join("|"));
      sessionStorage.setItem(key("sourceFinishedUrl"), String(entry?.url ?? ""));
    });
  }

  order.push("after-call");
  sessionStorage.setItem(
    key("sourceSync"),
    "surface:" + String(hasPromiseSurface) + "|sync:" + String(committedSettled) + "," + String(finishedSettled),
  );
  sessionStorage.setItem(key("sourceLog"), order.join("|"));
  sessionStorage.setItem(key("sourceCommittedUrl"), "null");
  sessionStorage.setItem(key("sourceFinishedUrl"), "null");
}, 0);
</script>
