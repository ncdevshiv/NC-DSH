<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(
      error && error.name,
      expectedName,
      description || "unexpected exception name"
    );
    return;
  }
  assert_unreached(
    (description || "assert_throws_name") + ": expected an exception"
  );
}

function wait_request(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

promise_test(async () => {
  const dbname = "idb-write-key-conversion-" + Math.random();
  const storeName = "auto";

  const openRequest = indexedDB.open(dbname, 1);
  openRequest.onupgradeneeded = () => {
    openRequest.result.createObjectStore(storeName, { autoIncrement: true });
  };

  const db = await wait_request(openRequest);
  const tx = db.transaction(storeName, "readwrite");
  const store = tx.objectStore(storeName);

  assert_throws_name(
    "TypeError",
    () => store.add(),
    "add value remains required"
  );
  assert_throws_name(
    "TypeError",
    () => store.put(),
    "put value remains required"
  );

  const addMissingKey = await wait_request(store.add("add-missing-key"));
  const addUndefinedKey = await wait_request(store.add("add-undefined-key", undefined));
  const putMissingKey = await wait_request(store.put("put-missing-key"));
  const putUndefinedKey = await wait_request(store.put("put-undefined-key", undefined));

  assert_equals(addMissingKey, 1, "add() missing key uses the generated key path");
  assert_equals(addUndefinedKey, 2, "add(undefined key) uses the generated key path");
  assert_equals(putMissingKey, 3, "put() missing key uses the generated key path");
  assert_equals(putUndefinedKey, 4, "put(undefined key) uses the generated key path");

  assert_equals(
    await wait_request(store.get(addMissingKey)),
    "add-missing-key",
    "add() missing key keeps stored value"
  );
  assert_equals(
    await wait_request(store.get(addUndefinedKey)),
    "add-undefined-key",
    "add(undefined key) keeps stored value"
  );
  assert_equals(
    await wait_request(store.get(putMissingKey)),
    "put-missing-key",
    "put() missing key keeps stored value"
  );
  assert_equals(
    await wait_request(store.get(putUndefinedKey)),
    "put-undefined-key",
    "put(undefined key) keeps stored value"
  );

  db.close();
  await wait_request(indexedDB.deleteDatabase(dbname));
}, "IndexedDB write operations parse optional raw any key arguments through WebIDL");
</script>
