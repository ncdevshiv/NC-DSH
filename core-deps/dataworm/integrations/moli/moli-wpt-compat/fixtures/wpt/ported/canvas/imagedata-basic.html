<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  let error = null;
  try {
    callback();
  } catch (caught) {
    error = caught;
  }
  assert_true(error !== null, (description || "assert_throws_name") + ": expected an exception");
  assert_equals(error.name, expectedName, (description || "assert_throws_name") + ": unexpected exception name");
}

test(function () {
  const imageData = new ImageData(2, 3);

  assert_true(imageData instanceof ImageData);
  assert_equals(imageData.width, 2);
  assert_equals(imageData.height, 3);
  assert_equals(imageData.colorSpace, "srgb");
  assert_equals(imageData.pixelFormat, "rgba-unorm8");
  assert_true(imageData.data instanceof Uint8ClampedArray);
  assert_equals(imageData.data.length, 24);
  assert_true(Array.from(imageData.data).every((value) => value === 0));
}, "ImageData(width, height) exposes dimensions, color metadata, and zeroed RGBA bytes");

test(function () {
  const imageData = new ImageData(1, 1);

  imageData.data[0] = 255;
  imageData.data[3] = 255;

  assert_array_equals(Array.from(imageData.data), [255, 0, 0, 255]);
}, "ImageData.data is a mutable Uint8ClampedArray");

test(function () {
  const bytes = new Uint8ClampedArray([1, 2, 3, 4, 5, 6, 7, 8]);
  const imageData = new ImageData(bytes, 1);

  assert_equals(imageData.width, 1);
  assert_equals(imageData.height, 2);
  assert_equals(imageData.data, bytes);
  assert_array_equals(Array.from(imageData.data), [1, 2, 3, 4, 5, 6, 7, 8]);
}, "ImageData(Uint8ClampedArray, width) infers height from byte length");

test(function () {
  const imageData = new ImageData(5, 5, { colorSpace: "srgb" });

  assert_equals(imageData.width, 5);
  assert_equals(imageData.height, 5);
  assert_equals(imageData.colorSpace, "srgb");
}, "ImageData accepts srgb colorSpace settings");

test(function () {
  assert_equals(new ImageData(1, 1, undefined).colorSpace, "srgb");
  assert_equals(new ImageData(1, 1, null).colorSpace, "srgb");
  assert_equals(new ImageData(1, 1, {}).colorSpace, "srgb");
  assert_equals(new ImageData(1, 1, { colorSpace: undefined }).colorSpace, "srgb");
  assert_equals(new ImageData(1, 1, { colorSpace: "display-p3" }).colorSpace, "display-p3");

  assert_throws_name("TypeError", function () {
    new ImageData(1, 1, { colorSpace: "bogus" });
  }, "invalid colorSpace should throw");
  assert_throws_name("TypeError", function () {
    new ImageData(1, 1, { colorSpace: null });
  }, "null colorSpace member should convert and reject");
  assert_throws_name("TypeError", function () {
    new ImageData(1, 1, { colorSpace: Symbol() });
  }, "Symbol colorSpace member should throw");
  assert_throws_name("TypeError", function () {
    new ImageData(1, 1, Symbol());
  }, "settings must be an object when present");
}, "ImageDataSettings.colorSpace follows WebIDL enum conversion");

test(function () {
  const bytes = new Uint8ClampedArray([1, 2, 3, 4]);
  assert_equals(new ImageData(bytes, 1, 1, { colorSpace: "display-p3" }).colorSpace, "display-p3");
  assert_throws_name("TypeError", function () {
    new ImageData(bytes, 1, 1, { colorSpace: "bogus" });
  }, "typed-array constructor should validate colorSpace");
}, "ImageData typed-array constructor validates colorSpace settings");

test(function () {
  try {
    new ImageData(0, 1);
    throw new Error("expected IndexSizeError");
  } catch (error) {
    assert_equals(error.name, "IndexSizeError");
  }
}, "ImageData rejects zero width with IndexSizeError");
</script>
