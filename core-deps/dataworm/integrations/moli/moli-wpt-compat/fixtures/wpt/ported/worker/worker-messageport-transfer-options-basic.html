<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function assert_throws_name(expectedName, callback, description) {
  let error = null;
  try {
    callback();
  } catch (thrown) {
    error = thrown;
  }
  assert_true(error !== null, (description || "assert_throws_name") + ": expected an exception");
  assert_equals(error.name, expectedName, (description || "assert_throws_name") + ": unexpected exception name");
}

function assert_message_event_defaults(event, description, expectedPortsLength) {
  assert_true(event instanceof MessageEvent, description + " should use MessageEvent");
  assert_equals(event.origin, "", description + " should use the empty origin default");
  assert_equals(event.lastEventId, "", description + " should use the empty lastEventId default");
  assert_equals(event.source, null, description + " should not expose a source object");
  assert_equals(event.ports.length, expectedPortsLength, description + " event.ports length");
  assert_equals(event.ports, event.ports, description + " event.ports should be stable");
}

async function assert_worker_postmessage_options_transfer_port() {
  const worker = new Worker(
    worker_url(
      [
        "onmessage = function (event) {",
        "  if (event.data !== 'connect') {",
        "    return;",
        "  }",
        "  const port = event.ports[0];",
        "  postMessage({",
        "    kind: 'ready',",
        "    isMessageEvent: event instanceof MessageEvent,",
        "    typeString: Object.prototype.toString.call(event),",
        "    origin: event.origin,",
        "    lastEventId: event.lastEventId,",
        "    sourceIsNull: event.source === null,",
        "    portsLength: event.ports.length,",
        "    portsStable: event.ports === event.ports,",
        "    isMessagePort: port instanceof MessagePort,",
        "  });",
        "  port.onmessage = function (messageEvent) {",
        "    port.postMessage('dict:' + messageEvent.data);",
        "  };",
        "};",
      ].join("\n"),
    ),
  );
  const channel = new MessageChannel();

  try {
    const ready = new Promise(function (resolve) {
      worker.onmessage = function (event) {
        assert_message_event_defaults(event, "worker ready delivery", 0);
        if (event.data.kind === "ready") {
          resolve(event.data);
        }
      };
    });
    const reply = new Promise(function (resolve) {
      channel.port1.onmessage = function (event) {
        assert_message_event_defaults(event, "options.transfer port reply", 0);
        resolve(event.data);
      };
    });

    worker.postMessage("connect", { transfer: [channel.port2] });

    const readyData = await ready;
    assert_true(readyData.isMessageEvent, "worker should receive options.transfer through MessageEvent");
    assert_equals(readyData.typeString, "[object MessageEvent]", "worker receive event brand");
    assert_equals(readyData.origin, "", "worker receive event.origin");
    assert_equals(readyData.lastEventId, "", "worker receive event.lastEventId");
    assert_equals(readyData.sourceIsNull, true, "worker receive event.source");
    assert_equals(readyData.portsLength, 1, "worker should receive one transferred port");
    assert_equals(readyData.portsStable, true, "worker receive event.ports should be stable");
    assert_true(readyData.isMessagePort, "transferred port should preserve its interface");

    channel.port1.postMessage("ping");
    assert_equals(await reply, "dict:ping", "options.transfer MessagePort should round-trip messages");
  } finally {
    channel.port1.close();
    channel.port2.close();
    worker.terminate();
  }
}

async function assert_worker_postmessage_nested_port_transfer() {
  const worker = new Worker(
    worker_url(
      [
        "onmessage = function (event) {",
        "  if (!event.data || event.data.kind !== 'connect') {",
        "    return;",
        "  }",
        "  const port = event.data.port;",
        "  postMessage({",
        "    kind: 'nested-ready',",
        "    isMessageEvent: event instanceof MessageEvent,",
        "    typeString: Object.prototype.toString.call(event),",
        "    origin: event.origin,",
        "    lastEventId: event.lastEventId,",
        "    sourceIsNull: event.source === null,",
        "    portsLength: event.ports.length,",
        "    portsStable: event.ports === event.ports,",
        "    sameWrapper: port === event.ports[0],",
        "    isMessagePort: port instanceof MessagePort,",
        "  });",
        "  port.onmessage = function (messageEvent) {",
        "    port.postMessage('nested:' + messageEvent.data);",
        "  };",
        "};",
      ].join("\n"),
    ),
  );
  const channel = new MessageChannel();

  try {
    const ready = new Promise(function (resolve) {
      worker.onmessage = function (event) {
        assert_message_event_defaults(event, "nested ready delivery", 0);
        if (event.data.kind === "nested-ready") {
          resolve(event.data);
        }
      };
    });
    const reply = new Promise(function (resolve) {
      channel.port1.onmessage = function (event) {
        assert_message_event_defaults(event, "nested port reply", 0);
        resolve(event.data);
      };
    });

    worker.postMessage({ kind: "connect", port: channel.port2 }, [channel.port2]);

    const readyData = await ready;
    assert_true(readyData.isMessageEvent, "worker nested receive event should use MessageEvent");
    assert_equals(readyData.typeString, "[object MessageEvent]", "worker nested receive event brand");
    assert_equals(readyData.origin, "", "worker nested receive event.origin");
    assert_equals(readyData.lastEventId, "", "worker nested receive event.lastEventId");
    assert_equals(readyData.sourceIsNull, true, "worker nested receive event.source");
    assert_equals(readyData.portsLength, 1, "event.ports should list the transferred MessagePort");
    assert_equals(readyData.portsStable, true, "worker nested receive event.ports should be stable");
    assert_true(readyData.sameWrapper, "payload host object and event.ports should share the same wrapper");
    assert_true(readyData.isMessagePort, "payload host object should deserialize as MessagePort");

    channel.port1.postMessage("ping");
    assert_equals(await reply, "nested:ping", "nested transferred MessagePort should round-trip messages");
  } finally {
    channel.port1.close();
    channel.port2.close();
    worker.terminate();
  }
}

async function assert_messageport_postmessage_forwards_port_to_worker() {
  const worker = new Worker(
    worker_url(
      [
        "let control = null;",
        "onmessage = function (event) {",
        "  if (event.data !== 'connect') {",
        "    return;",
        "  }",
        "  control = event.ports[0];",
        "  control.onmessage = function (messageEvent) {",
        "    if (!messageEvent.data || messageEvent.data.kind !== 'forward-port') {",
        "      return;",
        "    }",
        "    const forwarded = messageEvent.data.port;",
        "    control.postMessage({",
        "      kind: 'forward-ready',",
        "      isMessageEvent: messageEvent instanceof MessageEvent,",
        "      typeString: Object.prototype.toString.call(messageEvent),",
        "      origin: messageEvent.origin,",
        "      lastEventId: messageEvent.lastEventId,",
        "      sourceIsNull: messageEvent.source === null,",
        "      portsLength: messageEvent.ports.length,",
        "      portsStable: messageEvent.ports === messageEvent.ports,",
        "      sameWrapper: forwarded === messageEvent.ports[0],",
        "      isMessagePort: forwarded instanceof MessagePort,",
        "    });",
        "    forwarded.onmessage = function (innerEvent) {",
        "      forwarded.postMessage('forwarded:' + innerEvent.data);",
        "    };",
        "  };",
        "  postMessage({ kind: 'control-ready' });",
        "};",
      ].join("\n"),
    ),
  );
  const control = new MessageChannel();
  const inner = new MessageChannel();

  try {
    const controlReady = new Promise(function (resolve) {
      worker.onmessage = function (event) {
        assert_message_event_defaults(event, "control ready delivery", 0);
        if (event.data.kind === "control-ready") {
          resolve(event.data);
        }
      };
    });
    worker.postMessage("connect", [control.port2]);
    await controlReady;

    const forwardReady = new Promise(function (resolve) {
      control.port1.onmessage = function (event) {
        assert_message_event_defaults(event, "forward ready delivery", 0);
        if (event.data.kind === "forward-ready") {
          resolve(event.data);
        }
      };
    });
    const reply = new Promise(function (resolve) {
      inner.port1.onmessage = function (event) {
        assert_message_event_defaults(event, "forwarded port reply", 0);
        resolve(event.data);
      };
    });

    control.port1.postMessage({ kind: "forward-port", port: inner.port2 }, [inner.port2]);

    const readyData = await forwardReady;
    assert_true(readyData.isMessageEvent, "worker forwarded receive event should use MessageEvent");
    assert_equals(readyData.typeString, "[object MessageEvent]", "worker forwarded receive event brand");
    assert_equals(readyData.origin, "", "worker forwarded receive event.origin");
    assert_equals(readyData.lastEventId, "", "worker forwarded receive event.lastEventId");
    assert_equals(readyData.sourceIsNull, true, "worker forwarded receive event.source");
    assert_equals(readyData.portsLength, 1, "MessagePort message event should expose forwarded ports");
    assert_equals(readyData.portsStable, true, "worker forwarded receive event.ports should be stable");
    assert_true(readyData.sameWrapper, "forwarded payload port and event.ports should share a wrapper");
    assert_true(readyData.isMessagePort, "forwarded payload port should preserve its interface");

    inner.port1.postMessage("ping");
    assert_equals(await reply, "forwarded:ping", "MessagePort.postMessage should transfer a port to a worker");
  } finally {
    control.port1.close();
    control.port2.close();
    inner.port1.close();
    inner.port2.close();
    worker.terminate();
  }
}

function assert_worker_rejects_duplicate_messageport_transfer() {
  const worker = new Worker(worker_url("postMessage('ready');"));
  const channel = new MessageChannel();

  try {
    assert_throws_name("DataCloneError", function () {
      worker.postMessage("duplicate", [channel.port1, channel.port1]);
    }, "duplicate MessagePort in a transfer list should throw");

    assert_throws_name("DataCloneError", function () {
      worker.postMessage("duplicate", { transfer: [channel.port1, channel.port1] });
    }, "duplicate MessagePort in options.transfer should throw");
  } finally {
    channel.port1.close();
    channel.port2.close();
    worker.terminate();
  }
}

promise_test(async function () {
  await assert_worker_postmessage_options_transfer_port();
  await assert_worker_postmessage_nested_port_transfer();
  await assert_messageport_postmessage_forwards_port_to_worker();
  assert_worker_rejects_duplicate_messageport_transfer();
}, "Worker and worker-owned MessagePort support MessagePort transfer option semantics");
</script>
