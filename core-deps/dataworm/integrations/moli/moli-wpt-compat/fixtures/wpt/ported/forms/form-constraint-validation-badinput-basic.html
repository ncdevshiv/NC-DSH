<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body>
  <form id="form">
    <input id="number" type="number">
  </form>
</body>
<script>
window.__lmAssertBadInputState = function (expression, description) {
  if (!expression) {
    throw new Error(description);
  }
};

test(function () {
  const input = document.getElementById("number");

  input.value = "not-a-number";
  assert_equals(input.value, "", "script-set invalid number values should sanitize to empty");
  assert_false(input.validity.badInput, "script-set invalid number text should not create badInput");
  assert_true(input.validity.valid, "empty non-required number input should remain valid");
}, "script-set invalid number strings do not create badInput");
</script>
