<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected exception");
}

test(function () {
  const canvas = document.createElement("canvas");

  assert_true(canvas instanceof HTMLCanvasElement);
  assert_equals(canvas.width, 300);
  assert_equals(canvas.height, 150);

  canvas.width = 640;
  canvas.height = 480;
  assert_equals(canvas.width, 640);
  assert_equals(canvas.height, 480);
}, "HTMLCanvasElement exposes default and mutable dimensions");

test(function () {
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");

  assert_true(context instanceof CanvasRenderingContext2D);
  assert_equals(canvas.getContext("2d"), context);
  assert_equals(canvas.getContext("webgl"), null);
  assert_equals(canvas.getContext("unknown"), null);
  context.fillRect(0, 0, 10, 10);
}, "HTMLCanvasElement.getContext('2d') returns a cached 2D context");

test(function () {
  const context = document.createElement("canvas").getContext("2d");

  assert_equals(context.fillStyle, "#000000");
  context.fillStyle = "red";
  assert_equals(context.fillStyle, "#ff0000");
  context.fillStyle = "rebeccapurple";
  assert_equals(context.fillStyle, "#663399");
  context.fillStyle = "invalid-color";
  assert_equals(context.fillStyle, "#663399");
  context.fillStyle = "#fc0";
  assert_equals(context.fillStyle, "#ffcc00");
  context.fillStyle = "#fF00000F";
  assert_equals(context.fillStyle, "rgba(255, 0, 0, 0.06)");
}, "CanvasRenderingContext2D.fillStyle canonicalizes supported color forms");

test(function () {
  const context = document.createElement("canvas").getContext("2d");
  const defaultWidth = context.measureText("abc").width;

  assert_equals(context.font, "10px sans-serif");
  context.font = "bold 48px serif";
  assert_equals(context.font, "bold 48px serif");
  assert_true(defaultWidth > 0);
  assert_true(context.measureText("abc").width > defaultWidth);
}, "CanvasRenderingContext2D exposes simple font state and text metrics");

test(function () {
  const context = document.createElement("canvas").getContext("2d");
  const imageData = context.createImageData(100, 200);

  assert_true(imageData instanceof ImageData);
  assert_equals(imageData.width, 100);
  assert_equals(imageData.height, 200);
  assert_true(imageData.data instanceof Uint8ClampedArray);
  assert_equals(imageData.data.length, 100 * 200 * 4);
  assert_equals(imageData.data[0], 0);
  assert_equals(imageData.data[1], 0);
  assert_equals(imageData.data[2], 0);
  assert_equals(imageData.data[3], 0);

  const copy = context.createImageData(imageData);
  assert_equals(copy.width, 100);
  assert_equals(copy.height, 200);
  assert_equals(copy.data.length, imageData.data.length);
}, "CanvasRenderingContext2D.createImageData() creates zeroed ImageData");

test(function () {
  const canvas = document.createElement("canvas");
  canvas.width = 100;
  canvas.height = 50;
  const context = canvas.getContext("2d");
  const imageData = context.getImageData(0, 0, 10, 20);

  assert_true(imageData instanceof ImageData);
  assert_equals(imageData.width, 10);
  assert_equals(imageData.height, 20);
  assert_equals(imageData.data.length, 10 * 20 * 4);
  assert_equals(imageData.data[0], 0);
  assert_equals(imageData.data[1], 0);
  assert_equals(imageData.data[2], 0);
  assert_equals(imageData.data[3], 0);

  assert_throws_name(
    "IndexSizeError",
    () => context.getImageData(0, 0, 0, 10),
    "zero width must throw",
  );
  assert_throws_name(
    "IndexSizeError",
    () => context.getImageData(0, 0, 10, 0),
    "zero height must throw",
  );
}, "CanvasRenderingContext2D.getImageData() returns transparent pixels and validates size");

test(function () {
  const canvas = document.createElement("canvas");
  const dataUrl = canvas.toDataURL();

  assert_true(dataUrl.startsWith("data:image/png;base64,"));
  canvas.width = 0;
  assert_equals(canvas.toDataURL(), "data:,");
}, "HTMLCanvasElement.toDataURL() exposes current placeholder serialization");
</script>
