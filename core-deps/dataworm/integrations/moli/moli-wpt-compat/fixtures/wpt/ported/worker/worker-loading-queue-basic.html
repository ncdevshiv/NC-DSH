<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for(promise, description) {
  return Promise.race([
    promise,
    wait(500).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

promise_test(async function () {
  const workerUrl = new URL("/wpt/runtime/worker/slow.js", location.href).href;
  const worker = new Worker(workerUrl);
  const events = [];

  try {
    await wait_for(
      new Promise(function (resolve) {
        worker.onmessage = function (event) {
          events.push(event.data);
          if (events.length >= 2) {
            resolve();
          }
        };
        worker.postMessage("queued");
      }),
      "worker loading queue flush",
    );

    assert_array_equals(
      events,
      ["loaded", "pong:queued"],
      "messages sent while the worker script is still loading should flush after startup",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated workers flush queued postMessage calls after the script finishes loading");

promise_test(async function () {
  const workerUrl = new URL("/wpt/runtime/worker/slow.js", location.href).href;
  const worker = new Worker(workerUrl);
  let delivered = false;

  try {
    worker.onmessage = function () {
      delivered = true;
    };
    worker.onerror = function () {
      delivered = true;
    };

    worker.postMessage("queued-before-terminate");
    worker.terminate();
    await wait(180);

    assert_false(delivered, "terminate() while loading should drop queued messages and late startup delivery");
  } finally {
    worker.terminate();
  }
}, "Dedicated worker terminate() drops queued messages before a slow script finishes loading");
</script>
