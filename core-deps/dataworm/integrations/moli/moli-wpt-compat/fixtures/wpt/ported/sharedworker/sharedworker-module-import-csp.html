<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
let uniqueNameCounter = 0;

function unique_name(prefix) {
  uniqueNameCounter++;
  return prefix + "-" + Date.now() + "-" + uniqueNameCounter;
}

function next_worker_outcome(worker) {
  return new Promise(function (resolve) {
    worker.onerror = function (event) {
      resolve(["worker-error", String(event.message || "")]);
    };
    worker.port.onmessage = function (event) {
      resolve(event.data);
    };
    worker.port.start();
  });
}

promise_test(async function () {
  const meta = document.createElement("meta");
  meta.setAttribute("http-equiv", "Content-Security-Policy");
  meta.setAttribute("content", "worker-src 'self'; script-src 'self'");
  document.head.appendChild(meta);

  const worker = new SharedWorker(
    "/wpt/ported/sharedworker/resources/module-import-csp/static-main.js",
    { type: "module", name: unique_name("module-static-csp") },
  );
  const outcome = await next_worker_outcome(worker);

  assert_array_equals(
    outcome,
    ["static", "module-csp-dependency"],
    "SharedWorker static module imports use the creating document CSP",
  );
}, "Module SharedWorker static import uses outside CSP, not response CSP");

promise_test(async function () {
  const worker = new SharedWorker(
    "/wpt/ported/sharedworker/resources/module-import-csp/dynamic-main.js",
    { type: "module", name: unique_name("module-dynamic-csp") },
  );
  const outcome = await next_worker_outcome(worker);

  assert_array_equals(
    outcome,
    ["dynamic", "blocked", "TypeError"],
    "SharedWorker dynamic imports use the worker script response CSP",
  );
}, "Module SharedWorker dynamic import uses response CSP, not outside CSP");
</script>
