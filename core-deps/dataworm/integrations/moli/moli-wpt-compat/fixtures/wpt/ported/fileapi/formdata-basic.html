<!doctype html>
<meta charset="utf-8">
<form id="fixture-form">
  <input name="alpha" value="1">
  <input name="skip" value="disabled" disabled>
  <input type="submit" id="fixture-submit" name="action" value="save">
</form>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(name, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, name, description);
    return;
  }
  assert_unreached(description || `Expected ${name}`);
}

test(function () {
  const data = new FormData();
  data.append("a", "1");
  data.append("a", "2");
  data.append("b", "3");

  assert_true(data instanceof FormData);
  assert_equals(data.get("a"), "1");
  assert_array_equals(data.getAll("a"), ["1", "2"]);
  assert_true(data.has("b"));
  assert_equals(data.get("missing"), null);
  assert_array_equals(data.getAll("missing"), []);

  data.delete("a");
  assert_false(data.has("a"));
  assert_equals(data.get("b"), "3");
}, "FormData stores repeated string fields and supports lookup/delete");

test(function () {
  const data = new FormData();
  data.append("a", "1");
  data.append("b", "2");
  data.append("a", "3");

  assert_array_equals(Array.from(data.keys()), ["a", "b", "a"]);
  assert_array_equals(Array.from(data.values()), ["1", "2", "3"]);
  assert_equals(
    JSON.stringify(Array.from(data.entries())),
    JSON.stringify([["a", "1"], ["b", "2"], ["a", "3"]]),
  );
  assert_equals(
    JSON.stringify(Array.from(data)),
    JSON.stringify([["a", "1"], ["b", "2"], ["a", "3"]]),
  );
}, "FormData iterators preserve insertion order");

test(function () {
  const data = new FormData();
  data.append("x", "10");
  data.append("y", "20");
  const seen = [];

  data.forEach(function (value, key, formData) {
    seen.push([key, value, formData === data, this.marker]);
  }, { marker: "context" });

  assert_equals(
    JSON.stringify(seen),
    JSON.stringify([
      ["x", "10", true, "context"],
      ["y", "20", true, "context"],
    ]),
  );
}, "FormData.forEach receives value, key, instance, and thisArg");

promise_test(async function () {
  const blob = new Blob(["payload"], { type: "text/plain" });
  const data = new FormData();
  data.append("file", blob);

  const value = data.get("file");
  assert_true(value instanceof Blob);
  assert_equals(value.type, "text/plain");
  assert_equals(await value.text(), "payload");
}, "FormData preserves Blob values");

test(function () {
  const form = document.getElementById("fixture-form");
  const submitter = document.getElementById("fixture-submit");
  const data = new FormData(form, submitter);

  assert_equals(
    JSON.stringify(Array.from(data.entries())),
    JSON.stringify([["alpha", "1"], ["action", "save"]]),
  );
}, "FormData serializes successful form controls and the selected submitter");

test(function () {
  const form = document.getElementById("fixture-form");
  const observed = [];
  let eventFormData = null;

  form.addEventListener("formdata", function (event) {
    observed.push({
      type: event.type,
      trusted: event.isTrusted,
      bubbles: event.bubbles,
      cancelable: event.cancelable,
      target: event.target === form,
      currentTarget: event.currentTarget === form,
      instance: event instanceof FormDataEvent,
    });
    eventFormData = event.formData;
    event.formData.append("listener", "added");
  }, { once: true });

  const data = new FormData(form);
  assert_not_equals(eventFormData, data, "event.formData should be a separate FormData object");
  assert_equals(data.get("listener"), "added", "listener mutations should be copied to the returned FormData");
  eventFormData.append("late", "ignored");
  assert_false(data.has("late"), "late event FormData mutations should not affect the returned FormData");
  assert_equals(
    JSON.stringify(observed),
    JSON.stringify([{
      type: "formdata",
      trusted: true,
      bubbles: true,
      cancelable: false,
      target: true,
      currentTarget: true,
      instance: true,
    }]),
  );
}, "FormData(form) dispatches a trusted formdata event with an independent FormData object");

test(function () {
  const form = document.getElementById("fixture-form");
  let count = 0;

  form.addEventListener("formdata", function (event) {
    count++;
    assert_throws_name(
      "InvalidStateError",
      () => new FormData(event.target),
      "reentrant FormData construction should throw",
    );
    event.formData.append("reentrant", "ok");
  }, { once: true });

  const data = new FormData(form);
  assert_equals(count, 1);
  assert_equals(data.get("reentrant"), "ok", "listener mutations should still be copied out");
}, "FormData(form) inside a formdata event throws InvalidStateError");

test(function () {
  const data = new FormData();

  assert_throws_name("TypeError", () => data.append("missing-value"), "append value is required");
  assert_throws_name("TypeError", () => data.set("missing-value"), "set value is required");
  assert_throws_name("TypeError", () => data.get(), "get name is required");
  assert_throws_name("TypeError", () => data.getAll(), "getAll name is required");
  assert_throws_name("TypeError", () => data.has(), "has name is required");
  assert_throws_name("TypeError", () => data.delete(), "delete name is required");
  assert_throws_name("TypeError", () => data.forEach(), "forEach callback is required");

  assert_throws_name("TypeError", () => data.append(Symbol("name"), "value"), "name Symbol conversion should throw");
  assert_throws_name("TypeError", () => data.append("name", Symbol("value")), "value Symbol conversion should throw");
  assert_throws_name(
    "Error",
    () => data.append({ toString() { throw new Error("name failed"); } }, "value"),
    "name stringification errors should propagate",
  );
  assert_throws_name(
    "Error",
    () => data.append("name", { toString() { throw new Error("value failed"); } }),
    "value stringification errors should propagate",
  );
  assert_throws_name(
    "TypeError",
    () => data.append("name", "value", "filename.txt"),
    "append third argument should select the Blob overload",
  );
  assert_throws_name(
    "TypeError",
    () => data.set("name", "value", "filename.txt"),
    "set third argument should select the Blob overload",
  );
  assert_throws_name(
    "TypeError",
    () => data.append("name", { toString() { throw new Error("value failed"); } }, "filename.txt"),
    "Blob overload resolution should not stringify non-Blob values",
  );

  const blob = new Blob(["payload"]);
  assert_throws_name("TypeError", () => data.append("file", blob, Symbol("filename")), "filename Symbol conversion should throw");
  assert_throws_name(
    "Error",
    () => data.append("file", blob, { toString() { throw new Error("filename failed"); } }),
    "filename stringification errors should propagate",
  );
}, "FormData methods use WebIDL argument conversion");
</script>
