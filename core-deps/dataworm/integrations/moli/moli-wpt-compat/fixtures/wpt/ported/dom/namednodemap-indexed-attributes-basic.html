<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected exception");
}

function assert_attr(attr, expected) {
  assert_true(attr instanceof Attr, "instanceof Attr");
  assert_equals(attr.name, expected.name, "name");
  assert_equals(attr.nodeName, expected.name, "nodeName");
  assert_equals(attr.localName, expected.localName, "localName");
  assert_equals(attr.namespaceURI, expected.namespaceURI, "namespaceURI");
  assert_equals(attr.prefix, expected.prefix, "prefix");
  assert_equals(attr.value, expected.value, "value");
  assert_equals(attr.ownerElement, expected.ownerElement, "ownerElement");
}

test(function () {
  const el = document.createElement("div");
  el.setAttribute("foo", "plain");
  el.setAttributeNS("", "FOO", "upper");
  el.setAttributeNS("dummy1", "foo", "namespaced");
  el.setAttributeNS("dummy2", "dummy:foo", "prefixed");

  assert_equals(el.attributes.length, 4);
  assert_attr(el.attributes[0], {
    name: "foo",
    localName: "foo",
    namespaceURI: null,
    prefix: null,
    value: "plain",
    ownerElement: el,
  });
  assert_attr(el.attributes[1], {
    name: "FOO",
    localName: "FOO",
    namespaceURI: null,
    prefix: null,
    value: "upper",
    ownerElement: el,
  });
  assert_attr(el.attributes[2], {
    name: "foo",
    localName: "foo",
    namespaceURI: "dummy1",
    prefix: null,
    value: "namespaced",
    ownerElement: el,
  });
  assert_attr(el.attributes[3], {
    name: "dummy:foo",
    localName: "foo",
    namespaceURI: "dummy2",
    prefix: "dummy",
    value: "prefixed",
    ownerElement: el,
  });
}, "NamedNodeMap indexed access preserves per-attribute namespace metadata");

test(function () {
  const el = document.createElement("div");
  el.setAttribute("foo", "plain");
  el.setAttributeNS("", "FOO", "upper");
  el.setAttributeNS("dummy1", "foo", "namespaced");
  el.setAttributeNS("dummy2", "dummy:foo", "prefixed");

  assert_equals(el.attributes.item(0).name, "foo");
  assert_equals(el.attributes.item(1).name, "FOO");
  assert_equals(el.attributes.item(2).namespaceURI, "dummy1");
  assert_equals(el.attributes.item(3).name, "dummy:foo");
  assert_equals(el.attributes.item(4), null, "out-of-range item() should return null");
  assert_equals(el.attributes.item(-1), null, "wrapped negative index should return null when out of range");
  assert_throws_name("TypeError", () => el.attributes.item(), "item() should require its index argument");
  assert_equals(el.attributes.item(undefined).name, "foo", "explicit undefined should convert to zero");
  assert_equals(el.attributes.item(null).name, "foo", "null should convert to zero");
  assert_equals(el.attributes.item("1.9").name, "FOO", "string decimals should truncate through unsigned long conversion");
  assert_equals(el.attributes.item(NaN).name, "foo", "NaN should convert to zero");
  assert_equals(el.attributes.item(Infinity).name, "foo", "Infinity should convert to zero");
  assert_equals(el.attributes.item(-4294967295).name, "FOO", "negative values should wrap through unsigned long conversion");
  assert_equals(el.attributes.item(4294967297).name, "FOO", "large values should wrap through unsigned long conversion");
  assert_equals(
    el.attributes.item({
      valueOf() { return {}; },
      toString() { return "2"; },
    }).namespaceURI,
    "dummy1",
    "object values should fall back to toString during unsigned long conversion",
  );
  assert_throws_name("Error", () => {
    el.attributes.item({ valueOf() { throw new Error("item conversion failed"); } });
  }, "item() should propagate object conversion exceptions");
  assert_throws_name("TypeError", () => el.attributes.item(Symbol("index")), "item() should reject Symbol conversion");
  assert_throws_name("TypeError", () => el.attributes.item(1n), "item() should reject BigInt conversion");
  assert_array_equals(Array.from(el.attributes).map((attr) => attr.name), [
    "foo",
    "FOO",
    "foo",
    "dummy:foo",
  ]);
  assert_array_equals(Array.from(el.attributes).map((attr) => attr.value), [
    "plain",
    "upper",
    "namespaced",
    "prefixed",
  ]);
}, "NamedNodeMap item() and iteration preserve indexed Attr identity metadata");

test(function () {
  const el = document.createElement("div");
  el.setAttribute("foo", "plain");
  el.setAttributeNS("", "FOO", "upper");
  const map = el.attributes;

  assert_equals(map.item(undefined).name, "foo");
  assert_equals(map.item(null).name, "foo");
  assert_equals(map.item(NaN).name, "foo");
  assert_equals(map.item(1.9).name, "FOO");
  assert_equals(map.item("1").name, "FOO");
  assert_equals(map.item(-1), null);
  assert_throws_name("TypeError", function () {
    map.item();
  }, "missing argument");
  assert_throws_name("TypeError", function () {
    map.item(Symbol());
  }, "Symbol conversion error");
}, "NamedNodeMap.item() follows WebIDL unsigned long conversion");

test(function () {
  const el = document.createElement("div");
  el.setAttribute("foo", "plain");
  el.setAttributeNS("", "FOO", "upper");
  el.setAttributeNS("dummy1", "foo", "namespaced");

  el.attributes[1].value = "changed";
  assert_equals(el.getAttributeNS("", "FOO"), "changed");
  assert_equals(el.getAttribute("foo"), "plain");

  el.attributes[2].value = "ns-changed";
  assert_equals(el.getAttributeNS("dummy1", "foo"), "ns-changed");
  assert_equals(el.getAttribute("foo"), "plain");
}, "Indexed live Attr value setter updates the matching namespace/localName slot");
</script>
