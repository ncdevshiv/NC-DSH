<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body></body>
<script>
function withHost(markup, callback) {
  const host = document.createElement("div");
  host.innerHTML = markup;
  document.body.appendChild(host);
  try {
    callback(host);
  } finally {
    host.remove();
  }
}

test(function () {
  withHost(
    `
      <form id="form">
        <input id="text" type="text" value="seed">
        <input id="check" type="checkbox" checked>
        <textarea id="bio">initial</textarea>
        <select id="choice">
          <option value="a">A</option>
          <option value="b" selected>B</option>
        </select>
      </form>
    `,
    function (host) {
      const form = host.querySelector("#form");
      const text = host.querySelector("#text");
      const check = host.querySelector("#check");
      const bio = host.querySelector("#bio");
      const choice = host.querySelector("#choice");
      let resetCount = 0;
      let resetSurfaceOk = true;

      form.addEventListener("reset", function (event) {
        resetCount += 1;
        resetSurfaceOk =
          resetSurfaceOk &&
          event.target === form &&
          event.currentTarget === form &&
          event.cancelable === true;
      });

      text.value = "typed";
      text.defaultValue = "new-default";
      check.checked = false;
      check.defaultChecked = true;
      bio.value = "dirty-bio";
      bio.defaultValue = "default-bio";
      choice.value = "a";

      assert_equals(text.value, "typed", "input value should reflect the dirty value before reset");
      assert_equals(text.defaultValue, "new-default", "input defaultValue should update independently");
      assert_false(check.checked, "checkbox should reflect its dirty checked state before reset");
      assert_true(check.defaultChecked, "checkbox defaultChecked should remain the reset target");
      assert_equals(bio.value, "dirty-bio", "textarea value should reflect the dirty value before reset");
      assert_equals(bio.defaultValue, "default-bio", "textarea defaultValue should update independently");
      assert_equals(choice.value, "a", "select value should reflect the dirty selection before reset");
      assert_equals(choice.selectedIndex, 0, "select selectedIndex should reflect the dirty selection");

      form.reset();

      assert_equals(resetCount, 1, "form.reset should dispatch one reset event");
      assert_true(resetSurfaceOk, "reset event should target the form and remain cancelable");
      assert_equals(text.value, "new-default", "reset should restore the input to its current default");
      assert_equals(text.defaultValue, "new-default", "input defaultValue should remain updated");
      assert_true(check.checked, "reset should restore the checkbox checked state");
      assert_true(check.defaultChecked, "checkbox defaultChecked should remain the reset source");
      assert_equals(bio.value, "default-bio", "reset should restore the textarea to its current default");
      assert_equals(bio.defaultValue, "default-bio", "textarea defaultValue should remain updated");
      assert_equals(choice.value, "b", "reset should restore the select to its default option");
      assert_equals(choice.selectedIndex, 1, "reset should restore the select selectedIndex");
      assert_false(choice.options[0].selected, "reset should clear the dirty option");
      assert_true(choice.options[1].selected, "reset should restore the default-selected option");
    },
  );
}, "HTMLFormElement.reset restores dirty input, checkbox, textarea, and select state");

test(function () {
  withHost(
    `
      <form id="form">
        <input id="text" type="text" value="seed">
        <input id="check" type="checkbox" checked>
        <textarea id="bio">initial</textarea>
        <select id="choice">
          <option value="a">A</option>
          <option value="b" selected>B</option>
        </select>
      </form>
    `,
    function (host) {
      const form = host.querySelector("#form");
      const text = host.querySelector("#text");
      const check = host.querySelector("#check");
      const bio = host.querySelector("#bio");
      const choice = host.querySelector("#choice");
      let resetCount = 0;

      form.addEventListener("reset", function () {
        resetCount += 1;
      });
      form.addEventListener(
        "reset",
        function (event) {
          event.preventDefault();
        },
        { once: true },
      );

      text.value = "typed";
      check.checked = false;
      bio.value = "dirty-bio";
      choice.value = "a";

      form.reset();

      assert_equals(resetCount, 1, "prevented reset should still dispatch one reset event");
      assert_equals(text.value, "typed", "preventDefault should keep the input dirty value");
      assert_equals(text.defaultValue, "seed", "preventDefault should not rewrite input defaultValue");
      assert_false(check.checked, "preventDefault should keep the dirty checkbox state");
      assert_true(check.defaultChecked, "checkbox defaultChecked should remain unchanged");
      assert_equals(bio.value, "dirty-bio", "preventDefault should keep the dirty textarea value");
      assert_equals(bio.defaultValue, "initial", "preventDefault should not rewrite textarea defaultValue");
      assert_equals(choice.value, "a", "preventDefault should keep the dirty select value");
      assert_equals(choice.selectedIndex, 0, "preventDefault should keep the dirty select index");
    },
  );
}, "HTMLFormElement.reset respects preventDefault on the reset event");
</script>
