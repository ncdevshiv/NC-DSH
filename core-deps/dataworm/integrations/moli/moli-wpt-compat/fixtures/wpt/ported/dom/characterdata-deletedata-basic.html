<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback) {
  let thrown = null;
  try {
    callback();
  } catch (error) {
    thrown = error;
  }
  assert_true(!!thrown, "expected exception");
  assert_equals(thrown.name, expectedName);
}

function test_delete_data(create, type) {
  test(function() {
    const node = create();
    assert_throws_name("IndexSizeError", function() { node.deleteData(5, 10); });
    assert_throws_name("IndexSizeError", function() { node.deleteData(-1, 0); });
    assert_equals(node.data, "test");
  }, type + ".deleteData() rejects out-of-bounds offset");

  test(function() {
    const node = create();
    node.deleteData(0, 2);
    assert_equals(node.data, "st");
    assert_equals(node.length, 2);
  }, type + ".deleteData() at the start");

  test(function() {
    const node = create();
    node.deleteData(2, 10);
    assert_equals(node.data, "te");
  }, type + ".deleteData() clamps count at the end");

  test(function() {
    const node = create();
    node.deleteData(1, 1);
    assert_equals(node.data, "tst");
  }, type + ".deleteData() in the middle");

  test(function() {
    const node = create();
    node.deleteData(2, 0);
    assert_equals(node.data, "test");
  }, type + ".deleteData() with zero count");

  test(function() {
    const node = create();
    node.deleteData(2, -1);
    assert_equals(node.data, "te");

    const wrapped = create();
    wrapped.deleteData(1, -0x100000000 + 2);
    assert_equals(wrapped.data, "tt");
  }, type + ".deleteData() uses unsigned long count conversion");

  test(function() {
    const node = create();
    node.data = "This is the character data test, append more \u8cc7\u6599\uff0c\u66f4\u591a\u6e2c\u8a66\u8cc7\u6599";
    node.deleteData(40, 5);
    assert_equals(node.data, "This is the character data test, append \u8cc7\u6599\uff0c\u66f4\u591a\u6e2c\u8a66\u8cc7\u6599");
    node.deleteData(45, 2);
    assert_equals(node.data, "This is the character data test, append \u8cc7\u6599\uff0c\u66f4\u591a\u8cc7\u6599");
  }, type + ".deleteData() handles non-ASCII data");

  test(function() {
    const node = create();
    node.data = "\ud83c\udf20 test \ud83c\udf20 TEST";
    node.deleteData(5, 8);
    assert_equals(node.data, "\ud83c\udf20 teST");
  }, type + ".deleteData() counts UTF-16 code units");
}

test_delete_data(function() { return document.createTextNode("test"); }, "Text");
test_delete_data(function() { return document.createComment("test"); }, "Comment");
</script>
