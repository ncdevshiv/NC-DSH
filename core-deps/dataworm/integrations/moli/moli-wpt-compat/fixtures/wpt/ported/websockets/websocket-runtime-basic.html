<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function websocket_url(path) {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  return scheme + "//" + location.host + path;
}

function event_summary(label, expectedType, event, socket) {
  return [
    label,
    event.type,
    event instanceof Event,
    expectedType === "message" ? event instanceof MessageEvent : true,
    expectedType === "close" ? event instanceof CloseEvent : true,
    event.target === socket,
    event.currentTarget === socket,
    event.eventPhase,
    event.bubbles,
    event.cancelable,
  ].join(":");
}

promise_test(async function () {
  const socket = new WebSocket(websocket_url("/wpt/runtime/websocket/echo"));
  const events = [];

  const closed = new Promise(function (resolve, reject) {
    socket.addEventListener("open", function (event) {
      events.push(event_summary("open-listener-1", "open", event, socket));
      socket.send("event-order");
    });
    socket.onopen = function (event) {
      events.push(event_summary("open-on", "open", event, socket));
    };
    socket.addEventListener("open", function (event) {
      events.push(event_summary("open-listener-2", "open", event, socket));
    });
    socket.addEventListener("message", function (event) {
      events.push(event_summary("message-listener-1", "message", event, socket));
    });
    socket.onmessage = function (event) {
      events.push(event_summary("message-on", "message", event, socket));
      socket.close(1000, "events");
    };
    socket.addEventListener("message", function (event) {
      events.push(event_summary("message-listener-2", "message", event, socket));
    });
    socket.addEventListener("close", function (event) {
      events.push(event_summary("close-listener-1", "close", event, socket));
    });
    socket.onclose = function (event) {
      events.push(event_summary("close-on", "close", event, socket));
    };
    socket.addEventListener("close", function (event) {
      events.push(event_summary("close-listener-2", "close", event, socket));
      resolve(event);
    });
    socket.addEventListener("error", reject, { once: true });
  });

  const closeEvent = await closed;
  assert_true(closeEvent.wasClean, "echo close should be clean");
  assert_equals(closeEvent.code, 1000, "echo close code");
  assert_equals(closeEvent.reason, "events", "echo close reason");
  assert_array_equals(events, [
    "open-listener-1:open:true:true:true:true:true:2:false:false",
    "open-on:open:true:true:true:true:true:2:false:false",
    "open-listener-2:open:true:true:true:true:true:2:false:false",
    "message-listener-1:message:true:true:true:true:true:2:false:false",
    "message-on:message:true:true:true:true:true:2:false:false",
    "message-listener-2:message:true:true:true:true:true:2:false:false",
    "close-listener-1:close:true:true:true:true:true:2:false:false",
    "close-on:close:true:true:true:true:true:2:false:false",
    "close-listener-2:close:true:true:true:true:true:2:false:false",
  ], "event listeners and IDL attributes should fire in registration order with browser-style metadata");
}, "WebSocket echo preserves WPT-target event ordering and metadata");

promise_test(async function () {
  const socket = new WebSocket(websocket_url("/wpt/runtime/websocket/echo"));
  const expectedOrigin = new URL(socket.url).origin;
  const events = [];

  const closed = new Promise(function (resolve, reject) {
    socket.addEventListener("open", function () {
      socket.send("origin");
    }, { once: true });
    socket.addEventListener("message", function (event) {
      events.push("message:" + event.origin + ":" + event.data);
      socket.close(1000, "origin");
    }, { once: true });
    socket.addEventListener("close", function (event) {
      events.push("close:" + event.wasClean);
      resolve();
    }, { once: true });
    socket.addEventListener("error", reject, { once: true });
  });

  await closed;
  assert_array_equals(events, [
    "message:" + expectedOrigin + ":origin",
    "close:true",
  ], "message origin should expose the websocket origin");
}, "WebSocket MessageEvent.origin matches the socket origin");

promise_test(async function () {
  const socket = new WebSocket(websocket_url("/wpt/runtime/websocket/server-close"));
  const events = [];

  await new Promise(function (resolve, reject) {
    socket.addEventListener("open", function () {
      events.push("open:" + socket.readyState);
    }, { once: true });
    socket.addEventListener("close", function (event) {
      events.push("close:" + socket.readyState + ":" + event.code + ":" + event.reason + ":" + event.wasClean);
      resolve();
    }, { once: true });
    socket.addEventListener("error", reject, { once: true });
  });

  assert_array_equals(events, [
    "open:1",
    "close:3:3001:server done:true",
  ], "server-initiated close should expose code, reason, clean state, and final readyState");
}, "WebSocket server-initiated close reports code, reason, and clean state");
</script>
