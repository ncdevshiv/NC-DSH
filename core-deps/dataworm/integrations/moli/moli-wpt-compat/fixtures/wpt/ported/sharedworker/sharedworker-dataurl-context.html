<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function data_frame_url(script_source) {
  return "data:text/html;charset=utf-8," + encodeURIComponent(
    "<!doctype html><meta charset='utf-8'><script>" + script_source + "<\/script>",
  );
}

function wait_for_data_frame_message(test, token, frame_script) {
  return new Promise(function (resolve, reject) {
    const frame = document.createElement("iframe");
    let settled = false;

    function cleanup() {
      window.removeEventListener("message", on_message);
      frame.remove();
    }

    function on_message(event) {
      if (settled) {
        return;
      }
      if (!event.data || event.data.token !== token) {
        return;
      }
      settled = true;
      cleanup();
      resolve(event.data);
    }

    window.addEventListener("message", on_message);
    test.add_cleanup(cleanup);
    frame.src = data_frame_url(frame_script);
    (document.body || document.documentElement).appendChild(frame);
  });
}

function collect_data_frame_messages(test, token, frame_scripts) {
  return new Promise(function (resolve, reject) {
    const frames = [];
    const messages = [];
    let settled = false;

    function cleanup() {
      window.removeEventListener("message", on_message);
      for (const frame of frames) {
        frame.remove();
      }
    }

    function on_message(event) {
      if (settled) {
        return;
      }
      if (!event.data || event.data.token !== token) {
        return;
      }
      messages.push(event.data);
      if (messages.length === frame_scripts.length) {
        settled = true;
        cleanup();
        resolve(messages);
      }
    }

    window.addEventListener("message", on_message);
    test.add_cleanup(cleanup);
    const container = document.body || document.documentElement;
    for (const script of frame_scripts) {
      const frame = document.createElement("iframe");
      frame.src = data_frame_url(script);
      frames.push(frame);
      container.appendChild(frame);
    }
  });
}

function frame_shared_worker_probe(token, worker_url, name) {
  return [
    "const token = " + JSON.stringify(token) + ";",
    "try {",
    "  const worker = new SharedWorker(" + JSON.stringify(worker_url) + ", " + JSON.stringify(name) + ");",
    "  worker.port.onmessage = event => parent.postMessage({ token, result: event.data }, '*');",
    "  worker.onerror = event => parent.postMessage({ token, result: 'error', message: String(event.message || '') }, '*');",
    "} catch (error) {",
    "  parent.postMessage({ token, result: 'sync-throw', message: String(error && error.message || error) }, '*');",
    "}",
  ].join("\n");
}

promise_test(async function (test) {
  const token = "data-frame-http-worker-fails-async";
  const http_worker_url = new URL(
    "/wpt/ported/sharedworker/resources/runtime-url/fragment-worker.js",
    location.href,
  ).href;
  const message = await wait_for_data_frame_message(
    test,
    token,
    frame_shared_worker_probe(token, http_worker_url, "http-worker-from-data-frame"),
  );
  assert_equals(message.result, "error");
}, "HTTP SharedWorker from a data URL frame fails asynchronously");

promise_test(async function (test) {
  const token = "data-frame-data-worker-succeeds";
  const worker_code = "onconnect = event => event.ports[0].postMessage('PASS');";
  const worker_url = "data:application/javascript," + encodeURIComponent(worker_code);
  const message = await wait_for_data_frame_message(
    test,
    token,
    frame_shared_worker_probe(token, worker_url, "data-worker-from-data-frame"),
  );
  assert_equals(message.result, "PASS");
}, "Data URL SharedWorker from a data URL frame succeeds");

promise_test(async function (test) {
  const token = "data-frame-opaque-isolation";
  const worker_code = [
    "let connections = 0;",
    "onconnect = event => event.ports[0].postMessage(++connections);",
  ].join("\n");
  const worker_url = "data:application/javascript," + encodeURIComponent(worker_code);
  const frame_script = frame_shared_worker_probe(
    token,
    worker_url,
    "same-url-name-in-distinct-data-frames",
  );
  const messages = await collect_data_frame_messages(test, token, [frame_script, frame_script]);
  const counts = messages.map(message => message.result).sort();
  assert_array_equals(counts, [1, 1]);
}, "Same data URL SharedWorker is not shared across distinct data URL frames");
</script>
