<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(
      error && error.name,
      expectedName,
      description || "unexpected exception name"
    );
    return;
  }
  assert_unreached(
    (description || "assert_throws_name") + ": expected an exception"
  );
}

test(() => {
  assert_throws_name(
    "TypeError",
    () => IDBKeyRange.only(),
    "only() value is required"
  );
  assert_throws_name(
    "TypeError",
    () => IDBKeyRange.lowerBound(),
    "lowerBound() lower value is required"
  );
  assert_throws_name(
    "TypeError",
    () => IDBKeyRange.upperBound(),
    "upperBound() upper value is required"
  );
  assert_throws_name(
    "TypeError",
    () => IDBKeyRange.bound(1),
    "bound() upper value is required"
  );
  assert_throws_name(
    "DataError",
    () => IDBKeyRange.only(undefined),
    "present undefined is still validated as an IndexedDB key"
  );
}, "IDBKeyRange constructors distinguish WebIDL required arguments from invalid keys");

test(() => {
  let coercions = 0;
  const truthyObject = {
    valueOf() {
      ++coercions;
      return false;
    },
    toString() {
      ++coercions;
      return "";
    },
  };

  const defaultLower = IDBKeyRange.lowerBound(1);
  assert_false(defaultLower.lowerOpen, "missing lowerBound open defaults false");

  const nullLower = IDBKeyRange.lowerBound(1, null);
  assert_false(nullLower.lowerOpen, "null open converts to false");

  const stringLower = IDBKeyRange.lowerBound(1, "false");
  assert_true(stringLower.lowerOpen, "non-empty string open converts to true");

  const objectLower = IDBKeyRange.lowerBound(1, truthyObject);
  assert_true(objectLower.lowerOpen, "object open converts to true");
  assert_equals(coercions, 0, "boolean conversion does not call valueOf/toString");

  const bound = IDBKeyRange.bound(1, 3, 0, "yes");
  assert_false(bound.lowerOpen, "zero lowerOpen converts to false");
  assert_true(bound.upperOpen, "string upperOpen converts to true");

  const upper = IDBKeyRange.upperBound(3, Symbol("open"));
  assert_true(upper.upperOpen, "Symbol open converts to true");
}, "IDBKeyRange open flags follow WebIDL boolean conversion");

test(() => {
  const inclusive = IDBKeyRange.bound(1, 3);
  assert_true(inclusive.includes(1), "inclusive range includes lower bound");
  assert_true(inclusive.includes(3), "inclusive range includes upper bound");

  const exclusive = IDBKeyRange.bound(1, 3, true, true);
  assert_false(exclusive.includes(1), "exclusive range excludes lower bound");
  assert_false(exclusive.includes(3), "exclusive range excludes upper bound");
  assert_true(exclusive.includes(2), "exclusive range includes interior key");

  assert_throws_name(
    "TypeError",
    () => exclusive.includes(),
    "includes() key is required"
  );
  assert_throws_name(
    "DataError",
    () => exclusive.includes(undefined),
    "includes() validates present undefined as an IndexedDB key"
  );
}, "IDBKeyRange.includes() parses required key and uses existing range semantics");
</script>
