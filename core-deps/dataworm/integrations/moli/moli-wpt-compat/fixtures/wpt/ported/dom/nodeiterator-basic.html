<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function makeElementTree() {
  const root = document.createElement("section");
  root.id = "root";

  const a = document.createElement("article");
  a.id = "a";
  a.appendChild(document.createTextNode("alpha"));

  const b = document.createElement("article");
  b.id = "b";
  const nested = document.createElement("span");
  nested.id = "nested";
  nested.appendChild(document.createTextNode("nested text"));
  b.appendChild(nested);

  const c = document.createElement("article");
  c.id = "c";
  c.appendChild(document.createComment("tail"));

  root.append(a, b, c);
  return root;
}

function assert_readonly(object, property, replacement) {
  const original = object[property];
  try {
    object[property] = replacement;
  } catch (_) {}
  assert_equals(object[property], original, property + " should be readonly");
}

function assert_throws_type_error(callback, message) {
  try {
    callback();
  } catch (error) {
    assert_true(error instanceof TypeError, message);
    return;
  }
  throw new Error(message);
}

function labels(nodes) {
  return nodes.map((node) => node.id || node.nodeValue);
}

test(function () {
  assert_throws_type_error(function () {
    document.createNodeIterator();
  }, "createNodeIterator() without root should throw TypeError");
}, "createNodeIterator() requires a root Node");

test(function () {
  const root = makeElementTree();
  const iterator = document.createNodeIterator(root);

  assert_equals(iterator.toString(), "[object NodeIterator]");
  assert_equals(iterator.constructor.name, "NodeIterator");
  assert_equals(iterator.root, root);
  assert_equals(iterator.whatToShow, 0xffffffff);
  assert_equals(iterator.filter, null);
  assert_equals(iterator.referenceNode, root);
  assert_equals(iterator.pointerBeforeReferenceNode, true);
  assert_readonly(iterator, "root", document);
  assert_readonly(iterator, "whatToShow", NodeFilter.SHOW_ELEMENT);
  assert_readonly(iterator, "filter", function () {
    return NodeFilter.FILTER_ACCEPT;
  });
  assert_readonly(iterator, "referenceNode", document);
  assert_readonly(iterator, "pointerBeforeReferenceNode", false);

  iterator.detach();
  iterator.detach();
  assert_equals(iterator.referenceNode, root);
}, "Construct a NodeIterator and keep readonly attributes stable");

test(function () {
  const root = makeElementTree();

  assert_equals(document.createNodeIterator(root, null, null).whatToShow, 0);
  assert_equals(document.createNodeIterator(root, undefined, undefined).whatToShow, 0xffffffff);
  assert_equals(
    document.createNodeIterator(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_COMMENT).whatToShow,
    NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_COMMENT,
  );
}, "createNodeIterator() optional arguments preserve WPT whatToShow semantics");

test(function () {
  const root = makeElementTree();
  const iterator = document.createNodeIterator(root, NodeFilter.SHOW_ELEMENT);

  assert_equals(iterator.pointerBeforeReferenceNode, true);
  assert_equals(iterator.referenceNode, root);

  assert_equals(iterator.nextNode(), root);
  assert_equals(iterator.pointerBeforeReferenceNode, false);
  assert_equals(iterator.referenceNode, root);

  const a = iterator.nextNode();
  assert_equals(a.id, "a");
  assert_equals(iterator.referenceNode, a);
  assert_equals(iterator.pointerBeforeReferenceNode, false);

  const b = iterator.nextNode();
  assert_equals(b.id, "b");
  assert_equals(iterator.referenceNode, b);

  const back = iterator.previousNode();
  assert_equals(back, b);
  assert_equals(iterator.referenceNode, b);
  assert_equals(iterator.pointerBeforeReferenceNode, true);

  const forward = iterator.nextNode();
  assert_equals(forward, b);
  assert_equals(iterator.pointerBeforeReferenceNode, false);
}, "NodeIterator updates referenceNode and pointerBeforeReferenceNode while walking");

test(function () {
  const root = makeElementTree();
  const iterator = document.createNodeIterator(root, NodeFilter.SHOW_TEXT);
  const visited = [];
  let node;

  while ((node = iterator.nextNode())) {
    visited.push(node);
  }

  assert_array_equals(labels(visited), ["alpha", "nested text"]);
  assert_equals(iterator.nextNode(), null);
  assert_equals(iterator.referenceNode.nodeValue, "nested text");
}, "NodeIterator respects whatToShow for text nodes");

test(function () {
  const root = makeElementTree();
  const iterator = document.createNodeIterator(
    root,
    NodeFilter.SHOW_ELEMENT,
    function (node) {
      if (node.id === "a") {
        return NodeFilter.FILTER_SKIP;
      }
      if (node.id === "b") {
        return NodeFilter.FILTER_REJECT;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  );
  const visited = [];
  let node;

  while ((node = iterator.nextNode())) {
    visited.push(node);
  }

  assert_array_equals(labels(visited), ["root", "nested", "c"]);
}, "NodeIterator treats FILTER_SKIP and FILTER_REJECT as visibility filters");

test(function () {
  const root = makeElementTree();
  const filter = {
    acceptNode(node) {
      if (node.nodeType === Node.TEXT_NODE || node.nodeType === Node.COMMENT_NODE) {
        return NodeFilter.FILTER_ACCEPT;
      }
      return NodeFilter.FILTER_SKIP;
    },
  };
  const iterator = document.createNodeIterator(
    root,
    NodeFilter.SHOW_TEXT | NodeFilter.SHOW_COMMENT,
    filter,
  );
  const visited = [];
  let node;

  while ((node = iterator.nextNode())) {
    visited.push(node);
  }

  assert_equals(iterator.filter, filter);
  assert_array_equals(labels(visited), ["alpha", "nested text", "tail"]);
}, "NodeIterator accepts object filters with acceptNode()");
</script>
