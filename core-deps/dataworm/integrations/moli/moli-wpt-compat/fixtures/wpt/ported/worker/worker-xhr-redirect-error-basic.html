<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function next_worker_result(worker) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", onMessage);
      worker.removeEventListener("error", onError);
    }

    function onMessage(event) {
      cleanup();
      resolve(event);
    }

    function onError(event) {
      cleanup();
      reject(event.error || new Error(event.message || "worker error"));
    }

    worker.addEventListener("message", onMessage);
    worker.addEventListener("error", onError);
  });
}

async function run_mode(mode) {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-xhr-response-worker.js",
    location.href,
  ).href;
  const worker = new Worker(workerUrl);
  try {
    worker.postMessage({ mode: mode });
    const message = await next_worker_result(worker);
    assert_equals(message.data.mode, mode, "worker should echo the requested mode");
    return message.data;
  } finally {
    worker.terminate();
  }
}

promise_test(async function () {
  const result = await run_mode("redirect");
  const expectedUrl = new URL("/wpt/runtime/xhr/text", location.href).href;

  assert_equals(result.status, 200, "redirect status");
  assert_equals(result.statusText, "OK", "redirect statusText");
  assert_equals(result.responseURL, expectedUrl, "redirect responseURL should point at the final URL");
  assert_equals(result.responseText.length, 100, "redirect response body length");
  assert_array_equals(result.events, ["load", "loadend"], "redirect should complete through load");
}, "Dedicated workers follow XMLHttpRequest redirects and expose the final response URL");

promise_test(async function () {
  const result = await run_mode("not-found");

  assert_equals(result.status, 404, "404 status");
  assert_equals(result.statusText, "Not Found", "404 statusText");
  assert_equals(result.responseText, "Not Found", "404 responseText");
  assert_array_equals(result.events, ["load", "loadend"], "404 should still complete through load");
}, "Dedicated workers expose 404 XMLHttpRequest responses without collapsing them into network errors");

promise_test(async function () {
  const result = await run_mode("server-error");

  assert_equals(result.status, 500, "500 status");
  assert_equals(result.statusText, "Internal Server Error", "500 statusText");
  assert_equals(result.responseText, "Internal Server Error", "500 responseText");
  assert_array_equals(result.events, ["load", "loadend"], "500 should still complete through load");
}, "Dedicated workers expose 500 XMLHttpRequest responses without collapsing them into network errors");

promise_test(async function () {
  const result = await run_mode("bad-port");

  assert_equals(result.readyState, 4, "bad-port readyState");
  assert_equals(result.status, 0, "bad-port status");
  assert_equals(result.statusText, "", "bad-port statusText");
  assert_equals(result.responseURL, "", "bad-port responseURL");
  assert_equals(result.responseText, "", "bad-port responseText");
  assert_equals(result.contentType, null, "bad-port exposed response header");
  assert_equals(result.allHeaders, "", "bad-port response header list");
  assert_array_equals(
    result.events,
    ["readystatechange:1", "loadstart", "readystatechange:4", "error", "loadend"],
    "bad-port should follow the XHR network error event order",
  );
}, "Dedicated workers reject bad-port XMLHttpRequest as network errors before I/O");

promise_test(async function () {
  const result = await run_mode("timeout");

  assert_equals(result.readyState, 4, "timeout readyState");
  assert_equals(result.status, 0, "timeout status");
  assert_equals(result.statusText, "", "timeout statusText");
  assert_equals(result.responseURL, "", "timeout responseURL");
  assert_equals(result.responseText, "", "timeout responseText");
  assert_equals(result.contentType, null, "timeout exposed response header");
  assert_equals(result.allHeaders, "", "timeout response header list");
  assert_array_equals(
    result.events,
    ["readystatechange:1", "readystatechange:4", "timeout", "loadend"],
    "timeout should follow the XHR timeout event order and suppress late responses",
  );
}, "Dedicated workers time out slow XMLHttpRequest requests");
</script>
