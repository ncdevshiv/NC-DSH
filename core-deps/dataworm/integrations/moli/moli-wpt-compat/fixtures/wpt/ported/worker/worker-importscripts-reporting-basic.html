<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/runtime/fixture-server-config.js"></script>
<script>
function next_message(worker) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
    }

    function onmessage(event) {
      cleanup();
      resolve(event);
    }

    function onerror(event) {
      cleanup();
      reject(new Error("unexpected worker error: " + event.message));
    }

    worker.addEventListener("message", onmessage);
    worker.addEventListener("error", onerror);
  });
}

function alternate_url(path) {
  return location.protocol + "//" + location.hostname + ":" + __lmFixtureServerConfig.alternatePort + path;
}

function worker_fixture_url() {
  return new URL(
    "/wpt/ported/worker/resources/worker-importscripts-reporting-worker.js",
    location.href,
  ).href;
}

promise_test(async function () {
  const worker = new Worker(worker_fixture_url());
  const importedUrl = new URL(
    "/wpt/ported/worker/resources/worker-importscripts-reporting-syntax-error.js",
    location.href,
  ).href;

  try {
    worker.postMessage({ scenario: "same-origin-syntax" });
    const message = await next_message(worker);
    assert_equals(message.data.name, "SyntaxError", "imported syntax errors should surface as SyntaxError");
    assert_true(
      message.data.messageIncludesSyntaxError,
      "imported syntax errors should mention SyntaxError in the worker error message",
    );
    assert_equals(
      message.data.filename,
      importedUrl,
      "imported syntax errors should report the imported script URL",
    );
    assert_equals(message.data.lineno, 1, "imported syntax errors should point at the imported script line");
  } finally {
    worker.terminate();
  }
}, "Dedicated workers report same-origin imported syntax errors at the imported script location");

promise_test(async function () {
  const worker = new Worker(worker_fixture_url());
  const importedUrl = new URL(
    "/wpt/ported/worker/resources/worker-importscripts-reporting-runtime-error.js",
    location.href,
  ).href;

  try {
    worker.postMessage({ scenario: "same-origin-runtime" });
    const message = await next_message(worker);
    assert_equals(message.data.name, "Error", "imported runtime errors should preserve the thrown error name");
    assert_equals(
      message.data.errorMessage,
      "runtime-boom",
      "imported runtime errors should preserve the thrown error message",
    );
    assert_equals(
      message.data.filename,
      importedUrl,
      "imported runtime errors should report the imported script URL",
    );
    assert_equals(message.data.lineno, 1, "imported runtime errors should point at the imported script line");
  } finally {
    worker.terminate();
  }
}, "Dedicated workers report same-origin imported runtime errors at the imported script location");

promise_test(async function () {
  const workerUrl = worker_fixture_url();
  const worker = new Worker(workerUrl);
  const crossOriginUrl = alternate_url("/wpt/runtime/worker/importscripts/cross-origin-target.js");

  try {
    worker.postMessage({
      scenario: "cross-origin-helper",
      url: crossOriginUrl,
    });
    const message = await next_message(worker);
    assert_equals(message.data.name, "NetworkError", "cross-origin importScripts failures should surface as NetworkError");
    assert_true(
      message.data.domException,
      "cross-origin importScripts failures should still expose a DOMException",
    );
    assert_false(
      message.data.messageIsScriptError,
      "cross-origin importScripts failures should preserve the helper callsite message shape",
    );
    assert_equals(
      message.data.filename,
      workerUrl,
      "cross-origin importScripts failures should report the helper worker callsite",
    );
    assert_true(
      message.data.lineno > 0,
      "cross-origin importScripts failures should preserve a positive helper callsite line number",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated workers report cross-origin importScripts failures at the helper callsite");
</script>
