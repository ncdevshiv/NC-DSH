<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const transfer = new DataTransfer();
  const file = new File(["entry"], "entry.txt", {
    type: "text/plain",
    lastModified: 11,
  });
  const fileItem = transfer.items.add(file);
  const stringItem = transfer.items.add("plain", "text/plain");
  const entry = fileItem.webkitGetAsEntry();

  assert_equals(typeof fileItem.webkitGetAsEntry, "function", "webkitGetAsEntry is exposed");
  assert_true(entry instanceof FileSystemEntry, "file entry inherits FileSystemEntry");
  assert_true(entry instanceof FileSystemFileEntry, "file entry uses FileSystemFileEntry");
  assert_false(entry instanceof FileSystemDirectoryEntry, "file item is not a directory entry");
  assert_true(entry.isFile, "file entry reports isFile");
  assert_false(entry.isDirectory, "file entry reports not isDirectory");
  assert_equals(entry.name, "entry.txt", "entry name is the File name");
  assert_equals(entry.fullPath, "/entry.txt", "entry fullPath is rooted at the File name");
  assert_equals(stringItem.webkitGetAsEntry(), null, "string items do not expose filesystem entries");

  for (const name of ["filesystem", "fullPath", "isDirectory", "isFile", "name"]) {
    assert_equals(
      Object.getOwnPropertyDescriptor(entry, name),
      undefined,
      "FileSystemEntry." + name + " should not be an own data property",
    );
    const descriptor = Object.getOwnPropertyDescriptor(FileSystemEntry.prototype, name);
    assert_equals(typeof descriptor.get, "function", "FileSystemEntry." + name + " prototype getter");
    assert_equals(descriptor.set, undefined, "FileSystemEntry." + name + " should be readonly");
    assert_true(descriptor.enumerable, "FileSystemEntry." + name + " descriptor should be enumerable");
    assert_true(descriptor.configurable, "FileSystemEntry." + name + " descriptor should be configurable");
  }
}, "DataTransferItem.webkitGetAsEntry exposes FileSystemFileEntry metadata for file items");

promise_test(async function () {
  const transfer = new DataTransfer();
  const file = new File(["callback bytes"], "callback.txt", { type: "text/plain" });
  const entry = transfer.items.add(file).webkitGetAsEntry();
  const callbackFile = await new Promise(function (resolve) {
    entry.file(resolve);
  });

  assert_equals(callbackFile, file, "FileSystemFileEntry.file() returns the backing File");
  assert_equals(await callbackFile.text(), "callback bytes", "returned File preserves bytes");
  assert_equals(callbackFile.type, "text/plain", "returned File preserves type");
}, "FileSystemFileEntry.file() invokes the success callback with the backing File");
</script>
