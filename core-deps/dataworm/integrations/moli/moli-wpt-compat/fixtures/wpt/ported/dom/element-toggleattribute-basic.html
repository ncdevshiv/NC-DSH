<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback) {
  try {
    callback();
  } catch (error) {
    assert_equals(error && error.name, expectedName);
    return;
  }
  assert_true(false, "Expected " + expectedName);
}

function attribute_summary(element) {
  return Array.prototype.map.call(element.attributes, function (attr) {
    return [attr.name, attr.value, attr.namespaceURI];
  });
}

function assert_attribute_summary(element, expected) {
  const actual = attribute_summary(element);
  assert_equals(actual.length, expected.length, "attribute count");
  for (let index = 0; index < expected.length; index++) {
    assert_array_equals(actual[index], expected[index], "attribute " + index);
  }
}

test(function () {
  const el = document.createElement("div");

  assert_true(el.toggleAttribute("ALIGN"));
  assert_false(el.hasAttributeNS("", "ALIGN"));
  assert_true(el.hasAttributeNS("", "align"));
  assert_true(el.hasAttribute("align"));

  assert_false(el.toggleAttribute("ALIGN"));
  assert_false(el.hasAttributeNS("", "ALIGN"));
  assert_false(el.hasAttributeNS("", "align"));
  assert_false(el.hasAttribute("align"));
}, "toggleAttribute lowercases its name argument on HTML elements");

test(function () {
  const el = document.createElement("foo");

  assert_true(el.toggleAttribute("data-flag"));
  assert_true(el.hasAttribute("data-flag"));
  assert_false(el.toggleAttribute("data-flag"));
  assert_false(el.hasAttribute("data-flag"));

  assert_true(el.toggleAttribute("data-flag", true));
  assert_true(el.hasAttribute("data-flag"));
  assert_true(el.toggleAttribute("data-flag", true));
  assert_true(el.hasAttribute("data-flag"));
  assert_false(el.toggleAttribute("data-flag", false));
  assert_false(el.hasAttribute("data-flag"));
}, "toggleAttribute supports basic toggle and force semantics");

test(function () {
  const el = document.createElement("foo");

  el.toggleAttribute("a");
  el.toggleAttribute("b");
  el.setAttribute("a", "thing");
  el.toggleAttribute("c");

  assert_attribute_summary(el, [
    ["a", "thing", null],
    ["b", "", null],
    ["c", "", null],
  ]);
}, "toggleAttribute does not change the order of previously set attributes");

test(function () {
  const el = document.createElement("baz");

  el.setAttributeNS("ab", "attr", "fail");
  el.setAttributeNS("kl", "attr", "pass");
  el.toggleAttribute("attr");

  assert_attribute_summary(el, [["attr", "pass", "kl"]]);
}, "toggleAttribute removes the first attribute with the given name");

test(function () {
  const el = document.createElement("baz");

  el.setAttributeNS("foo", "foo:bar", "1");
  el.setAttributeNS("foo", "foo:bat", "2");
  assert_equals(el.getAttribute("foo:bar"), "1");
  assert_equals(el.getAttribute("foo:bat"), "2");

  el.toggleAttribute("foo:bar");

  assert_false(el.hasAttribute("foo:bar"));
  assert_attribute_summary(el, [["foo:bat", "2", "foo"]]);
}, "toggleAttribute matches namespaced attributes by qualified name");

test(function () {
  const el = document.createElement("foo");

  assert_throws_name("InvalidCharacterError", function () {
    el.toggleAttribute("has space");
  });
  assert_throws_name("InvalidCharacterError", function () {
    el.toggleAttribute("has space", true);
  });
  assert_throws_name("InvalidCharacterError", function () {
    el.toggleAttribute("has space", false);
  });
}, "toggleAttribute throws InvalidCharacterError for invalid qualified names");
</script>
