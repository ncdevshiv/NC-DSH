<meta charset="utf-8">

<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body></body>
<script>
function assert_throws_name(expectedName, callback, description) {
  let error = null;
  try {
    callback();
  } catch (thrown) {
    error = thrown;
  }
  assert_true(error !== null, (description || "assert_throws_name") + ": expected an exception");
  assert_equals(error.name, expectedName, (description || "assert_throws_name") + ": unexpected exception name");
}

test(function () {
  const input = document.createElement("input");
  input.type = "number";

  assert_true(Number.isNaN(input.valueAsNumber), "empty number input should expose NaN");

  input.value = "12.5";
  assert_equals(input.valueAsNumber, 12.5, "valueAsNumber getter should parse finite number values");

  input.value = "-0.25";
  assert_equals(input.valueAsNumber, -0.25, "valueAsNumber getter should parse signed decimals");

  input.value = "1.5e2";
  assert_equals(input.valueAsNumber, 150, "valueAsNumber getter should parse scientific notation");

  input.value = "bad";
  assert_equals(input.value, "", "invalid script-set number text should sanitize to empty");
  assert_true(Number.isNaN(input.valueAsNumber), "sanitized empty number input should expose NaN");
}, "number input valueAsNumber getter reflects the sanitized numeric value");

test(function () {
  const input = document.createElement("input");
  input.type = "number";
  input.step = "any";

  input.valueAsNumber = 3.25;
  assert_equals(input.value, "3.25", "finite valueAsNumber setter should update value");
  assert_equals(input.valueAsNumber, 3.25, "finite valueAsNumber setter should round-trip through the getter");
  assert_false(input.validity.stepMismatch, "valueAsNumber setter should feed normal number validity");

  input.valueAsNumber = "-2.5";
  assert_equals(input.value, "-2.5", "valueAsNumber setter should convert string input with ToNumber");

  input.valueAsNumber = true;
  assert_equals(input.value, "1", "valueAsNumber setter should convert boolean input with ToNumber");

  input.valueAsNumber = { valueOf() { return 4.75; } };
  assert_equals(input.value, "4.75", "valueAsNumber setter should convert object input through valueOf");

  input.valueAsNumber = {
    valueOf() { return {}; },
    toString() { return "-6.5"; },
  };
  assert_equals(input.value, "-6.5", "valueAsNumber setter should fall back to object toString conversion");

  input.valueAsNumber = NaN;
  assert_equals(input.value, "", "NaN valueAsNumber setter should clear the value");
  assert_true(Number.isNaN(input.valueAsNumber), "cleared number input should expose NaN");
}, "number input valueAsNumber setter converts finite values and clears on NaN");

test(function () {
  const input = document.createElement("input");
  input.type = "number";
  input.value = "5";

  assert_throws_name("TypeError", function () {
    input.valueAsNumber = Infinity;
  }, "setting valueAsNumber to Infinity should throw TypeError");
  assert_equals(input.value, "5", "failed valueAsNumber setter should not change value");

  assert_throws_name("TypeError", function () {
    input.valueAsNumber = -Infinity;
  }, "setting valueAsNumber to -Infinity should throw TypeError");
  assert_equals(input.value, "5", "failed negative Infinity setter should not change value");

  assert_throws_name("TypeError", function () {
    input.valueAsNumber = Symbol("not-convertible");
  }, "setting valueAsNumber to a Symbol should preserve ToNumber TypeError");
  assert_equals(input.value, "5", "failed ToNumber conversion should not change value");

  assert_throws_name("TypeError", function () {
    input.valueAsNumber = { valueOf() { return Infinity; } };
  }, "setting valueAsNumber to an object converting to Infinity should throw TypeError");
  assert_equals(input.value, "5", "failed object Infinity conversion should not change value");

  assert_throws_name("Error", function () {
    input.valueAsNumber = { valueOf() { throw new Error("conversion failed"); } };
  }, "setting valueAsNumber to an object with throwing valueOf should propagate the exception");
  assert_equals(input.value, "5", "throwing object conversion should not change value");
}, "number input valueAsNumber setter rejects infinite values");

test(function () {
  const input = document.createElement("input");
  input.type = "text";
  input.value = "7";

  assert_true(Number.isNaN(input.valueAsNumber), "unsupported input type should expose NaN");
  assert_throws_name("InvalidStateError", function () {
    input.valueAsNumber = 7;
  }, "unsupported input type should reject valueAsNumber setter");
}, "unsupported input types expose the valueAsNumber boundary");
</script>
