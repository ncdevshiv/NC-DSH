<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/runtime/fixture-server-config.js"></script>
<script>
function alternate_url(path) {
  return location.protocol + "//" + location.hostname + ":" + __lmFixtureServerConfig.alternatePort + path;
}

async function assert_rejects_name(expectedName, promise, description) {
  try {
    await promise;
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected rejection");
}

function xhr_result(url) {
  return new Promise(function (resolve) {
    const events = [];
    const xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function () {
      events.push("readystatechange:" + xhr.readyState);
    };
    xhr.onload = function () {
      events.push("load");
    };
    xhr.onerror = function () {
      events.push("error");
    };
    xhr.onloadend = function () {
      events.push("loadend");
      resolve({
        events,
        readyState: xhr.readyState,
        status: xhr.status,
        responseText: xhr.responseText,
        responseURL: xhr.responseURL,
        contentType: xhr.getResponseHeader("Content-Type"),
        allHeaders: xhr.getAllResponseHeaders(),
      });
    };
    xhr.open("GET", url);
    xhr.send();
  });
}

promise_test(async function () {
  const response = await fetch(alternate_url("/wpt/runtime/cors/allow"));
  assert_equals(response.type, "cors");
  assert_equals(await response.text(), "cors-ok");
}, "fetch accepts cross-origin responses with Access-Control-Allow-Origin");

promise_test(async function () {
  await assert_rejects_name(
    "TypeError",
    fetch(alternate_url("/wpt/runtime/cors/deny")),
    "fetch should reject cross-origin responses without Access-Control-Allow-Origin",
  );
}, "fetch rejects cross-origin responses without Access-Control-Allow-Origin");

promise_test(async function () {
  const result = await xhr_result(alternate_url("/wpt/runtime/cors/allow"));
  assert_array_equals(result.events, [
    "readystatechange:1",
    "readystatechange:2",
    "readystatechange:3",
    "readystatechange:4",
    "load",
    "loadend",
  ]);
  assert_equals(result.status, 200);
  assert_equals(result.responseText, "cors-ok");
  assert_true(result.responseURL.endsWith("/wpt/runtime/cors/allow"));
}, "XMLHttpRequest accepts cross-origin responses with Access-Control-Allow-Origin");

promise_test(async function () {
  const result = await xhr_result(alternate_url("/wpt/runtime/cors/deny"));
  assert_array_equals(result.events, [
    "readystatechange:1",
    "readystatechange:4",
    "error",
    "loadend",
  ]);
  assert_equals(result.readyState, 4);
  assert_equals(result.status, 0);
  assert_equals(result.responseText, "");
  assert_equals(result.responseURL, "");
  assert_equals(result.contentType, null);
  assert_equals(result.allHeaders, "");
}, "XMLHttpRequest rejects cross-origin responses without Access-Control-Allow-Origin");
</script>
