<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_worker_message(worker, predicate) {
  return new Promise(function (resolve, reject) {
    worker.addEventListener("message", function handler(event) {
      if (predicate && !predicate(event.data)) {
        return;
      }
      worker.removeEventListener("message", handler);
      resolve(event);
    });
    worker.addEventListener("error", function (event) {
      reject(new Error(event.message || "worker error"));
    }, { once: true });
  });
}

function next_task() {
  return new Promise(function (resolve) {
    setTimeout(resolve, 0);
  });
}

async function assert_worker_message_listener_requires_start() {
  const worker = new Worker(
    worker_url(
      [
        "let port = null;",
        "let beforeStart = -1;",
        "const messages = [];",
        "onmessage = function (event) {",
        "  if (event.data === 'connect') {",
        "    port = event.ports[0];",
        "    port.addEventListener('message', function (messageEvent) {",
        "      messages.push(messageEvent.data);",
        "      postMessage({ kind: 'result', beforeStart, messages });",
        "    });",
        "    postMessage({ kind: 'ready' });",
        "    return;",
        "  }",
        "  if (event.data === 'start') {",
        "    beforeStart = messages.length;",
        "    port.start();",
        "  }",
        "};",
      ].join("\n"),
    ),
  );
  const channel = new MessageChannel();

  try {
    const ready = next_worker_message(worker, function (data) {
      return data && data.kind === "ready";
    });
    worker.postMessage("connect", [channel.port2]);
    await ready;

    channel.port1.postMessage("queued");
    await next_task();
    worker.postMessage("start");

    const result = await next_worker_message(worker, function (data) {
      return data && data.kind === "result";
    });
    assert_equals(
      result.data.beforeStart,
      0,
      "message event listeners should not run before start()",
    );
    assert_array_equals(
      result.data.messages,
      ["queued"],
      "start() should deliver the queued MessagePort message",
    );
  } finally {
    channel.port1.close();
    worker.terminate();
  }
}

async function assert_worker_onmessage_starts_port_delivery() {
  const worker = new Worker(
    worker_url(
      [
        "onmessage = function (event) {",
        "  if (event.data !== 'connect') {",
        "    return;",
        "  }",
        "  const port = event.ports[0];",
        "  port.onmessage = function (messageEvent) {",
        "    postMessage({ kind: 'result', data: messageEvent.data });",
        "  };",
        "  postMessage({ kind: 'ready' });",
        "};",
      ].join("\n"),
    ),
  );
  const channel = new MessageChannel();

  try {
    const ready = next_worker_message(worker, function (data) {
      return data && data.kind === "ready";
    });
    worker.postMessage("connect", [channel.port2]);
    await ready;

    channel.port1.postMessage("auto");

    const result = await next_worker_message(worker, function (data) {
      return data && data.kind === "result";
    });
    assert_equals(
      result.data.data,
      "auto",
      "onmessage should enable delivery without an explicit start() call",
    );
  } finally {
    channel.port1.close();
    worker.terminate();
  }
}

promise_test(async function () {
  await assert_worker_message_listener_requires_start();
  await assert_worker_onmessage_starts_port_delivery();
}, "Worker-owned MessagePort start and onmessage delivery semantics");
</script>
