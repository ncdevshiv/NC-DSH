<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName);
    return;
  }
  throw new Error("Expected " + expectedName);
}

test(function () {
  assert_throws_name("NotSupportedError", function () {
    document.createCDATASection("foo");
  });
}, "createCDATASection() throws NotSupportedError in an HTML document");

test(function () {
  const xmlDocument = document.implementation.createDocument(null, "root", null);
  const cdata = xmlDocument.createCDATASection("alpha < beta & gamma");

  assert_true(cdata instanceof CDATASection, "CDATASection identity");
  assert_true(cdata instanceof Text, "Text identity");
  assert_true(cdata instanceof CharacterData, "CharacterData identity");
  assert_true(cdata instanceof Node, "Node identity");
  assert_equals(cdata.ownerDocument, xmlDocument, "ownerDocument");
  assert_equals(cdata.nodeType, Node.CDATA_SECTION_NODE, "nodeType");
  assert_equals(cdata.nodeName, "#cdata-section", "nodeName");
  assert_equals(cdata.data, "alpha < beta & gamma", "data");
  assert_equals(cdata.nodeValue, "alpha < beta & gamma", "nodeValue");
  assert_equals(cdata.textContent, "alpha < beta & gamma", "textContent");
  assert_equals(cdata.length, "alpha < beta & gamma".length, "length");
  assert_equals(cdata.parentNode, null, "parentNode");
  assert_equals(cdata.childNodes.length, 0, "childNodes");
}, "createCDATASection() creates a detached CDATASection in an XML document");

test(function () {
  const xmlDocument = new DOMParser().parseFromString("<root/>", "application/xml");
  const cdata = xmlDocument.createCDATASection("parsed alpha");

  assert_true(cdata instanceof CDATASection, "CDATASection identity");
  assert_true(cdata instanceof Text, "Text identity");
  assert_true(cdata instanceof CharacterData, "CharacterData identity");
  assert_true(cdata instanceof Node, "Node identity");
  assert_equals(cdata.ownerDocument, xmlDocument, "ownerDocument");
  assert_equals(cdata.nodeType, Node.CDATA_SECTION_NODE, "nodeType");
  assert_equals(cdata.nodeName, "#cdata-section", "nodeName");
  assert_equals(cdata.data, "parsed alpha", "data");
  assert_equals(cdata.nodeValue, "parsed alpha", "nodeValue");
  assert_equals(cdata.textContent, "parsed alpha", "textContent");
}, "DOMParser XML document exposes createCDATASection()");

test(function () {
  const htmlDocument = new DOMParser().parseFromString(
    "<html><body></body></html>",
    "text/html"
  );

  assert_throws_name("NotSupportedError", function () {
    htmlDocument.createCDATASection("foo");
  });
}, "DOMParser HTML document createCDATASection() throws NotSupportedError");

test(function () {
  const xmlDocument = document.implementation.createDocument(null, "root", null);

  assert_throws_name("InvalidCharacterError", function () {
    xmlDocument.createCDATASection("bad ]]> data");
  });
}, "createCDATASection() rejects data containing the CDATA close delimiter");

test(function () {
  const xmlDocument = new DOMParser().parseFromString("<root/>", "application/xml");

  assert_throws_name("InvalidCharacterError", function () {
    xmlDocument.createCDATASection("bad ]]> data");
  });
}, "DOMParser XML document createCDATASection() rejects the CDATA close delimiter");
</script>
