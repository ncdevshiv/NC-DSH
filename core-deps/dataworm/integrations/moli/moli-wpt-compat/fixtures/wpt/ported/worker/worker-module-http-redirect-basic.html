<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function next_message(worker) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", on_message);
      worker.removeEventListener("error", on_error);
    }
    function on_message(event) {
      cleanup();
      resolve(event);
    }
    function on_error(event) {
      cleanup();
      reject(new Error("Worker error: " + event.message));
    }
    worker.addEventListener("message", on_message);
    worker.addEventListener("error", on_error);
  });
}

promise_test(async function () {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-redirect-main.js",
    location.href
  ).href;
  const entryUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-redirect-entry.js",
    location.href
  ).href;
  const fragmentEntryUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-redirect-entry.js#redirect-fragment",
    location.href
  ).href;
  const leafUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-redirect-leaf.js",
    location.href
  ).href;
  const worker = new Worker(workerUrl, { type: "module" });

  try {
    const message = await next_message(worker);
    assert_equals(message.data.error, undefined, "redirect module worker should not fail");
    assert_equals(
      message.data.leafValue,
      "redirect-leaf",
      "redirected dependency should still evaluate its relative dependency graph"
    );
    assert_equals(
      message.data.entryMetaUrl,
      entryUrl,
      "redirected dependency import.meta.url should reflect the final response URL"
    );
    assert_equals(
      message.data.fragmentEntryMetaUrl,
      fragmentEntryUrl,
      "redirected dependency import.meta.url should prefer the redirect response fragment over the request fragment"
    );
    assert_equals(
      message.data.leafMetaUrl,
      leafUrl,
      "relative imports under a redirected dependency should resolve against the final response URL"
    );
    assert_equals(
      message.data.fragmentLeafMetaUrl,
      leafUrl,
      "relative imports under a fragment-bearing redirected dependency should still resolve against the final response path"
    );
    assert_equals(
      message.data.dynamicLeafValue,
      "redirect-leaf",
      "dynamic import of a redirected dependency should still evaluate its relative dependency graph"
    );
    assert_equals(
      message.data.dynamicEntryMetaUrl,
      entryUrl,
      "dynamic import of a redirected dependency should expose the final response URL"
    );
    assert_equals(
      message.data.dynamicFragmentEntryMetaUrl,
      fragmentEntryUrl,
      "dynamic import of a fragment-bearing redirect should expose the redirect response fragment"
    );
    assert_equals(
      message.data.dynamicLeafMetaUrl,
      leafUrl,
      "relative imports under a dynamically imported redirected dependency should resolve against the final response URL"
    );
    assert_equals(
      message.data.dynamicFragmentLeafMetaUrl,
      leafUrl,
      "relative imports under a dynamically imported fragment-bearing redirect should resolve against the final response path"
    );
    assert_equals(
      message.data.mainMetaUrl,
      workerUrl,
      "main module import.meta.url should still expose the worker script URL"
    );
    assert_equals(
      message.data.importScriptsType,
      "function",
      "module workers should expose WorkerGlobalScope.importScripts"
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated module workers resolve redirected HTTP dependencies against the final response URL");
</script>
