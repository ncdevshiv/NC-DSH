<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/resources/WebIDLParser.js"></script>
<script src="/wpt/resources/idlharness.js"></script>
<script>
idl_test([`
interface DOMStringMap {};
`], [], function (idlArray) {
  idlArray.enable_interface_descriptor_assertions();
  idlArray.enable_object_brand_assertions();
  idlArray.add_objects({
    DOMStringMap: ["document.createElement('div').dataset"]
  });
});

test(function () {
  const element = document.createElement("div");
  const dataset = element.dataset;

  dataset.fooBar = "value";
  assert_equals(dataset.fooBar, "value");
  assert_equals(element.getAttribute("data-foo-bar"), "value");
  assert_true(delete dataset.fooBar);
  assert_equals(element.getAttribute("data-foo-bar"), null);
  assert_equals(Object.prototype.toString.call(dataset), "[object DOMStringMap]");
}, "DOMStringMap idlharness sample operations reflect data attributes");
</script>
