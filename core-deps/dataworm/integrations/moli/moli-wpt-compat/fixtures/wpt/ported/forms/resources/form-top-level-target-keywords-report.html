<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body
  data-order=""
  data-submit-count-top=""
  data-submit-count-parent=""
  data-arrival-top=""
  data-arrival-parent=""
  data-query-target-top=""
  data-query-target-parent=""
></body>
<script>
const STORAGE_PREFIX = "__lm_wpt_form_top_level_target_keywords_basic__";

function key(suffix) {
  return STORAGE_PREFIX + suffix;
}

document.body.setAttribute("data-order", sessionStorage.getItem(key("order")) ?? "");
document.body.setAttribute(
  "data-submit-count-top",
  sessionStorage.getItem(key("submitCount:_top")) ?? "",
);
document.body.setAttribute(
  "data-submit-count-parent",
  sessionStorage.getItem(key("submitCount:_parent")) ?? "",
);
document.body.setAttribute("data-arrival-top", sessionStorage.getItem(key("arrival:_top")) ?? "");
document.body.setAttribute(
  "data-arrival-parent",
  sessionStorage.getItem(key("arrival:_parent")) ?? "",
);
document.body.setAttribute(
  "data-query-target-top",
  sessionStorage.getItem(key("queryTarget:_top")) ?? "",
);
document.body.setAttribute(
  "data-query-target-parent",
  sessionStorage.getItem(key("queryTarget:_parent")) ?? "",
);

test(function () {
  assert_equals(
    document.body.getAttribute("data-order"),
    "_top|_parent",
    "both top-level keyword targets should complete in order",
  );
  assert_equals(
    document.body.getAttribute("data-submit-count-top"),
    "1",
    "_top submission should dispatch submit exactly once",
  );
  assert_equals(
    document.body.getAttribute("data-submit-count-parent"),
    "1",
    "_parent submission should dispatch submit exactly once",
  );
  assert_equals(
    document.body.getAttribute("data-arrival-top"),
    new URL("form-top-level-target-keywords-hop.html?target=_top", location.href).href,
    "_top should navigate the current top-level browsing context to the destination",
  );
  assert_equals(
    document.body.getAttribute("data-arrival-parent"),
    new URL("form-top-level-target-keywords-hop.html?target=_parent", location.href).href,
    "_parent should resolve to the current top-level browsing context when already top-level",
  );
  assert_equals(
    document.body.getAttribute("data-query-target-top"),
    "_top",
    "_top submission should preserve successful controls in the destination query",
  );
  assert_equals(
    document.body.getAttribute("data-query-target-parent"),
    "_parent",
    "_parent submission should preserve successful controls in the destination query",
  );
}, "_top and _parent form targets navigate the top-level browsing context even when same-named child frames exist");
</script>
