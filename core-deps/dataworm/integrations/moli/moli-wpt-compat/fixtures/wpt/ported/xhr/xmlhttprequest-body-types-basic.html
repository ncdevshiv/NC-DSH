<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const ECHO_BODY_URL = "/wpt/runtime/xhr/echo-body";

function sendBody(body, configure) {
  return new Promise(function (resolve) {
    const xhr = new XMLHttpRequest();
    xhr.onload = function () {
      resolve({ status: xhr.status, response: xhr.response });
    };
    xhr.open("POST", ECHO_BODY_URL);
    xhr.responseType = "json";
    if (configure) {
      configure(xhr);
    }
    xhr.send(body);
  });
}

promise_test(async function () {
  const result = await sendBody("plain-body");

  assert_equals(result.status, 200, "string body status");
  assert_equals(result.response.body, "plain-body", "String body should be sent unchanged");
  assert_equals(
    result.response.content_type,
    "text/plain;charset=UTF-8",
    "String bodies should install the default text/plain Content-Type",
  );
}, "XMLHttpRequest serializes string request bodies");

promise_test(async function () {
  const params = new URLSearchParams();
  params.append("alpha", "one");
  params.append("space", "two words");

  const result = await sendBody(params);

  assert_equals(result.status, 200, "URLSearchParams status");
  assert_equals(
    result.response.body,
    "alpha=one&space=two+words",
    "URLSearchParams body should be form-url-encoded",
  );
  assert_equals(
    result.response.content_type,
    "application/x-www-form-urlencoded;charset=UTF-8",
    "URLSearchParams should install the default Content-Type",
  );
}, "XMLHttpRequest serializes URLSearchParams request bodies");

promise_test(async function () {
  const params = new URLSearchParams();
  params.append("alpha", "one");

  const result = await sendBody(params, function (xhr) {
    xhr.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
  });

  assert_equals(result.status, 200, "explicit Content-Type status");
  assert_equals(result.response.body, "alpha=one", "URLSearchParams body should still serialize");
  assert_equals(
    result.response.content_type,
    "text/plain;charset=utf-8",
    "explicit Content-Type should not be overwritten",
  );
}, "XMLHttpRequest preserves an explicit Content-Type for URLSearchParams bodies");

promise_test(async function () {
  const result = await sendBody(new Blob(["blob-body"], { type: "text/plain;charset=utf-8" }));

  assert_equals(result.status, 200, "Blob status");
  assert_equals(result.response.body, "blob-body", "Blob bytes should be sent as the body");
  assert_equals(
    result.response.content_type,
    "text/plain;charset=utf-8",
    "Blob type should become the default Content-Type",
  );
}, "XMLHttpRequest serializes Blob request bodies");

promise_test(async function () {
  const result = await sendBody(new Uint8Array([65, 66, 67]));

  assert_equals(result.status, 200, "BufferSource status");
  assert_equals(result.response.body, "ABC", "BufferSource bytes should be sent as the body");
  assert_equals(result.response.content_type, null, "BufferSource should not install a Content-Type");
}, "XMLHttpRequest serializes BufferSource request bodies");

promise_test(async function () {
  const result = await sendBody(new Uint8Array([65, 66, 67]), function (xhr) {
    xhr.setRequestHeader("Content-Type", "application/custom-bytes");
  });

  assert_equals(result.status, 200, "explicit BufferSource Content-Type status");
  assert_equals(result.response.body, "ABC", "BufferSource bytes should still be sent as the body");
  assert_equals(
    result.response.content_type,
    "application/custom-bytes",
    "BufferSource bodies should preserve an explicit Content-Type",
  );
}, "XMLHttpRequest preserves an explicit Content-Type for BufferSource bodies");
</script>
