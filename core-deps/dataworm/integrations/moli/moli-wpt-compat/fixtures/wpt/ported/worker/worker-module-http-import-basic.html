<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function next_message(worker) {
  return new Promise(function (resolve, reject) {
    worker.addEventListener("message", resolve, { once: true });
    worker.addEventListener("error", function (event) {
      reject(new Error("Worker error: " + event.message));
    }, { once: true });
  });
}

promise_test(async function () {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-main.js",
    location.href
  ).href;
  const dependencyUrl = new URL(
    "/wpt/ported/worker/resources/worker-module-http-dep.js",
    location.href
  ).href;
  const worker = new Worker(workerUrl, { type: "module" });

  try {
    const message = await next_message(worker);
    assert_equals(message.data.defaultValue, "default-value", "default import should resolve from an HTTP dependency");
    assert_equals(message.data.answer, 42, "named import should resolve from an HTTP dependency");
    assert_equals(message.data.renamed, "dep", "renamed named import should bind the requested export");
    assert_equals(message.data.doubled, 42, "exported function imports should remain callable");
    assert_equals(message.data.boxValue, 9, "exported class imports should remain constructible");
    assert_equals(message.data.importedAnswer, 42, "re-exported named binding should be visible through namespace import");
    assert_equals(message.data.importedDefault, "default-value", "re-exported default binding should be visible through namespace import");
    assert_equals(message.data.namespaceAnswer, 42, "export-star-as namespace should expose dependency exports");
    assert_equals(message.data.starAnswer, 42, "export-star should forward non-default named exports");
    assert_equals(message.data.importScriptsType, "function", "module workers should expose WorkerGlobalScope.importScripts");
    assert_equals(message.data.metaUrl, workerUrl, "import.meta.url should expose the HTTP worker script URL");
    assert_equals(message.data.depMetaUrl, dependencyUrl, "import.meta.url should expose the HTTP dependency script URL");
    assert_equals(message.data.resolvedDep, dependencyUrl, "main module import.meta.resolve should resolve relative HTTP dependencies");
    assert_equals(
      message.data.resolvedDotSegment,
      dependencyUrl,
      "main module import.meta.resolve should normalize dot segments",
    );
    assert_equals(
      message.data.depResolvedSelf,
      dependencyUrl,
      "dependency module import.meta.resolve should resolve relative to the dependency URL",
    );
    assert_equals(
      message.data.depResolvedDotSegment,
      dependencyUrl,
      "dependency module import.meta.resolve should normalize dependency-relative dot segments",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated module workers resolve same-origin HTTP static imports and re-exports");
</script>
