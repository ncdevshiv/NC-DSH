<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for(promise, description) {
  return Promise.race([
    promise,
    wait(300).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

async function assert_module_cycle_failure(scriptName, description) {
  const previousOnerror = window.onerror;
  let messageSeen = false;
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/" + scriptName,
    location.href,
  ).href;
  const worker = new Worker(workerUrl, { type: "module" });

  try {
    window.onerror = function () {
      return true;
    };
    worker.onmessage = function () {
      messageSeen = true;
    };

    const event = await wait_for(
      new Promise(function (resolve) {
        worker.onerror = function (event) {
          resolve(event);
          return true;
        };
      }),
      description,
    );

    assert_equals(event.type, "error", description + " should dispatch an error event");
    const lowerMessage = String(event.message).toLowerCase();
    assert_true(
      lowerMessage.indexOf("cannot access") !== -1 ||
        lowerMessage.indexOf("before initialization") !== -1 ||
        lowerMessage.indexOf("reference") !== -1,
      description + " should surface a TDZ/reference initialization reason",
    );
    assert_false(messageSeen, description + " should not evaluate the worker body");
  } finally {
    window.onerror = previousOnerror;
    worker.terminate();
  }
}

async function assert_module_cycle_message(scriptName, expected, description) {
  const workerUrl = new URL(
    "/wpt/ported/worker/resources/" + scriptName,
    location.href,
  ).href;
  const worker = new Worker(workerUrl, { type: "module" });

  try {
    const message = await new Promise(function (resolve, reject) {
      worker.addEventListener("message", resolve, { once: true });
      worker.addEventListener("error", function (event) {
        reject(new Error(event.message || "worker error"));
      }, { once: true });
    });
    assert_equals(message.data, expected, description + " should evaluate");
  } finally {
    worker.terminate();
  }
}

promise_test(function () {
  return assert_module_cycle_failure(
    "worker-module-cycle-matrix-import-main.js",
    "named import cycle",
  );
}, "Dedicated module workers reject TDZ-reading named import cycles before evaluation");

promise_test(function () {
  return assert_module_cycle_message(
    "worker-module-cycle-matrix-export-list-main.js",
    "export-list-cycle-ok",
    "export list cycle",
  );
}, "Dedicated module workers evaluate export-list cycles");

promise_test(function () {
  return assert_module_cycle_message(
    "worker-module-cycle-matrix-export-star-main.js",
    "export-star-cycle-ok",
    "export star cycle",
  );
}, "Dedicated module workers evaluate export-star cycles");
</script>
