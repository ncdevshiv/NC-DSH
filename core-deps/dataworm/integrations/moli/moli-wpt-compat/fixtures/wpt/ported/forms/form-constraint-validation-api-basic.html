<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body></body>
<script>
function withHost(markup, callback) {
  const host = document.createElement("div");
  host.innerHTML = markup;
  document.body.appendChild(host);
  try {
    callback(host);
  } finally {
    host.remove();
  }
}

test(function () {
  const input = document.createElement("input");
  input.required = true;
  assert_true(input.willValidate, "required text input should be a validation candidate");
  assert_true(input.validity.valueMissing, "empty required input should expose valueMissing");
  assert_false(input.validity.valid, "empty required input should be invalid");
  assert_true(input.validationMessage.length > 0, "empty required input should expose a message");

  input.value = "filled";
  assert_false(input.validity.valueMissing, "filled required input should clear valueMissing");
  assert_true(input.validity.valid, "filled required input should be valid");
  assert_equals(input.validationMessage, "", "valid input should not expose a validation message");

  const hidden = document.createElement("input");
  hidden.type = "hidden";
  hidden.required = true;
  assert_false(hidden.willValidate, "hidden input should be barred from constraint validation");
  assert_true(hidden.checkValidity(), "barred controls should check as valid");
  assert_true(hidden.validity.valid, "barred controls should expose a valid ValidityState");
}, "input validity, willValidate, and validationMessage reflect required valueMissing");

test(function () {
  withHost(
    `
      <form>
        <select id="select" required>
          <option value="">Choose</option>
          <option value="ready">Ready</option>
        </select>
        <textarea id="textarea" required></textarea>
      </form>
    `,
    function (host) {
      const select = host.querySelector("#select");
      const textarea = host.querySelector("#textarea");

      assert_true(select.willValidate, "required select should be a validation candidate");
      assert_true(select.validity.valueMissing, "select on an empty option should be valueMissing");
      select.value = "ready";
      assert_true(select.validity.valid, "selecting a non-empty option should satisfy required");

      assert_true(textarea.willValidate, "required textarea should be a validation candidate");
      assert_true(textarea.validity.valueMissing, "empty textarea should be valueMissing");
      textarea.value = "ready";
      assert_true(textarea.validity.valid, "non-empty textarea should satisfy required");
    },
  );
}, "select and textarea validity reflect required valueMissing");

test(function () {
  const input = document.createElement("input");
  input.value = "filled";

  input.setCustomValidity("custom failure");
  assert_true(input.validity.customError, "setCustomValidity(non-empty) should set customError");
  assert_false(input.validity.valid, "customError should make the control invalid");
  assert_equals(input.validationMessage, "custom failure", "custom message should be exposed");

  input.setCustomValidity("");
  assert_false(input.validity.customError, "setCustomValidity(empty) should clear customError");
  assert_true(input.validity.valid, "clearing customError should restore validity");
  assert_equals(input.validationMessage, "", "clearing customError should clear the message");
}, "setCustomValidity drives customError and validationMessage");

test(function () {
  withHost(
    `<form id="form"><input id="input" required></form>`,
    function (host) {
      const form = host.querySelector("#form");
      const input = host.querySelector("#input");
      const events = [];

      form.addEventListener("invalid", function () {
        events.push("form-bubble");
      });
      input.addEventListener("invalid", function (event) {
        events.push("input:" + event.bubbles + ":" + event.cancelable);
        event.preventDefault();
      });

      assert_false(input.checkValidity(), "invalid control checkValidity should return false");
      assert_array_equals(
        events,
        ["input:false:true"],
        "invalid should fire at the control and should not bubble",
      );

      events.length = 0;
      input.value = "ready";
      assert_true(input.reportValidity(), "valid control reportValidity should return true");
      assert_array_equals(events, [], "valid reportValidity should not dispatch invalid");
    },
  );
}, "control checkValidity/reportValidity dispatch invalid events for invalid controls");

test(function () {
  withHost(
    `
      <form id="form">
        <input id="first" required>
        <textarea id="second" required></textarea>
      </form>
    `,
    function (host) {
      const form = host.querySelector("#form");
      const first = host.querySelector("#first");
      const second = host.querySelector("#second");
      const events = [];

      first.addEventListener("invalid", function () {
        events.push("first");
      });
      second.addEventListener("invalid", function () {
        events.push("second");
      });

      assert_false(form.checkValidity(), "form checkValidity should fail when controls are invalid");
      assert_array_equals(events, ["first", "second"], "form checkValidity should visit controls in tree order");

      events.length = 0;
      first.value = "ready";
      second.value = "ready";
      assert_true(form.reportValidity(), "form reportValidity should pass once controls are valid");
      assert_array_equals(events, [], "valid form reportValidity should not dispatch invalid");
    },
  );
}, "form checkValidity/reportValidity aggregate descendant controls");

test(function () {
  withHost(
    `<form id="form"><input id="input" required><button id="submitter"></button></form>`,
    function (host) {
      const form = host.querySelector("#form");
      const input = host.querySelector("#input");
      const submitter = host.querySelector("#submitter");
      const events = [];

      input.addEventListener("invalid", function () {
        events.push("invalid");
      });
      form.addEventListener("submit", function () {
        events.push("submit");
      });

      form.requestSubmit(submitter);
      assert_array_equals(
        events,
        ["invalid"],
        "requestSubmit should run validation and stop before submit when a control is invalid",
      );
    },
  );
}, "requestSubmit dispatches invalid and suppresses submit on validation failure");
</script>
