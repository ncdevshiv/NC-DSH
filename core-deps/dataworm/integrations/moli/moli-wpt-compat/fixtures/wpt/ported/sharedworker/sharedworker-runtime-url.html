<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
let uniqueNameCounter = 0;

function unique_name(prefix) {
  uniqueNameCounter++;
  return prefix + "-" + Date.now() + "-" + uniqueNameCounter;
}

function next_port_message(port) {
  return new Promise(function (resolve) {
    port.addEventListener("message", resolve, { once: true });
    port.start();
  });
}

promise_test(async function () {
  const first = new SharedWorker(
    "/wpt/ported/sharedworker/resources/runtime-url/fragment-worker.js#one",
    unique_name("fragment-one"),
  );
  const second = new SharedWorker(
    "/wpt/ported/sharedworker/resources/runtime-url/fragment-worker.js#two",
    unique_name("fragment-two"),
  );

  const firstMessage = (await next_port_message(first.port)).data;
  const secondMessage = (await next_port_message(second.port)).data;

  assert_equals(firstMessage.hash, "#one");
  assert_equals(secondMessage.hash, "#two");
  assert_true(firstMessage.href.endsWith("/fragment-worker.js#one"));
  assert_true(secondMessage.href.endsWith("/fragment-worker.js#two"));
}, "SharedWorker location preserves constructor URL fragments while fetching the resource without the fragment");

promise_test(async function () {
  const worker = new SharedWorker(
    "/wpt/ported/sharedworker/resources/runtime-url/beta/importscripts.py",
    unique_name("importscripts-baseurl"),
  );
  const message = (await next_port_message(worker.port)).data;

  assert_equals(message.result, "gamma/script.js");
  assert_true(
    message.href.endsWith("/runtime-url/gamma/importscripts.js"),
    "redirected final script URL should become the importScripts base URL",
  );
}, "SharedWorker importScripts resolves relative URLs against the redirected final worker script URL");

promise_test(async function () {
  const worker = new SharedWorker(
    "/wpt/ported/sharedworker/resources/runtime-url/beta/xhr-worker.py",
    unique_name("xhr-baseurl"),
  );
  const message = (await next_port_message(worker.port)).data;

  assert_equals(message.response, "gamma\n");
  assert_true(
    message.href.endsWith("/runtime-url/gamma/xhr-worker.js"),
    "redirected final script URL should become the XMLHttpRequest base URL",
  );
}, "SharedWorker XMLHttpRequest resolves relative URLs against the redirected final worker script URL");

promise_test(async function () {
  const worker = new SharedWorker(
    "/wpt/ported/sharedworker/resources/runtime-url/module-main.js",
    { name: unique_name("module-sharedworker"), type: "module" },
  );
  const message = (await next_port_message(worker.port)).data;

  assert_equals(message.value, "module dependency");
  assert_equals(message.importScriptsType, "function");
  assert_true(message.metaUrl.endsWith("/runtime-url/module-main.js"));
}, "Module SharedWorker evaluates static imports against the module script URL");
</script>
