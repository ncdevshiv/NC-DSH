<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function next_message(worker) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
    }

    function onmessage(event) {
      cleanup();
      resolve(event);
    }

    function onerror(event) {
      cleanup();
      reject(new Error("unexpected worker error: " + event.message));
    }

    worker.addEventListener("message", onmessage);
    worker.addEventListener("error", onerror);
  });
}

function worker_fixture_url() {
  return new URL(
    "/wpt/ported/worker/resources/worker-importscripts-blob-worker.js",
    location.href,
  ).href;
}

promise_test(async function () {
  const worker = new Worker(worker_fixture_url());

  try {
    worker.postMessage("blob-load");
    const message = await next_message(worker);
    assert_true(message.data.blobUrlPrefix, "blob URLs should retain the worker's origin");
    assert_equals(
      message.data.objectUrlType,
      "function",
      "workers should expose URL.createObjectURL",
    );
    assert_equals(
      message.data.imported,
      "blob-loaded",
      "importScripts should execute blob URL scripts",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated workers load blob URL scripts through importScripts");

promise_test(async function () {
  const worker = new Worker(worker_fixture_url());

  try {
    worker.postMessage("revoked-blob");
    const message = await next_message(worker);
    assert_equals(
      message.data.name,
      "NetworkError",
      "revoked blob URLs should fail with NetworkError",
    );
    assert_false(
      message.data.ran,
      "revoked blob URL imports should not execute their script body",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated workers reject revoked blob URL imports");

promise_test(async function () {
  const worker = new Worker(worker_fixture_url());

  try {
    worker.postMessage("prepared-revoke");
    const message = await next_message(worker);
    assert_true(
      message.data.ran,
      "prepared blob URL imports should still run after an earlier script revokes the URL",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated workers keep prepared blob URL imports alive after earlier revocation");
</script>
