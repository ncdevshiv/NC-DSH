<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function parse_reporting_api_body(report) {
  return JSON.parse(report.body)[0];
}

async function take_csp_reports(token) {
  const response = await fetch(
    "/wpt/runtime/csp/reporting/take?token=" + encodeURIComponent(token),
    { cache: "no-store" },
  );
  assert_equals(response.status, 200, "report take endpoint should be reachable");
  return (await response.json()).reports;
}

async function wait_for_csp_report(token, predicate) {
  for (let attempt = 0; attempt < 40; attempt++) {
    for (const report of await take_csp_reports(token)) {
      const parsed = parse_reporting_api_body(report);
      if (predicate(parsed, report)) {
        return { parsed, report };
      }
    }
    await new Promise(resolve => step_timeout(resolve, 25));
  }
  assert_unreached("timed out waiting for dedicated worker CSP WebSocket report-to delivery");
}

function next_message(worker) {
  return new Promise(resolve => {
    worker.addEventListener("message", resolve, { once: true });
  });
}

promise_test(async function () {
  const token = "worker-report-to-report-only-websocket";
  const worker = new Worker(
    "/wpt/ported/worker/resources/worker-response-csp-report-to-websocket-worker.js",
  );

  try {
    const outcome = (await next_message(worker)).data;
    assert_equals(
      outcome.data,
      "worker-report-to-websocket",
      "report-only connect-src must not block the worker WebSocket",
    );
    assert_true(
      outcome.events.some(event => event.disposition === "report" &&
        event.effectiveDirective === "connect-src" &&
        event.instance &&
        event.blockedURI.includes("/wpt/runtime/websocket/echo")),
      "dedicated worker report-only CSP should dispatch a WebSocket SecurityPolicyViolationEvent",
    );

    const match = await wait_for_csp_report(token, report => {
      return report.type === "csp-violation" &&
        report.body.disposition === "report" &&
        report.body.effectiveDirective === "connect-src" &&
        report.body.blockedURL.includes("/wpt/runtime/websocket/echo");
    });
    assert_true(
      match.report.contentType.includes("application/reports+json"),
      "worker WebSocket report-to delivery should use Reporting API content type",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated worker response report-only CSP sends report-to without blocking WebSocket");
</script>
