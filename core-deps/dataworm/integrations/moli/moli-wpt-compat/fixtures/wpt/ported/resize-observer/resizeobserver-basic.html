<!doctype html>
<meta charset="utf-8">
<div id="target" style="width: 37px; height: 19px;"></div>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const target = document.getElementById("target");
  const observer = new ResizeObserver(function () {});

  observer.observe(target);
  const records = observer.takeRecords();

  assert_true(observer instanceof ResizeObserver);
  assert_equals(records.length, 1);
  assert_equals(records[0].target, target);
  assert_equals(records[0].contentRect.width, 37);
  assert_equals(records[0].contentRect.height, 20);
}, "ResizeObserver.observe() queues a record with target and contentRect");

test(function () {
  const target = document.getElementById("target");
  const observer = new ResizeObserver(function () {});

  observer.observe(target);
  observer.unobserve(target);
  assert_equals(observer.takeRecords().length, 0);
}, "ResizeObserver.unobserve() removes pending records for the target");

test(function () {
  const target = document.getElementById("target");
  const observer = new ResizeObserver(function () {});

  observer.observe(target);
  observer.disconnect();
  assert_equals(observer.takeRecords().length, 0);
}, "ResizeObserver.disconnect() clears observed targets and pending records");
</script>
