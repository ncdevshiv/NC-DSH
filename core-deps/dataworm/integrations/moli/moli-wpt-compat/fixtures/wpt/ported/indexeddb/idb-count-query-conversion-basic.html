<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function wait_request(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(
      error && error.name,
      expectedName,
      description || "unexpected exception name"
    );
    return;
  }
  assert_unreached(
    (description || "assert_throws_name") + ": expected an exception"
  );
}

promise_test(async () => {
  const dbname = "idb-count-query-conversion-" + Math.random();
  const storeName = "store";
  const indexName = "byGroup";

  const openRequest = indexedDB.open(dbname, 1);
  openRequest.onupgradeneeded = () => {
    const store = openRequest.result.createObjectStore(storeName);
    store.createIndex(indexName, "group");
    store.add({ id: 1, group: "a" }, 1);
    store.add({ id: 2, group: "a" }, 2);
    store.add({ id: 3, group: "b" }, 3);
  };

  const db = await wait_request(openRequest);
  const tx = db.transaction(storeName);
  const store = tx.objectStore(storeName);
  const index = store.index(indexName);

  assert_equals(
    await wait_request(store.count()),
    3,
    "objectStore.count() missing query counts every record"
  );
  assert_equals(
    await wait_request(store.count(undefined)),
    3,
    "objectStore.count(undefined) counts every record"
  );
  assert_equals(
    await wait_request(store.count(IDBKeyRange.bound(1, 2))),
    2,
    "objectStore.count() accepts IDBKeyRange queries"
  );
  assert_equals(
    await wait_request(index.count("a")),
    2,
    "index.count() accepts valid key queries"
  );
  assert_equals(
    await wait_request(index.count(undefined)),
    3,
    "index.count(undefined) counts every indexed record"
  );

  assert_throws_name(
    "DataError",
    () => store.count({}),
    "objectStore.count() keeps invalid query validation in IndexedDB runtime"
  );
  assert_throws_name(
    "DataError",
    () => index.count({}),
    "index.count() keeps invalid query validation in IndexedDB runtime"
  );

  db.close();
  await wait_request(indexedDB.deleteDatabase(dbname));
}, "IndexedDB count query arguments use WebIDL optional raw any boundaries");
</script>
