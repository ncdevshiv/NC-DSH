<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const decoder = new TextDecoder();
  assert_equals(decoder.encoding, "utf-8");
  assert_false(decoder.fatal);
  assert_false(decoder.ignoreBOM);
  assert_equals(decoder.decode(), "");
}, "TextDecoder exposes default UTF-8 configuration");

test(function () {
  const decoder = new TextDecoder("utf8");
  assert_equals(decoder.decode(new Uint8Array([97, 194, 163, 240, 159, 152, 128])), "a\u00a3\ud83d\ude00");
  assert_equals(decoder.decode(new Uint8Array([0xef, 0xbb, 0xbf, 97])), "a");
  assert_equals(decoder.decode(new Uint8Array([249, 52])), "\ufffd4");
}, "TextDecoder decodes UTF-8 bytes and handles BOM/replacement behavior");

test(function () {
  const buffer = new ArrayBuffer(6);
  const bytes = new Uint8Array(buffer);
  bytes.set([233, 166, 153, 230, 150, 153]);
  assert_equals(new TextDecoder().decode(buffer), "\u9999\u6599");

  const viewBuffer = new ArrayBuffer(7);
  const viewBytes = new Uint8Array(viewBuffer);
  viewBytes.set([80, 81, 82, 83, 84, 85, 86]);
  assert_equals(new TextDecoder().decode(new Uint8Array(viewBuffer, 2, 3)), "RST");
  assert_equals(new TextDecoder().decode(new DataView(buffer)), "\u9999\u6599");
}, "TextDecoder accepts ArrayBuffer and typed buffer views");

test(function () {
  const decoder = new TextDecoder();
  assert_equals(decoder.decode(new Uint8Array([226, 153]), { stream: true }), "");
  assert_equals(decoder.decode(new Uint8Array([165]), { stream: true }), "\u2665");
  assert_equals(decoder.decode(), "");
}, "TextDecoder streams incomplete UTF-8 sequences across decode calls");

test(function () {
  const defaults = new TextDecoder("utf-8", null);
  assert_false(defaults.fatal);
  assert_false(defaults.ignoreBOM);

  const configured = new TextDecoder("utf-8", { fatal: 1, ignoreBOM: "yes" });
  assert_true(configured.fatal);
  assert_true(configured.ignoreBOM);

  const throwingLabel = {
    toString() {
      throw new RangeError("label conversion");
    }
  };
  const throwingOptions = {
    get fatal() {
      throw new RangeError("fatal conversion");
    }
  };

  assert_throws_js(TypeError, function () {
    new TextDecoder(Symbol("utf-8"));
  });
  assert_throws_js(RangeError, function () {
    new TextDecoder(throwingLabel);
  });
  assert_throws_js(TypeError, function () {
    new TextDecoder("utf-8", "options");
  });
  assert_throws_js(RangeError, function () {
    new TextDecoder("utf-8", throwingOptions);
  });
}, "TextDecoder constructor label and options follow WebIDL conversion");
</script>
