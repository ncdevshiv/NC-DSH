<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<div id="parent">
  <p id="child1">Child 1</p>
  <div id="child2"><span id="grandchild">Grandchild</span></div>
  <p id="child3">Child 3</p>
</div>
<script>
test(function () {
  const node = document.getElementById("parent");
  assert_equals(node.compareDocumentPosition(node), 0);
}, "compareDocumentPosition() returns 0 for the same node");

test(function () {
  const parent = document.getElementById("parent");
  const child = document.getElementById("child1");
  const grandchild = document.getElementById("grandchild");

  assert_equals(
    parent.compareDocumentPosition(child),
    Node.DOCUMENT_POSITION_CONTAINED_BY | Node.DOCUMENT_POSITION_FOLLOWING
  );
  assert_equals(
    child.compareDocumentPosition(parent),
    Node.DOCUMENT_POSITION_CONTAINS | Node.DOCUMENT_POSITION_PRECEDING
  );
  assert_equals(
    parent.compareDocumentPosition(grandchild),
    Node.DOCUMENT_POSITION_CONTAINED_BY | Node.DOCUMENT_POSITION_FOLLOWING
  );
  assert_equals(
    grandchild.compareDocumentPosition(parent),
    Node.DOCUMENT_POSITION_CONTAINS | Node.DOCUMENT_POSITION_PRECEDING
  );
}, "compareDocumentPosition() reports ancestor and descendant relationships");

test(function () {
  const child1 = document.getElementById("child1");
  const child2 = document.getElementById("child2");
  const child3 = document.getElementById("child3");
  const grandchild = document.getElementById("grandchild");

  assert_equals(child1.compareDocumentPosition(child2), Node.DOCUMENT_POSITION_FOLLOWING);
  assert_equals(child2.compareDocumentPosition(child1), Node.DOCUMENT_POSITION_PRECEDING);
  assert_equals(child1.compareDocumentPosition(child3), Node.DOCUMENT_POSITION_FOLLOWING);
  assert_equals(child3.compareDocumentPosition(child1), Node.DOCUMENT_POSITION_PRECEDING);
  assert_equals(child1.compareDocumentPosition(grandchild), Node.DOCUMENT_POSITION_FOLLOWING);
  assert_equals(grandchild.compareDocumentPosition(child1), Node.DOCUMENT_POSITION_PRECEDING);
}, "compareDocumentPosition() reports sibling and cousin document order");

test(function () {
  const element = document.getElementById("parent");

  assert_equals(
    document.compareDocumentPosition(element),
    Node.DOCUMENT_POSITION_CONTAINED_BY | Node.DOCUMENT_POSITION_FOLLOWING
  );
  assert_equals(
    element.compareDocumentPosition(document),
    Node.DOCUMENT_POSITION_CONTAINS | Node.DOCUMENT_POSITION_PRECEDING
  );
}, "compareDocumentPosition() handles Document versus descendant elements");

test(function () {
  const container = document.createElement("div");
  const text = container.appendChild(document.createTextNode("before"));
  const span = container.appendChild(document.createElement("span"));
  const comment = container.appendChild(document.createComment("middle"));
  const after = container.appendChild(document.createTextNode("after"));

  assert_equals(container.compareDocumentPosition(text), Node.DOCUMENT_POSITION_CONTAINED_BY | Node.DOCUMENT_POSITION_FOLLOWING);
  assert_equals(text.compareDocumentPosition(container), Node.DOCUMENT_POSITION_CONTAINS | Node.DOCUMENT_POSITION_PRECEDING);
  assert_equals(text.compareDocumentPosition(span), Node.DOCUMENT_POSITION_FOLLOWING);
  assert_equals(span.compareDocumentPosition(comment), Node.DOCUMENT_POSITION_FOLLOWING);
  assert_equals(comment.compareDocumentPosition(after), Node.DOCUMENT_POSITION_FOLLOWING);
  assert_equals(after.compareDocumentPosition(text), Node.DOCUMENT_POSITION_PRECEDING);
}, "compareDocumentPosition() handles Text and Comment nodes in tree order");

test(function () {
  const detachedA = document.createElement("div");
  const detachedB = document.createElement("span");
  const result = detachedA.compareDocumentPosition(detachedB);
  const resultAgain = detachedA.compareDocumentPosition(detachedB);

  assert_true((result & Node.DOCUMENT_POSITION_DISCONNECTED) !== 0);
  assert_true((result & Node.DOCUMENT_POSITION_IMPLEMENTATION_SPECIFIC) !== 0);
  assert_true(
    (result & Node.DOCUMENT_POSITION_PRECEDING) !== 0 ||
    (result & Node.DOCUMENT_POSITION_FOLLOWING) !== 0
  );
  assert_equals(resultAgain, result);
}, "compareDocumentPosition() reports disconnected detached nodes consistently");
</script>
