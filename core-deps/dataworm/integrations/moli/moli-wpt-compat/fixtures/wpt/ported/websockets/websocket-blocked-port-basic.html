<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
promise_test(async function () {
  const socket = new WebSocket("ws://127.0.0.1:25/blocked-port");
  const events = [];

  await new Promise(function (resolve) {
    socket.addEventListener("open", function () {
      events.push("open");
    }, { once: true });
    socket.addEventListener("error", function () {
      events.push("error:" + socket.readyState);
    }, { once: true });
    socket.addEventListener("close", function (event) {
      events.push("close:" + event.code + ":" + event.wasClean);
      resolve();
    }, { once: true });
  });

  assert_array_equals(events, [
    "error:" + WebSocket.CLOSED,
    "close:1006:false",
  ], "blocked WebSocket ports should fail without opening");
}, "WebSocket connections to blocked ports fail with error then abnormal close");
</script>
