<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const controller = new AbortController();
  const signal = controller.signal;
  const events = [];

  assert_false(signal.aborted);
  signal.addEventListener("abort", function (event) {
    events.push(event.type + ":" + String(event.target === signal));
  });
  signal.onabort = function () {
    events.push("onabort");
  };

  controller.abort("boom");
  assert_true(signal.aborted);
  assert_equals(signal.reason, "boom");
  assert_array_equals(events, ["abort:true", "onabort"]);

  controller.abort("again");
  assert_array_equals(events, ["abort:true", "onabort"]);
  assert_equals(signal.reason, "boom");
}, "AbortController aborts once, exposes reason, and dispatches abort");
</script>
