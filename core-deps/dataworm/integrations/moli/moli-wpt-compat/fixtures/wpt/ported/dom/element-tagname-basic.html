<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const HTML_NS = "http://www.w3.org/1999/xhtml";

  assert_equals(document.createElementNS(HTML_NS, "I").tagName, "I");
  assert_equals(document.createElementNS(HTML_NS, "i").tagName, "I");
  assert_equals(document.createElementNS(HTML_NS, "x:b").tagName, "X:B");
}, "tagName uppercases HTML elements in HTML documents");

test(function () {
  const SVG_NS = "http://www.w3.org/2000/svg";

  assert_equals(document.createElementNS(SVG_NS, "svg").tagName, "svg");
  assert_equals(document.createElementNS(SVG_NS, "SVG").tagName, "SVG");
  assert_equals(document.createElementNS(SVG_NS, "s:svg").tagName, "s:svg");
  assert_equals(document.createElementNS(SVG_NS, "s:SVG").tagName, "s:SVG");
  assert_equals(document.createElementNS(SVG_NS, "textPath").tagName, "textPath");
}, "tagName preserves SVG element casing in HTML documents");

test(function () {
  const element = document.createElementNS("http://example.com/", "mixedCase");

  assert_equals(element.tagName, "mixedCase");
}, "tagName preserves non-HTML non-SVG namespace casing");

test(function () {
  const HTML_NS = "http://www.w3.org/1999/xhtml";
  const xmlElement = document.implementation
    .createDocument(HTML_NS, "div", null)
    .documentElement;

  assert_equals(xmlElement.tagName, "div", "tagName in XML document");

  const htmlElement = document.importNode(xmlElement, true);
  assert_equals(htmlElement.tagName, "DIV", "tagName after import into HTML document");
}, "tagName updates when importing an XHTML element into an HTML document");

test(function () {
  const HTML_NS = "http://www.w3.org/1999/xhtml";
  const xmlElement = document.implementation
    .createDocument(HTML_NS, "foo:div", null)
    .documentElement;

  assert_equals(xmlElement.tagName, "foo:div", "qualified tagName in XML document");

  const htmlElement = document.importNode(xmlElement, true);
  assert_equals(htmlElement.tagName, "FOO:DIV", "qualified tagName after import into HTML document");
}, "tagName updates qualified names when importing an XHTML element into an HTML document");

test(function () {
  if (!("DOMParser" in window)) {
    return;
  }

  const xmlElement = new DOMParser()
    .parseFromString('<div xmlns="http://www.w3.org/1999/xhtml">Test</div>', "text/xml")
    .documentElement;

  assert_equals(xmlElement.tagName, "div", "DOMParser XML tagName");

  const htmlElement = document.importNode(xmlElement, true);
  assert_equals(htmlElement.tagName, "DIV", "DOMParser XML tagName after import into HTML document");
}, "tagName updates when importing a DOMParser XHTML element into an HTML document");
</script>
