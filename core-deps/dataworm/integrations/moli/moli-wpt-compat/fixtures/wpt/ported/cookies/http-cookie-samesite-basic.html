<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
promise_test(async function () {
  const setResponse = await fetch("/wpt/runtime/cookies/samesite/set");
  assert_equals(await setResponse.text(), "samesite-cookie=set", "setter route response");

  const checkResponse = await fetch("/wpt/runtime/cookies/samesite/check");
  assert_equals(
    await checkResponse.text(),
    "samesite-cookie=strict-lax",
    "same-site fetch should send SameSite=Strict and SameSite=Lax cookies",
  );
}, "HTTP SameSite Strict and Lax cookies are sent on same-site fetches");
</script>
