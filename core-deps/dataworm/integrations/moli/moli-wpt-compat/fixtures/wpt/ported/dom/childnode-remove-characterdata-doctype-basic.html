<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_childnode_remove(createNode, createParent, label) {
  test(function() {
    const node = createNode();
    assert_true("remove" in node);
    assert_equals(typeof node.remove, "function");
    assert_equals(node.remove.length, 0);
  }, label + " exposes remove()");

  test(function() {
    const node = createNode();
    assert_equals(node.parentNode, null);
    assert_equals(node.remove(), undefined);
    assert_equals(node.parentNode, null);
  }, label + ".remove() is a no-op without a parent");

  test(function() {
    const node = createNode();
    const parent = createParent();
    parent.appendChild(node);
    assert_equals(node.parentNode, parent);
    assert_equals(node.remove(), undefined);
    assert_equals(node.parentNode, null);
    assert_array_equals(Array.from(parent.childNodes), []);
  }, label + ".remove() detaches from parent");

  test(function() {
    const node = createNode();
    const parent = createParent();
    const before = parent.appendChild(document.createComment("before"));
    parent.appendChild(node);
    const after = parent.appendChild(document.createComment("after"));
    assert_equals(node.remove(), undefined);
    assert_equals(node.parentNode, null);
    assert_array_equals(Array.from(parent.childNodes), [before, after]);
  }, label + ".remove() preserves siblings");
}

assert_childnode_remove(
  function() { return document.createTextNode("text"); },
  function() { return document.createElement("div"); },
  "Text"
);
assert_childnode_remove(
  function() { return document.createComment("comment"); },
  function() { return document.createElement("div"); },
  "Comment"
);
assert_childnode_remove(
  function() { return document.createProcessingInstruction("target", "data"); },
  function() { return document.createElement("div"); },
  "ProcessingInstruction"
);
assert_childnode_remove(
  function() { return document.implementation.createDocumentType("html", "", ""); },
  function() { return document.implementation.createDocument(null, "", null); },
  "DocumentType"
);
</script>
