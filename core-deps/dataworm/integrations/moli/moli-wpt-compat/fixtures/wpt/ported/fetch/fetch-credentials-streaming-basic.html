<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/runtime/fixture-server-config.js"></script>
<script>
function alternate_url(path) {
  return location.protocol + "//" + location.hostname + ":" + __lmFixtureServerConfig.alternatePort + path;
}

async function fetch_text(url, init) {
  const response = await fetch(url, init);
  return response.text();
}

function streaming_path(mode, operation) {
  return `/wpt/runtime/fetch/credentials/streaming/${mode}/${operation}`;
}

promise_test(async function () {
  const response = await fetch(alternate_url(streaming_path("include", "set")), {
    credentials: "include",
  });

  assert_equals(
    await fetch_text(alternate_url(streaming_path("include", "check")), {
      credentials: "include",
    }),
    "streaming-include-response-cookie=seen",
    "credentialed streaming response Set-Cookie should be committed when headers arrive",
  );
  assert_equals(
    await response.text(),
    "streaming-include-response-cookie=head-tail",
    "streaming credential response body should remain readable after the early cookie check",
  );
}, "fetch credentials=include stores streaming cross-origin response cookies before body completion");

promise_test(async function () {
  const response = await fetch(alternate_url(streaming_path("default", "set")));

  assert_equals(
    await fetch_text(alternate_url(streaming_path("default", "check")), {
      credentials: "include",
    }),
    "streaming-default-response-cookie=missing",
    "default cross-origin streaming response Set-Cookie should not be committed when headers arrive",
  );
  assert_equals(
    await response.text(),
    "streaming-default-response-cookie=head-tail",
    "default credentials streaming response body should still complete",
  );
  assert_equals(
    await fetch_text(alternate_url(streaming_path("default", "check")), {
      credentials: "include",
    }),
    "streaming-default-response-cookie=missing",
    "default cross-origin streaming response Set-Cookie should remain ignored after body completion",
  );
}, "fetch default credentials ignores streaming cross-origin response cookies");

promise_test(async function () {
  const response = await fetch(streaming_path("omit", "set"), {
    credentials: "omit",
  });

  assert_equals(
    await fetch_text(streaming_path("omit", "check")),
    "streaming-omit-response-cookie=missing",
    "same-origin streaming response Set-Cookie should not be committed when credentials=omit",
  );
  assert_equals(
    await response.text(),
    "streaming-omit-response-cookie=head-tail",
    "omit credentials streaming response body should still complete",
  );
  assert_equals(
    await fetch_text(streaming_path("omit", "check")),
    "streaming-omit-response-cookie=missing",
    "credentials=omit should keep ignoring Set-Cookie after body completion",
  );
}, "fetch credentials=omit ignores streaming same-origin response cookies");
</script>
