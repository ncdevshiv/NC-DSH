<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function () {
  const event = new Event("ready", {
    bubbles: true,
    cancelable: true,
    composed: true
  });

  assert_true(event instanceof Event);
  assert_equals(event.type, "ready");
  assert_true(event.bubbles);
  assert_true(event.cancelable);
  assert_true(event.composed);
  assert_false(event.defaultPrevented);
  assert_equals(event.target, null);
  assert_equals(event.currentTarget, null);
  assert_equals(event.eventPhase, Event.NONE);
  assert_equals(typeof event.timeStamp, "number");

  event.preventDefault();
  assert_true(event.defaultPrevented);
}, "Event constructor initializes core event attributes");

test(function () {
  const event = new Event("plain");

  event.preventDefault();
  assert_false(event.defaultPrevented);
}, "preventDefault() is ignored for non-cancelable events");

test(function () {
  const detail = { message: "hello", count: 3 };
  const event = new CustomEvent("custom", {
    bubbles: true,
    cancelable: true,
    detail
  });

  assert_true(event instanceof Event);
  assert_true(event instanceof CustomEvent);
  assert_equals(event.type, "custom");
  assert_true(event.bubbles);
  assert_true(event.cancelable);
  assert_equals(event.detail, detail);
}, "CustomEvent constructor preserves detail and EventInit attributes");

test(function () {
  const event = new CustomEvent("default");

  assert_equals(event.detail, null);
  assert_false(event.bubbles);
  assert_false(event.cancelable);
}, "CustomEvent constructor defaults detail to null");

test(function () {
  const channel = new MessageChannel();
  const payload = { value: 42 };
  const event = new MessageEvent("message", {
    data: payload,
    origin: "https://example.test",
    lastEventId: "id-1",
    source: window,
    ports: [channel.port1],
    bubbles: true,
    cancelable: true
  });

  assert_true(event instanceof Event);
  assert_true(event instanceof MessageEvent);
  assert_equals(event.type, "message");
  assert_equals(event.data, payload);
  assert_equals(event.origin, "https://example.test");
  assert_equals(event.lastEventId, "id-1");
  assert_equals(event.source, window);
  assert_equals(event.ports.length, 1);
  assert_equals(event.ports[0], channel.port1);
  assert_true(event.bubbles);
  assert_true(event.cancelable);
}, "MessageEvent constructor preserves message init fields");

test(function () {
  const event = new MessageEvent("message");

  assert_true(event instanceof Event);
  assert_true(event instanceof MessageEvent);
  assert_equals(event.type, "message");
  assert_equals(event.data, null);
  assert_equals(event.origin, "");
  assert_equals(event.lastEventId, "");
  assert_equals(event.source, null);
  assert_equals(event.ports.length, 0);
  assert_equals(event.ports, event.ports);
  assert_false(event.bubbles);
  assert_false(event.cancelable);
}, "MessageEvent constructor exposes default message fields");
</script>
