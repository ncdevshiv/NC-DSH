<!doctype html>
<meta charset="utf-8">
<textarea id="drop-target" style="display:block;width:200px;height:200px">hello world</textarea>
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const input = document.getElementById("drop-target");
const events = [];
let firstDataTransfer = null;

input.focus();
input.setSelectionRange(6, 11);

const dropped = new Promise(function (resolve) {
  input.addEventListener("dragenter", function (event) {
    firstDataTransfer = event.dataTransfer;
    events.push(
      "dragenter:" +
        (event instanceof DragEvent) +
        ":" +
        event.dataTransfer.getData("text") +
        ":" +
        event.dataTransfer.dropEffect +
        ":" +
        event.dataTransfer.effectAllowed,
    );
  });

  input.addEventListener("dragover", function (event) {
    events.push(
      "dragover-before:" +
        (event.dataTransfer === firstDataTransfer) +
        ":" +
        event.dataTransfer.getData("text"),
    );
    event.dataTransfer.setData("text", "mutated-in-over");
    event.dataTransfer.dropEffect = "move";
    events.push(
      "dragover-after:" +
        event.dataTransfer.getData("text") +
        ":" +
        event.dataTransfer.dropEffect,
    );
  });

  input.addEventListener("drop", function (event) {
    events.push(
      "drop:" +
        (event.dataTransfer === firstDataTransfer) +
        ":" +
        event.dataTransfer.getData("text") +
        ":" +
        event.dataTransfer.dropEffect +
        ":" +
        input.value,
    );
    setTimeout(resolve, 0);
  });

  input.addEventListener(
    "input",
    function () {
      events.push(
        "input:" + input.value + ":" + input.selectionStart + ":" + input.selectionEnd,
      );
    },
    { once: true },
  );
});

promise_test(async function () {
  await dropped;
  assert_array_equals(
    events,
    [
      "dragenter:true:initial-text:copy:copyMove",
      "dragover-before:true:initial-text",
      "dragover-after:mutated-in-over:move",
      "drop:true:mutated-in-over:move:hello world",
      "input:hello mutated-in-over:21:21",
    ],
    "drag lifecycle should reuse live DataTransfer and run text drop default action",
  );
}, "Input.dispatchDragEvent drives live DataTransfer reuse and text input default drop");
</script>
