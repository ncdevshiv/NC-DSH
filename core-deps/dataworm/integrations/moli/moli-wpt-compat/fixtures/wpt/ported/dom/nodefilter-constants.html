<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
const acceptNodeConstants = [
  ["FILTER_ACCEPT", 1],
  ["FILTER_REJECT", 2],
  ["FILTER_SKIP", 3],
];

const whatToShowConstants = [
  ["SHOW_ALL", 0xffffffff],
  ["SHOW_ELEMENT", 0x1],
  ["SHOW_ATTRIBUTE", 0x2],
  ["SHOW_TEXT", 0x4],
  ["SHOW_CDATA_SECTION", 0x8],
  ["SHOW_ENTITY_REFERENCE", 0x10],
  ["SHOW_ENTITY", 0x20],
  ["SHOW_PROCESSING_INSTRUCTION", 0x40],
  ["SHOW_COMMENT", 0x80],
  ["SHOW_DOCUMENT", 0x100],
  ["SHOW_DOCUMENT_TYPE", 0x200],
  ["SHOW_DOCUMENT_FRAGMENT", 0x400],
  ["SHOW_NOTATION", 0x800],
];

function assert_constants(constants) {
  for (const [name, value] of constants) {
    assert_true(name in NodeFilter, "NodeFilter has " + name);
    assert_equals(NodeFilter[name], value, "NodeFilter." + name);
  }
}

test(function () {
  assert_equals(typeof NodeFilter, "function");
  assert_constants(acceptNodeConstants);
}, "NodeFilter acceptNode constants are exposed on the interface object");

test(function () {
  assert_constants(whatToShowConstants);
  assert_equals(NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_COMMENT, 0x81);
  assert_equals(NodeFilter.SHOW_TEXT | NodeFilter.SHOW_COMMENT, 0x84);
}, "NodeFilter whatToShow constants are exposed on the interface object");
</script>
