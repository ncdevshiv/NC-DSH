<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function test_matched(id, selector) {
  test(function () {
    const container = document.createElement("div");
    const child = document.createElement("span");
    child.id = id;

    container.appendChild(child);

    assert_equals(container.querySelector(selector), child);
  }, JSON.stringify(id) + " should match " + JSON.stringify(selector));
}

test_matched("nonescaped", "#nonescaped");
test_matched("0nextIsWhiteSpace", "#\\30 nextIsWhiteSpace");
test_matched("0nextIsNotHexLetters", "#\\30nextIsNotHexLetters");
test_matched("0connectHexMoreThan6Hex", "#\\000030connectHexMoreThan6Hex");
test_matched(".comma", "#\\.comma");
test_matched("-minus", "#\\-minus");
test_matched("g", "#\\g");
test_matched("aBMPRegular", "#\\61 BMPRegular");
test_matched("\u{1f511}nonBMP", "#\\1f511 nonBMP");
test_matched("00continueEscapes", "#\\30\\30 continueEscapes");
test_matched("00continueEscapesWithSpace", "#\\30 \\30 continueEscapesWithSpace");
test_matched("hello", "#hel\\6Co");
test_matched("&B", "#\\26 B");
test_matched("test", "#te\\s\\t");
test_matched(".,:!", "#\\.\\,\\:\\!");
test_matched("simple-ident", "#simple-ident");
test_matched("_underscore", "#_underscore");
test_matched("\u{A0}", "#\u{A0}");
</script>
