<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/runtime/fixture-server-config.js"></script>
<script>
function alternate_url(path) {
  return location.protocol + "//" + location.hostname + ":" + __lmFixtureServerConfig.alternatePort + path;
}

function load_frame(url) {
  return new Promise(function (resolve) {
    const iframe = document.createElement("iframe");
    iframe.onload = function () {
      iframe.remove();
      resolve();
    };
    iframe.src = url;
    (document.body || document.documentElement).appendChild(iframe);
  });
}

function next_worker_message(worker) {
  return new Promise(function (resolve, reject) {
    worker.addEventListener("message", resolve, { once: true });
    worker.addEventListener("error", function (event) {
      reject(new Error(event.message || "worker error"));
    }, { once: true });
  });
}

async function fetch_text(url, init) {
  const response = await fetch(url, init);
  return response.text();
}

promise_test(async function () {
  await load_frame(alternate_url("/wpt/runtime/worker/module-credentials/set-cookie"));
  assert_equals(
    await fetch_text(alternate_url("/wpt/runtime/worker/module-credentials/check-cookie"), {
      credentials: "include",
    }),
    "module-worker-cookie=seen",
    "test setup should store a cookie on the dependency origin",
  );

  const workerUrl = new URL(
    "/wpt/runtime/worker/module-credentials/main.js",
    location.href
  ).href;
  const worker = new Worker(workerUrl, { type: "module" });

  try {
    const message = await next_worker_message(worker);
    assert_equals(
      message.data.credentialCookie,
      "missing",
      "cross-origin module worker dependencies should use same-origin credentials and omit cookies",
    );
    assert_equals(message.data.metaUrl, workerUrl, "main module import.meta.url should remain the worker URL");
  } finally {
    worker.terminate();
  }
}, "Dedicated module worker static imports omit cookies for cross-origin dependencies");
</script>
