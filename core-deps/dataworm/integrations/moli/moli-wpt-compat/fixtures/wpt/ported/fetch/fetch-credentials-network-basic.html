<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script src="/wpt/runtime/fixture-server-config.js"></script>
<script>
function alternate_url(path) {
  return location.protocol + "//" + location.hostname + ":" + __lmFixtureServerConfig.alternatePort + path;
}

function load_frame(url) {
  return new Promise(function (resolve) {
    const iframe = document.createElement("iframe");
    iframe.onload = function () {
      iframe.remove();
      resolve();
    };
    iframe.src = url;
    (document.body || document.documentElement).appendChild(iframe);
  });
}

async function fetch_text(url, init) {
  const response = await fetch(url, init);
  return response.text();
}

promise_test(async function () {
  await load_frame(alternate_url("/wpt/runtime/fetch/credentials/request-cookie/set"));

  assert_equals(
    await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/request-cookie/check")),
    "request-cookie=missing",
    "cross-origin fetch should omit cookies by default",
  );
  assert_equals(
    await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/request-cookie/check"), {
      credentials: "same-origin",
    }),
    "request-cookie=missing",
    "cross-origin fetch with credentials=same-origin should omit cookies",
  );
  assert_equals(
    await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/request-cookie/check"), {
      credentials: "include",
    }),
    "request-cookie=seen",
    "cross-origin fetch with credentials=include should send cookies",
  );
  assert_equals(
    await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/request-cookie/check"), {
      credentials: "omit",
    }),
    "request-cookie=missing",
    "fetch with credentials=omit should omit cookies",
  );
}, "fetch credentials mode controls cross-origin request cookies");

promise_test(async function () {
  await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/default-response-cookie/set"));
  assert_equals(
    await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/default-response-cookie/check"), {
      credentials: "include",
    }),
    "default-response-cookie=missing",
    "cross-origin Set-Cookie should be ignored by default",
  );

  await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/include-response-cookie/set"), {
    credentials: "include",
  });
  assert_equals(
    await fetch_text(alternate_url("/wpt/runtime/fetch/credentials/include-response-cookie/check"), {
      credentials: "include",
    }),
    "include-response-cookie=seen",
    "cross-origin Set-Cookie should be stored with credentials=include",
  );

  await fetch_text("/wpt/runtime/fetch/credentials/omit-response-cookie/set", {
    credentials: "omit",
  });
  assert_equals(
    await fetch_text("/wpt/runtime/fetch/credentials/omit-response-cookie/check"),
    "omit-response-cookie=missing",
    "same-origin Set-Cookie should be ignored with credentials=omit",
  );
}, "fetch credentials mode controls response cookie storage");
</script>
