<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(
      error && error.name,
      expectedName,
      description || "unexpected exception name"
    );
    return;
  }
  assert_unreached(
    (description || "assert_throws_name") + ": expected an exception"
  );
}

function wait_request(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

promise_test(async () => {
  const dbname = "idb-schema-conversion-" + Math.random();
  const objectName = "object-store-" + Math.random();
  const stringifiedName = {
    toString() {
      return objectName;
    },
  };
  const throwingName = {
    toString() {
      throw new RangeError("schema name conversion");
    },
  };
  const throwingOptions = {
    get keyPath() {
      throw new RangeError("object store options conversion");
    },
  };

  const request = indexedDB.open(dbname, 1);
  request.onupgradeneeded = () => {
    const db = request.result;

    assert_throws_name(
      "TypeError",
      () => db.createObjectStore(),
      "createObjectStore name is required"
    );
    assert_throws_name(
      "TypeError",
      () => db.deleteObjectStore(),
      "deleteObjectStore name is required"
    );
    assert_throws_name(
      "TypeError",
      () => db.createObjectStore(Symbol("store")),
      "createObjectStore rejects Symbol name"
    );
    assert_throws_name(
      "TypeError",
      () => db.deleteObjectStore(Symbol("store")),
      "deleteObjectStore rejects Symbol name"
    );
    assert_throws_name(
      "RangeError",
      () => db.createObjectStore(throwingName),
      "createObjectStore propagates name stringification errors"
    );
    assert_throws_name(
      "RangeError",
      () => db.deleteObjectStore(throwingName),
      "deleteObjectStore propagates name stringification errors"
    );
    assert_throws_name(
      "TypeError",
      () => db.createObjectStore("bad-options", Symbol("options")),
      "createObjectStore rejects non-object options dictionaries"
    );
    assert_throws_name(
      "RangeError",
      () => db.createObjectStore("throwing-options", throwingOptions),
      "createObjectStore propagates options getter errors"
    );
    assert_throws_name(
      "InvalidAccessError",
      () => db.createObjectStore("compound-auto", {
        keyPath: ["id", "group"],
        autoIncrement: true,
      }),
      "createObjectStore rejects sequence keyPath with autoIncrement"
    );

    const store = db.createObjectStore(stringifiedName);
    assert_equals(store.name, objectName, "object name stringifies through DOMString");
    assert_true(
      db.objectStoreNames.contains(objectName),
      "created object store is visible in objectStoreNames"
    );

    const optionStore = db.createObjectStore("options-store", {
      keyPath: {
        toString() {
          return "id";
        },
      },
      autoIncrement: { valueOf() { throw new RangeError("unused"); } },
    });
    assert_equals(optionStore.keyPath, "id", "options keyPath uses DOMString conversion");
    assert_true(optionStore.autoIncrement, "options autoIncrement uses boolean conversion");
    assert_true(
      db.objectStoreNames.contains("options-store"),
      "options-created store is visible"
    );

    const compoundStore = db.createObjectStore("compound-store", {
      keyPath: ["id", "group"],
    });
    assert_array_equals(
      compoundStore.keyPath,
      ["id", "group"],
      "options keyPath accepts sequence conversion"
    );
    compoundStore.add({ id: 1, group: "a", value: "compound value" });

    const undefinedStore = db.createObjectStore(undefined);
    assert_equals(
      undefinedStore.name,
      "undefined",
      "present undefined converts to a DOMString object store name"
    );
    assert_true(
      db.objectStoreNames.contains("undefined"),
      "undefined-named object store is visible"
    );

    db.deleteObjectStore(undefined);
    assert_false(
      db.objectStoreNames.contains("undefined"),
      "deleteObjectStore converts present undefined before deletion"
    );

    db.deleteObjectStore(stringifiedName);
    assert_false(
      db.objectStoreNames.contains(objectName),
      "deleteObjectStore converts object name before deletion"
    );

    db.deleteObjectStore("options-store");
  };

  const db = await wait_request(request);
  const compoundTx = db.transaction("compound-store");
  const compoundStore = compoundTx.objectStore("compound-store");
  const compoundValue = await wait_request(compoundStore.get([1, "a"]));
  assert_equals(
    compoundValue.value,
    "compound value",
    "sequence keyPath derives compound object store keys"
  );

  assert_equals(db.objectStoreNames.length, 1, "only compound smoke store remains");
  db.close();
  await wait_request(indexedDB.deleteDatabase(dbname));
}, "IDBDatabase object store schema arguments follow WebIDL conversion");
</script>
