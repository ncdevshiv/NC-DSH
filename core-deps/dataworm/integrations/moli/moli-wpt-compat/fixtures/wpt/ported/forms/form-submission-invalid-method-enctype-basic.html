<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<body></body>
<script>
function read_frame_text(frame) {
  return frame.contentDocument?.body?.textContent?.trim() ?? "";
}

function read_payload(frame) {
  const text = read_frame_text(frame);
  if (text === "") {
    return null;
  }
  return JSON.parse(text);
}

function wait(ms) {
  return new Promise(function (resolve) {
    setTimeout(resolve, ms);
  });
}

function wait_for_payload(frame, description) {
  return Promise.race([
    new Promise(function (resolve, reject) {
      const deadline = Date.now() + 1000;
      function poll() {
        const payload = read_payload(frame);
        if (payload !== null) {
          resolve(payload);
          return;
        }
        if (Date.now() >= deadline) {
          reject(new Error("timed out waiting for " + description));
          return;
        }
        setTimeout(poll, 10);
      }
      poll();
    }),
    wait(1100).then(function () {
      throw new Error("timed out waiting for " + description);
    }),
  ]);
}

function append_text(form, name, value) {
  const input = document.createElement("input");
  input.name = name;
  input.value = value;
  form.appendChild(input);
  return input;
}

function append_target_frame(name) {
  const frame = document.createElement("iframe");
  frame.name = name;
  document.body.appendChild(frame);
  return frame;
}

function create_form(target, search) {
  const form = document.createElement("form");
  form.target = target;
  form.action = "/wpt/runtime/forms/submit-echo?stale=1&case=" + search;
  document.body.appendChild(form);
  return form;
}

const invalidMethodFrame = append_target_frame("invalid-method-target");
const invalidMethodForm = create_form("invalid-method-target", "invalid-method");
invalidMethodForm.method = "put";
invalidMethodForm.enctype = "multipart/form-data";
append_text(invalidMethodForm, "alpha", "one");
append_text(invalidMethodForm, "beta", "two words");
invalidMethodForm.submit();

const invalidEnctypeFrame = append_target_frame("invalid-enctype-target");
const invalidEnctypeForm = create_form("invalid-enctype-target", "invalid-enctype");
invalidEnctypeForm.method = "post";
invalidEnctypeForm.enctype = "application/json";
append_text(invalidEnctypeForm, "alpha", "one");
append_text(invalidEnctypeForm, "beta", "two words");
invalidEnctypeForm.submit();

const invalidSubmitterMethodFrame = append_target_frame("invalid-submitter-method-target");
const invalidSubmitterMethodForm = create_form(
  "invalid-submitter-method-target",
  "invalid-submitter-method",
);
invalidSubmitterMethodForm.method = "post";
invalidSubmitterMethodForm.enctype = "text/plain";
append_text(invalidSubmitterMethodForm, "alpha", "submitter method");
const invalidMethodSubmitter = document.createElement("button");
invalidMethodSubmitter.type = "submit";
invalidMethodSubmitter.name = "submitter";
invalidMethodSubmitter.value = "invalid-method";
invalidMethodSubmitter.setAttribute("formmethod", "trace");
invalidMethodSubmitter.setAttribute("formenctype", "multipart/form-data");
invalidSubmitterMethodForm.appendChild(invalidMethodSubmitter);
invalidSubmitterMethodForm.requestSubmit(invalidMethodSubmitter);

const invalidSubmitterEnctypeFrame = append_target_frame("invalid-submitter-enctype-target");
const invalidSubmitterEnctypeForm = create_form(
  "invalid-submitter-enctype-target",
  "invalid-submitter-enctype",
);
invalidSubmitterEnctypeForm.method = "post";
invalidSubmitterEnctypeForm.enctype = "text/plain";
append_text(invalidSubmitterEnctypeForm, "alpha", "submitter enctype");
const invalidEnctypeSubmitter = document.createElement("button");
invalidEnctypeSubmitter.type = "submit";
invalidEnctypeSubmitter.name = "submitter";
invalidEnctypeSubmitter.value = "invalid-enctype";
invalidEnctypeSubmitter.setAttribute("formmethod", "post");
invalidEnctypeSubmitter.setAttribute("formenctype", "application/json");
invalidSubmitterEnctypeForm.appendChild(invalidEnctypeSubmitter);
invalidSubmitterEnctypeForm.requestSubmit(invalidEnctypeSubmitter);

promise_test(async function () {
  const payload = await wait_for_payload(invalidMethodFrame, "invalid form method submission");
  assert_equals(payload.method, "GET", "invalid form method should fall back to GET");
  assert_equals(
    payload.search,
    "?alpha=one&beta=two+words",
    "GET fallback should replace the action query with successful controls",
  );
  assert_equals(payload.body, "", "GET fallback should not send a request body");
  assert_equals(payload.content_type, null, "GET fallback should not send a form Content-Type");
}, "Invalid form method falls back to GET for real submission");

promise_test(async function () {
  const payload = await wait_for_payload(invalidEnctypeFrame, "invalid form enctype submission");
  assert_equals(payload.method, "POST", "valid POST method should be preserved");
  assert_equals(payload.search, "?stale=1&case=invalid-enctype", "POST should preserve the action query");
  assert_equals(
    payload.content_type,
    "application/x-www-form-urlencoded",
    "invalid form enctype should fall back to application/x-www-form-urlencoded",
  );
  assert_equals(
    payload.body,
    "alpha=one&beta=two+words",
    "invalid form enctype fallback should send a urlencoded body",
  );
}, "Invalid form enctype falls back to urlencoded for POST submission");

promise_test(async function () {
  const payload = await wait_for_payload(
    invalidSubmitterMethodFrame,
    "invalid submitter formmethod submission",
  );
  assert_equals(payload.method, "GET", "invalid submitter formmethod should fall back to GET");
  assert_equals(
    payload.search,
    "?alpha=submitter+method&submitter=invalid-method",
    "submitter method fallback should include the active submitter in the GET query",
  );
  assert_equals(payload.body, "", "submitter GET fallback should not send a request body");
  assert_equals(payload.content_type, null, "submitter GET fallback should not send Content-Type");
}, "Invalid submitter formmethod falls back to GET and overrides the form method");

promise_test(async function () {
  const payload = await wait_for_payload(
    invalidSubmitterEnctypeFrame,
    "invalid submitter formenctype submission",
  );
  assert_equals(payload.method, "POST", "submitter formmethod=post should preserve POST");
  assert_equals(
    payload.content_type,
    "application/x-www-form-urlencoded",
    "invalid submitter formenctype should fall back to application/x-www-form-urlencoded",
  );
  assert_equals(
    payload.body,
    "alpha=submitter+enctype&submitter=invalid-enctype",
    "submitter enctype fallback should include the active submitter in the urlencoded body",
  );
}, "Invalid submitter formenctype falls back to urlencoded and overrides the form enctype");
</script>
