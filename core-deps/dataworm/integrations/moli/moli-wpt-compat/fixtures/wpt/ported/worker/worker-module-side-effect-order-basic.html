<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function worker_url(source) {
  return "data:text/javascript," + encodeURIComponent(source);
}

function next_worker_event(worker) {
  return new Promise(function (resolve, reject) {
    function cleanup() {
      worker.removeEventListener("message", onmessage);
      worker.removeEventListener("error", onerror);
    }

    function onmessage(event) {
      cleanup();
      resolve(event);
    }

    function onerror(event) {
      cleanup();
      reject(new Error(event.message || "worker error"));
    }

    worker.addEventListener("message", onmessage);
    worker.addEventListener("error", onerror);
  });
}

promise_test(async function () {
  const sharedUrl = worker_url([
    "self.__moduleOrder = self.__moduleOrder || [];",
    "self.__moduleOrder.push('shared');",
    "export const marker = 'shared-marker';",
  ].join("\n"));
  const firstUrl = worker_url([
    "import " + JSON.stringify(sharedUrl) + ";",
    "self.__moduleOrder.push('first');",
    "export const first = 'first-export';",
  ].join("\n"));
  const secondUrl = worker_url([
    "import { marker } from " + JSON.stringify(sharedUrl) + ";",
    "self.__moduleOrder.push('second:' + marker);",
    "export const second = marker;",
  ].join("\n"));
  const source = [
    "import " + JSON.stringify(firstUrl) + ";",
    "import { second } from " + JSON.stringify(secondUrl) + ";",
    "import " + JSON.stringify(sharedUrl) + ";",
    "postMessage({",
    "  order: self.__moduleOrder.join('|'),",
    "  second,",
    "});",
  ].join("\n");
  const worker = new Worker(worker_url(source), { type: "module" });

  try {
    const event = await next_worker_event(worker);
    assert_equals(
      event.data.order,
      "shared|first|second:shared-marker",
      "dependency side effects should run before importers and shared modules should evaluate once",
    );
    assert_equals(
      event.data.second,
      "shared-marker",
      "named imports should still read exports from the shared dependency",
    );
  } finally {
    worker.terminate();
  }
}, "Dedicated module workers evaluate side-effect imports once in dependency order");
</script>
