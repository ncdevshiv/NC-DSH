<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<button></button>
<span data-e2="2" data-F2="3" id="case-fixture"></span>
<div id="foo"></div>
<p data-foo=""></p>
<script>
test(function () {
  const el = document.createElement("p");
  el.setAttributeNS("foo", "x", "first");

  assert_true(el.hasAttribute("x"));
}, "hasAttribute checks attribute presence irrespective of namespace");

test(function () {
  const el = document.getElementById("case-fixture");

  assert_true(el.hasAttribute("data-e2"));
  assert_true(el.hasAttribute("data-E2"));
  assert_true(el.hasAttribute("data-f2"));
  assert_true(el.hasAttribute("data-F2"));
}, "hasAttribute works with all attribute casings on HTML elements");

test(function () {
  const buttonElement = document.getElementsByTagName("button")[0];
  assert_equals(buttonElement.hasAttributes(), false);

  const emptyDiv = document.createElement("div");
  assert_equals(emptyDiv.hasAttributes(), false);
}, "hasAttributes returns false for elements without attributes");

test(function () {
  const divWithId = document.getElementById("foo");
  assert_equals(divWithId.hasAttributes(), true);

  const divWithClass = document.createElement("div");
  divWithClass.setAttribute("class", "foo");
  assert_equals(divWithClass.hasAttributes(), true);

  const pWithCustomAttr = document.querySelector("p");
  assert_equals(pWithCustomAttr.hasAttributes(), true);

  const divWithCustomAttr = document.createElement("div");
  divWithCustomAttr.setAttribute("data-custom", "foo");
  assert_equals(divWithCustomAttr.hasAttributes(), true);
}, "hasAttributes returns true for elements with attributes");
</script>
