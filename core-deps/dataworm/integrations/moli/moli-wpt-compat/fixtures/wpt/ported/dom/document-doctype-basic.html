<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
test(function() {
  assert_true(document.doctype instanceof DocumentType);
  assert_equals(document.doctype, document.childNodes[1]);
  assert_equals(document.childNodes[0].nodeType, Node.COMMENT_NODE);
  assert_equals(document.childNodes[1].nodeType, Node.DOCUMENT_TYPE_NODE);
}, "document.doctype returns the doctype child even after a leading comment");

test(function() {
  const newdoc = new Document();
  newdoc.appendChild(newdoc.createElement("html"));
  assert_equals(newdoc.doctype, null);
}, "new Document() has no doctype");
</script>
