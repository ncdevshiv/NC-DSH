<!doctype html>
<meta charset="utf-8">
<script src="/wpt/resources/testharness.js"></script>
<script src="/wpt/resources/testharnessreport.js"></script>
<script src="/wpt/resources/moli-wpt-adapter.js"></script>
<script>
function assert_throws_name(expectedName, callback, description) {
  try {
    callback();
  } catch (error) {
    assert_equals(error.name, expectedName, description);
    return;
  }
  throw new Error(description || "expected exception");
}

test(function () {
  assert_true(localStorage instanceof Storage);
  assert_true(sessionStorage instanceof Storage);
  assert_true(Storage.prototype.isPrototypeOf(localStorage));
  assert_true(Storage.prototype.isPrototypeOf(sessionStorage));
  assert_equals(Object.prototype.toString.call(localStorage), "[object Storage]");
}, "localStorage and sessionStorage expose Storage instances");

test(function () {
  localStorage.clear();

  assert_equals(localStorage.length, 0);
  assert_equals(localStorage.getItem("missing"), null);
  assert_throws_name("TypeError", () => localStorage.key(), "key() requires an index argument");
  assert_equals(localStorage.key(0), null);

  localStorage.setItem("alpha", "1");
  localStorage.setItem("beta", "2");
  localStorage.setItem("alpha", "3");

  assert_equals(localStorage.length, 2);
  assert_equals(localStorage.getItem("alpha"), "3");
  assert_equals(localStorage.getItem("beta"), "2");
  assert_array_equals([localStorage.key(0), localStorage.key(1)].sort(), ["alpha", "beta"]);

  localStorage.removeItem("beta");
  assert_equals(localStorage.length, 1);
  assert_equals(localStorage.getItem("beta"), null);

  localStorage.clear();
  assert_equals(localStorage.length, 0);
}, "Storage supports setItem, getItem, key, removeItem, and clear");

test(function () {
  localStorage.clear();
  localStorage.setItem("alpha", "1");
  localStorage.setItem("beta", "2");

  const first = localStorage.key(0);
  const second = localStorage.key(1);
  assert_true(first !== null);
  assert_true(second !== null);

  assert_equals(localStorage.key(2), null, "out-of-range index returns null");
  assert_equals(localStorage.key(-1), null, "negative one wraps to an out-of-range unsigned long index");
  assert_equals(localStorage.key(undefined), first, "undefined converts to unsigned long zero");
  assert_equals(localStorage.key(null), first, "null converts to unsigned long zero");
  assert_equals(localStorage.key(NaN), first, "NaN converts to unsigned long zero");
  assert_equals(localStorage.key(Infinity), first, "Infinity converts to unsigned long zero");
  assert_equals(localStorage.key("1.9"), second, "fractional strings truncate through unsigned long conversion");
  assert_equals(localStorage.key(-4294967295), second, "negative values wrap through unsigned long conversion");
  assert_equals(localStorage.key(4294967297), second, "large values wrap through unsigned long conversion");
  assert_equals(localStorage.key({ valueOf() { return 1; } }), second, "object indexes use ToNumber conversion");
  assert_throws_name("Error", () => localStorage.key({ valueOf() { throw new Error("boom"); } }), "throwing ToNumber should propagate");
  assert_throws_name("TypeError", () => localStorage.key(Symbol("index")), "key() should reject Symbol conversion");
  assert_throws_name("TypeError", () => localStorage.key(1n), "key() should reject BigInt conversion");

  localStorage.clear();
}, "Storage.key applies WebIDL unsigned long index conversion");

test(function () {
  localStorage.clear();

  localStorage.setItem(null, 123);
  localStorage.setItem(undefined, false);

  assert_equals(localStorage.getItem("null"), "123");
  assert_equals(localStorage.getItem(null), "123");
  assert_equals(localStorage.getItem("undefined"), "false");
  assert_equals(localStorage.getItem(undefined), "false");

  localStorage.clear();
}, "Storage stringifies keys and values");

test(function () {
  localStorage.clear();
  sessionStorage.clear();

  localStorage.setItem("shared", "local");
  sessionStorage.setItem("shared", "session");

  assert_equals(localStorage.getItem("shared"), "local");
  assert_equals(sessionStorage.getItem("shared"), "session");
  assert_equals(localStorage.length, 1);
  assert_equals(sessionStorage.length, 1);

  localStorage.clear();
  assert_equals(localStorage.getItem("shared"), null);
  assert_equals(sessionStorage.getItem("shared"), "session");

  sessionStorage.clear();
}, "localStorage and sessionStorage keep independent areas");

test(function () {
  localStorage.clear();

  localStorage.propertyName = "property-value";
  assert_equals(localStorage.getItem("propertyName"), "property-value");
  assert_equals(localStorage.propertyName, "property-value");
  assert_true("propertyName" in localStorage);

  delete localStorage.propertyName;
  assert_equals(localStorage.getItem("propertyName"), null);

  localStorage.clear();
}, "Storage supports named property access for stored keys");
</script>
