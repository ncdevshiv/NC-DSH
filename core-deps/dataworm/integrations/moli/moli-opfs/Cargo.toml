[package]
license.workspace = true
name = "moli-opfs"
version = "0.1.0"
edition = "2024"
description = "Renderer-neutral Origin Private File System backend for Moli"

[dependencies]
moli-crypto = { path = "../moli-crypto" }
parking_lot = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
