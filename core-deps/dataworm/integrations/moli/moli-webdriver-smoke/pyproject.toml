[project]
name = "moli-webdriver-smoke"
version = "0.1.0"
description = "WebDriver smoke tests for moli"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "selenium>=4.44,<5",
  "websockets>=13,<16",
]

[project.scripts]
moli-webdriver-smoke = "moli_webdriver_smoke.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moli_webdriver_smoke"]
