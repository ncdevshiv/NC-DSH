# Local DSH integration settings for SearXNG.
# Loaded over searx/settings.yml via SEARXNG_SETTINGS_PATH.
# JSON format is enabled so the DSH plugin can query the search API on loopback.

use_default_settings: true

general:
  instance_name: "SearXNG (DSH)"
  debug: false
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "auto"
  formats:
    - html
    - json
    - csv
    - rss

server:
  port: 8899
  bind_address: "127.0.0.1"
  base_url: false
  limiter: false
  public_instance: false
  secret_key: "dsh-searxng-local-4f2a9c81e7b35d06"
  image_proxy: false
  http_protocol_version: "1.1"
  method: "GET"

valkey:
  url: false

ui:
  static_path: ""
  templates_path: ""
  default_theme: simple
  theme_args:
    simple_style: auto

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
