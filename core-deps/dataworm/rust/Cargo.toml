[package]
name = "dataworm-rs"
version = "0.1.1"
edition = "2021"
description = "Rust heavy-ops core for DataWorm: crawl, hashing, references, impact, signature. Callable in-process (PyO3) and as a standalone JSON binary."

[lib]
name = "dataworm_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dataworm-core"
path = "src/bin/main.rs"

[features]
default = []
# PyO3 Python extension module. Required for the cdylib usable from Python.
# Gated so the standalone `rlib`/binary build (no Python) compiles cleanly.
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
md-5 = "0.10"
regex = "1.10"
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
