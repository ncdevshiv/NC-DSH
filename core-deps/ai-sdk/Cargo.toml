[workspace]
resolver = "2"
members = [
    "crates/ai-types",
    "crates/ai-core",
    "crates/ai-config",
    "crates/ai-errors",
    "crates/ai-models",
    "crates/ai-providers",
    "crates/ai-runtime",
    "crates/ai-stream",
    "crates/ai-tools",
    "crates/ai-protocols",
    "crates/ai-agents",
    "crates/ai-web",
    "crates/ai-memory",
    "crates/ai-rag",
    "crates/ai-workflows",
    "crates/ai-observability",
    "crates/ai-analytics",
    "crates/ai-devtools",
    "crates/ai-security",
    "crates/ai-cache",
    "crates/ai-storage",
    "crates/ai-edge",
    "crates/ai-voice",
    "crates/ai-cli",
    "crates/ai-computer",
    "crates/ai-sdk",
    "crates/ai-orchestra",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Shivam Tiwari <ncdevshiv@gmail.com>"]
repository = "https://github.com/ncdevshiv/ai-sdk"
homepage = "https://github.com/ncdevshiv/ai-sdk"
keywords = ["ai", "sdk", "adk", "agent", "llm", "providers", "rag", "mcp"]
categories = ["api-bindings", "asynchronous", "web-programming"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client (provider APIs, web subsystem)
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "http2", "multipart", "rustls-tls"], default-features = false }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Errors
thiserror = "2"
# Async traits
async-trait = "0.1"
# Tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Futures / streams
futures = "0.3"
futures-core = "0.3"
async-stream = "0.3"
# Byte buffers (streaming bodies)
bytes = "1"
# Concurrency utilities
tokio-util = { version = "0.7", features = ["rt"] }
# URLs / SSRF safety
url = "2"
# Log redaction
redact = "0.1"
# UUIDs for trace/request/execution ids
uuid = { version = "1", features = ["v4", "serde"] }
# Time
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
# CLI
clap = { version = "4", features = ["derive", "env"] }
# HTML parsing / extraction (web subsystem)
scraper = "0.20"
# Unicode / encoding detection
encoding_rs = "0.8"
# Regex (URL patterns, robots, redaction)
regex = "1"
# SQLite storage adapter (memory long-term)
rusqlite = { version = "0.32", features = ["bundled"] }
# Benchmarking
criterion = { version = "0.5", features = ["async_tokio"] }
# Property-based testing
proptest = { version = "1", features = ["regex-syntax"] }
# Random (jitter, backoff)
rand = "0.8"
# Async mutex/storage helpers
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
