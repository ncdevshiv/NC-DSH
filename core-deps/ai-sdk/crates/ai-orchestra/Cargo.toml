[package]
name = "ai-orchestra"
description = "Orchestrator harness core: task trees, run handles, agent registry, clarification mailbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ai-agents = { path = "../ai-agents" }
ai-core = { path = "../ai-core" }
ai-errors = { path = "../ai-errors" }
ai-types = { path = "../ai-types" }
ai-runtime = { path = "../ai-runtime" }
tokio.workspace = true
# Verified: in tokio-util 0.7.x `tokio_util::sync::CancellationToken` lives in
# an UNGATED module (there is no "sync" feature), so the workspace
# declaration's "rt" feature is all we need.
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
parking_lot.workspace = true

[dev-dependencies]
# Needed to implement offline scripted `Model`s for registry tests.
ai-models = { path = "../ai-models" }
proptest.workspace = true
# Real provider for the credential-gated live end-to-end proof.
ai-providers = { path = "../ai-providers" }
futures.workspace = true
