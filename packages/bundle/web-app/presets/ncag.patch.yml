# Agent preset ncag: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
#
# The platform itself comes from `@deepseek-ai/dsh-ncag-service`, mounted here
# rather than on the host plane so selecting this mode is the only thing that
# starts a platform. Every mount naming one database shares one orchestrator;
# the service owns that rule so two Sessions never dispatch the same task.
#
# Configuration is the deployment's, read from the same variables the standalone
# `ncag` profile documents, with the harness home as the default location:
#   NCAG_DATABASE_PATH   platform SQLite database
#   NCAG_WORKSPACE_ROOT  directory holding agent worktrees
#   NCAG_MODEL_PRICING   JSON price table for every route NC-AG may use
# Prices, per-tier model overrides and limits belong to the NC-AG settings tab
# (`ncag` namespace). The platform loads with an empty table; token counts are
# always recorded, and a priced route additionally reports USD.
- insert:
    - id: preset-ncag
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ncag
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are NC-AG, the supervisory intelligence of an autonomous multi-agent
                organization, powered by the {{model}} model. You plan, coordinate and
                verify work; you do not perform every task yourself and you never report
                success you cannot evidence. Open a durable workstream with ncag_project,
                submit the work with ncag_request so the platform normalizes it,
                decomposes it and runs specialized agents in isolated worktrees, observe
                them with ncag_status and ncag_events, and answer raised disagreements
                with ncag_decide. A task is complete only when its recorded verification
                evidence says its acceptance criteria passed: report that evidence, the
                review findings and the remaining limitations, and never turn a failed
                check into a success report.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

          # The platform and its model-facing tools. They share an isolate
          # realm because a preset owns the services it mounts: without it the
          # platform would publish onto the host plane and outlive the session
          # that selected this mode. The service reads the same variables the
          # `ncag` profile documents and defaults the two path values under the
          # harness home, so selecting this mode needs no boot-time
          # configuration beyond model prices.
          - id: ncag-platform
            name: cordis:group
            group: true
            isolate:
              ncag: true
            config:
              - id: ncag
                name: '@deepseek-ai/dsh-ncag-service'
                config:
                  databasePath: !!js process.env.NCAG_DATABASE_PATH ?? process.getBuiltinModule('node:path').join(process.env.DSH_HOME ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh'), 'ncag', 'platform.db')
                  workspaceRoot: !!js process.env.NCAG_WORKSPACE_ROOT ?? process.getBuiltinModule('node:path').join(process.env.DSH_HOME ?? process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.dsh'), 'ncag', 'workspaces')
                  modelPricing: !!js process.env.NCAG_MODEL_PRICING ?? '[]'
                  defaultRoute: !!js "(() => { const s = ctx.get('agentDefaultModel')?.currentSelection(); return s === undefined ? null : { provider: s.provider, model: s.model } })()"
                  preferredProviders: !!js (process.env.NCAG_PREFERRED_PROVIDERS ?? '').split(',').filter(Boolean)
                  maxConcurrentAgents: !!js Number(process.env.NCAG_MAX_CONCURRENT_AGENTS ?? 4)
                  maxStepsPerTask: !!js Number(process.env.NCAG_MAX_STEPS ?? 24)
                  maxOutputTokens: !!js Number(process.env.NCAG_MAX_OUTPUT_TOKENS ?? 4096)
              - id: tools-ncag
                name: '@deepseek-ai/dsh-tool-ncag'
